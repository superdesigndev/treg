name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new push supersedes the running build of the same branch or PR: the outdated run is cancelled
# instead of holding a runner and queueing the new one behind it (two overlapped runs were live
# the day this landed).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only reads the repo (checkout + tests + secret scan).
permissions:
  contents: read

jobs:
  checks:
    # The repository variable CI_LINUX_RUNNER names the runner label for the Linux jobs that run
    # Python (checks, test-postgres, cli-go's Linux leg); unset, they run on GitHub's own runner.
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # the docs-only check diffs HEAD against its parent
      - name: Detect a docs-only push
        id: docs
        run: bash .github/scripts/docs-only.sh
      - uses: astral-sh/setup-uv@v7
        if: steps.docs.outputs.only != 'true'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: steps.docs.outputs.only != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard
        if: steps.docs.outputs.only != 'true'
        run: bash scripts/build-dashboard.sh
      - name: Install dependencies
        if: steps.docs.outputs.only != 'true'
        run: uv sync --locked
      - name: Verify pause context documentation
        if: steps.docs.outputs.only != 'true'
        run: |
          python3 .agents/skills/tools-registry-context/scripts/build-map.py
          git diff --exit-code -- docs/context/README.md .agents/skills/tools-registry-context/MAP.md
          bash .agents/skills/tools-registry-context/scripts/drift.sh HEAD^..HEAD
      - name: Enforce import boundaries
        if: steps.docs.outputs.only != 'true'
        run: uv run --locked lint-imports
      - name: Lint
        if: steps.docs.outputs.only != 'true'
        run: uv run --locked ruff check
      - name: Lint CI shell scripts
        if: steps.docs.outputs.only != 'true'
        run: shellcheck .github/scripts/*.sh
      - name: Validate the catalog
        # The required unchanged check validates the full catalog on pull requests and merge groups.
        if: github.event_name == 'push' && steps.docs.outputs.only != 'true'
        run: uv run --locked python scripts/catalog_validate.py
      - name: Run the SQLite tests
        # Production runs on Postgres, and test-postgres runs the whole suite there. SQLite is the
        # local development database: these are the paths only it takes (the dev sign-in code,
        # single-user mode, the CLI against a local server, migrations on a fresh local file).
        if: steps.docs.outputs.only != 'true'
        run: >-
          uv run --with pytest-xdist pytest -n auto -v -o faulthandler_timeout=300
          tests/test_auth_email.py
          tests/test_single_user.py
          tests/test_dev_title.py
          tests/test_operational.py
          tests/test_cli_account_flows.py
          tests/test_maintenance.py
          tests/test_alembic_baseline.py

  test-postgres:
    # The whole suite on Postgres, production's database, split across machines. The background
    # pool connects through a transaction-pooling PgBouncer, as in production.
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: treg
          POSTGRES_PASSWORD: treg
          POSTGRES_DB: treg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treg -d treg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_USER: treg
          DB_PASSWORD: treg
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_PREPARED_STATEMENTS: '200'
          MAX_CLIENT_CONN: '1000'
          LISTEN_PORT: '6432'
        ports:
          - 6432:6432
    env:
      TREG_TEST_DB_URL: postgresql+asyncpg://treg:treg@127.0.0.1:5432/treg_test
      TREG_TEST_POOLER_URL: postgresql+asyncpg://treg:treg@127.0.0.1:6432/treg_test
      TREG_TEST_KV_URL: redis://127.0.0.1:6379/15
      TREG_TEST_SHARD: ${{ matrix.shard }}/2
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect a docs-only push
        id: docs
        run: bash .github/scripts/docs-only.sh
      - uses: astral-sh/setup-uv@v7
        if: steps.docs.outputs.only != 'true'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: steps.docs.outputs.only != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard
        if: steps.docs.outputs.only != 'true'
        run: bash scripts/build-dashboard.sh
      - name: Install dependencies
        if: steps.docs.outputs.only != 'true'
        run: uv sync --locked
      - name: Install disposable Redis test dependency
        # A few tests start their own redis-server on a unix socket to stall it on purpose.
        if: steps.docs.outputs.only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Run tests
        # Each xdist worker gets its own database (treg_test_gw0, ...; see tests/conftest.py), so
        # reset_db() in one worker never empties another's tables. TREG_TEST_SHARD picks this
        # machine's half (tests/conftest.py). -v + faulthandler locate a stall: the fault handler
        # dumps every thread's stack after 300s of one test.
        if: steps.docs.outputs.only != 'true'
        run: uv run --frozen --with pytest-xdist python -m pytest -n auto -v -o faulthandler_timeout=300
      - name: Dump Postgres activity on failure
        # Shows the database's view of a hang: every session, its state (idle in transaction = a
        # leaked or blocked one), what it waits on, and ungranted locks with their holders' queries.
        if: failure()
        env:
          PGPASSWORD: treg
        run: |
          psql -h 127.0.0.1 -U treg -d treg_test -x -c "select datname, pid, state, wait_event_type, wait_event, xact_start, state_change, left(query,140) as query from pg_stat_activity where datname like 'treg_test%' order by xact_start nulls last;" || true
          psql -h 127.0.0.1 -U treg -d treg_test -c "select l.pid, l.locktype, l.mode, l.granted, a.state, left(a.query,90) as query from pg_locks l join pg_stat_activity a using(pid) where not l.granted;" || true

  test:
    # The required check, under the name branch protection asks for: it passes only when the lint
    # and SQLite job and every Postgres shard passed. A job skipped or cancelled fails it.
    needs: [checks, test-postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the suite passed
        env:
          CHECKS: ${{ needs.checks.result }}
          POSTGRES: ${{ needs.test-postgres.result }}
        run: |
          echo "checks: $CHECKS, test-postgres: $POSTGRES"
          [ "$CHECKS" = success ] && [ "$POSTGRES" = success ]

  cli-go:
    # The binary CLI: vet and unit tests on every platform it ships for, then the parity suite that
    # runs it beside the Python CLI against a real local registry. The matrix value stays the job's
    # name, so the required check keeps its name whichever runner the Linux leg lands on.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_LINUX_RUNNER || matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Format
        if: runner.os != 'Windows'
        working-directory: cli
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet and unit tests
        working-directory: cli
        run: |
          go vet ./...
          go test ./...
      - name: Modern Go
        # The analyzer that rewrites code to the idioms go.mod's version allows; it reports any left.
        if: runner.os == 'Linux'
        working-directory: cli
        run: go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.52.0 -test ./...
      - name: Build
        working-directory: cli
        run: go build -o treg-go ./cmd/treg
      - uses: astral-sh/setup-uv@v7
        if: runner.os == 'Linux'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Parity with the Python CLI
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-dashboard.sh
          uv sync --locked
          TREG_GO_BIN="$PWD/cli/treg-go" uv run --locked --with pytest-xdist pytest tests/cli_go -n auto -v

  # RESTORED 2026-08-24. This job is a REQUIRED check on main, and the CI rewrite in 528383d
  # dropped it while keeping the requirement — so for three weeks every pull request waited on a
  # check that could never report, and only an admin bypass moved anything. It never skips (see
  # the docs-only note in `test`: a skipped required check blocks a merge forever), and it scans
  # the FULL history, because a secret removed from the tip still lives in the commit that added
  # it. `.gitleaks.toml` allowlists the deliberately-fake placeholders in the tests and the demo
  # sandbox; everything else is a real finding.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history of the push/PR, not just the tip
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for secrets
        # HEAD is the PR merge commit (both parents) or the pushed main commit. Scan all
        # reachable history, including deleted secrets, without unrelated fetched branch tips.
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="HEAD" --verbose --redact

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: bash scripts/build-dashboard.sh
      - run: npm --prefix frontend test
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 7
      - name: Check distributable assets
        run: |
          uv build
          python - <<'PYCODE'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile
          import re
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              assert not [name for name in wheel.namelist() if name.endswith('.mp4')]
              html = wheel.read('treg/web/dashboard/index.html').decode()
              assets = re.findall(r'/app/ui/(assets/[^"\s]+)', html)
              assert assets, 'Dashboard entry must reference compiled assets'
              for asset in assets:
                  assert wheel.read('treg/web/dashboard/' + asset)
              assert not [name for name in wheel.namelist() if 'dashboard-legacy' in name]
              arena = wheel.read('treg/web/enrich-arena.html').decode()
              for asset in re.findall(r'src="(/vendor/vue-[^"\s]+)"', arena):
                  assert wheel.read('treg/web' + asset)
              assert wheel.read('treg/web/vendor/LICENSE')
          with open_tar(next(Path('dist').glob('*.tar.gz'))) as source:
              assert not [member.name for member in source.getmembers()
                          if member.name.endswith('.mp4')]
          PYCODE
