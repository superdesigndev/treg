name: PR Slack notice

# `pull_request_target` gives fork pull requests the Slack token and never checks out their code.
# `pull_request_review` on a fork gets no secrets; its message catches up on the next event.
on:
  pull_request_target:
    types: [opened, reopened, review_requested, review_request_removed, ready_for_review,
      converted_to_draft, edited, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]

# Requesting several reviewers fires one event each; the wait in the job lets the last one win.
concurrency:
  group: pr-slack-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Slack settings
        id: settings
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_PR_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_PR_CHANNEL }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "::warning::No SLACK_PR_BOT_TOKEN secret or SLACK_PR_CHANNEL variable (a review on a fork pull request gets no secrets); no Slack notice sent"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.settings.outputs.ready
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Update the Slack message
        if: steps.settings.outputs.ready
        env:
          GH_TOKEN: ${{ github.token }}
          # Bot scopes: chat:write, and channels:history (groups:history for a private channel).
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_PR_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_PR_CHANNEL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sleep 15
          .github/scripts/pr-slack.sh
