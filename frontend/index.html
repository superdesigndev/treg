<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>treg</title>
<!-- The dashboard is an authenticated app: every view needs a session and supports shared deep links. Nothing here is indexable, and a crawler that got in would index a sign-in prompt. -->
<meta name="robots" content="noindex, follow"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<!-- Boot's first two requests start here, alongside the bundle download, instead of after it
     (boot.js picks them up), and the saved theme applies before the first paint, not after mount. -->
<script>
(function(){
  var h={'ngrok-skip-browser-warning':'1'};
  window.__tregBoot={
    meta:fetch('/meta',{headers:h}).then(function(r){return r.json()}),
    me:fetch('/auth/me',{credentials:'include',headers:h}).then(function(r){return r.ok?r.json():null})
  };
  // boot.js attaches its own handlers; these only keep an unused promise from logging a rejection.
  window.__tregBoot.meta.catch(function(){}); window.__tregBoot.me.catch(function(){});
  try{ document.documentElement.dataset.theme=localStorage.getItem('treg-theme')||'light'; }catch(e){}
})();
</script>



<script src="/tutorial.js"></script>
<script src="/dashboard-tour/tour.js"></script>
<script src="/adtrack.js"></script>
</head>
<body>
<!-- The same markup App.vue shows while it boots, so mounting swaps it for itself. Nothing is
     visible for the first moments; a thin bar fades in at the top only if boot is slow
     (base.css, .boot-status). The status line hides itself inline: in development the stylesheet
     arrives with the script, after this markup has painted. -->
<div id="app"><main class="boot-status" aria-busy="true"><span class="boot-bar" aria-hidden="true"></span><p role="status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap">Loading treg…</p></main></div>
<script src="/sitetrack.js"></script>
<script src="/agent-setup.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
