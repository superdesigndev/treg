    in_expr: {body.titles: "list(title)", body.limit: limit}
    const: {body.include_contact_details: false}
    out: {people: people, count: count, next_cursor: next_cursor}
    miss: "people == []"
  findymail.search.domain:
    accepts: [[company_domain]]
    in:  {company_domain: body.domain}
    out: {people: contacts, count: "len(contacts)"}
    miss: "contacts == []"

  # *.bulk endpoints are never routed (Jason, 2026-08-29): a routed call is one subject, one answer.
  fiber-ai.people.enrich:
    accepts: [[linkedin_url]]
    in:  {}
    in_expr: {body.profileIdentifier: "obj('identifier', 'linkedinUrl', 'value', linkedin_url)"}
    test_identity: {linkedin_url: "https://www.linkedin.com/in/williamhgates"}
    out: {full_name: "output.data[0].name", first_name: "output.data[0].first_name", last_name: "output.data[0].last_name",
          title: "output.data[0].headline", location: "output.data[0].locality", linkedin_url: "output.data[0].url"}
    miss: "output.data == []"
  tomba.people.enrich.profile:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {full_name: data.name.fullName, first_name: data.name.givenName, last_name: data.name.familyName,
          title: data.employment.title, company: data.employment.name, company_domain: data.employment.domain,
          location: data.location}
    miss: "data.name.fullName == null"
  tomba.people.enrich.combined:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {full_name: data.person.name.fullName, first_name: data.person.name.givenName, last_name: data.person.name.familyName,
          title: data.person.employment.title, company: data.company.name, company_domain: data.company.domain,
          location: data.person.location}
    miss: "data.person.name.fullName == null"
  hunter.x.combined-find:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {full_name: data.person.name.fullName, first_name: data.person.name.givenName, last_name: data.person.name.familyName,
          title: data.person.employment.title, company: data.company.name, company_domain: data.company.domain,
          location: data.person.location}
    miss: "data.person.name.fullName == null"

  fiber-ai.people.contacts.turbo:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.linkedinUrl}
    out: {email: "output.profile.emails[0].email", verified: "output.profile.emails[0].status == 'valid'"}
    miss: "output.profile.emails == []"
  leadmagic.x.personal-email-finder:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.profile_url}
    out: {email: first_personal_email}
    miss: "first_personal_email == null"

  findymail.search.reverse-email:
    accepts: [[email]]
    in:  {email: body.email}
    out: {linkedin_url: linkedin_url}
    miss: "linkedin_url == null"
  # Still out: apollo.people.search / coresignal.people.search (no fixture; apollo's `person_titles[]` keys need a
  # bracket-safe target), crustdata/diffbot people.enrich and diffbot.people.search (truncated examples), icypeas
  # email find/verify and the *.bulk jobs (async: the answer arrives by polling), companyenrich by numeric id.

