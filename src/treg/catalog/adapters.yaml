# ADAPTERS — one per endpoint, data-first: how a contract request becomes this provider's request
# (`in`), how the provider's body becomes the contract's core output (`out`), and what a miss
# looks like (`miss`). A tiny expression language, evaluated by domain/catalog/routing/paths.py:
#   paths        data.email · emails[0].email · output.profile.emails[0].email
#   coalesce     coalesce(a.b, c.d)
#   arithmetic   data.score / 100
#   predicates   x == null · x != null · x == [] · x == 'literal'
#   named        split_first(full_name) · join(a, b) · has_type(emails, 'work')
# `accepts` lists the contract identity variants (by their keys) this endpoint can serve.
#
# Every adapter is VERIFIED at catalog load against the endpoint's `test_request` (in) and its
# captured `example_response` (out): one that cannot round-trip its fixture does not become a
# router candidate — the endpoint stays callable via /call/ exactly as before. See
# domain/catalog/routing/adapters.py::verify.

adapters:
  # ---- people.email.find --------------------------------------------------------------------
  contactout.people.contact.work:
    accepts: [[linkedin_url]]
    in: {linkedin_url: queryParams.profile}
    const: {queryParams.email_type: work, queryParams.include_phone: false}
    test_identity: {linkedin_url: "https://www.linkedin.com/in/routing-fixture"}
    out: {email: "profile.work_email[0]"}
    miss: "at_least(status_code != 200, coalesce(profile.work_email) == null)"
  dropleads.people.email.find:
    accepts: [[first_name, last_name, domain]]
    in: {first_name: body.first_name, last_name: body.last_name, domain: body.company_domain}
    out: {email: email, verified: "status == 'valid'"}
    miss: "email == null"
  prospeo.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain], [linkedin_url]]
    in: {full_name: body.data.full_name, first_name: body.data.first_name,
         last_name: body.data.last_name, domain: body.data.company_website,
         linkedin_url: body.data.linkedin_url}
    const: {body.only_verified_email: true, body.enrich_mobile: false, body.only_verified_mobile: false}
    out: {email: person.email.email, first_name: person.first_name, last_name: person.last_name,
          verified: "person.email.status == 'VERIFIED'"}
    miss: "person.email.email == null"
  aiark.people.email.find:
    accepts: [[linkedin_url]]
    in: {linkedin_url: body.url}
    out: {email: "data.email.output[0].address", first_name: data.profile.first_name,
          last_name: data.profile.last_name, verified: "data.email.output[0].status == 'VALID'"}
    miss: "data.email.output[0].address == null"
  trykitt.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in: {full_name: body.fullName, domain: body.domain, linkedin_url: body.linkedinStandardProfileURL}
    const: {body.realtime: true}
    out: {email: email, verified: "validity == 'valid'"}
    miss: "coalesce(email, 'no-results-found') == 'no-results-found'"
  hunter.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: queryParams.full_name, domain: queryParams.domain}
    out: {email: data.email, confidence: "data.score / 100", first_name: data.first_name,
          last_name: data.last_name, verified: "data.verification.status == 'valid'"}
    miss: "data.email == null"
  leadmagic.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: body.full_name, domain: body.domain}
    out: {email: email, first_name: first_name, last_name: last_name, verified: "status == 'valid'"}
    miss: "email == null"
  leadsforge.people.email.find:
    # Full names still work through the contract's first/last derivation. A mononym must
    # not fall back to a variant that maps neither name part and sends only the company.
    accepts: [[first_name, last_name, domain], [linkedin_url]]
    in:  {first_name: body.firstName, last_name: body.lastName, domain: body.companyDomain,
          linkedin_url: body.linkedinURL}
    # Enrichment success does not report mailbox deliverability.
    out: {email: email}
    miss: "email == null"
  findymail.search.name:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: body.name, domain: body.domain}
    out: {email: contact.email, first_name: "split_first(contact.name)", last_name: "split_last(contact.name)"}
    miss: "contact.email == null"
  findymail.search.business-profile:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.linkedin_url}
    out: {email: contact.email, first_name: "split_first(contact.name)", last_name: "split_last(contact.name)"}
    miss: "contact.email == null"
  tomba.people.email.find:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in:  {full_name: queryParams.full_name, domain: queryParams.domain}
    out: {email: data.email, confidence: "data.score / 100", first_name: data.first_name,
          last_name: data.last_name, verified: "data.verification.status == 'valid'"}
    miss: "data.email == null"
  tomba.people.email.find.linkedin:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: queryParams.url}
    out: {email: data.email, confidence: "data.score / 100", first_name: data.first_name,
          last_name: data.last_name, verified: "data.verification.status == 'valid'"}
    miss: "data.email == null"
  aviato.people.email.find:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: queryParams.linkedinURL}
    const: {queryParams.type: work}
    out: {email: "emails[0].email"}
    miss: "emails == []"
  fiber-ai.people.contacts.reveal:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.linkedinUrl}
    const: {body.enrichmentType: {getWorkEmails: true, getPersonalEmails: false, getPhoneNumbers: false},
            body.validateEmails: true}
    out: {email: "output.profile.emails[0].email"}
    miss: "output.profile.emails == []"
  moltsets.people.email.find.name:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in: {full_name: body.name, first_name: body.first_name, last_name: body.last_name,
         domain: body.company_domain}
    out: {email: results.email, linkedin_url: results.linkedin_url,
          verified: "results.risk_score == 'A'"}
    miss: "status != 'ok'"
  limadata.people.email.find.name:
    accepts: [[full_name, domain], [first_name, last_name, domain]]
    in: {full_name: body.full_name, domain: body.company_domain}
    out: {email: email}
    miss: "email == null"
  limadata.people.email.find.linkedin:
    accepts: [[linkedin_url]]
    in: {linkedin_url: body.linkedin_url}
    out: {email: email}
    miss: "email == null"

  # ---- instagram.user.profile ---------------------------------------------------------------
  tikhub.instagram.user.profile:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: "coalesce(data.data.user.username, params.username)", user_id: data.data.user.id,
          full_name: data.data.user.full_name, followers: data.data.user.edge_followed_by.count,
          following: data.data.user.edge_follow.count, posts_count: data.data.user.edge_owner_to_timeline_media.count,
          is_verified: data.data.user.is_verified, is_private: data.data.user.is_private, biography: data.data.user.biography}
    miss: "data.data.user == null"
  tikhub.x.instagram-v1-fetch-user-info-by-username-v2:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v1-fetch-user-info-by-username-v3:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v1-fetch-user-info-by-id:
    accepts: [[user_id]]
    in:  {user_id: queryParams.user_id}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v1-fetch-user-info-by-id-v2:
    accepts: [[user_id]]
    in:  {user_id: queryParams.user_id}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  tikhub.x.instagram-v3-get-user-profile:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.follower_count,
          following: data.following_count, posts_count: data.media_count, is_verified: data.is_verified,
          is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  justoneapi.instagram.user.profile:
    accepts: [[username]]
    in:  {username: queryParams.username}
    out: {username: data.username, user_id: data.id, full_name: data.full_name, followers: data.edge_followed_by.count,
          following: data.edge_follow.count, posts_count: data.edge_owner_to_timeline_media.count,
          is_verified: data.is_verified, is_private: data.is_private, biography: data.biography}
    miss: "data.username == null"
  scrapecreators.instagram.user.profile:
    accepts: [[username]]
    in:  {username: queryParams.handle}
    out: {username: data.user.username, user_id: data.user.pk, full_name: data.user.full_name,
          followers: data.user.follower_count, following: data.user.following_count, posts_count: data.user.media_count,
          is_verified: data.user.is_verified, is_private: data.user.is_private, biography: data.user.biography}
    miss: "data.user.username == null"
  scrapecreators.x.v1-instagram-basic-profile:
    accepts: [[user_id]]
    in:  {user_id: queryParams.userId}
    out: {username: username, user_id: pk, full_name: full_name, followers: follower_count, following: following_count,
          posts_count: media_count, is_verified: is_verified, is_private: is_private, biography: biography}
    miss: "username == null"
  serpapi.x.instagram-profile:
    accepts: [[username]]
    in:  {username: queryParams.profile_id}
    const: {queryParams.engine: instagram_profile}
    out: {username: search_parameters.profile_id, full_name: full_name, followers: followers, following: following,
          posts_count: posts_count, is_verified: is_verified, biography: biography}
    miss: "error != null"

  # ---- instagram.hashtag.posts --------------------------------------------------------------
  # tikhub.x.instagram-v1-fetch-hashtag-posts: no adapter — its captured example truncates the
  # `edge_hashtag_to_media` edges, so `out` cannot be fixture-verified; still callable via /call/.
  tikhub.x.instagram-v2-fetch-hashtag-posts:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.keyword}
    out: {posts: data.data.items, count: data.data.count, next_cursor: data.pagination_token}
    miss: "data.data.items == []"
  scrapecreators.x.v1-instagram-search-hashtag:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.hashtag}
    out: {posts: posts, count: "len(posts)", next_cursor: cursor}
    miss: "posts == []"
  justoneapi.x.instagram-search-hashtag-posts-v1:
    accepts: [[hashtag]]
    in:  {hashtag: queryParams.hashtag}
    out: {posts: data.data.hashtag.edge_hashtag_to_media.edges, count: data.data.hashtag.edge_hashtag_to_media.count,
          next_cursor: data.data.hashtag.edge_hashtag_to_media.page_info.end_cursor}
    miss: "data.data.hashtag == null"

  # ---- x.user.posts -------------------------------------------------------------------------
  tikhub.x.user.posts:
    accepts: [[username], [user_id]]
    in:  {username: queryParams.screen_name, user_id: queryParams.rest_id}
    out: {posts: data.timeline, next_cursor: data.next_cursor}
    miss: "data.timeline == []"
  scrapecreators.x.user.posts:
    accepts: [[username]]
    in:  {username: queryParams.handle}
    out: {posts: tweets}
    miss: "tweets == []"
  justoneapi.x.twitter-get-user-posts-v1:
    accepts: [[user_id]]
    in:  {user_id: queryParams.restId}
    out: {posts: data.timeline, next_cursor: data.next_cursor}
    miss: "data.timeline == []"

  # ---- tiktok.user.profile ------------------------------------------------------------------
  tikhub.tiktok.user.profile:
    accepts: [[username], [sec_uid]]
    in:  {username: queryParams.uniqueId, sec_uid: queryParams.secUid}
    out: {username: data.userInfo.user.uniqueId, user_id: data.userInfo.user.id, sec_uid: data.userInfo.user.secUid,
          nickname: data.userInfo.user.nickname, followers: data.userInfo.stats.followerCount,
          following: data.userInfo.stats.followingCount, likes: data.userInfo.stats.heartCount,
          videos_count: data.userInfo.stats.videoCount, is_verified: data.userInfo.user.verified,
          biography: data.userInfo.user.signature}
    miss: "data.userInfo.user.uniqueId == null"
  justoneapi.tiktok.user.profile:
    accepts: [[username], [sec_uid]]
    in:  {username: queryParams.uniqueId, sec_uid: queryParams.secUid}
    out: {username: data.userInfo.user.uniqueId, user_id: data.userInfo.user.id, sec_uid: data.userInfo.user.secUid,
          nickname: data.userInfo.user.nickname, followers: data.userInfo.stats.followerCount,
          following: data.userInfo.stats.followingCount, likes: data.userInfo.stats.heartCount,
          videos_count: data.userInfo.stats.videoCount, is_verified: data.userInfo.user.verified,
          biography: data.userInfo.user.signature}
    miss: "data.userInfo.user.uniqueId == null"
  scrapecreators.tiktok.user.profile:
    accepts: [[username], [user_id]]
    in:  {username: queryParams.handle, user_id: queryParams.user_id}
    out: {username: user.uniqueId, user_id: user.id, sec_uid: user.secUid, nickname: user.nickname,
          followers: stats.followerCount, following: stats.followingCount, likes: stats.heartCount,
          videos_count: stats.videoCount, is_verified: user.verified, biography: user.signature}
    miss: "user.uniqueId == null"
  tikhub.x.tiktok-analytics-fetch-creator-info-and-milestones:
    accepts: [[user_id]]
    in:  {user_id: queryParams.user_id}
    out: {username: data.creator_info.unique_id, user_id: data.user_id, sec_uid: data.creator_info.sec_user_id,
          nickname: data.creator_info.nickname, followers: data.creator_info.follower_count,
          likes: data.creator_info.like_count}
    miss: "data.creator_info.unique_id == null"

  # ---- people.phone.find --------------------------------------------------------------------
  contactout.people.contact.phone:
    accepts: [[linkedin_url]]
    in: {linkedin_url: queryParams.profile}
    const: {queryParams.email_type: none, queryParams.include_phone: true}
    test_identity: {linkedin_url: "https://www.linkedin.com/in/routing-fixture"}
    out: {phone: "profile.phone[0]", line_type: "'mobile'"}
    miss: "at_least(status_code != 200, coalesce(profile.phone) == null)"
  dropleads.people.phone.find:
    accepts: [[linkedin_url]]
    in: {linkedin_url: body.linkedin_url}
    out: {phone: mobile_number, line_type: "'mobile'"}
    miss: "mobile_number == null"
  prospeo.people.phone.find:
    accepts: [[linkedin_url], [email], [full_name, domain], [first_name, last_name, domain]]
    in: {linkedin_url: body.data.linkedin_url, email: body.data.email,
         full_name: body.data.full_name, first_name: body.data.first_name,
         last_name: body.data.last_name, domain: body.data.company_website}
    const: {body.only_verified_email: false, body.enrich_mobile: true, body.only_verified_mobile: true}
    out: {phone: person.mobile.mobile_international, line_type: "'mobile'",
          country_code: person.mobile.mobile_country_code}
    miss: "person.mobile.mobile_international == null"
  aiark.people.phone.find:
    accepts: [[linkedin_url], [full_name, domain], [first_name, last_name, domain]]
    in: {linkedin_url: body.linkedin, full_name: body.name, domain: body.domain}
    out: {phone: "get(data.data[0], '[0]')", line_type: "'mobile'"}
    miss: "get(data.data[0], '[0]') == null"
  tomba.people.phone.find:
    accepts: [[email], [linkedin_url]]
    in:  {email: queryParams.email, linkedin_url: queryParams.linkedin}
    out: {phone: "coalesce(data.e164_format, data.intl_format)", line_type: data.line_type, country_code: data.country_code}
    miss: "data.e164_format == null"
  leadsforge.people.phone.find:
    accepts: [[first_name, last_name, domain], [linkedin_url]]
    in:  {first_name: body.firstName, last_name: body.lastName, domain: body.companyDomain, linkedin_url: body.linkedinURL}
    out: {phone: phoneNumber}
    miss: "phoneNumber == null"
  leadmagic.people.phone.find:
    accepts: [[linkedin_url], [email]]
    in:  {linkedin_url: body.profile_url, email: body.work_email}
    out: {phone: mobile_number, line_type: "'mobile'"}
    miss: "mobile_number == null"
  findymail.search.phone:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.linkedin_url}
    out: {phone: phone, line_type: line_type}
    miss: "phone == null"
  aviato.people.phone.find:
    accepts: [[linkedin_url], [email]]
    in:  {linkedin_url: queryParams.linkedinURL, email: queryParams.email}
    out: {phone: "phones[0].phoneNumber"}
    miss: "phones == []"
  limadata.people.phone.find:
    accepts: [[linkedin_url], [full_name, domain], [first_name, last_name, domain]]
    in: {linkedin_url: body.linkedin_url, full_name: body.name, domain: body.company_domain}
    out: {phone: "phone_numbers[0].number", line_type: "phone_numbers[0].type"}
    miss: "phone_numbers == []"
  lusha.people.phone.find:
    # Lusha's native direct-dial/mobile data (its third-party phone waterfall is not connected on
    # treg's account). Dearest phone finder in the ladder — 6 credits on a hit — so it ranks last
    # and is only asked once the cheaper five have missed; a miss is free, a matched-but-no-number
    # profile costs the 1-credit search (settled from billing.creditsCharged). Added for LatAm
    # coverage after voice-ai-outbound's Guatemala test (7 hits in 44 across the other five).
    accepts: [[linkedin_url], [email], [first_name, last_name, domain], [full_name, domain]]
    in:  {}
    in_expr: {body.contacts: "list(obj('linkedinUrl', linkedin_url, 'email', email, 'firstName', first_name, 'lastName', last_name, 'companyDomain', domain))"}
    const: {body.reveal: [phones]}
    test_identity: {first_name: Jane, last_name: Doe, domain: lusha.com}
    out: {phone: "results[0].phones[0].number", line_type: "results[0].phones[0].type", country_code: "results[0].phones[0].countryIso2"}
    miss: "results[0].phones[0].number == null"

  tomba.people.phone.verify:
    accepts: [[phone]]
    in: {phone: queryParams.phone, country_code: queryParams.country_code}
    out: {valid: data.valid, phone: data.e164_format, country_code: data.country_code, line_type: data.line_type, carrier: data.carrier}
    miss: "data.valid == null"

  # ---- people.email.verify ------------------------------------------------------------------
  dropleads.people.email.verify:
    accepts: [[email]]
    in: {email: body.email}
    out: {valid: "status == 'valid'", status: status}
    miss: "status == null"
  scrubby.people.email.verify:
    accepts: [[email]]
    in: {email: body.email}
    out: {valid: "result == 'Valid'", status: result}
    # Invalid, Risky and Unknown are useful verdicts. Only a missing verdict is a miss.
    miss: "result == null"
  zerobounce.people.email.verify:
    accepts: [[email]]
    in: {email: queryParams.email}
    out: {valid: "status == 'valid'", status: status}
    # Invalid, catch-all, abuse, spamtrap and do_not_mail are useful answers. ZeroBounce documents
    # unknown as uncharged; treating it as a miss lets the existing generic success settlement
    # release the hold and lets a routed waterfall continue.
    miss: "coalesce(status, 'unknown') == 'unknown'"
  trykitt.people.email.verify:
    accepts: [[email]]
    in: {email: body.email}
    const: {body.realtime: true}
    out: {valid: "validity == 'valid'", status: validity}
    miss: "validity == null"
  contactout.people.email.verify:
    accepts: [[email]]
    in: {email: queryParams.email}
    out: {valid: "data.status == 'valid'", status: data.status}
    # Preserve uncertain verdict words; only explicit valid confirms deliverability.
    # Require both a successful envelope and a nonempty verdict, using existing expressions.
    # at_least takes the maximum of the two predicates (0/1): either failure is a miss.
    miss: "at_least(status_code != 200, coalesce(data.status) == null)"
  millionverifier.people.email.verify:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {valid: "result == 'ok'", status: result}
    # Like peer verifiers, risky/invalid verdicts are answers; API errors omit quality.
    miss: "quality == null"
  bounceban.people.email.verify:
    accepts: [[email]]
    in: {email: queryParams.email}
    out: {valid: "result == 'deliverable'", status: result, score: score}
    # A standard submission can return status=verifying before the verdict exists. It was billed,
    # but it is not a routed answer yet, so the existing waterfall may continue.
    miss: "result == null"
  leadmagic.people.email.verify:
    accepts: [[email]]
    in:  {email: body.email}
    out: {valid: "email_status == 'valid'", status: email_status}
    miss: "email_status == null"
  tomba.people.email.verify:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {valid: "data.email.status == 'valid'", status: data.email.status, score: data.email.score}
    miss: "data.email.status == null"
  hunter.people.email.verify:
    accepts: [[email]]
    in:  {email: queryParams.email}
    out: {valid: "data.status == 'valid'", status: data.status, score: data.score}
    miss: "data.status == null"
  limadata.people.email.verify:
    accepts: [[email]]
    in: {email: body.email}
    out: {valid: "result == 'Valid'", status: result, score: score}
    miss: "result == null"

  # ---- people.enrich ------------------------------------------------------------------------
  dropleads.people.enrich:
    accepts: [[email], [linkedin_url], [first_name, last_name, domain], [full_name, domain]]
    in: {email: body.email, linkedin_url: body.linkedin_url, first_name: body.first_name,
         last_name: body.last_name, full_name: body.name, domain: body.domain}
