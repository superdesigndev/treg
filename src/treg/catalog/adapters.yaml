          title: data.employment.title, company: data.employment.name, company_domain: data.employment.domain,
          linkedin_url: data.linkedin.handle, location: "coalesce(data.location, data.geo.country)"}
    miss: "data.name.fullName == null"
  # hunter.x.combined-find: no adapter — its captured example truncates data.person.name, so `out`
  # cannot be fixture-verified; hunter.people.enrich covers the same identity.
  leadmagic.people.enrich:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: body.profile_url}
    out: {full_name: full_name, first_name: first_name, last_name: last_name, title: professional_title,
          company: company_name, company_domain: company_website, linkedin_url: profile_url, location: location}
    miss: "full_name == null"
  icypeas.people.enrich:
    accepts: [[linkedin_url]]
    in:  {linkedin_url: queryParams.url}
    out: {full_name: "join(result.firstname, result.lastname)", first_name: result.firstname, last_name: result.lastname,
          title: result.headline, company: "result.worksFor[0].name", linkedin_url: result.url,
          location: result.address.addressLocality}
    miss: "result == null"
  pdl.people.enrich:
