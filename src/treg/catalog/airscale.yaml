provider: airscale
source:
  docs: https://docs.airscale.io/api-reference/api-overview
  openapi: https://docs.airscale.io/openapi.json
  curated: '2026-09-29'
limits: "Per workspace: people search/count and company search/filter values each share 6 requests/second; email, phone, profile and company 3,000/minute; personal email and reverse phone 2,000/minute; reverse email 25/second; AirSearch 300/minute."
pricing_url: https://airscale.io/pricing

endpoints:
  - id: airscale.find-people.count
    capability: people.search.count
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /find-people/count
    body_allowlist: true
    name: Count matching people
    summary: Count a filtered people-search audience without retrieving charged leads.
    input:
      bodyType: json
      body:
        query: &people_query
          type: object
          required: true
          minProperties: 1
          example: {jobTitle: {include: [Founder]}}
          note: "At least one supported filter. Past-experience filters apply to the same prior role."
          properties:
            firstname: &person_text_filter
              type: object
              required: false
              note: "Use include and/or exclude string arrays; empty arrays and empty strings are accepted, but meaningful values are recommended."
              example: {include: [Example]}
              properties:
                include: {type: array, required: false, items: {type: string}, maxItems: 200, example: [Example]}
                exclude: {type: array, required: false, items: {type: string}, maxItems: 200, example: [Other]}
            lastname: {<<: *person_text_filter, example: {include: [Person]}}
            jobTitle: {<<: *person_text_filter, example: {include: [Founder]}}
            school: {<<: *person_text_filter, example: {include: [Stanford University]}}
            languages: {<<: *person_text_filter, example: {include: [English]}}
            skills: {<<: *person_text_filter, example: {include: [Python]}}
            location: {<<: *person_text_filter, example: {include: [US]}, note: "Person or current-role location; country names and ISO alpha-2 codes are accepted. Supply include and/or exclude."}
            keyword: {<<: *person_text_filter, example: {include: [payments]}}
            currentCompanyName: {<<: *person_text_filter, example: {include: [Stripe]}}
            companyDomain: {<<: *person_text_filter, example: {include: [stripe.com]}, note: "Current-company domain; URL input is normalized to its hostname. Combined with companyLinkedinUrl as OR alternatives. Supply include and/or exclude."}
            companyLinkedinUrl: {<<: *person_text_filter, example: {include: ["https://www.linkedin.com/company/stripe/"]}, note: "Current-company LinkedIn URL or identifier; combined with companyDomain as OR alternatives. Supply include and/or exclude."}
            currentCompany.type: {<<: *person_text_filter, example: {include: [Privately Held]}}
            currentCompany.industry: {<<: *person_text_filter, example: {include: [Software Development]}}
            currentCompany.location: {<<: *person_text_filter, example: {include: [US]}, note: "Current-company headquarters location; country names and ISO alpha-2 codes are accepted. Supply include and/or exclude."}
            currentCompany.keyword: {<<: *person_text_filter, example: {include: [payments]}}
            pastJobTitle: {<<: *person_text_filter, example: {include: [Engineer]}, note: "Previous title; all past-experience filters must match the same prior role. Supply include and/or exclude."}
            pastCompanyName: {<<: *person_text_filter, example: {include: [Example Company]}}
            pastCompanyId: {<<: *person_text_filter, example: {include: ["100000002"]}}
            pastCompanyWebsite: {<<: *person_text_filter, example: {include: [example.org]}}
            pastCompanyUrn: {<<: *person_text_filter, example: {include: ["urn:li:fsd_company:100000002"]}}
            pastCompany.type: {<<: *person_text_filter, example: {include: [Privately Held]}}
            pastCompany.industry: {<<: *person_text_filter, example: {include: [Software Development]}}
            pastCompany.location: {<<: *person_text_filter, example: {include: [US]}, note: "Previous-company headquarters location; country names and ISO alpha-2 codes are accepted. Supply include and/or exclude."}
            pastCompany.keyword: {<<: *person_text_filter, example: {include: [software]}}
            totalYearsOfExperience: &person_integer_range
              type: object
              required: false
              note: "At least one integer bound; use literal >, >=, < or <= keys."
              example: {">=": 5}
              properties:
                ">": {type: integer, required: false, example: 5}
                ">=": {type: integer, required: false, example: 5}
                "<": {type: integer, required: false, example: 10}
                "<=": {type: integer, required: false, example: 10}
            timeInCurrentCompany: {<<: *person_integer_range, example: {">=": 2}}
            currentCompany.headcount: {<<: *person_integer_range, example: {">=": 50}}
            currentCompany.revenue: {<<: *person_integer_range, example: {">": 1000000}}
            pastCompany.headcount: {<<: *person_integer_range, example: {"<": 500}}
            pastCompany.revenue: {<<: *person_integer_range, example: {">=": 1000000}}
            currentCompany.headcountGrowth: &person_growth
              type: object
              required: false
              note: "timespan and at least one min/max bound are required; min must not exceed max."
              example: {timespan: 12months, min: 10}
              properties:
                timespan: {type: string, required: true, enum: [6months, 12months, 24months], example: 12months}
                min: {type: number, required: false, min: -100, max: 10000, example: 10}
                max: {type: number, required: false, min: -100, max: 10000, example: 50}
            pastCompany.headcountGrowth: {<<: *person_growth, example: {timespan: 6months, max: 20}}
      note: "Count accepts the same query as Find people, with no size or cursor."
    test_request: {body: {query: {jobTitle: {include: [Founder]}}}}
    cost: {type: free, value: 0, currency: USD, per: 1, unit: call, source: docs, source_url: https://docs.airscale.io/api-reference/find-people/count, checked: '2026-09-29', confidence: documented, note: "Count neither reserves nor debits Airscale credits."}
    docs_url: https://docs.airscale.io/api-reference/find-people/count

  - id: airscale.find-people
    capability: people.search
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /find-people
    body_allowlist: true
    platform_blocked: "Each returned lead costs 0.1 credit, but the response has no exact charge field and generic settlement cannot count leads in its array."
    name: Search people
    summary: Find public people by role, location, company and experience filters.
    input:
      bodyType: json
      body:
        query: *people_query
        size: {type: integer, required: false, min: 1, max: 100, default: 100, example: 1, note: "Catalog calls accept JSON integer page sizes from 1 to 100. Airscale also accepts canonical decimal strings through the raw BYOK tool."}
        cursor: {type: string, required: false, minLength: 1, note: "Opaque next_cursor from the preceding page; keep query unchanged."}
    test_request: {body: {query: {companyDomain: {include: [stripe.com]}}, size: 1}}
    cost: {type: per_result, value: 0.1, currency: credit, per: 1, unit: record, source: docs, source_url: https://docs.airscale.io/api-reference/find-people, checked: '2026-09-29', confidence: documented, note: "0.1 credit per lead in leads; an empty leads array is free. No exact charge/count field is reported for generic settlement."}
    docs_url: https://docs.airscale.io/api-reference/find-people

  - id: airscale.find-companies.filter-values
    capability: companies.search.filters
    platform: companies
    scope: any_account
    method: GET
    path: /find-companies/filter-values
    name: Discover company filter values
    summary: List accepted city, region, industry, topic or technology filter values.
    input:
      queryParams:
        filter: {type: string, required: true, enum: [city, region, industry, topics, techStack], example: industry}
        q: {type: string, required: false, minLength: 2, maxLength: 120, example: software, note: "Takes precedence over query, even when blank; at least one of q or query is required."}
        query: {type: string, required: false, minLength: 2, maxLength: 120, example: software, note: "Alias used only when q is absent."}
        limit: {type: integer, required: false, min: 1, max: 100, default: 20, example: 1, note: "Invalid values default to 20; out-of-range integers clamp to 1–100."}
        country: {type: "array[string]", required: false, example: [US], note: "Optional repeat or comma-separated country context."}
        region: {type: "array[string]", required: false, example: [us-ca], note: "Optional repeat or comma-separated region context; a bare region name needs country."}
      note: "At least one of q or query must contain 2–120 characters after trimming."
    test_request: {queryParams: {filter: industry, q: software, limit: 1}}
    cost: {type: free, value: 0, currency: USD, per: 1, unit: call, source: docs, source_url: https://docs.airscale.io/api-reference/find-companies/filter-values, checked: '2026-09-29', confidence: documented, note: "Filter suggestions neither reserve nor debit credits."}
    docs_url: https://docs.airscale.io/api-reference/find-companies/filter-values

  - id: airscale.find-companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: POST
    path: /find-companies
    body_allowlist: true
    platform_blocked: "Each returned company costs 0.1 credit, but the response has no exact charge field and generic settlement cannot count rows in its array."
    name: Search companies
    summary: Find public companies by firmographics, location, technology, intent and events.
    input:
      bodyType: json
      body:
        filters:
          type: object
          required: true
          minProperties: 1
          example: {country: [FR]}
          note: "At least one real company filter is required; eventWindow and locationMatch defaults alone do not count. Nullable boolean fields count only when set to true or false."
          properties:
            country: &company_string_or_array
              type: "string|array[string]"
              required: false
              minLength: 1
              minItems: 1
              pattern: "\\S"
              items: {type: string, minLength: 1, pattern: "\\S"}
              example: [FR]
              note: "Recognized country name or ISO alpha-2 code; one value or a nonempty array."
            region: {<<: *company_string_or_array, example: [us-ca], note: "Canonical region code, Region|Country or region name scoped by country; discover values with filter-values."}
            city: {<<: *company_string_or_array, example: [San Francisco], note: "Resolvable city value; discover exact values with filter-values."}
            industry: {<<: *company_string_or_array, example: [Software Development], note: "Canonical industry value; discover with filter-values."}
            size: &company_bucket
              type: "string|array[string]"
              required: false
              minItems: 1
              enum: &size_buckets [1-10, 11-50, 51-200, 201-500, 501-1000, 1001-5000, 5001-10000, 10001+]
              items: {type: string, enum: *size_buckets}
              example: [11-50]
              note: "One documented employee-count bucket or a nonempty array of buckets."
            revenue:
              <<: *company_bucket
              enum: &revenue_buckets [0-500K, 500K-1M, 1M-5M, 5M-10M, 10M-25M, 25M-75M, 75M-200M, 200M-500M, 500M-1B, 1B-10B, 10B-100B, 100B-1T, 1T-10T, 10T+]
              items: {type: string, enum: *revenue_buckets}
              example: [1M-5M]
              note: "One documented revenue bucket or a nonempty array of buckets."
            age:
              <<: *company_bucket
              enum: &age_buckets [0-3, 3-6, 6-10, 10-20, 20+]
              items: {type: string, enum: *age_buckets}
              example: [6-10]
              note: "One documented company-age bucket or a nonempty array of buckets."
            techStack: {<<: *company_string_or_array, example: [HubSpot], note: "Technology used; discover exact values with filter-values."}
            keywords: {<<: *company_string_or_array, example: [workflow automation], note: "Free text found on the company website."}
            topics: {<<: *company_string_or_array, example: [workflow automation], note: "Canonical business-intent topic; discover exact values with filter-values."}
            events:
              <<: *company_bucket
              enum: &event_values
                - increase_in_customer_service_department
                - hiring_in_finance_department
                - hiring_in_support_department
                - increase_in_engineering_department
                - decrease_in_customer_service_department
                - hiring_in_operations_department
                - hiring_in_creative_department
                - decrease_in_engineering_department
                - hiring_in_sales_department
                - increase_in_operations_department
                - hiring_in_trade_department
                - decrease_in_marketing_department
                - increase_in_marketing_department
                - hiring_in_marketing_department
                - hiring_in_health_department
                - hiring_in_education_department
                - increase_in_all_departments
                - decrease_in_all_departments
                - decrease_in_sales_department
                - decrease_in_operations_department
                - hiring_in_professional_service_department
                - hiring_in_human_resources_department
                - increase_in_sales_department
                - hiring_in_legal_department
                - hiring_in_unknown_department
                - hiring_in_engineering_department
                - company_award
                - new_product
                - employee_joined_company
                - merger_and_acquisitions
                - lawsuits_and_legal_issues
                - outages_and_security_breaches
                - closing_office
                - new_investment
                - new_office
                - new_partnership
                - cost_cutting
                - new_funding_round
                - award
                - ipo_announcement
              items: {type: string, enum: *event_values}
              example: [new_funding_round]
              note: "One documented recent event or a nonempty array of events."
            locations:
              <<: *company_bucket
              enum: &location_buckets [0-1, 2-5, 6-20, 21-50, 51-100, 101-1000, 1001+]
              items: {type: string, enum: *location_buckets}
              example: [2-5]
              note: "One documented count-of-locations bucket or a nonempty array of buckets."
            companyName: {<<: *company_string_or_array, example: [Stripe], note: "Company name; one string or a nonempty string array."}
            eventWindow: {type: "string|null", required: false, enum: [30 days, 60 days, 90 days, null, ""], default: 30 days, example: 30 days, note: "Blank (including whitespace-only) or null also uses the 30-day default; this alone is not a search filter."}
            locationMatch: {type: "string|null", required: false, enum: [hqOnly, hqOperating, null, ""], default: hqOnly, example: hqOnly, note: "Blank (including whitespace-only) or null also uses hqOnly; this alone is not a search filter."}
            hasWebsite: {type: "boolean|null", required: false, example: true, note: "Null leaves this criterion unset; true or false is a real filter."}
            isPublicCompany: {type: "boolean|null", required: false, example: false, note: "Null leaves this criterion unset; true or false is a real filter."}
        page: {type: integer, required: false, min: 0, default: 0, example: 0, note: "Catalog calls accept zero-based JSON integer pages. Airscale also accepts canonical decimal strings through the raw BYOK tool."}
        size: {type: integer, required: false, min: 1, max: 100, default: 50, example: 1, note: "Catalog calls accept JSON integer page sizes from 1 to 100. Airscale also accepts canonical decimal strings through the raw BYOK tool."}
        cursor: {type: string, required: false, note: "Opaque fc_ next_cursor; its saved page size overrides page and size."}
    test_request: {body: {filters: {country: [FR]}, page: 0, size: 1}}
    cost: {type: per_result, value: 0.1, currency: credit, per: 1, unit: record, source: docs, source_url: https://docs.airscale.io/api-reference/find-companies, checked: '2026-09-29', confidence: documented, note: "0.1 credit per company in rows; zero returned rows are free. Search requires at least 0.1 credit available to begin."}
    docs_url: https://docs.airscale.io/api-reference/find-companies

  - id: airscale.profile
    capability: people.enrich
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /profile
    body_allowlist: true
    platform_blocked: "The route accepts /in/, /company/ and /school/ URLs at different prices; the shared-key resolver cannot enforce URL-family pricing."
    name: Extract a LinkedIn profile
    summary: Extract public person or organization data from a LinkedIn profile URL.
    input:
      bodyType: json
      body:
        linkedin_profile_url: {type: string, required: true, minLength: 1, example: "https://www.linkedin.com/in/example-person-000000", note: "LinkedIn /in/, /company/ or /school/ URL; scheme may be omitted and query/extra path segments are canonicalized away."}
    test_request: {body: {linkedin_profile_url: "https://www.linkedin.com/company/stripe/"}}
    miss: {status: 404, means: "No profile was found for the submitted LinkedIn URL; no credits are charged."}
    cost: {type: per_success, value: 0.5, currency: credit, per: 1, unit: call, source: docs, source_url: https://docs.airscale.io/api-reference/extract-people-profile, checked: '2026-09-29', confidence: documented, note: "A successful /company/ or /school/ lookup costs 0.5 credit; /in/ costs 1. Failed lookup is free. The test uses a well-known public company URL and exercises the cheapest supported family."}
    docs_url: https://docs.airscale.io/api-reference/extract-people-profile

  - id: airscale.company
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /company
    body_allowlist: true
    platform_blocked: "The route accepts /in/, /company/ and /school/ URLs at different prices; the shared-key resolver cannot enforce URL-family pricing."
    name: Extract a LinkedIn company
    summary: Extract public company or school data from a LinkedIn profile URL.
    input:
      bodyType: json
      body:
        linkedin_profile_url: {type: string, required: true, minLength: 1, example: "https://www.linkedin.com/company/stripe/", note: "LinkedIn /in/, /company/ or /school/ URL; this route requires linkedin_profile_url, not a domain. Scheme may be omitted."}
    test_request: {body: {linkedin_profile_url: "https://www.linkedin.com/company/stripe/"}}
    miss: {status: 404, means: "No profile was found for the submitted LinkedIn URL; no credits are charged."}
    cost: {type: per_success, value: null, currency: credit, per: 1, unit: call, source: docs, source_url: https://docs.airscale.io/api-reference/extract-company-profile, checked: '2026-09-29', confidence: unknown, note: "Documented successful /company/ or /school/ lookup costs 0.5 credit; /in/ costs 1. Failed lookup is free. The public company test target is intended to exercise the 0.5-credit family; no hit price observed."}
    docs_url: https://docs.airscale.io/api-reference/extract-company-profile

  - id: airscale.reverse-email
    capability: linkedin.profile.from_email
    platform: linkedin
    scope: any_account
    method: POST
    path: /reverse-email
    body_allowlist: true
    platform_blocked: "The free HTTP 200 miss is the scalar JSON string \"not found\"; generic settlement does not recognize it before estimate fallback."
    name: Find a LinkedIn profile by email
    summary: Resolve a public person profile from an email address.
    input:
      bodyType: json
      body:
        email: {type: string, required: true, example: "example.person@example.org", note: "Nonempty local part and dotted domain; trimmed and lowercased before lookup."}
    test_request: {body: {email: "nobody@airscale.invalid"}}
    cost: {type: per_success, value: 2, currency: credit, per: 1, unit: call, source: docs, source_url: https://docs.airscale.io/api-reference/reverse-email, checked: '2026-09-29', confidence: documented, note: "Two credits for a returned profile. Exact HTTP 200 JSON scalar \"not found\" is a free miss; 503 is free. Generic settlement does not detect that scalar miss. The reserved .invalid test address is a deliberate miss; a previous synthetic example unexpectedly produced a metered hit, so no identity-bearing response is retained."}
    docs_url: https://docs.airscale.io/api-reference/reverse-email

  - id: airscale.airsearch
    capability: web.answer
    platform: web
    scope: any_account
    method: POST
    path: /airsearch
    body_allowlist: true
    name: Answer a web research question
    summary: Research a factual question and return a sourced answer with optional structured fields.
    input:
      bodyType: json
      body:
        prompt: {type: string, required: true, minLength: 1, example: "What is the capital of France?", note: "Nonempty after trimming."}
        schema: {type: object, required: false, example: {capital: string}, note: "Map nonempty output field names to nonempty type keywords or descriptions. Reserved names: status, response, reasoning, sources, confidence_score, certainty_tag, duration_ms."}
    test_request: {body: {prompt: "What is the capital of France?"}}
    expect: {json_path: status, equals: success}
    cost: {type: per_success, value: 1, currency: credit, per: 1, unit: call, source: observed, source_url: https://docs.airscale.io/api-reference/airsearch, checked: '2026-09-29', confidence: verified, note: "One credit for status:success, confirmed by a post-release balance delta with a 0.9 fractional remainder preserved. HTTP 200 status:not_found or status:timeout is free; an initial HTTP 504 timeout is also free."}
    docs_url: https://docs.airscale.io/api-reference/airsearch
