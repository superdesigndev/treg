        - last-hour
        - last-day
        - last-week
        - last-month
        - last-year
      page:
        type: integer
        required: false
        note: 1-based results page.
        default: 1
        min: 1
      query:
        type: string
        required: true
        note: Search keyword (e.g. "crossfit").
        example: travel
    bodyType: json
