# AnyAPI — CORE tier, hand-curated by the vendor (see the PR description's self-verification
# ledger: every test_request below was run live on 2026-09-08 and its cost reconciled against the
# charge AnyAPI's own meter reported). Core is the six platforms that carry most of AnyAPI's real
# traffic — tiktok, linkedin, facebook, google, x, instagram. Every other AnyAPI endpoint is in
# anyapi.extended.yaml, generated by scripts/catalog_ingest.py and priced by the same rule.
#
# AnyAPI is a per-request USD gateway over 362 normalized endpoints. Two properties matter for
# this catalog:
#   1. PRICE. `cost.value` is MEASURED, not listed: the p90 of every charge AnyAPI actually billed
#      for that endpoint over the trailing 60 days (scripts/data/anyapi_measured_charges.json),
#      which is why `source: observed`. It replaces the live rate card's cheapest-source price,
#      which read far below what buyers really pay wherever the cheap source rarely wins, and far
#      above it wherever a per-result endpoint was priced at its input maximum. A p90 is a shelf
#      price, NOT a ceiling: about one call in ten settles above the reserve, which is exactly what
#      domain/money/settlement.py designs for — the ledger takes the difference from the balance
#      and the next reserve is the gate. Across the same 60 days, under the older and much worse
#      prices, that overrun came to $18.66 on $695.05 settled, 2.7%. Every SKU also publishes
#      `failoverMaxUsd`, the dearest source that may rescue a failed attempt; that ceiling is named
#      per endpoint in `note`.
#      FIVE core rows are the exception and list the rate card's CHEAPEST SOURCE price instead
#      (`source: rate_card_api`): maps.search, maps.place, maps.reviews, twitter.profile and
#      twitter.replies. Their sources charge very different amounts for the SAME number of results,
#      so the p90 there measures which source won rather than how much work the call did. Measured
#      per source over the same 60 days, maps.search is scrapertech $0.00175 flat (312 calls),
#      serper $0.00297 flat (743 calls) and apify $0.06005 median (485 calls), all averaging 11-12
#      items per response - so its $0.07734 p90 is a number only the dearest source ever charges,
#      and listing it on a price-sorted shelf overstates the endpoint 44x. These five therefore
#      UNDER-reserve by design: a rescue on a dearer source settles above the listing. That is the
#      same overrun settlement.py:133-134 already accepts and reports in reconcile, and `costUsd`
#      settles the real number either way. The rule does not extend to the extended tier, which is
#      not shelf-ranked, nor to a single-source per-result row like linkedin.company_employees or
#      linkedin.jobs, whose cheapest advertised price is HIGHER than its measured p90.
#   2. SETTLEMENT. Every 2xx run body carries a top-level `costUsd` — the exact USD charged for
#      that call. `cost.reported_charge` makes treg settle on that number instead of the estimate,
#      so a rescued request bills what it really cost and a cheap request can bill LESS than the
#      catalogued price.
# A request that no source could serve returns a non-2xx and is not charged.
provider: anyapi
source:
  docs: https://getanyapi.com/docs
  openapi: https://api.getanyapi.com/openapi.json
  rate_card: https://api.getanyapi.com/v1/apis
  curated: '2026-09-09'
limits: no published per-key request-rate limit on /v1/run - AnyAPI does not advertise a quota it does
  not enforce. Spend is bounded instead by the wallet balance, the key's own spend cap, and the per-request
  `max_cost_usd` ceiling the caller sets. The unauthenticated /agent/signup trial route is limited to
  3 per IP per hour.
pricing_url: https://getanyapi.com/catalog
proposed_capabilities:
  google.maps.reviews: List the Google Maps reviews of a place
  google.serp.ai_overview: Get the AI Overview panel Google shows above a search result
  linkedin.email.work.find: Find work email from a LinkedIn profile, optionally with phone
endpoints:
- id: anyapi.x.search.posts
  capability: x.search.posts
  platform: x
  scope: any_account
  kind: data
  method: POST
  path: /v1/run/twitter.search
  name: X / Twitter Search
  summary: 'Search X (Twitter) with full advanced-search syntax (operators like from:, since:, until:,
    min_faves: work inline in the query) and get structured tweets with text, author, engagement, and
    cursor pagination. Limit is a per-page maximum; native pages contain approximately 20 tweets unless
    requireSinglePage selects a bulk lane.'
  input:
    body:
      cursor:
        type: string
        required: false
        note: Opaque pagination cursor from a previous response's nextCursor. Omit for the first page;
          pass it to fetch the next page of search results.
      limit:
        type: integer
        required: false
        note: Per-page maximum number of results to return (1-50, default 20). A provider may return a
          smaller native page; follow nextCursor for more.
        default: 20
        min: 1
        max: 50
        example: 20
      query:
        type: string
        required: true
        note: 'Search query using X (Twitter) advanced-search syntax. IMPORTANT: bare terms are ANDed
          - a tweet must contain EVERY word, so a list of loosely related keywords matches nothing; use
          one short phrase or OR between alternatives (e.g. ''anyapi OR getanyapi''). You can embed X
          advanced-search operators...'
        example: openai
      queryType:
        type: string
        required: false
        note: 'Result ranking: ''Latest'', ''Top'', ''Photos'', or ''Videos'' (e.g. Latest).'
        default: Latest
    bodyType: json
  test_request:
    body:
      query: openai
      limit: 20
  cost:
    type: per_success
    value: 0.00075
    currency: USD
    unit: call
    reported_charge:
      path: costUsd
      unit: usd
    source: observed
    source_url: https://api.getanyapi.com/v1/apis/twitter.search
    checked: '2026-09-11'
    confidence: verified
  example_response: examples/anyapi.x.search.posts.json
  docs_url: https://getanyapi.com/api/twitter/search
  note: AnyAPI lists this flat per request at the default limit of 20, and one of the four sources bills
    per result, so a SMALL request can settle below the price here ($0.0002 observed at limit=1 on 2026-09-08);
    `costUsd` reports the exact charge. AnyAPI slug `twitter.search`. Price is the p90 of what AnyAPI
    really charged for this endpoint over the 60 days to 2026-09-09 (24576 charged calls, $0.00075 median),
    not a list price; roughly one call in ten settles above it. 4 sources can serve it; the cheapest serves
    first and a failed attempt is retried on the next, up to a $0.0154 ceiling per request. Every response
    reports its exact charge as `costUsd`, so `reported_charge` settles the real number rather than this
    estimate. A request no source could serve is not charged. Send the `max_cost_usd` query parameter
    to refuse any source dearer than a price you name.
