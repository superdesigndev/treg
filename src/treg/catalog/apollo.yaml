        details: {type: array, items: {type: object}, required: true, note: "1-10 objects (max 10 per request), each carrying the same identifier keys as /people/match — email, first_name, last_name, domain, linkedin_url, …", example: [{"first_name": "Tim", "last_name": "Cook", "domain": "apple.com"}]}
