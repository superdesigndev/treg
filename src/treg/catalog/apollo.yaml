provider: apollo
source:
  docs: https://docs.apollo.io/reference/
  openapi: null # Apollo publishes reference docs (readme.io) but no fetchable OpenAPI document
  curated: 2026-07-28
# PARAMETER LOCATION TRAP — the single biggest first-call failure on this provider. Apollo puts
# most search and person-match parameters in the QUERY STRING, even on POST. Bulk person matching
# and validation instead take JSON bodies. Search arrays use `field[]=value` query pairs.
#
# PATH TRAP: people search is POST /mixed_people/api_search. The older /mixed_people/search is the
# in-app search route and answers 403 on API/Basic plans; several integrators published deprecation
# notices about exactly this. Do not "simplify" the path back.
#
# Billing (https://docs.apollo.io/docs/api-pricing): Apollo meters CREDITS, the per-month allowance
# depends on the plan, and Apollo itself publishes no $/credit — costs below stay in credits and
# convert through fx.yaml's credit_rates_usd.apollo (Basic-plan rate). Three rules matter:
#   1. Enrichment charges only when credit-consuming data comes BACK. A miss costs 0.
#   2. A mobile phone is eight times the price of an email: 1 credit for demographics or an email,
#      +8 if a mobile is returned, hence Apollo's own "1-9 credits per person". `reveal_phone_number`
#      is therefore the expensive switch. The ordinary enrichment tool leaves it off on treg's key;
#      the dedicated phone-finding tool fixes it on with a separate hold.
#   3. The two searches are priced DIFFERENTLY from each other: people search is free (and returns
#      no contact details at all), while company search costs 1 credit per PAGE. Do not assume
#      "search is free" as a blanket rule here.
# Waterfall flags (run_waterfall_email / run_waterfall_phone) fall through to third-party vendors,
# and some of those vendors bill per lookup EVEN WHEN NOTHING IS FOUND — the one place where
# Apollo's otherwise-clean "no data, no charge" rule does not hold.

limits: "credit pool plus per-minute caps that differ per endpoint"
pricing_url: https://www.apollo.io/pricing  # Per USER per month. API access for custom integrations requires Organization. Exporting a mobile number commonly costs 5 credits. Credits do NOT roll over.; free tier: 10 expor
endpoints:
  - id: apollo.people.enrich
    added: '2026-07-28'
    cache:
      ignore_paths: ["request_id"]
    test_request: {"queryParams": {"email": "patrick@stripe.com"}}
    domain: contacts
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /people/match
    name: "Enrich a person by email, LinkedIn URL or name + company"
    summary: "Enrich a person from an email, LinkedIn URL or name + company — title, contact details"
    input:
      queryParams:
        email: {type: string, required: false, note: "work or personal email of the person", example: "tim@apple.com"}
        hashed_email: {type: string, required: false, note: "MD5 or SHA-256 hash of the email, when you cannot send it in the clear"}
        first_name: {type: string, required: false, example: "Tim"}
        last_name: {type: string, required: false, example: "Cook"}
        name: {type: string, required: false, note: "full name; use instead of first_name + last_name"}
        organization_name: {type: string, required: false, note: "the person's employer, to disambiguate common names", example: "Apple"}
        domain: {type: string, required: false, note: "employer's domain, with no www and no @", example: "apple.com"}
        linkedin_url: {type: string, required: false, example: "http://www.linkedin.com/in/tim-cook"}
        id: {type: string, required: false, note: "Apollo person id from a previous search"}
        reveal_personal_emails: {type: boolean, required: false, note: "unlocks personal emails; default false", example: false}
        reveal_phone_number: {type: boolean, required: false, note: "OWN KEY ONLY: true is refused on treg's shared key (false, the default, is accepted, as is omitting it). Adds 8 credits when a mobile is found. The number arrives asynchronously by webhook_url or poll_only; default false", example: false}
        run_waterfall_email: {type: boolean, required: false, note: "OWN KEY ONLY: true is refused on treg's shared key (false, the default, is accepted). Fall through to third-party vendors when Apollo's own data misses; some vendors bill even on a miss; default false"}
        run_waterfall_phone: {type: boolean, required: false, note: "OWN KEY ONLY: true is refused on treg's shared key (false, the default, is accepted). As run_waterfall_email, for phone numbers; default false"}
        webhook_url: {type: string, required: false, note: "OWN KEY ONLY: refused on treg's shared key. Use this or poll_only when reveal_phone_number is true"}
      note: "POST, but every parameter rides in the QUERY STRING — there is no JSON body. Supply the strongest identifier you have: email > linkedin_url > name + domain. A request with none of them cannot match"
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://www.apollo.io/pricing
      checked: '2026-08-13'
      confidence: documented
      note: 'Metered at the 1-credit baseline treg calls with: reveal_phone_number and reveal_personal_emails both default false, so a default enrich consumes 1 credit for demographics or an email, charged only when credit-consuming data comes back (no match, no charge) — the same documented Basic-plan rate (fx.yaml credit_rates_usd.apollo) as apollo.companies.enrich. The phone reveal (+8 per mobile, returned async to webhook_url) and the waterfalls (whose vendors may bill even on a miss) are refused on treg''s shared key, so this rate covers every shared-key call. A no-match answers 200 with a person stub at match_confidence none; it is free unless it carries an email.'
    docs_url: https://docs.apollo.io/reference/people-enrichment

  - id: apollo.people.phone.find
    added: '2026-11-20'
    domain: contacts
    capability: people.phone.find
    platform: people
    scope: any_account
    method: POST
    path: /people/match
    strict_query: true
    cache: forbidden
    async:
      id_from: request_id_str
      poll:
        endpoint: apollo.people.phone.result
        param: {in: pathParams, name: request_id}
      status:
        path: webhook_result.status
        success: [success]
      result: {path: webhook_result.people}
      interval: 10
      max_age: 600
      pending_response: {status: 404, path: error_code, equals: result_pending}
    expect: {json_path: phone_enrichment.status, equals: pending}
    name: Find a person's phone numbers with Apollo
    summary: Retrieve available phone numbers and their types for one person.
    input:
      queryParams:
        email: {type: string, required: false, example: "tim@apple.com"}
        linkedin_url: {type: string, required: false, example: "https://www.linkedin.com/in/tim-cook"}
        name: {type: string, required: false, example: "Tim Cook"}
        domain: {type: string, required: false, example: "apple.com"}
        reveal_phone_number: {type: boolean, required: true, enum: [true], example: true}
        poll_only: {type: boolean, required: true, enum: [true], example: true}
      note: "Send an email, LinkedIn URL or name plus employer domain. Apollo returns a request_id_str when phone_enrichment.status is pending; poll the linked result tool. The result labels each number with type_cd, including mobile or work_direct. Waterfalls and caller webhooks are excluded."
    test_request: {queryParams: {name: "Tim Cook", domain: "apple.com", reveal_phone_number: true, poll_only: true}}
    cost:
      type: per_success
      value: 9
      currency: credit
      per: 1
      unit: call
      settle: usage
      usage: {path: webhook_result.credits_consumed, unit: credit}
      non_deferred_charge: {path: person.email, value: 1}
      fallback: {value: 9, note: "The documented maximum is one demographic credit plus eight for a phone; missing terminal usage settles at this estimate for review."}
      worst_case: 9
      source: docs
      source_url: https://docs.apollo.io/docs/api-pricing
      checked: '2026-11-20'
      confidence: documented
      note: "A submission carrying person.email adds one demographic credit to the terminal phone meter, or settles one credit immediately when no phone job starts. A non-pending no-email stub is free."
    verified: '2026-11-20'
    example_response: examples/apollo.people.phone.find.json
    terminal_example_response: examples/apollo.people.phone.result.json
    docs_url: https://docs.apollo.io/reference/people-enrichment

  - id: apollo.people.phone.result
    added: '2026-11-20'
    kind: utility
    domain: contacts
    capability: people.phone.find
    platform: people
    scope: any_account
    method: GET
    path: /webhook_result/{request_id}
    strict_query: true
    cache: forbidden
    resource_ownership:
      requires: {kind: "poll:apollo.people.phone.result", param: request_id}
    name: Get a completed Apollo phone lookup
    summary: Read the result of a phone lookup this team started.
    input:
      pathParams:
        request_id: {type: string, required: true, example: "1039995589705121900"}
      note: "A pending result answers 404 result_pending with retry_after_seconds. Only use the top-level request_id_str from the submission; phone_enrichment.request_id is a different identifier."
    test_request: {pathParams: {request_id: "1039995589705121900"}}
    cost: {type: free, value: 0, currency: USD, unit: call, source: docs, source_url: "https://docs.apollo.io/reference/poll-webhook-result", checked: '2026-11-20', confidence: documented, note: "Apollo lists polling at zero credits."}
    example_response: examples/apollo.people.phone.result.json
    docs_url: https://docs.apollo.io/reference/poll-webhook-result

  - id: apollo.people.phone.validate
    added: '2026-11-20'
    domain: contacts
    capability: people.phone.verify
    platform: people
    scope: any_account
    method: POST
    path: /enrich
    body_allowlist: true
    cache: forbidden
    async:
      id_from: request_id
      poll:
        endpoint: apollo.people.phone.validate.result
        param: {in: pathParams, name: request_id}
      status:
        path: webhook_result.status
        success: [success]
      result: {path: webhook_result.results}
      interval: 10
      max_age: 3600
      pending_response: {status: 404, path: error_code, equals: result_pending}
    expect: {json_path: status, equals: accepted}
    name: Validate a phone number with Apollo
    summary: Check one supplied phone number and return Apollo's validation verdict and validator.
    input:
      bodyType: json
      body:
        action: {type: string, required: true, enum: [phone_verifier], example: phone_verifier}
        action_type: {type: string, required: true, enum: [tool], example: tool}
        input_attributes:
          type: array
          required: true
          minItems: 1
          maxItems: 1
          items: {type: object}
          item_required_all: [phone_number]
          example: [{phone_number: '+12025550143'}]
          note: 'One existing phone number in E.164 format; a malformed number can still be checked and charged.'
        poll_only: {type: boolean, required: true, enum: [true], example: true}
      note: 'Validation checks a supplied number; it does not find a number or check Do Not Call status. A not_validated result means Apollo could not confirm it.'
    test_request:
      bodyType: json
      body: {action: phone_verifier, action_type: tool, input_attributes: [{phone_number: '+12025550143'}], poll_only: true}
    cost:
      type: per_success
      value: 8
      currency: credit
      per: 1
      unit: record
      settle: usage
      usage: {path: webhook_result.credits_consumed, unit: credit}
      fallback: {value: 8, note: 'Missing terminal usage settles at the 8-credit estimate and flags the task for review.'}
      worst_case: 20
      source: docs
      source_url: https://docs.apollo.io/reference/validate-emails-and-phone-numbers
      checked: '2026-11-20'
      confidence: documented
      note: 'Apollo charges each checked phone regardless of verdict. The platform hold covers the documented 20-credit plan variant; the completed result reports actual credits consumed.'
    verified: '2026-11-20'
    example_response: examples/apollo.people.phone.validate.json
    terminal_example_response: examples/apollo.people.phone.validate.result.json
    docs_url: https://docs.apollo.io/reference/validate-emails-and-phone-numbers

  - id: apollo.people.phone.validate.result
    added: '2026-11-20'
    kind: utility
    domain: contacts
    capability: people.phone.verify
    platform: people
    scope: any_account
    method: GET
    path: /webhook_result/{request_id}
    strict_query: true
    cache: forbidden
    resource_ownership:
      requires: {kind: 'poll:apollo.people.phone.validate.result', param: request_id}
    name: Get a completed Apollo phone validation
    summary: Read the result of a phone validation this team started.
    input:
      pathParams:
        request_id: {type: string, required: true, example: '5139398567364803549'}
      note: 'A pending result answers 404 result_pending with retry_after_seconds.'
    test_request: {pathParams: {request_id: '5139398567364803549'}}
    cost: {type: free, value: 0, currency: USD, unit: call, source: docs, source_url: 'https://docs.apollo.io/reference/poll-webhook-result', checked: '2026-11-20', confidence: documented}
    example_response: examples/apollo.people.phone.validate.result.json
    docs_url: https://docs.apollo.io/reference/poll-webhook-result

  - id: apollo.people.search
    test_request:
      bodyType: json
      body: {person_titles: ["head of marketing"], q_organization_domains_list: ["stripe.com"], per_page: 3}
    example_response: examples/apollo.people.search.json
    verified: '2026-08-29'
    added: '2026-07-28'
    domain: contacts
    capability: people.search
    platform: people
    scope: any_account
    method: POST
    path: /mixed_people/api_search
    name: "Search people by title, seniority, company or location"
    summary: "Search Apollo's 200M+ contacts by title, seniority, company, location or tech (free)"
    input:
      queryParams:
        "person_titles[]": {type: array, items: {type: string}, required: false, note: "job titles, matched loosely (OR across the list)", example: ["head of marketing"]}
        "person_seniorities[]": {type: array, items: {type: string}, required: false, note: "owner, founder, c_suite, partner, vp, head, director, manager, senior, entry, intern"}
        "person_locations[]": {type: array, items: {type: string}, required: false, note: "where the PERSON lives", example: ["California, US"]}
        "organization_locations[]": {type: array, items: {type: string}, required: false, note: "where their COMPANY's HQ is"}
        "q_organization_domains_list[]": {type: array, items: {type: string}, required: false, note: "restrict to employees of these company domains; max 1,000", example: ["apollo.io"]}
        "organization_num_employees_ranges[]": {type: array, items: {type: string}, required: false, note: "employee-count bands as 'min,max' strings", example: ["1,10"]}
        "contact_email_status[]": {type: array, items: {type: string}, required: false, note: "verified, unverified, likely to engage, unavailable"}
        "currently_using_any_of_technology_uids[]": {type: array, items: {type: string}, required: false, note: "tech-stack filter, e.g. salesforce"}
        "revenue_range[min]": {type: [integer, string], required: false, note: "annual revenue floor, integer with no symbols"}
        "revenue_range[max]": {type: integer, required: false, note: "annual revenue ceiling"}
        page: {type: integer, required: false, note: "1-based; max 500 pages", example: 1}
        per_page: {type: integer, required: false, note: "max 100", example: 1}
      note: "query-string params on a POST, with arrays in field[]=value form. RETURNS NO EMAILS OR PHONE NUMBERS AT ALL — that is why it is free. Pipe the person ids into apollo.people.enrich to get contact data, which is where the credits go. Result set is capped at 50,000 records"
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'documented free — 0 credits, because no contact data is returned. Counts against the plan''s request limits only'}
    docs_url: https://docs.apollo.io/reference/people-api-search

