        has_phone: {type: boolean, required: false, note: "only people with a phone number on file"}
        has_linkedin: {type: boolean, required: false, note: "only people with a LinkedIn profile on file"}
        has_company_phone: {type: boolean, required: false, note: "only people whose company has a main phone number on file"}
        group_by: {type: string, required: false, enum: [department, level, industry, country, state, company_size, revenue, company, title], note: "break the count down by one field"}
    test_request: {body: {title: ["head of sales"], countries: ["US"]}}
    cost:
      type: per_call
      value: 0.05
      currency: USD
      reported_charge: {path: billing.charge_usd, unit: usd}
      source: rate_card_api
      source_url: https://people-api.arihaan.ai/v2/rates
      checked: '2026-11-17'
      confidence: documented
      note: "Reserves the most one count can be charged: up to 25 count units at $0.002. Settles on billing.charge_usd: one count unit for a narrow count ($0.002), more for very broad filters; this is what the count costs us to run. Not charged when refused as too broad."
