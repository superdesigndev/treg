provider: arihaan-people
source:
  docs: https://people-api.arihaan.ai/docs
  openapi: https://people-api.arihaan.ai/v2/openapi.json
  curated: 2026-10-28
# Prepaid pay-per-use balance. Each call reserves the price in `cost.value`, the most that call can be charged under the
# public rate card, and settles on the exact figure the response carries at `billing.charge_usd` (a search that reads
# less, or returns fewer people, settles lower; a miss is charged less than a hit). The rate card is public:
# GET /v2/rates. Every 2xx carries the `billing` block and the X-Cost-USD and X-Balance-USD headers. Errors and the
# free routes (/v2/meta, /v2/rates, /v2/balance, /v2/usage, /v2/openapi.json, /v2/people/estimate) are not charged.
# City, state and country on a person are the company's headquarters, not where the person lives.
# Probe: GET /v2/balance is free; a bad or missing key answers 401.
limits: "100 people per search page; 25 keys per lookup; 100 ids per fetch or phone call; a search that would read more than the scan cap is refused with HTTP 400 and nothing is charged; HTTP 402 when the prepaid balance is below the estimated charge"
pricing_url: https://people-api.arihaan.ai/pay-per-person
endpoints:
  - id: arihaan-people.people.search
    verified: '2026-10-28'
    added: '2026-10-28'
    example_response: examples/arihaan-people.people.search.json
    domain: people
    capability: people.search
    platform: people
    scope: any_account
    method: POST
    path: /v2/people/search
    body_allowlist: true
    name: "Search people by role, company and location"
    summary: "Find business contacts by title, department, seniority, company, industry, size, revenue and company location. Each person has name, title, department, level, company, company location, work email when on file and LinkedIn URL. Cursor paging."
    input:
      bodyType: json
      body:
        title: {type: "array[string]", required: false, max: 50, note: "job title keywords; a person matches if the title contains ANY of them", example: ["head of sales"]}
        title_exclude: {type: "array[string]", required: false, max: 50, note: "drop people whose title contains ANY of these", example: ["assistant"]}
        title_whole_words: {type: boolean, required: false, note: "match title and title_exclude as whole words"}
        company: {type: "array[string]", required: false, max: 50, note: "company name contains ANY of these", example: ["stripe"]}
        company_exact: {type: boolean, required: false, note: "match company names exactly instead of 'contains'"}
        exclude_company: {type: "array[string]", required: false, max: 50, note: "drop people at companies whose name contains ANY of these"}
        department: {type: "array[string]", required: false, max: 50, note: "job family; accepted values are listed by GET /v2/meta", example: ["Sales"]}
        level: {type: "array[string]", required: false, max: 50, note: "seniority; accepted values are listed by GET /v2/meta", example: ["C-suite", "VP"]}
        industry: {type: "array[string]", required: false, max: 50, note: "the company's industry contains ANY of these", example: ["software"]}
        company_size: {type: "array[string]", required: false, max: 50, note: "company headcount bucket; accepted values are listed by GET /v2/meta"}
        revenue: {type: "array[string]", required: false, max: 50, note: "company annual revenue range; accepted values are listed by GET /v2/meta", example: ["$10-50M"]}
        countries: {type: "array[string]", required: false, max: 50, note: "ISO-3166 alpha-2 codes of the COMPANY's headquarters country", example: ["US"]}
        states: {type: "array[string]", required: false, max: 50, note: "state or province codes of the COMPANY's headquarters", example: ["TX"]}
        city: {type: "array[string]", required: false, max: 50, note: "company headquarters city contains ANY of these", example: ["austin"]}
        has_email: {type: boolean, required: false, note: "only people with an email on file"}
        has_phone: {type: boolean, required: false, note: "only people with a phone number on file"}
        has_linkedin: {type: boolean, required: false, note: "only people with a LinkedIn profile on file"}
        has_company_phone: {type: boolean, required: false, note: "only people whose company has a main phone number on file"}
        limit: {type: integer, required: false, default: 25, min: 1, max: 100, note: "people per page", example: 1}
        cursor: {type: string, required: false, note: "next_cursor from the previous page; null means the last page"}
    test_request: {body: {title: ["head of sales"], countries: ["US"], has_email: true, limit: 1}}
    cost:
      type: per_call
      value: 0.10
      currency: USD
      reported_charge: {path: billing.charge_usd, unit: usd}
      source: rate_card_api
      source_url: https://people-api.arihaan.ai/v2/rates
      checked: '2026-10-28'
      confidence: documented
      note: "Reserves the most one page can be charged: up to 10 scan units at $0.005 plus up to 100 people at $0.0004. Settles on billing.charge_usd: one scan unit for a narrow search ($0.005) plus $0.0004 per person returned. A search that finds nobody is still charged its scan units. A refusal as too broad, and every 4xx, is not charged. POST /v2/people/estimate (free) returns the scan units before you run it."
    docs_url: https://people-api.arihaan.ai/docs

  - id: arihaan-people.people.count
