provider: arihaan-people
source:
  docs: https://people.arihaan.ai/docs
  openapi: https://people-api.arihaan.ai/v2/openapi.json
  curated: 2026-11-17
# Prepaid pay-per-use balance, no subscription. Each call reserves the price in `cost.value`, the most that call can be
# charged on treg's rate card, and settles on the exact figure the response carries at `billing.charge_usd`. treg's key
# is on the `treg` card of the public rate card (GET /v2/rates, no key needed): every hit price is 5% under the
# cheapest paid provider in the same treg capability as read on 2026-11-17. Every call covers what it costs us:
#   - a lookup, personal email or profile that finds nothing is charged the $0.0003 miss fee (the cost of the read);
#   - a search pays its scan units ($0.005 each, one for a narrow search) even when it finds nobody;
#   - a fetch or phone call pays at least $0.001;
#   - a call whose real BigQuery cost is above its price is topped up to that cost (billing.events.cost_floor).
# Errors, refusals (too broad, over a limit, no balance) and the free routes (/v2/meta, /v2/rates, /v2/balance,
# /v2/usage, /v2/openapi.json, /v2/people/estimate) are not charged. Every 2xx carries the `billing` block and the
# X-Cost-USD and X-Balance-USD headers.
# City, state and country on a search or lookup person are the company's headquarters, not where the person lives.
# Personal emails: an address that bounced, was reported, unsubscribed or failed its check is never returned, and
# people in the EU/EEA, the UK and Switzerland are not covered. Reverse lookup by email matches work emails only.
# Use is under the Terms and Fair Use Policy: https://people.arihaan.ai/terms and https://people.arihaan.ai/fair-use
# Probe: GET /v2/balance is free; a bad or missing key answers 401.
limits: "100 people per search page; 100 ids per fetch or phone call; one key per lookup row here; a search that would read more than the scan cap is refused with HTTP 400 and nothing is charged; HTTP 402 when the prepaid balance is below the reserve; HTTP 403 profile_required until the account owner adds a LinkedIn profile URL and where they heard about us; HTTP 429 with resets_at past the per-key caps (treg's key gets 20x the usual: 1,200 calls a minute, 200 at once, 1,000,000 people and 40,000 personal emails a day)"
pricing_url: https://people-api.arihaan.ai/v2/rates
endpoints:
  - id: arihaan-people.people.email.personal
    added: '2026-11-17'
    example_response: examples/arihaan-people.people.email.personal.json
    domain: people
    capability: people.email.find.personal
    platform: people
    scope: any_account
    method: POST
    path: /v2/people/personal-email
    body_allowlist: true
    name: "Personal email from a LinkedIn URL"
    summary: "The personal email (Gmail, Outlook, iCloud and similar) behind a LinkedIn profile URL or a person id, each address with the date its mailbox was last checked and what the check said. Not the work address."
    input:
      bodyType: json
      body:
        linkedin_url: {type: string, required: false, note: "the person's LinkedIn profile URL; send this or id", example: "https://www.linkedin.com/in/example"}
        id: {type: string, required: false, note: "a person id from a search or lookup; send this or linkedin_url"}
    test_request: {body: {linkedin_url: "https://www.linkedin.com/in/example-person-zz9"}}
    cost:
      type: per_call
      value: 0.038
      currency: USD
      reported_charge: {path: billing.charge_usd, unit: usd}
      source: rate_card_api
      source_url: https://people-api.arihaan.ai/v2/rates
      checked: '2026-11-17'
      confidence: documented
      note: "$0.038 when at least one personal address is returned (5% under the cheapest paid personal email provider on treg, Fiber AI at $0.04). A miss is charged $0.0003, the cost of the read, so a miss never costs us money."
    docs_url: https://people.arihaan.ai/docs

