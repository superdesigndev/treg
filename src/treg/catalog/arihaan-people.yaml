        city: {type: "array[string]", required: false, max: 50, note: "company headquarters city contains ANY of these", example: ["austin"]}
        has_email: {type: boolean, required: false, note: "only people with a work email on file"}
        has_personal_email: {type: boolean, required: false, note: "only people we hold a personal email for (bought per person on /v2/people/personal-email)"}
        personal_email_checked: {type: boolean, required: false, note: "only people whose personal email's mailbox we have checked"}
