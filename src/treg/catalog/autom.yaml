provider: autom
source:
  docs: https://docs.autom.dev
  openapi: https://app.autom.dev/openapi
  curated: '2026-11-09'
pricing_url: https://www.autom.dev/pricing
limits: Rate limits depend on the plan; GET /usage returns the key's credit balance and per-second and per-minute limits.
proposed_capabilities:
  google.serp.autocomplete: Get Google query autocomplete suggestions
  google.serp.jobs: Get Google Jobs listings for a query
  google.serp.ai-mode: Get the Google AI Mode answer for a query
  google.locations.find: Find Google location names a search can target
defaults:
  expect:
    path: response.error
    op: absent
  provenance:
    source: docs
    source_url: https://www.autom.dev/pricing
    checked: '2026-11-09'
    confidence: documented
endpoints:
- id: autom.google.serp.organic
  capability: google.serp.organic
  platform: google
  domain: search
  scope: any_account
  method: GET
  path: /v1/google/search
  name: Search Google (full SERP)
  summary: Search Google and return organic results, knowledge graph, related questions and related searches as JSON.
  input:
    queryParams:
      query:
        type: string
        required: true
        example: best electric cars
      tbs:
        type: string
        required: false
      safe:
        type: string
        required: false
      location:
        type: string
        required: false
      uule:
        type: string
        required: false
      google_domain:
        type: string
        required: false
        default: google.com
      gl:
        type: string
        required: false
        example: us
      hl:
        type: string
        required: false
        example: en
      cr:
        type: string
        required: false
      lr:
        type: string
        required: false
      page:
        type: number
        required: false
        default: 1
        note: Page number / offset used for pagination.
      num:
        type: number
        required: false
        default: 10
        example: 10
        note: Maximum number of results to return per page (deprecated).
  test_request:
    queryParams:
      query: best electric cars
      gl: us
      hl: en
      num: 10
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  miss:
    when:
      any:
      - path: response.organic_results
        op: absent
      - path: response.organic_results
        op: empty
  added: '2026-11-09'
  docs_url: https://docs.autom.dev
