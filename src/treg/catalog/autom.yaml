- id: autom.google.serp.jobs
  capability: google.serp.jobs
  platform: google
  domain: search
  scope: any_account
  method: GET
  path: /v1/google/jobs
  name: Search Google Jobs
  summary: Search Google Jobs and return job listings with title, company, location and posting details.
  input:
    queryParams:
      query:
        type: string
        required: true
        example: software engineer
      uds:
        type: string
        required: false
        note: Advanced search filters string for Google Jobs (encoded filter chips).
      lrad:
        type: number
        required: false
        note: Search radius in kilometers. Does not strictly limit the radius, but influences result proximity.
      ltype:
        type: number
        required: false
      location:
        type: string
        required: false
        example: New York, NY
      uule:
        type: string
        required: false
      google_domain:
        type: string
        required: false
        default: google.com
      gl:
        type: string
        required: false
        default: us
        example: us
      hl:
        type: string
        required: false
        default: en
        example: en
      cr:
        type: string
        required: false
      lr:
        type: string
        required: false
      next_page_token:
        type: string
        required: false
  test_request:
    queryParams:
      query: software engineer
      location: New York, NY
      gl: us
      hl: en
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  added: '2026-11-09'
  docs_url: https://docs.autom.dev
