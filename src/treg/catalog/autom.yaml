        required: true
        example: best electric cars
        note: The search query you want to run on Bing.
      page:
        type: number
        required: false
        default: 1
        note: Page number for pagination (1 = first page).
      num:
        type: number
        required: false
        default: 10
        note: Number of results per page (e.g. 10, 20, 50). This value is a suggestion.
      location:
        type: string
        required: false
        note: Search origin location (e.g. city).
      lat:
        type: number
        required: false
        note: GPS latitude for the search origin.
      lon:
