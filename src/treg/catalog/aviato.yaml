provider: aviato
source:
  docs: https://docs.data.aviato.co
  openapi: null
  curated: '2026-08-25'
limits: "Current team limits are per route: company enrich 500/5s and 360,000/hour; company bulk enrich 50/5s and 36,000/hour; company search 10/minute and 300/hour; employees 20/minute and 1,000/hour; founders and funding rounds 150/5s and 20,000/hour; acquisitions and both investment routes 120/minute and 5,000/hour; person enrich 500/5s and 360,000/hour; person bulk enrich 50/5s and 36,000/hour; contact-info and phone 100/5s and 72,000/hour; DSL person search 600/minute and 36,000/hour; each social route 60/minute and 1,000/hour. Numeric limits are not published for person/email or simple search."
pricing_url: https://docs.data.aviato.co/api-reference/billing/get-balance

# Aviato is available through BYOK and treg's platform key. Our automatic recharge and paid receipt
# establish $0.01/credit in fx.yaml. Endpoint credit counts come from the authenticated Limits &
# Pricing page; the differently named company-investments and person-email routes were also checked
# against live balance deltas. Preview-mode company/person enrichment is free. All 21 endpoints were
# live verified on 2026-08-25, with captured and reviewed example responses. Live balance deltas
# are authoritative where the authenticated price page and the API's actual billing differ.

proposed_capabilities:
  companies.employees: "List a company's employees"
  companies.founders: "List a company's founders"
  companies.funding_rounds: "List a company's funding rounds"
  companies.acquisitions: "List acquisitions made by a company"
  companies.investments: "List investments received by a company"
  companies.outbound_investments: "List investments made by a company"
  people.contact.get: "Get a person's contact information"

endpoints:
  - id: aviato.companies.enrich
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: GET
    path: /company/enrich
    name: "Enrich a company by website or profile URL"
    summary: "Get enriched company firmographics, financing, traffic, technology and hiring data"
    input:
      queryParams:
        id: {type: string, required: false, note: "Aviato company id"}
        linkedinID: {type: string, required: false, note: "LinkedIn slug"}
        linkedinNumID: {type: string, required: false, note: "numeric LinkedIn company id"}
        linkedinURL: {type: string, required: false, note: "company LinkedIn URL"}
        website: {type: string, required: false, note: "company domain or URL", example: "stripe.com"}
        preview: {type: boolean, required: false, note: "return minimal id/name/URLs without charging a credit"}
        full: {type: boolean, required: false, note: "include funding rounds, investments, acquisitions, founders and funds"}
        rescrape: {type: boolean, required: false, note: "refresh stale data; use with maxDataAgeDays"}
        maxDataAgeDays: {type: integer, required: false}
        require: {type: "array[string]", required: false, note: "repeat for fields that must be non-empty; a miss returns 404 without charge"}
      note: "supply at least one identifier. Start with preview=true to resolve the entity for free, then request the full record."
    test_request:
      queryParams: {website: "stripe.com", preview: true}
    verified: '2026-08-24'
    example_response: examples/aviato.companies.enrich.json
    cost:
      type: per_success
      value: 15
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://data.aviato.co/
      checked: '2026-08-25'
      confidence: verified
      settle: modifiers
      modifiers:
        preview: {location: query, when: truthy, set_credits: 0}
        rescrape: {location: query, when: truthy, add_credits: 5, reserve_only: true}
      note: "15 credits per successful enrichment; preview=true and a require-driven miss are free. Two live rescrape=true probes on different companies each charged 15 credits, not the documented 20. Treg holds the documented 20-credit maximum and settles the observed 15-credit charge."
    docs_url: https://docs.data.aviato.co/api-reference/company/enrich

  - id: aviato.companies.enrich.bulk
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /company/bulk-enrich
    name: "Bulk enrich companies"
    summary: "Enrich up to 100 companies in one synchronous request"
    input:
      bodyType: json
      body:
        lookups: {type: "array[object]", required: true, note: "1-100 lookup objects; each can use Aviato company identifiers such as website or linkedinURL", example: [{website: "stripe.com"}]}
        rescrape: {type: boolean, required: false, note: "refresh records older than maxDataAgeDays"}
        maxDataAgeDays: {type: integer, required: false, note: "stale-data threshold; requires rescrape=true"}
        require: {type: "array[string]", required: false, note: "top-level fields that must be present; failed gates are not billed"}
      note: "this is synchronous bulk enrichment. Each successful lookup returns the normal company object. Public docs do not offer company preview mode."
    test_request:
      body: {lookups: [{website: "stripe.com"}], require: ["name"]}
    verified: '2026-08-25'
    example_response: examples/aviato.companies.enrich.bulk.json
    cost:
      type: per_success
      value: 15
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://data.aviato.co/
      checked: '2026-08-25'
      confidence: verified
      settle: modifiers
      modifiers:
        rescrape: {location: body, when: truthy, add_credits: 5, reserve_only: true}
      note: "15 credits per successfully enriched company. Live one-row and mixed two-row rescrape=true probes charged 15 credits per successful row, not the documented 20. Treg holds 20 per input and settles 15 per successful row. A failed lookup is free."
    docs_url: https://docs.data.aviato.co/api-reference/company/bulk-enrich

  - id: aviato.companies.search
    domain: companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: POST
    path: /company/search
    name: "Search companies with Aviato DSL"
    summary: "Search companies using nested filters, text queries and relational fields"
    input:
      bodyType: json
      body:
        dsl: {type: object, required: true, note: "{filters,limit,offset,sort?,nameQuery?}; filters use {columnPath:{operation,value,quantifier?}} and support AND/OR groups", example: {filters: [{name: {operation: "fts", value: "Stripe"}}], limit: 1, offset: 0, sort: []}}
      note: "DSL limit is at most 250 and offset at most 10,000. Use a one-row query while developing because the public docs do not publish search credit counts."
    test_request:
      body:
        dsl: {filters: [{name: {operation: "fts", value: "Stripe"}}], limit: 10, offset: 0, sort: []}
    verified: '2026-08-25'
    example_response: examples/aviato.companies.search.json
    cost:
      type: per_success
      value: 0.25
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://data.aviato.co/
      checked: '2026-08-24'
      confidence: documented
      note: "0.25 credits per successful search call; the result limit changes the response size, not this fixed route price."
    docs_url: https://docs.data.aviato.co/api-reference/company/search

