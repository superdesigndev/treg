- id: besttime.forecast.address
  capability: venues.foot_traffic.forecast
  platform: venues
  scope: any_account
  method: POST
  path: /forecasts
  name: Venue foot-traffic forecast by name and address
  summary: Get a 24x7 foot-traffic forecast from venue name and address.
  input:
    queryParams:
      venue_name:
        type: string
        required: true
        example: MOA Korean BBQ & Bar
      venue_address:
        type: string
        required: true
        example: 128 S Tryon St Charlotte NC 28202
    note: Supply a BestTime venue_id or a venue name and street address. A new forecast returns the 168 hourly
      values for a week; Live returns current busyness when available.
