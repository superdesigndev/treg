provider: besttime
source:
  docs: https://documentation.besttime.app/
  openapi: null
  curated: '2026-09-24'
pricing_url: https://besttime.app/subscription/pricing
limits: Plan and per-route limits apply; see BestTime API documentation. Public-key queries can only read venues
  forecasted under the matching key pair.
proposed_capabilities:
  venues.types.list: List or search BestTime venue type identifiers
  venues.foot_traffic.detail: Read one forecasted venue and its foot-traffic details
  venues.foot_traffic.week: Read the full 168-hour weekly foot-traffic forecast for a venue
  venues.foot_traffic.day: Read one day of a venue foot-traffic forecast
  venues.foot_traffic.hour: Read one hour of a venue foot-traffic forecast
  venues.foot_traffic.week_overview: Summarize foot-traffic patterns across a venue forecast week
  venues.foot_traffic.busy_hours: Find the busiest hours for a forecasted venue
  venues.foot_traffic.quiet_hours: Find the quietest hours for a forecasted venue
  venues.foot_traffic.peak_hours: Find the peak hours for a forecasted venue
  venues.foot_traffic.now: Read a venue forecast for the current hour
endpoints:
- id: besttime.types
  capability: venues.types.list
  platform: venues
  scope: any_account
  method: GET
  path: /venues/types
  name: Venue Types
  summary: Search canonical broad or detailed venue types
  input:
    queryParams:
      layer:
        type: string
        required: false
        note: broad or detailed
        example: broad
      q:
        type: string
        required: false
        note: Search text
        example: bar
      per_page:
        type: integer
        required: false
        note: Maximum 100
        example: 1
  test_request:
    queryParams:
      layer: broad
      q: bar
      per_page: 1
  cost:
    type: free
    value: 0
    currency: USD
    per: 1
    unit: call
    source: observed
    source_url: https://besttime.app/subscription/pricing
    checked: '2026-09-24'
    confidence: verified
    note: Observed as a 0-credit Venue Types usage row in the BestTime meter.
  docs_url: https://documentation.besttime.app/
  unverified: Vendor observed HTTP 200 and matching credit usage on 2026-09-24; maintainer verification with an
    independent key pair is pending.
