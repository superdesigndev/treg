      body:
        job: {type: object, required: false, note: "Title, description, seniority, location and date-posted filters."}
        company: {type: object, required: false, note: "Company firmographic filters."}
        max_results: {type: integer, required: false, default: 10, min: 1, max: 50, example: 1}
        cursor: {type: string, required: false}
    test_request: {body: {job: {title: {include: [Software Engineer]}}, max_results: 1}}
    cost: *search_cost
    docs_url: https://docs.blitz-api.ai/api-reference/job-search/search-jobs
    verified: '2026-10-16'
    added: '2026-10-16'
    example_response: examples/blitzapi.jobs.search.json

