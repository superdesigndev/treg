provider: blitzapi
source:
  docs: https://docs.blitz-api.ai/
  openapi: https://docs.blitz-api.ai/api-reference/v2.openapi.json
  curated: '2026-10-16'
pricing_url: https://docs.blitz-api.ai/guide/reference/fair-use-policy
limits: "The Start key reports 10 requests per second per endpoint. Search pages consume one record per returned row; enrichment consumes one record on a hit. Every metered answer reports fair_usage.records_used."
cache: forbidden
proposed_capabilities:
  companies.linkedin.find: Resolve a company's website domain to its LinkedIn page
  companies.email_domain.find: Find the domain a company uses for work email
  companies.employees.distribution: Count a company's employees by country or department

endpoints:
  - id: blitzapi.people.search
    capability: people.search
    platform: people
    domain: search
    scope: any_account
    method: POST
    path: /v2/search/people
    body_allowlist: true
    name: Search people across companies
    summary: Find people by role, location and company criteria with cursor pagination.
    input:
      bodyType: json
      body:
        company: {type: object, required: false, note: "Company firmographic filters; use a LinkedIn company URL to target a specific employer."}
        people: {type: object, required: false, note: "Job title, level, function and location filters."}
        max_results: {type: integer, required: false, default: 10, min: 1, max: 50, example: 1}
        cursor: {type: string, required: false, note: "Cursor from the prior page."}
    test_request: {body: {people: {job_title: {include: [Founder]}}, max_results: 1}}
    cost: &search_cost
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      reported_charge: {path: fair_usage.records_used, unit: credit}
      source: observed
      source_url: https://docs.blitz-api.ai/guide/reference/fair-use-policy
      checked: '2026-10-16'
      confidence: verified
      note: "One record per returned person, company or job; fair_usage.records_used settled exactly against the free key-info balance in live calls. Empty pages use zero records."
    docs_url: https://docs.blitz-api.ai/api-reference/people-search/find-people
    verified: '2026-10-16'
    added: '2026-10-16'
    example_response: examples/blitzapi.people.search.json

  - id: blitzapi.people.employee-finder
    capability: people.search
    platform: people
    domain: search
    scope: any_account
    method: POST
    path: /v2/search/employee-finder
    body_allowlist: true
    name: Find a company's employees
    summary: List employees at one LinkedIn company, with page and role filters.
    input:
      bodyType: json
      body:
        company_linkedin_url: {type: string, required: true, example: "https://www.linkedin.com/company/blitz-api"}
        country_code: {type: "array[string]", required: false, note: "ISO two-letter codes or WORLD."}
        continent: {type: "array[string]", required: false}
        sales_region: {type: "array[string]", required: false}
        job_level: {type: "array[string]", required: false}
        job_function: {type: "array[string]", required: false}
        min_connections_count: {type: integer, required: false}
        is_recent_hire: {type: boolean, required: false}
        max_results: {type: integer, required: false, default: 10, min: 1, max: 50, example: 1}
        page: {type: integer, required: false, default: 1, min: 1}
    test_request: {body: {company_linkedin_url: "https://www.linkedin.com/company/blitz-api", max_results: 1, page: 1}}
    cost: *search_cost
    docs_url: https://docs.blitz-api.ai/api-reference/people-search/employee-finder
    verified: '2026-10-16'
    added: '2026-10-16'
    example_response: examples/blitzapi.people.employee-finder.json

  - id: blitzapi.people.waterfall-icp
    capability: people.search
    platform: people
    domain: search
    scope: any_account
    method: POST
    path: /v2/search/waterfall-icp-keyword
    body_allowlist: true
    name: Find decision-makers by priority
    summary: Search one company through an ordered cascade of title criteria.
    input:
      bodyType: json
      body:
        company_linkedin_url: {type: string, required: true, example: "https://www.linkedin.com/company/blitz-api"}
        cascade: {type: "array[object]", required: true, minItems: 1, maxItems: 10, note: "Each tier requires include_title and may set exclude_title, location and current-job options."}
        max_results: {type: integer, required: false, default: 10, min: 1, max: 100, example: 1}
        profile_min_connections: {type: integer, required: false}
    test_request: {body: {company_linkedin_url: "https://www.linkedin.com/company/blitz-api", cascade: [{include_title: [Founder]}], max_results: 1}}
    cost: *search_cost
    docs_url: https://docs.blitz-api.ai/api-reference/people-search/waterfall-icp-search
    verified: '2026-10-16'
    added: '2026-10-16'
    example_response: examples/blitzapi.people.waterfall-icp.json

  - id: blitzapi.companies.search
