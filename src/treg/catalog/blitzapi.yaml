        company: {type: object, required: false, note: "Company firmographic filters."}
        max_results: {type: integer, required: false, default: 3, min: 1, max: 50, example: 1}
        cursor: {type: string, required: false}
    test_request: {body: {job: {title: {include: [Software Engineer]}}, max_results: 1}}
    cost: *search_cost
    docs_url: https://docs.blitz-api.ai/api-reference/company-search/tam-by-jobs
    verified: '2026-10-16'
    added: '2026-10-16'
    example_response: examples/blitzapi.companies.tam-by-jobs.json

  - id: blitzapi.companies.tam-by-people
    capability: companies.search
    platform: companies
    domain: search
    scope: any_account
    method: POST
    path: /v2/company/tam-by-people
