    body_allowlist: true
    name: Search companies
    summary: Find companies by firmographics, funding and keywords with cursor pagination.
    input:
      bodyType: json
      body:
        company: {type: object, required: false, note: "Name, industry, size, HQ, revenue, funding and keyword filters."}
        max_results: {type: integer, required: false, default: 10, min: 1, max: 50, example: 1}
        cursor: {type: string, required: false}
    test_request: {body: {company: {name: {include: [BlitzAPI]}}, max_results: 1}}
    cost: *search_cost
    docs_url: https://docs.blitz-api.ai/api-reference/company-search/company-search
    verified: '2026-10-16'
    added: '2026-10-16'
    example_response: examples/blitzapi.companies.search.json

