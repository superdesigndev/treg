        schema: {type: object, required: true, example: {type: object, properties: {mission_statement: {type: string, description: The company's stated mission.},
              case_studies: {type: array, items: {type: object, properties: {title: {type: string}, url: {type: string}}, required: [title, url], additionalProperties: false}}},
            required: [mission_statement, case_studies], additionalProperties: false}, note: JSON Schema (not an example object) for the returned object.
            Image fields include relevant page image references.}
        instructions: {type: string, required: false, note: 'Optional extraction guidance, such as which facts to prioritize or how to interpret fields in
            the schema. maxLength: 2000.'}
        factCheck: {type: boolean, required: false, default: false, note: Require facts stated on the page. Unsupported fields become null or empty.}
        followSubdomains: {type: boolean, required: false, default: false, note: 'When true, follow links on subdomains of the starting URL''s domain.'}
        maxPages: {type: integer, required: false, default: 5, min: 1, max: 50, note: 'Maximum number of pages to analyze for extraction. Hard cap: 50. Defaults
            to 5.'}
        maxDepth: {type: integer, required: false, min: 0, note: 'Optional maximum link depth from the starting URL (0 = only the starting page). If omitted,
            there is no crawl depth limit.'}
        pdf: {type: object, required: false, default: {shouldParse: true}, note: 'PDF handling. `start`/`end` limit parsing to an inclusive, 1-based page
            range. Fields: shouldParse, start, end.'}
        includeFrames: {type: boolean, required: false, default: false, note: 'When true, iframe contents are included in Markdown before extraction.'}
        maxAgeMs: {type: integer, required: false, default: 604800000, min: 0, max: 2592000000, note: Return cached scrape results if a prior scrape for the
            same parameters is younger than this many milliseconds. Defaults to 7 days (604800000 ms).}
        waitForMs: {type: integer, required: false, min: 0, max: 30000, note: Optional browser wait time in milliseconds after initial page load for each
            crawled page.}
        settleAnimations: {type: boolean, required: false, default: false, note: Wait briefly for CSS animations and transitions to settle before reading
            each page.}
        actions: {type: 'array[object]', required: false, maxItems: 5, note: Browser steps before page discovery. Requires a paid plan; defaults the crawl
            budget to 110000 ms.}
        stopAfterMs: {type: integer, required: false, default: 80000, min: 10000, max: 110000, note: 'Soft time budget for the crawl in milliseconds. Min:
            10000 (10s). Max: 110000 (110s). Defaults to 80000 (80s), or 110000 (110s) when browser actions are provided.'}
        timeoutOpts: {type: object, required: false, note: 'Request deadline and what to return when it passes. Fields: milliseconds, behavior.'}
        zdr: {type: string, required: false, enum: [enabled, disabled], default: disabled, note: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED`
            unless your organization has ZDR.'}
        tags: {type: 'array[string]', required: false, example: [production, team-alpha], maxItems: 20, note: Labels for filtering usage in the dashboard.}
