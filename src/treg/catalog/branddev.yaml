      value: 1
      fallback: {value: 1, note: "The curated map excludes the charged search option."}
      currency: credit
      per: 1
      unit: call
      settle: usage
      usage: {path: key_metadata.credits_consumed, unit: credit}
      source: observed
      source_url: https://docs.context.dev/account/credits
      checked: '2026-09-28'
      confidence: verified
      note: "A ten-URL map returned links and consumed one credit live. The priced search option is excluded; settle from reported credits."
    verified: '2026-09-28'
    added: '2026-09-28'
    example_response: examples/branddev.web.map.json
    docs_url: https://docs.context.dev/api-reference/web-scraping/map

  - id: branddev.web.crawl
    capability: web.crawl
    platform: web
    domain: crawl
    scope: any_account
    method: POST
    path: /web/crawl
    body_allowlist: true
    name: Crawl a website
    summary: Return Markdown from a bounded crawl of linked pages.
    input:
      bodyType: json
      body:
        url: {type: string, required: true, format: uri, example: "https://example.com"}
        maxPages: {type: integer, required: true, min: 1, max: 10, example: 1, note: "The shared key holds at most ten one-credit pages."}
        maxDepth: {type: integer, required: false, min: 0, max: 10, example: 0}
      note: "Crawl stops at maxPages. The reserved maximum is released down to the provider's actual successful-page charge."
    test_request: {body: {url: "https://example.com", maxPages: 1, maxDepth: 0}}
    cost:
      type: per_success
      table:
        - {when: {body.maxPages: 1}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 2}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 3}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 4}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 5}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 6}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 7}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 8}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 9}, value: 1, times: body.maxPages}
        - {when: {body.maxPages: 10}, value: 1, times: body.maxPages}
      fallback: {value: 10, note: "The curated crawl is limited to ten pages."}
      currency: credit
      unit: page
      settle: usage
      usage: {path: key_metadata.credits_consumed, unit: credit}
      source: observed
      source_url: https://docs.context.dev/account/credits
      checked: '2026-09-28'
      confidence: verified
      note: "The one-page live crawl consumed one credit. Context.dev charges one per successful page; hold the requested ceiling and settle actual reported usage."
    verified: '2026-09-28'
    added: '2026-09-28'
    example_response: examples/branddev.web.crawl.json
    docs_url: https://docs.context.dev/api-reference/web-scraping/crawl

