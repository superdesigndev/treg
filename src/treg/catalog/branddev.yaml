  - id: branddev.web.extract
    capability: web.extract.website
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /web/extract
    name: Extract structured data from a website
    summary: Extract website data using your JSON Schema and instructions.
    input:
      bodyType: json
      body:
        url: {type: string, required: true, format: uri, note: 'The starting website URL to crawl and extract from. Must include http:// or https://. minLength:
