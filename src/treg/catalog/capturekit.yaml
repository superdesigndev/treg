provider: capturekit
source:
  docs: https://docs.capturekit.dev
  openapi: https://app.capturekit.dev/openapi
  curated: '2026-11-09'
pricing_url: https://www.capturekit.dev/pricing
limits: Rate limits depend on the plan; GET /usage returns the key's credit balance and per-second and per-minute
  limits.
proposed_capabilities:
  web.analyze: Summarize what a website offers with AI (value proposition, features, categories)
defaults:
  expect:
    path: response.error
    op: absent
  provenance:
    source: docs
    source_url: https://www.capturekit.dev/pricing
    checked: '2026-11-09'
    confidence: documented
endpoints:
- id: capturekit.web.screenshot
  capability: web.screenshot
  platform: web
  domain: screenshot
  scope: any_account
  method: GET
  path: /v1/capture
  name: Capture a web page screenshot
  summary: Capture a public web page as a PNG, JPEG, WebP image or a PDF, by viewport, full page or CSS selector.
  input:
    queryParams:
      url:
        type: string
        required: true
        example: https://example.com
      format:
        type: string
        required: false
        enum:
        - jpeg
        - jpg
        - pdf
        - png
        - webp
        default: png
        example: png
        note: The output format of the screenshot.
      device:
        type: string
        required: false
        enum:
        - galaxy_fold4
        - galaxy_s23
        - galaxy_s23_ultra
        - galaxy_s8
        - huawei_mate_50_pro
        - huawei_p60_pro
        - ipad
        - iphone_12
        - iphone_13_mini
        - iphone_13_pro_max
        - iphone_14_pro
        - iphone_14_pro_max
        - iphone_x
        - pixel_5
        - pixel_6a
        - pixel_7_pro
        - redmi_note_11
        - redmi_note_12_pro
        note: The device type to emulate for the screenshot.
      full_page:
        type: boolean
        required: false
        default: false
        note: Capture the entire page instead of just the visible viewport.
      full_page_scroll:
        type: boolean
        required: false
        default: false
        note: Scroll the page to fully load lazy-loaded elements before capturing a full-page screenshot.
      full_page_scroll_duration:
        type: number
        required: false
        default: 400
        note: Time in milliseconds for scrolling before capturing the full page.
      viewport_width:
        type: number
        required: false
        default: 1280
        note: The width of the browser viewport in pixels.
      viewport_height:
        type: number
        required: false
        default: 1024
        note: The height of the browser viewport in pixels.
      scale_factor:
        type: number
        required: false
        default: 1
        note: The scale factor for high-resolution screenshots.
      image_quality:
        type: string
        required: false
        default: '80'
        note: Generate images with custom quality settings.
      selector:
        type: string
        required: false
        note: Capture a specific element on the page instead of the full viewport.
      cache:
        type: boolean
        required: false
        default: false
        note: Cache the response.
      cache_ttl:
        type: number
        required: false
        default: 2592000
        note: Cache the response for a custom TTL (in seconds).
      remove_selectors:
        type: string
        required: false
        note: A comma-separated list of elements to hide before capturing (e.g., ads, popups).
      remove_cookie_banners:
        type: boolean
        required: false
        default: false
        note: Automatically remove cookie banners before capturing.
      remove_ads:
        type: boolean
        required: false
        default: false
        note: Automatically remove ads before capturing.
      block_resources:
        type: string
        required: false
        enum:
        - document
        - eventsource
        - fetch
        - font
        - image
        - manifest
        - media
        - other
        - script
        - stylesheet
        - texttrack
        - websocket
        - xhr
        note: Comma-separated list of resource types to block (e.g., “image,stylesheet,font”).
      block_urls:
        type: string
        required: false
        note: Comma-separated list of URL patterns to block (e.g., “analytics,tracking,advertisement”).
      delay:
        type: number
        required: false
        default: 0
        note: Delay in seconds before capturing the screenshot.
      wait_until:
        type: array
        required: false
        enum:
        - domcontentloaded
        - load
        - networkidle0
        - networkidle2
        note: Define when to capture.
      wait_for_selector:
        type: string
        required: false
        note: Wait for a specific element to appear before taking the screenshot.
      storage_endpoint:
        type: string
        required: false
  test_request:
    queryParams:
      url: https://example.com
      format: png
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  added: '2026-11-09'
  docs_url: https://docs.capturekit.dev
- id: capturekit.web.extract
  capability: web.extract
  platform: web
  domain: extract
  scope: any_account
  method: GET
  path: /v1/content
  name: Extract a web page's content
  summary: Fetch a rendered web page and return its title, metadata, links, and optional Markdown or HTML.
  input:
    queryParams:
      url:
        type: string
        required: true
        example: https://example.com
        note: The URL of the webpage to capture.
      include_html:
        type: boolean
        required: false
        default: false
        note: Include the raw HTML of the webpage in the response.
      include_markdown:
        type: boolean
        required: false
        default: false
        example: true
        note: Include the Markdown of the webpage in the response.
      include_sitemap:
        type: boolean
        required: false
        default: false
        note: Include the sitemap of the website in the response.
      use_defuddle:
        type: boolean
        required: false
        default: false
      remove_selectors:
        type: string
        required: false
        note: A comma-separated list of elements to hide before capturing (e.g., ads, popups).
      remove_cookie_banners:
        type: boolean
        required: false
        default: false
        note: Automatically remove cookie banners before capturing.
      remove_ads:
        type: boolean
        required: false
        default: false
        note: Automatically remove ads before capturing.
      block_resources:
        type: string
        required: false
        enum:
        - document
        - eventsource
        - fetch
        - font
        - image
        - manifest
        - media
        - other
        - script
        - stylesheet
        - texttrack
        - websocket
        - xhr
        note: Comma-separated list of resource types to block (e.g., “image,stylesheet,font”).
      block_urls:
        type: string
        required: false
        note: Comma-separated list of URL patterns to block (e.g., “analytics,tracking,advertisement”).
      delay:
        type: number
        required: false
        default: 0
        note: Delay in seconds before capturing the screenshot.
      wait_until:
        type: array
        required: false
        enum:
        - domcontentloaded
        - load
        - networkidle0
        - networkidle2
        note: Define when to capture.
      wait_for_selector:
        type: string
        required: false
        note: Wait for a specific element to appear before taking the screenshot.
      cache:
        type: boolean
        required: false
        default: false
        note: Cache the response.
      cache_ttl:
        type: number
        required: false
        default: 2592000
        note: Cache the response for a custom TTL (in seconds).
  test_request:
    queryParams:
      url: https://example.com
      include_markdown: true
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  added: '2026-11-09'
  docs_url: https://docs.capturekit.dev
- id: capturekit.web.fetch.html
  capability: web.extract
  platform: web
  domain: extract
  scope: any_account
  method: GET
  path: /v1/website/crawler
  name: Fetch a web page's raw HTML
  summary: Fetch the raw HTML of a public page over plain HTTP, without a browser.
  input:
    queryParams:
      query:
        type: string
        required: true
        example: https://example.com
        note: A website URL with either the http or https protocol.
      allow_redirects:
        type: boolean
        required: false
        default: true
      return_page_source:
        type: boolean
        required: false
        default: false
  test_request:
    queryParams:
      query: https://example.com
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  added: '2026-11-09'
  docs_url: https://docs.capturekit.dev
- id: capturekit.web.analyze
  capability: web.analyze
  platform: web
  domain: extract
  scope: any_account
  method: GET
  path: /v1/analyze
  name: Analyze a website with AI
  summary: Read a website and return an AI summary of its value proposition, features, categories and use cases.
  input:
    queryParams:
      url:
        type: string
        required: true
        example: https://example.com
        note: The URL of the webpage to capture.
      custom_response:
        type: string
        required: false
        note: Pass custom response fields to be included in the AI response.
      custom_prompt:
        type: string
        required: false
        note: Add your own instructions to guide the AI’s analysis.
      cache:
        type: boolean
        required: false
        default: false
        note: Cache the response.
      cache_ttl:
        type: number
        required: false
        default: 2592000
        note: Cache the response for a custom TTL (in seconds).
  test_request:
    queryParams:
      url: https://example.com
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  added: '2026-11-09'
  docs_url: https://docs.capturekit.dev
