provider: chucho
source:
  docs: https://chucho.ai/agents.md
  openapi: https://chucho.ai/openapi.json
  curated: '2026-10-20'
limits: 'Public discovery reads: 60 requests/minute per IP; obey HTTP 429. Publication and host form availability
  may change. Search pagination is fixed at 24 results per page. Public reads need no key; a Chucho organization key (x-api-key) is accepted and ignored.'
proposed_capabilities:
  travel.accommodations.search: Search published accommodation listings by destination, capacity and amenities
  travel.accommodations.filters: Discover supported accommodation destinations, filters and catalog coverage
  travel.accommodations.details: Read published accommodation facts, photos and host information
  travel.accommodations.booking-link: Get an accommodation host booking destination without making a reservation
  travel.accommodations.enquiry-form: Read the current questions for an accommodation booking enquiry
    without sending it
endpoints:
- id: chucho.properties.search
  added: '2026-10-20'
  capability: travel.accommodations.search
  platform: travel
  scope: any_account
  method: GET
  path: /properties
  name: Search vacation rentals and boutique hotels
  summary: Search published accommodation listings by destination, capacity and amenities
  input:
    queryParams:
      locale:
        type: string
        required: false
        example: en
        note: 'Allowed: ''en'', ''es'' Default: en'
      quoteMode:
        type: string
        required: false
        note: 'Optional price/availability enrichment. exact uses supplied dates and guests; estimate
          requires estimateWindowStart, estimateWindowEnd, estimateNights and guests for a clearly labeled
          sample within supplied flexible bounds. Search does not wait for every host or filter unknown
          homes out. Allowed: ''exact'', ''estimate'''
      estimateWindowStart:
        type: string
        required: false
        note: 'Earliest sample arrival (YYYY-MM-DD), paired with estimateWindowEnd. Only with quoteMode:estimate.
          Preserve the traveler''s flexible month or date range. format: date'
      estimateWindowEnd:
        type: string
        required: false
        note: 'Latest sample departure (YYYY-MM-DD), paired with estimateWindowStart. Window must fit
          estimateNights (required), at most 150 days. format: date'
      arrival:
        type: string
        required: false
        note: 'format: date'
      departure:
        type: string
        required: false
        note: 'format: date'
      currency:
        type: string
        required: false
        note: 'Allowed: ''USD'', ''EUR'', ''GBP'', ''CRC'', ''MXN'', ''COP'', ''PEN'', ''BRL'', ''AUD'''
      estimateNights:
        type: integer
        required: false
        note: 'Sample-stay nights, required. Only with quoteMode:estimate. minimum: 1 maximum: 30'
      organization:
        type: string
        required: false
        example: pico-mar
        note: 'Exact organization slug returned on a property or in get_filters. Restricts results to
          that organization, across destinations. maxLength: 160 Default:'
      relatedTo:
        type: string
        required: false
        note: 'Published property ID. Find other homes from its organization, same locality first, then
          region/country and other locations. Excludes the source property. Additional filters still combine
          with AND. maxLength: 160 Default:'
      q:
        type: string
        required: false
        example: Alma Tierra Mar
        note: 'Search public property names, locations and approved introduction text. maxLength: 160
          Default:'
      semantic:
        type: string
        required: false
        example: quiet workspace
        note: 'Rank indexed, eligible homes by text and photo similarity. Does not establish hard facts;
          no lexical fallback when unavailable. minLength: 1 maxLength: 4000'
      semanticPreferences:
        type: string
        required: false
        example: '["quiet workspace"]'
        note: 'Individual experiential preferences, each copied verbatim from semantic. Interpret the
          traveler in context: separate requested preferences without adding needs. Keep related words
          together when they describe one room, view or relationship. These are questions to assess, not
          property facts; omit for factual-only searches. minItems: 1 maxItems: 8 Wire format: JSON-encoded
          array of exact spans copied from semantic'
      place:
        type: string
        required: false
        note: 'Place key from the live filter catalog. maxLength: 240 Default:'
      bounds:
        type: string
        required: false
        note: 'Map viewport as south,west,north,east in degrees; keeps homes whose public area center
          is inside it. West greater than east crosses the antimeridian. maxLength: 80 Default:'
      feature:
        type: string
        required: false
        note: 'Collection key from the filter catalog. Allowed: '''', ''private-pools'', ''room-for-4'',
          ''room-for-6'', ''room-for-8'', ''room-for-10'', ''2-bedrooms'', ''3-bedrooms'', ''4-bedrooms'',
          ''pets'', ''air-conditioning'', ''workspace'', ''step-free'' Default:'
      geographicArea:
        type: string
        required: false
        note: 'Exact geographic area key from get_filters(kind:geography), including continents and subregions.
          Americas includes North/Central/South America and the Caribbean. north-america includes Northern
          America, Central America and Caribbean; northern-america is the narrower UN M49 subregion. Filters
          by public ISO country/territory code; unknown locations never match. Combines with all other
          filters using AND. Allowed: '''', ''africa'', ''northern-africa'', ''sub-saharan-africa'', ''eastern-africa'',
          ''middle-africa'', ''southern-africa'', ''western-africa'', ''americas'', ''latin-america-and-the-caribbean'',
          ''caribbean'', ''central-america'', ''south-america'', ''northern-america'', ''asia'', ''central-asia'',
          ''eastern-asia'', ''south-eastern-asia'', ''southern-asia'', ''western-asia'', ''europe'', ''eastern-europe'',
          ''northern-europe'', ''southern-europe'', ''western-europe'', ''oceania'', ''australia-and-new-zealand'',
          ''melanesia'', ''micronesia'', ''polynesia'', ''north-america'' Default:'
      countries:
        type: string
        required: false
        example: CR,PA
        note: 'Explicit union of ISO 3166-1 alpha-2 country/territory codes, e.g. [CR, PA]. A home must
          match one selected country; combines with geographicArea, country and every other filter using
          AND. Use available codes from get_filters; never silently substitute a narrower country for
          an area. maxItems: 249 Default: [] Wire format: comma-separated ISO alpha-2 codes, e.g. CR,PA'
      country:
        type: string
        required: false
        example: CR
        note: 'maxLength: 160 Default:'
      region:
        type: string
        required: false
        note: 'maxLength: 160 Default:'
      city:
        type: string
        required: false
        example: Uvita
        note: 'maxLength: 160 Default:'
      accommodationType:
        type: string
        required: false
        note: 'Filter by reviewed accommodation type. Hotel results represent one establishment; guest
          count requires a quote for one suitable room, never total hotel capacity. Allowed: '''', ''vacation_rental'',
          ''boutique_hotel'' Default:'
      guests:
        type: integer
        required: false
        note: 'Rental minimum sleeping capacity; for boutique hotels, actual adults for a one-room quote,
          with occupancy unconfirmed until that quote succeeds. minimum: 1 maximum: 100'
      minBedrooms:
        type: integer
        required: false
        note: 'minimum: 1 maximum: 50'
      minBathrooms:
        type: number
        required: false
        note: 'minimum: 0.5 maximum: 50 multipleOf: 0.5'
      amenities:
        type: string
        required: false
        note: 'Comma-separated amenity keys; every requested amenity must be explicitly present. maxLength:
          240 Default:'
      pool:
        type: string
        required: false
        note: 'Allowed: '''', ''present'', ''private'', ''shared'', ''absent'' Default:'
      page:
        type: integer
        required: false
        example: 1
        note: 'minimum: 1 maximum: 1000 Default: 1'
    note: Filters combine with AND; omitted facts are unknown. Results contain total, page, pageSize (fixed
      at 24), nextPage and nextUrl. Repeat identical filters with the returned nextPage. There is no pageSize
      or limit input. Totals count published homes, never available or affordable homes. Use semantic
      for experiential preferences, not authoritative facts. Price requests require traveler-supplied
      party size and exact dates, or flexible bounds plus stay length; ask for missing details. Without
      them, omit quoteMode and show no prices. Unknown availability is not available. Reuse ready quotes
      and complete at most three shortlisted checks through the separately documented quote tools, not
      repeated searches. Respect 429; no booking or payment occurs.
  test_request:
    queryParams:
      q: Alma Tierra Mar
      locale: en
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: inferred
    source_url: https://chucho.ai/auth.md
    checked: '2026-10-20'
    confidence: inferred
    note: Proposed zero price for anonymous public reads; no API billing account, charge header, rate
      card or balance meter is published. This is not independently metered pricing evidence. Confirm
      the free-use policy with hello@chucho.ai before activation.
  docs_url: https://chucho.ai/openapi.json
