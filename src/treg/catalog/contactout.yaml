        minItems: 1
        maxItems: 100
        example: [support@contactout.com]
      callback_url: {type: string, required: false, note: "an https URL ContactOut posts the finished results to"}
    note: Answers QUEUED with a job_id; poll contactout.people.email.verify.batch.get until status
      is DONE. Each verdict is valid, invalid, accept_all, unknown or disposable.
  untestable: Starting a job spends verifier credits; the examples are fixtures with reserved fake addresses.
  example_response: examples/contactout.people.email.verify.batch.json
  terminal_example_response: examples/contactout.people.email.verify.batch.result.json
  price:
    value: '0.01'
    currency: USD
    per: 1
    unit: result
    note: One verifier credit per email whose verdict is valid, invalid or accept_all, billed
      when the job finishes. Unknown and disposable verdicts, a failed job and every poll are
      free; the hold is one credit per email sent.
