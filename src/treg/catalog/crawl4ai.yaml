provider: crawl4ai
source:
  docs: https://api.crawl4ai.com/docs
  llms: https://crawl4ai.com/llms.txt
  openapi: null
  curated: '2026-10-05'
pricing_url: https://api.crawl4ai.com/v1/prices
limits: >-
  Prepaid credits, 1 credit = $0.001 at the $10 pack. A page already in Crawl4AI's archive costs
  half; the effort a page needed sets the rest (x0.5 archived, x1 light/standard, x2 browser, x4
  the site fought back). Every priced answer carries its exact charge in x-c4-cost (credits) and
  the running balance in x-c4-balance; a batch line carries "cost" and the stream ends with a
  {"summary": {"cost": …}} line; a finished job reports usage.cost. Blocked (403), unreachable
  (502) and fleet-busy (503) answers are not charged. Out of credit answers 402 no_credit, the
  account's own monthly cap 402 spend_cap, the plan's monthly allowance 402 plan_cap; per-plan
  pace limits answer 429 with X-RateLimit-* headers. GET /v1/billing/balance trails the per-call
  header by about a minute.
proposed_capabilities:
  # >>> recipes: generated by scripts/catalog_ingest_crawl4ai_recipes.py; edit the script
  airbnb.listing.detail: One Airbnb listing
  amazon.product.reviews: Reviews of an Amazon product
  app-store.app.detail: One app on Apple's App Store
  booking.hotel.detail: One Booking.com hotel
  crunchbase.company.profile: One company on Crunchbase
  etsy.search.products: Etsy search results
  github.repo.files: Files of a GitHub repository
  github.repo.issues: Issues of a GitHub repository
  glassdoor.company.reviews: Reviews of a company on Glassdoor
  glassdoor.search.jobs: Jobs on Glassdoor for a search
  google-play.app.detail: One app on Google Play
  hackernews.jobs.hiring: 'Hacker News: who is hiring, by keyword'
  hackernews.search.stories: Search Hacker News
  hackernews.stories.front: 'Hacker News: front page stories'
  indeed.search.jobs: Indeed job search results
  medium.posts.list: Posts of a Medium tag, author or publication
  packages.package.info: Facts about a package (npm, PyPI, crates.io)
  producthunt.launches.today: 'Product Hunt: today''s launches'
  producthunt.launches.today_detailed: 'Product Hunt: today''s launches, enriched from each product page'
  producthunt.product.detail: 'Product Hunt: one product'
  remoteok.search.jobs: Remote jobs from Remote OK
  research.search.papers: Search arXiv papers
  shopify.store.products: Products of a Shopify store
  stackoverflow.search.questions: Stack Overflow questions by tag
  steam.app.detail: A Steam game's price, reviews and facts
  substack.publication.posts: A Substack publication's latest posts
  walmart.seller.profile: One Walmart Marketplace seller
  weather.forecast.daily: Daily weather forecast for a place
  web.feed.read: Any RSS or Atom feed
  weworkremotely.search.jobs: Remote jobs from We Work Remotely
  wikipedia.article.detail: A Wikipedia article's summary and sections
  wikipedia.search.articles: Wikipedia articles matching a query
  zillow.property.detail: One Zillow home
  # <<< recipes
  web.extract.estimate: Price a page scrape before running it

endpoints:
  # --- Account ------------------------------------------------------------------------------
  - id: crawl4ai.account.usage
    kind: account
    domain: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /v1/billing/balance
    name: Check credit balance
    summary: "Returns the account's credit balance, this month's spend and whether auto recharge is on. Trails the per-call x-c4-balance header by about a minute."
    input:
      queryParams: {}
    test_request:
      queryParams: {}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "Reading the balance spends no credits."}
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://api.crawl4ai.com/docs
    example_response: examples/crawl4ai.account.usage.json

  - id: crawl4ai.web.extract.estimate
    kind: utility
    capability: web.extract.estimate
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /v1/estimate
    name: Price a scrape before running it
    summary: "The credit range a scrape of one URL (or a list) would cost, from Crawl4AI's own effort model. Free."
    input:
      bodyType: json
      body:
        endpoint: {type: string, required: true, enum: [scrape, search, extract, answer, jobs], example: scrape}
        url: {type: string, required: false, format: uri, example: "https://example.com"}
        urls: {type: "array[string]", required: false, maxItems: 50}
    test_request: {body: {endpoint: scrape, url: "https://example.com"}}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "Estimates spend no credits."}
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.extract.estimate.json

  # --- Scrape, search, extract, answer -----------------------------------------------------------
  - id: crawl4ai.web.scrape
    async: false
    capability: web.extract
    not_found: {status: [404, 410], when: "starts_with(reason, 'origin-error')", means: "the site itself answered 404 or 410: the page does not exist"}
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /scrape
    body_allowlist: true
    name: Scrape or crawl a web page to clean Markdown for LLMs
    summary: "Scrape one URL, a web page or a PDF, into clean, LLM-ready Markdown text and/or HTML. Crawl4AI picks the cheapest engine that works (archive, plain fetch, real browser that renders JavaScript), with optional links, media, metadata and tables; proxies for sites that block datacenters."
    input:
      bodyType: json
      body:
        url: {type: string, required: true, format: uri, example: "https://example.com"}
        format: {type: string, required: false, enum: [both, md, html], default: both, example: md}
        proxy: {type: string, required: false, enum: [none, isp, residential], default: none, note: "exit network for sites that block datacenters"}
        country: {type: string, required: false, note: "two-letter exit country for isp/residential, e.g. us"}
        parse: {type: object, required: false, note: "true for all, or pick {links, media, metadata, tables}"}
      note: "Most pages answer in 1-2 s; a page that needs a real browser takes 10-30 s, and a failed page ends within about 55 s. A PDF URL returns the PDF's text as Markdown. Images and other binary files answer 422 binary-body within about a second, free. Blocked (403), unreachable (502) and fleet-busy (503) answers are free; retry a 503 after a few seconds."
    test_request: {body: {url: "https://example.com", format: md}}
    cost:
      type: per_success
      value: 0.15
      currency: credit
      per: 1
      unit: page
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-08'
      confidence: verified
      note: "treg's account price: a flat 0.15 credits per page at every effort (archived, plain, PDF, browser, hard); failures free. The x-c4-cost header settles the charge (0.150 observed live 2026-10-08 at efforts 0, 1, 2 and 3)."
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.scrape.json

  - id: crawl4ai.web.search
    async: false
    capability: web.search
    platform: web
    domain: search
    scope: any_account
    method: GET
    path: /search
    name: "Search the web: live ranked results with title, URL, snippet"
    summary: "Live web search across several engines, ranked and cleaned: each result has a title, URL and snippet. When the live web returns fewer than 10 results, results from the Crawl4AI index fill the list. For follow-up questions, related queries and an entity card, use crawl4ai.web.search.rich."
    input:
      queryParams:
        q: {type: string, required: true, note: "max 512 characters", example: "rust web crawler"}
      note: "For follow-up questions, related queries, an entity card, videos and news, use crawl4ai.web.search.rich."
    test_request: {queryParams: {q: "rust web crawler"}}
    cost:
      type: per_call
      value: 0.15
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-13'
      confidence: verified
      note: "treg's account price: a flat 0.15 credits per answered search, an empty one included: a query Google has no results for answers 200 with results [] and is charged (x-c4-cost 0.150 observed live 2026-10-13). A failed search is a free 503. The x-c4-cost header settles the actual charge."
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.search.json

  - id: crawl4ai.web.search.rich
    async: false
    capability: web.search
    platform: web
    domain: search
    scope: any_account
    method: GET
    path: /search
    name: Search the web with rich results
    summary: "Web search plus a rich block: follow-up questions, related queries, an entity card, videos, news and discussions."
    input:
      queryParams:
        q: {type: string, required: true, note: "max 512 characters", example: "why is the sky blue"}
        rich: {type: integer, required: true, enum: [1], example: 1}
    test_request: {queryParams: {q: "why is the sky blue", rich: 1}}
    cost:
      type: per_success
      value: 0.15
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-09'
      confidence: verified
      note: "treg's account price: a flat 0.15 credits per rich search (observed live 2026-10-09). The x-c4-cost header settles the actual charge."
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.search.rich.json

  - id: crawl4ai.web.extract.structured
    async: false
    capability: web.extract.structured
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /extract
    body_allowlist: true
    name: Extract structured JSON data from a web page with an LLM
    summary: "Scrape a page (crawled for you) or read your own content, and return typed JSON matching a JSON schema and/or a plain-English instruction, extracted by an LLM."
    input:
      bodyType: json
      body:
        url: {type: string, required: false, format: uri, example: "https://news.ycombinator.com"}
        content: {type: string, required: false, note: "your own text, Markdown or HTML instead of a URL"}
        instruction: {type: string, required: false, example: "the top 3 stories on the front page"}
        schema: {type: object, required: false, note: "JSON schema each returned record must match"}
        example: {type: object, required: false, note: "a sample of the shape you want (structure, not values)"}
      note: "Send url or content, plus instruction and/or schema."
    test_request:
      body:
        url: "https://example.com"
        instruction: "the page title"
        schema: {type: object, properties: {title: {type: string}}, required: [title]}
    cost:
      type: per_success
      value: 10
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-05'
      confidence: verified
      note: "0.5 credit base times the page's effort, plus the model's tokens (1 credit per 5,000-token block). A three-record extract from the HN front page cost 1.952 live. The 10-credit hold is an upper bound for a large page; the x-c4-cost header settles the actual charge."
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.extract.structured.json

  - id: crawl4ai.web.answer
    async: false
    capability: web.answer
    platform: web
    domain: search
    scope: any_account
    method: GET
    path: /answer
    # The answer service was rebuilt on 2026-10-07; calls before that measured the old one.
    observed_from: '2026-10-08'
    name: "Answer a question from the web, prose or JSON"
    summary: "Answers a question or a whole agent prompt (up to 4,000 characters) from the web's current top results, with the pages it drew on. Ask for JSON in the question, or pass a JSON Schema, and the answer is JSON of that shape. answer.source says whether the text is Google's own answer (google_ai_mode, google_ai_overview) or written from the pages (crawl4ai). answered is false, and free, when the pages hold no answer. Experimental: fields may be added."
    input:
      queryParams:
        q: {type: string, required: true, note: "the question or prompt, up to 4,000 characters; say the shape you want inside it, e.g. 'answer with JSON only: {...}'", example: "who founded stripe"}
        schema: {type: string, required: false, note: "a JSON Schema object as a JSON string, up to 4,000 bytes; the answer is then JSON of exactly that shape (parse answer.text)"}
        deep: {type: integer, required: false, enum: [0, 1], default: 1, note: "1 reads pages and writes an answer when the web has none; 0 returns only the web's own direct answer, else answered false"}
        gl: {type: string, required: false, note: "search country, e.g. us"}
        hl: {type: string, required: false, note: "search language, e.g. en"}
        nocache: {type: integer, required: false, enum: [1], note: "1 skips every cache"}
    test_request: {queryParams: {q: "who founded stripe"}}
    cost:
      type: per_success
      value: 2.15
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-09'
      confidence: verified
      note: "treg's account price: 0.15 credits for the web's own answer (source google_ai_*), 2.15 for a written answer (0.15 plus the model); no answer, a 400 or a 503 is free. The 2.15-credit hold is a written answer; the x-c4-cost header settles the actual charge (0.15 and 2.15 observed live 2026-10-09)."
    verified: '2026-10-07'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.answer.json

  - id: crawl4ai.google.serp.ai_mode
    async: false
    capability: google.serp.ai_mode
    platform: google
    domain: serp
    scope: any_account
    method: GET
    path: /answer
    name: "Google AI Mode answer for a question (text only)"
    summary: "Google's own AI Mode / AI Overview answer for a question, word for word, with answer.source naming which. deep must be 0, so the text is never written by another model; answered is false, and free, when Google shows no direct answer. Text only: no product, place or ad cards."
    strict_query: true
    input:
      queryParams:
        q: {type: string, required: true, note: "the question, up to 4,000 characters", example: "what is a stock split"}
        deep: {type: string, required: true, enum: ["0"], note: "must be 0: only Google's own answer"}
        gl: {type: string, required: false, note: "search country, e.g. us"}
        hl: {type: string, required: false, note: "search language, e.g. en"}
        nocache: {type: string, required: false, enum: ["1"], note: "1 skips every cache"}
    test_request: {queryParams: {q: "what is a stock split", deep: "0"}}
    cost:
      type: per_success
      value: 0.15
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-09'
      confidence: verified
      note: "treg's account price: 0.15 credits for Google's answer, 0 when there is none; the x-c4-cost header settles the charge (0.15 observed live 2026-10-09)."
    verified: '2026-10-07'
    added: '2026-10-07'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.google.serp.ai_mode.json

  - id: crawl4ai.google.serp.organic
    async: false
    capability: google.serp.organic
    platform: google
    domain: serp
    scope: any_account
    method: GET
    path: /serp
    name: "Google organic results with true rank and page blocks"
    summary: "One Google results page as JSON: every organic result with its rank (position, and position_absolute counting the blocks above it), and each block Google showed (People also ask, local pack, videos, ...; the AI Overview when Google showed one: always with source=google, otherwise only when the answer came from Google directly, see note). Localised to a country, a language and optionally a city. When results is empty, empty_reason says why: google_no_results (Google matched nothing) or rescue_no_results (another provider may still have results)."
    strict_query: true
    input:
      queryParams:
        q: {type: string, required: true, note: "the query, up to 512 characters", example: "best crm software"}
        country: {type: string, required: false, note: "two-letter Google country (gl), default us"}
        language: {type: string, required: false, note: "Google interface language (hl), e.g. en or pt-br; default en"}
        location: {type: string, required: false, note: "a city or region, e.g. Austin, TX; an unknown place answers 400 with the closest names"}
        num: {type: integer, required: false, note: "results to return: a multiple of 10 from 10 to 100 (num/10 Google pages); default 10"}
        page: {type: integer, required: false, note: "page over num, 1 to 30: num=10&page=2 is results 11-20"}
        time: {type: string, required: false, enum: [hour, day, week, month, year], note: "Google's time filter"}
        fresh: {type: string, required: false, enum: ["1"], note: "1 skips the cache"}
        source: {type: string, required: false, enum: [auto, google], note: "auto (default) may answer from Crawl4AI's fallback page, which has no AI Overview; google answers from Google's own page only, with the AI Overview when Google shows one, and is a free 503 when Google cannot be reached"}
    test_request: {queryParams: {q: "best crm software", country: us}}
    cost:
      type: per_success
      value: 0.15
      currency: credit
      per: 1
      unit: page
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-09'
      confidence: verified
      note: "treg's account price: 0.15 credits per Google page of 10 results, so num=30 costs 0.45; a 4xx or 5xx is free. The hold is one page; the x-c4-cost header settles the actual charge (0.150 for num=10 and 0.450 for num=30 observed live 2026-10-09)."
    verified: '2026-10-09'
    added: '2026-10-09'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.google.serp.organic.json
    note: "The answer's source names the path that answered: gg is Google fetched directly and carries ai_overview when Google showed one; gs is Crawl4AI's fallback and never carries ai_overview. source=google always answers from gg (a free 503 when Google cannot be reached): 9 of 10 AI-Overview questions returned it, 0.7 to 3 s, observed live 2026-10-13. Routed treg.google.serp.organic sends source=google when the caller sets ai_overview true."

  # --- Many URLs ---------------------------------------------------------------------------------
  - id: crawl4ai.web.extract.batch
    async: false
    capability: web.extract.batch
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /scrape/batch
    body_allowlist: true
    name: Scrape or crawl a list of URLs in one batch, streamed
    summary: "Scrape up to 25 URLs in one call; results stream back as NDJSON, one line per URL as it finishes, then one summary line with the batch's total cost."
    input:
      bodyType: json
      body:
        urls: {type: "array[string]", required: true, minItems: 1, maxItems: 25, example: ["https://example.com"]}
        format: {type: string, required: false, enum: [both, md, html], default: both, example: md}
        proxy: {type: string, required: false, enum: [none, isp, residential], default: none}
        country: {type: string, required: false}
      note: "Crawl4AI takes up to 50; treg caps the list at 25 so the hold stays bounded. For more URLs, start a job."
    test_request: {body: {urls: ["https://example.com"], format: md}}
    cost:
      type: per_success
      value: 3.75
      fallback: {value: 3.75, note: "25 URLs at the flat page price, when the stream ends without its summary line."}
      currency: credit
      unit: call
      settle: usage
      usage: {path: summary.cost, unit: credit}
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-05'
      confidence: verified
      note: "Each URL costs like a scrape (a flat 0.15 credits on treg's account) and its line carries that cost; the closing summary line carries the total, which settles the call. The 3.75-credit hold is 25 URLs at that price."
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.extract.batch.json

  - id: crawl4ai.web.scrape.job.start
    capability: web.scrape.job.start
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /scrape/jobs
    body_allowlist: true
    name: Crawl many URLs as a background scrape job
    summary: "Submit up to 500 URLs as a background job; poll its status, then read the results. Nothing waits on a slow page."
    input:
      bodyType: json
      body:
        urls: {type: "array[string]", required: true, minItems: 1, maxItems: 500, example: ["https://example.com"]}
        format: {type: string, required: false, enum: [both, md, html], default: both}
        proxy: {type: string, required: false, enum: [none, isp, residential], default: none}
        country: {type: string, required: false}
      note: "Crawl4AI takes up to 10,000; treg caps a job at 500 URLs so the hold stays bounded."
    test_request: {body: {urls: ["https://example.com"]}}
    cost:
      type: per_success
      value: 75
      fallback: {value: 75, note: "500 URLs at the job's flat 0.15 credits per URL, when the finished job reports no usage.cost."}
      currency: credit
      unit: call
      settle: usage
      usage: {path: usage.cost, unit: credit}
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-05'
      confidence: verified
      note: "A job costs a flat 0.15 credits per URL on treg's account (usage.unit_cost 0.150, observed 2026-10-08); the finished job's usage.cost (after refunds for failed URLs) settles the call. The 75-credit hold is 500 URLs. Job ids may name their region (j_sin-…) and can be read from any region."
    verified: '2026-10-05'
    added: '2026-10-06'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.scrape.job.start.json
    async:
      id_from: job_id
      poll:
        endpoint: crawl4ai.web.scrape.job.status
        param: {in: pathParams, name: id}
      status:
        path: status
        progress: [pending, running, paused]
        success: [done]
        failure: []
        billed_failure: [failed, cancelled]
      result: {path: usage}
      interval: 10

  - id: crawl4ai.web.map
    capability: web.map
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /scan
    body_allowlist: true
    name: List every URL of a site without crawling it
    summary: "A site's URLs from the sources that already know them: its sitemaps, the links on its home page and the newest Common Crawl indexes (mode full adds the Wayback Machine). One call, 1 to 3 seconds for most sites. Each row: url, sources, last_seen, depth."
    input:
      bodyType: json
      body:
        domain: {type: string, required: true, note: "the site's host; a leading https:// is dropped, www and the bare host are one site", example: docs.crawl4ai.com}
        mode: {type: string, required: false, enum: [fast, full], default: fast, note: "full adds the Wayback Machine, up to 20 s more"}
        max_urls: {type: integer, required: false, default: 5000, max: 50000}
        include: {type: string, required: false, note: "keep only matching URLs: a path prefix (/docs) or a glob with * over the path"}
        include_subdomains: {type: boolean, required: false, default: false}
    test_request: {body: {domain: docs.crawl4ai.com, max_urls: 5}}
    cost:
      type: per_success
      value: 0.15
      currency: credit
      per: 1
      unit: page
      source: observed
      source_url: https://crawl4ai.com/llms.txt
      checked: '2026-10-11'
      confidence: verified
      note: "1 unit for the call plus each page the scan reads (robots.txt, the home page, each sitemap, each index reply) at treg's scrape price; most scans read 4 to 26 pages. A repeat within 7 days is served from cache for the call's unit only. The hold is one page; the x-c4-cost header settles the actual charge (0.500 observed 2026-10-11 for a 5-URL scan)."
    verified: '2026-10-11'
    added: '2026-10-11'
    docs_url: https://crawl4ai.com/llms.txt
    example_response: examples/crawl4ai.web.map.json

  - id: crawl4ai.web.crawl
    capability: web.crawl
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /site
    body_allowlist: true
    name: Crawl a whole site as a background job
