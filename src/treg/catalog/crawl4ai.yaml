  # Watch: page monitors that keep running after the call. Each team's monitors live under its own
  # label (team_label), and a team buys a budget for them (crawl4ai.watch.budget.add); on treg's key a
  # label with no budget gets no checks, so its monitors stay paused until one is added.
  - id: crawl4ai.watch.create
    capability: web.monitor.create
    kind: action
    platform: web
    domain: monitor
    scope: any_account
    method: POST
    path: /monitors
    name: "Watch a page: describe the change to report"
    summary: "Say in plain words what you care about, for example \"tell me when a plan gets more expensive\", \"a new job in Berlin\" or \"back in stock\". The monitor turns your sentence into conditions, ignores every change that does not match (layout, dates, banners), and reports only matching changes as facts: what changed, from what, to what, with both versions of the page. Numbers work too: \"the Business plan costs more than $250\". On treg's key it runs from your team's watch budget (crawl4ai.watch.budget.add)."
    team_label: [body.agent]
    caller_email: [body.notify.email]
    managed_resource: {operation: create, kind: monitor, id: {in: response, path: id}, name_from: {in: body, path: name}, cleanup_endpoint: crawl4ai.watch.delete}
    input:
      bodyType: json
      body:
        url: {type: string, required: true, format: uri, example: "https://example.com/pricing"}
        watch: {type: string, required: false, example: "a plan gets more expensive, or a plan is removed", note: "Your condition in plain words: what change, in which direction. Several conditions in one sentence are fine; empty = any real change."}
        agent: {type: string, required: true, note: "Your team's label on treg's key. A call without it, or with another label, is refused and the error names yours."}
        every: {type: string, required: false, default: auto, note: "auto (checked as often as the page really changes, at least daily, 1 credit a check) or a fixed 4m, 15m, 1h, 6h, 1d, 1w. A fixed interval under 1 hour costs 2 credits a check."}
        name: {type: string, required: false, example: "Competitor pricing"}
        notify:
          type: object
          required: false
          note: "Optional alerts on each confirmed change. On treg's key an email alert goes only to your own treg email."
          properties:
            webhook: {type: string, format: uri, note: "Your public HTTPS address; one POST per confirmed change."}
            secret: {type: string, note: "Signs the webhook (x-c4-signature)."}
            email: {type: string, note: "Your own treg email only; any other address is refused."}
            trigger: {type: object, note: "{url, token}: starts an agent, for example a Claude Code routine."}
        schema: {type: object, required: false, note: "Your own JSON shape, filled on every change as custom."}
        region: {type: string, required: false, enum: [eu, sin, us]}
        expires_at: {type: string, required: false, note: "ISO 8601 time when the monitor pauses by itself."}
      note: "A change reaches your feed (crawl4ai.watch.changes) about a minute after a check finds it, and is confirmed 30 minutes later if the page did not go back. Same url, watch and agent again returns the existing monitor."
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      note: "Creating a monitor is free. Its checks (1 credit each, 2 for a fixed interval under an hour) and matched changes (3 credits) are paid from the team's watch budget, bought with crawl4ai.watch.budget.add."
    added: '2026-10-19'
    example_response: examples/crawl4ai.watch.create.json
    docs_url: https://crawl4ai.com/llms.txt
  - id: crawl4ai.watch.budget.add
    capability: web.monitor.budget.add
    kind: action
    platform: web
    domain: monitor
    scope: any_account
    method: POST
    path: /monitors/agents/{label}/budget
    name: "Buy a watch budget for your team's monitors"
    summary: "Add Crawl4AI credits to your team's watch budget. You choose the amount; it is charged once, now, and your monitors run until it is used, then pause by themselves. Send your own purchase id as ref: a retry with the same ref adds nothing and charges nothing."
