  # >>> lead: Crawl4AI Lead (company and people search) answers from gate.crawl4ai.com, the same key
  - id: crawl4ai.companies.enrich
    async: false
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: GET
    host: gate.crawl4ai.com
    path: /lead/company
    name: Company enrichment by domain
    summary: 'Enrich a company from its domain, name or LinkedIn company page: name, description, industry, employee count
      (the people on record), LinkedIn company URL, logo, website technology stack, the work e-mails and phones
      published on its pages, its social links and mail provider. `domain` is the company''s website (stripe.com);
      `linkedin` is its LinkedIn page link or handle (when several domains share the page, the most asked one answers
      and meta.also_on_this_linkedin_page lists the rest); `name` is the company''s name (legal endings such as Inc or
      GmbH are ignored; answers only when one company clearly has the name, otherwise 404 with up to 5 candidate
      domains, free). A company not on record answers 404, free. About 0.2 s.'
    input:
      queryParams:
        domain:
          type: string
          required: false
          example: stripe.com
          note: one of domain, linkedin or name
        linkedin:
          type: string
          required: false
          example: https://www.linkedin.com/company/stripe/
          note: a LinkedIn company page link or handle
        name:
          type: string
          required: false
          example: Stripe
          note: the company name; one of domain, linkedin or name
    strict_query: true
    cost:
      type: per_success
      value: 0.5
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-31'
      confidence: verified
      note: 'treg''s account price: 0.5 credits per company found; a 404 (Lead has no such company) is free.
        The x-c4-cost header settles the actual charge.'
    miss:
      status: 404
      means: "Lead has no record of this domain — a normal outcome, and free"
    docs_url: https://crawl4ai.com/llms.txt
    test_request:
      queryParams:
        domain: stripe.com
    verified: '2026-10-31'
    example_response: examples/crawl4ai.companies.enrich.json
    added: '2026-10-31'
  - id: crawl4ai.people.search
    async: false
    capability: people.search
    platform: people
    scope: any_account
    method: POST
    host: gate.crawl4ai.com
    path: /lead/people/search
    name: Find people at a company by job title
    summary: 'People search by company domain and job title, one row per person: name, job title, LinkedIn profile,
      work e-mail when one is published (with its kind and status), department, seniority and decision role, the
      page they were found on, and the company''s facts. Search by company (`where.company.domain`), by job title
      (`where.person.title`: words in any order, VP = Vice President, Head = Director), by department or seniority
      (department: marketing, sales, engineering,
      product, finance, hr, operations, legal, it, design, executive; seniority: owner_founder, c_level, vp, director,
      manager; decision_role for decision makers), by a person''s name (`where.person.name`), by company country,
      city or industry, or by a free-text brief (`q`). `limit` is how many people (default 10, up to 100), one
      price a call at any limit. An empty answer is free. About 0.2 s.'
    body_allowlist: true
    input:
      bodyType: json
      body:
        where:
          type: object
          required: false
          example: {company: {domain: stripe.com}, person: {department: [engineering]}}
          note: "company: domain, country (two-letter code: gb, us, de), city, industry; person: title, name, seniority (one of owner_founder, c_level, vp, director, manager, senior, individual, intern, unknown), department, decision_role"
        q:
          type: string
          required: false
          note: a free-text brief instead of `where` ("marketing leaders at fintech companies in London")
        limit:
          type: integer
          required: false
          note: default 10, up to 100
    cost:
      type: per_success
      value: 0.5
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://api.crawl4ai.com/v1/prices
      checked: '2026-10-31'
      confidence: verified
      note: 'treg''s account price: 0.5 credits per answer with at least one person, whatever the limit; an empty
        answer is free. The x-c4-cost header settles the actual charge.'
    docs_url: https://crawl4ai.com/llms.txt
    test_request:
      body:
        where: {company: {domain: stripe.com}}
        limit: 3
    verified: '2026-10-31'
    example_response: examples/crawl4ai.people.search.json
    added: '2026-10-31'
