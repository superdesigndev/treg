    capability: google.reviews.task.results
    kind: utility
    platform: google
    scope: any_account
    method: GET
    path: /business_data/google/reviews/task_get/{id}
    name: "Fetch Google reviews by task ID"
    summary: "Retrieve the Google reviews requested by dataforseo.x.business-data-google-reviews-task-post."
    cache: forbidden
    resource_ownership:
      requires: {kind: "fetch:dataforseo.x.business-data-google-reviews-task-get", param: id}
    input:
      pathParams:
        id: {type: string, required: true, note: "A tasks[].id returned by this team's review submission", example: "00000000-0000-0000-0000-000000000000"}
      note: >-
        Read tasks[].status_code as well as the HTTP status: 20000 means results are ready.
        Pending tasks must be fetched again later using the same ID. The response is relayed
        unchanged. Shared-key access requires this team's recorded submission; unknown IDs,
        another team's IDs and tasks predating ownership tracking are refused. BYOK can read
        tasks created directly in that provider account. Results are available for 30 days.
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://docs.dataforseo.com/v3/business_data/google/reviews/task_get/
