# Deeplead API. Self-verified by the vendor against production with a partner key (ledger in the PR).
# Prices are Deeplead's partner rates for treg's platform key, quoted by the vendor and metered per
# call in the `x-deeplead-cost-usd` response header. Keys bought directly from Deeplead pay in
# credits instead (https://www.deeplead.io/pricing); the body's chargedCredits shows that direct-key
# equivalent and is not what treg pays.
provider: deeplead
source:
  docs: https://www.deeplead.io/api/v1/docs
  openapi: https://www.deeplead.io/api/v1/spec.json
  curated: '2026-10-26'
pricing_url: https://www.deeplead.io/pricing
limits: 120 requests/minute per key.
proposed_capabilities:
  companies.businesses.search: Search physical business locations.
  companies.emails.list: "List every work email found on a company domain"
  companies.ad_pixels: Find which ad and analytics pixels a company's website runs
  people.email.inbox_placement.start: Test whether mail from your own mailbox lands in the inbox, spam or a tab at Gmail and Outlook
  people.email.inbox_placement.status: Read where an inbox placement test's email landed at each seed mailbox

endpoints:
- id: deeplead.businesses.search
  added: '2026-10-26'
  domain: companies
  capability: companies.businesses.search
  platform: companies
  scope: any_account
  method: POST
  path: /businesses/search
  name: Search local businesses
  summary: Search local businesses from Google Business Profiles
  input:
    bodyType: json
    note: Up to 30 businesses per page. Every row carries rating, review counts per star, website, emails, phones, socials and ad-pixel flags (Meta, Google Ads, GA, TikTok, ChatGPT). `require` filters to rows that have (true) or were checked and lack (false) a field.
    body:
      categories: {type: "array[string]", required: true, note: "Google business categories", example: ["Dentist"]}
      location: {type: string, required: true, note: "a city (\"Austin, TX\"), a US state (\"Texas\") or a country (\"Germany\")", example: "Austin, TX"}
      page: {type: integer, required: false, note: "1-100, default 1", example: 1}
      radiusMiles: {type: number, required: false, note: "1-100 around a city, default 30", example: 10}
      keyword: {type: string, required: false, note: "matched against the business name and categories", example: "Castle Dental"}
      excludedCategories: {type: "array[string]", required: false}
      rating: {type: string, required: false, note: "under-4 | 4-to-4.5 | 4.5-plus"}
      reviews: {type: string, required: false, note: "under-10 | 10-to-100 | 100-plus"}
      require: {type: object, required: false, note: "e.g. {\"email\": true, \"metaAds\": false}", example: {email: true}}
  test_request:
    body: {categories: ["Dentist"], location: "Austin, TX", keyword: "Castle Dental & Orthodontics - Sunset Valley"}
  cost:
    type: per_result
    value: 0.0085
    currency: USD
    per: 1
    unit: record
    source: vendor_email
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: documented
    note: Partner rate per business returned; an empty page is free. The test_request returns one business. Metered per call in the x-deeplead-cost-usd response header.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.organizations.search
  added: '2026-10-26'
  domain: companies
  capability: companies.search
  platform: companies
  scope: any_account
  method: POST
  path: /organizations/search
  name: Search companies, or look them up by domain
  summary: Search organizations, or look them up by domain
  input:
    bodyType: json
    note: Returns totalCount; limit 0 returns only the count. Pass `domains` to look companies up; the returned organizationId feeds deeplead.persons.search and deeplead.organizations.decision_maker. Free on treg's partner key.
    body:
      query: {type: string, required: false, note: "free text matched against company name, description and keywords", example: "logistics software"}
      semantic: {type: string, required: false, note: "what the company is and sells, matched by meaning", example: "outsourced medical billing for clinics"}
      domains: {type: "array[string]", required: false, example: ["stripe.com"]}
      hqCountry: {type: "array[string]", required: false, note: "ISO alpha-2", example: ["US"]}
      hqState: {type: "array[string]", required: false}
      hqCity: {type: "array[string]", required: false}
      employeeBands: {type: "array[string]", required: false, note: "1-10 | 11-50 | 51-200 | 201-500 | 501-1,000 | 1,001-5,000 | 5,001-10,000 | 10,001+", example: ["51-200"]}
      revenueRange: {type: "array[string]", required: false, note: "<$1M | $1M to <$10M | $10M to <$50M | $50M to <$100M | $100M to <$1B | $1B+"}
      industryNaicsDirect: {type: "array[string]", required: false, note: "NAICS codes"}
      technologies: {type: "array[string]", required: false}
      foundedAfter: {type: integer, required: false}
      foundedBefore: {type: integer, required: false}
      monthlyVisitsMin: {type: integer, required: false, note: "known for about 1 in 8 US companies; the rest are excluded"}
      employeeGrowthMin: {type: integer, required: false, note: "percent on LinkedIn"}
      fundedAfter: {type: integer, required: false, note: "year of the last funding round"}
      limit: {type: integer, required: false, note: "0-25, default 25; 0 = count only", example: 1}
      offset: {type: integer, required: false, note: "0-10,000"}
      includeWithoutWebsite: {type: boolean, required: false}
  test_request:
    body: {domains: ["stripe.com"], limit: 1}
  cost:
    type: free
    value: 0
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: verified
    note: Free on the partner key; the live call's x-deeplead-cost-usd header read 0.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.persons.search
  added: '2026-10-26'
  domain: contacts
  capability: people.search
  platform: people
  scope: any_account
  method: POST
  path: /persons/search
  name: Search people with their emails and phones
  summary: Search persons with their emails and phones
  input:
    bodyType: json
    note: Returns only people with an email or phone, with names, emails, phones, titles, LinkedIn URLs and company data. Takes every company filter of deeplead.organizations.search plus the person filters below. `limit` 0 returns only totalCount (all matches, including people without contact data) and is free, so a query can be sized before paying. Page with nextOffset. Needs at least one filter. Send an Idempotency-Key header so retries never charge twice.
    body:
      jobTitle: {type: "array[string]", required: false, note: "partial match, so CEO also finds Assistant to the CEO; combine with jobLevel", example: ["CFO"]}
      jobTitleExclude: {type: "array[string]", required: false}
      jobLevel: {type: "array[string]", required: false, note: "C-Team | VP | Director | Manager | Staff | Other", example: ["C-Team"]}
      decisionMakersOnly: {type: boolean, required: false, example: true}
      inCountry: {type: "array[string]", required: false, note: "ISO alpha-2 where the person is based", example: ["US"]}
      personState: {type: "array[string]", required: false}
      personCity: {type: "array[string]", required: false}
      organizationIds: {type: "array[string]", required: false, note: "from deeplead.organizations.search", example: ["rb:rb-oacwbixtv"]}
      domains: {type: "array[string]", required: false, note: "company domains", example: ["stripe.com"]}
      query: {type: string, required: false, note: "company free text"}
      semantic: {type: string, required: false, note: "what the company is and sells, matched by meaning"}
      hqCountry: {type: "array[string]", required: false, note: "company HQ, ISO alpha-2"}
      employeeBands: {type: "array[string]", required: false}
      limit: {type: integer, required: false, note: "0-100, default 25; the spend cap. 0 = free count", example: 0}
      offset: {type: integer, required: false, note: "0-10,000"}
      onePerOrganization: {type: boolean, required: false, note: "default false"}
  test_request:
    body: {organizationIds: ["rb:rb-oacwbixtv"], decisionMakersOnly: true, limit: 0}
  cost:
    type: per_result
    value: 0.0045
    currency: USD
    per: 1
    unit: record
    source: vendor_email
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: documented
    note: Partner rate per person returned; every returned person has an email or phone, and limit 0 (the test_request) is a free count. Rows are named private individuals, so no example response is shipped and the paid path is observed by the vendor only (see the PR ledger). The partner key only reads, nothing is saved to a Deeplead account, so every call is billed.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.persons.lookup
  added: '2026-10-26'
  domain: contacts
  capability: people.enrich
  platform: people
  scope: any_account
  method: POST
  path: /persons/lookup
  name: Look up a person by LinkedIn, email or name + domain
  summary: Look up one person by LinkedIn URL, email, or name and company domain
  input:
    bodyType: json
    note: Pass exactly one of linkedin, email, or name together with domain. Returns the person's emails, phones, role and company. 200 with found=false is a miss and free.
    body:
      linkedin: {type: string, required: false, example: "https://www.linkedin.com/in/jane-doe"}
      email: {type: string, required: false}
      name: {type: string, required: false, note: "full name; needs domain"}
      domain: {type: string, required: false, note: "company domain; with name"}
  miss: {status: 200, means: "found=false, person null: nobody on file with an email or phone; free"}
  untestable: returns a named private individual's contact details, so no example response is shipped
  cost:
    type: per_success
    value: 0.0045
    currency: USD
    per: 1
    unit: call
    source: vendor_email
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-09-26'
    confidence: documented
    note: Partner rate per person found with an email; a person returned with a phone is billed $0.025. A miss, or a person without email or phone, is free.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.organizations.decision_maker
  added: '2026-10-26'
  domain: contacts
  capability: people.decision_makers
  platform: people
  scope: any_account
  method: POST
  path: /organizations/{organizationId}/decision-maker
  name: Find a company's decision maker with a verified email
  summary: Find the decision maker of an organization with a verified email
  input:
    pathParams:
      organizationId: {type: string, required: true, note: "from deeplead.organizations.search (e.g. a domain lookup)", example: "rb:rb-oabdk75ro"}
    note: Checks candidates from Deeplead's database, the company's LinkedIn page and its website domain, confirms each still works there, and returns the first whose email verifies. Usually 5-30 s, up to 3 minutes. 200 with found=false is a miss and free; 503 means the lookup did not finish, nothing was charged, retry later. Send an Idempotency-Key header.
  miss: {status: 200, means: "found=false, decisionMaker null: no candidate's email verified; free"}
  untestable: returns a named private individual's email, so no example response is shipped; the vendor observed hits (see the PR ledger)
  cost:
    type: per_success
    value: 0.12
    currency: USD
    per: 1
    unit: call
    source: vendor_email
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: documented
    note: Partner rate per decision maker found; a miss (found=false), a 404 for an unknown organizationId and a 503 are free.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.websites.contacts
  added: '2026-10-26'
  domain: companies
  capability: companies.emails.list
  platform: companies
  scope: any_account
  method: POST
  path: /websites/contacts
  name: Emails, phones and socials on a company website
  summary: Website or domain → the emails, phones and social profiles found on the site
  input:
    bodyType: json
    note: Reads Deeplead's own crawl of the website (2.5M websites with an email, 2.8M with a phone), so it answers in under a second and never visits the site during the call. A website many businesses share (a site builder, a booking platform) has no contacts. 200 with found=false (no email and no phone) is a miss and free; socials still come back on a miss.
    body:
      website: {type: string, required: true, note: "URL or domain; www. and paths are ignored", example: "hubspot.com"}
  miss: {status: 200, means: "found=false, emails and phones empty: the crawl found no email or phone on that website; free"}
  test_request:
    body: {website: "hubspot.com"}
  cost:
    type: per_success
    value: 0.003
    currency: USD
    per: 1
    unit: call
    source: vendor_email
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: documented
    note: Partner rate per website with an email or phone; a miss is free.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.websites.pixels
  added: '2026-10-26'
  domain: companies
  capability: companies.ad_pixels
  platform: companies
  scope: any_account
  method: POST
  path: /websites/pixels
  name: Find the ad and analytics pixels a website runs
  summary: Website or domain → which ad and analytics pixels it runs (Meta, Google Ads, TikTok, ChatGPT Ads, LinkedIn…) with their ids
  input:
    bodyType: json
    note: Checks the homepage and every Google Tag Manager container it loads, nested ones included, for meta, tiktok, openai (ChatGPT Ads), google_analytics, google_ads, microsoft_ads, linkedin, pinterest, snapchat, x, reddit, hotjar, microsoft_clarity and callrail, and returns pixel ids where the markup shows them (meta:1234…, google_ads:AW-…). Containers that 50 or more checked websites load belong to a platform or agency and are left out. 9.2M websites are already checked and answer at once with checkedAt; any other website is checked during the call (up to 20 s). 200 with found=false means the homepage never answered and is free.
    body:
      website: {type: string, required: true, note: "URL or domain", example: "hubspot.com"}
  miss: {status: 200, means: "found=false, checkedAt null: the homepage did not answer; free"}
  test_request:
    body: {website: "hubspot.com"}
  cost:
    type: per_success
    value: 0.002
    currency: USD
    per: 1
    unit: call
    source: vendor_email
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: documented
    note: Partner rate per website whose homepage answered, also when it runs no pixels; a homepage that never answers is free.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.deliverability.tests.create
  added: '2026-10-26'
  domain: contacts
  capability: people.email.inbox_placement.start
  platform: people
  scope: any_account
  method: POST
  path: /deliverability/tests
  resource_ownership:
    produces:
      - {kind: deliverability_test, path: testId}
  name: Start an inbox placement test for your mailbox
  summary: Get seed addresses and a testId; send one email to them from your mailbox, then read where it landed
  input:
    bodyType: json
    note: No body. Returns testId, seedEmails and closesAt (60 minutes later). Send one email from the mailbox under test to every seed address with the testId anywhere in the body, then poll deeplead.deliverability.tests.get about once a minute; most seeds report within 2-5 minutes. Send an Idempotency-Key header so a retry never starts a second paid test.
  test_request:
    body: {}
  cost:
    type: per_call
    value: 0.45
    currency: USD
    per: 1
    unit: call
    source: vendor_email
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: documented
    note: Partner rate per test started; reading its result is free. A 503 (no seed mailbox available) is free.
  docs_url: https://www.deeplead.io/api/v1/docs

- id: deeplead.deliverability.tests.get
  added: '2026-10-26'
  domain: contacts
  capability: people.email.inbox_placement.status
  platform: people
  scope: any_account
  method: GET
  path: /deliverability/tests/{testId}
  resource_ownership:
    requires: {kind: deliverability_test, param: testId}
  name: Read where an inbox placement test's email landed
  summary: Per seed mailbox, inbox, spam, a Gmail tab or missing, plus an inbox score once the test completes
  input:
    pathParams:
      testId: {type: string, required: true, note: "from deeplead.deliverability.tests.create; only the team that started the test can read it"}
    note: status is waiting until every seed reported or the 60-minute window closed, then completed with score (inbox share, 0-10). placement per seed is inbox, spam, promotions, social, updates, forums or missing. rspamd carries the content filter's verdict and matched rules when a seed reports one. Poll at most every 30 seconds.
  untestable: needs a testId the same key created, and placement needs an email sent from the caller's own mailbox
  cost:
    type: free
    value: 0
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://www.deeplead.io/api/v1/docs
    checked: '2026-10-26'
    confidence: verified
    note: Free; the live call's x-deeplead-cost-usd header read 0.
  docs_url: https://www.deeplead.io/api/v1/docs
