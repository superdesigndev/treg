# DevTune measures what AI answer engines say about a company's product: it runs the company's
# tracked prompts on a schedule, records each answer, who was cited and who was named, counts the
# AI crawlers, answer fetches and referrals hitting the company's site, and ranks fixes.
#
# Every route is own_account: a dtk_live_ key is bound to exactly ONE project, and every path
# carries that project's id. GET /connection (no scope, free) returns it, so an agent's first call
# is always /connection and the rest take its data.projectId. A key for project A gets 404 on
# project B's id, never B's data.
#
# Reads are included in the plan: no per-call charge, only the per-key rate limit (Plus 100,
# Pro 500, Enterprise 1,000 requests/minute). Credit-spending routes (agent runs, Agent Picks tests,
# brief and draft generation) and every write are deliberately NOT catalogued here — see the PR's
# surface map.
#
# Windows are fixed, not arbitrary date ranges: windowDays accepts only the listed values and
# anything else is a 400. Measurement routes read daily rollups, so today's probes appear the
# next day.
provider: devtune
source:
  docs: https://docs.devtune.ai/api-reference/overview
  openapi: https://devtune.ai/api/v2/openapi.json
  curated: 2026-10-30
limits: "Per key: Plus 100, Pro 500, Enterprise 1,000 requests/minute (X-RateLimit-* headers on every response)"
pricing_url: https://devtune.ai/pricing  # API access is included in every paid plan; reads are not metered

proposed_capabilities:
  ai-search.prompts.list: "List the prompts tracked against AI answer engines"
  ai-search.citations.stats: "Get citation totals and share of voice for your own site"
  ai-search.traffic.summary: "Get AI crawler, answer-fetch and AI-referral totals for your site"
  ai-search.traffic.missing_pages: "List missing pages AI systems keep requesting from your site"
  ai-search.content_gaps.list: "List topics and sources where competitors are cited and you are not"
  ai-search.actions.list: "List ranked fixes to improve how AI answers describe you"
  ai-search.outcomes.ledger: "Get before/after results for shipped AI-visibility fixes"
  ai-search.audit.summary: "Get answer-engine readiness scores for your site"

endpoints:
  - id: devtune.account.identity
    added: '2026-10-30'
    kind: account
    domain: account
    capability: account.identity
    platform: account
    scope: own_account
    method: GET
    path: /connection
    name: "Discover the key's project"
    summary: "Discover the authorized project"
    input:
      note: "no parameters. Returns data.projectId (pass it as {projectId} everywhere else), the key's scopes and the features it can use. Free and needs no scope; this is also the connect-time probe"
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included in every paid plan; no per-call charge"}
    test_request: {queryParams: {}}
    docs_url: https://docs.devtune.ai/api-reference/overview

  - id: devtune.account.usage
    added: '2026-10-30'
    kind: account
    domain: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /projects/{projectId}/usage
    name: "Project status and usage"
    summary: "Get project status and usage"
    input:
      pathParams:
        projectId: {type: string, required: true, note: "data.projectId from GET /connection", example: "321e11dc-aaf8-498b-8c3c-a3e52c34a043"}
      note: "needs no scope. Shows whether the project is paused, plan allowances and current usage"
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included in every paid plan; no per-call charge"}
    test_request:
      pathParams: {projectId: "321e11dc-aaf8-498b-8c3c-a3e52c34a043"}
    docs_url: https://docs.devtune.ai/api-reference/overview

  - id: devtune.ai-search.mentions.summary
    added: '2026-10-30'
    capability: ai-search.mentions.summary
