    scope: own_account
    method: GET
    path: /projects/{projectId}/visibility/summary
    name: "AI visibility summary"
    summary: "Get visibility summary metrics"
    input:
      pathParams:
        projectId: {type: string, required: true, note: "data.projectId from GET /connection", example: "321e11dc-aaf8-498b-8c3c-a3e52c34a043"}
      queryParams:
        windowDays: {type: integer, required: false, note: "30 (default) or 90; any other value is a 400", example: 30}
        platform: {type: string, required: false, note: "one AI platform id, e.g. chatgpt-search, perplexity, google-ai, google-ai-mode", example: "perplexity"}
        topicId: {type: string, required: false, note: "only prompts in this topic, by id from the topics list"}
        includeHistoricalPlatforms: {type: boolean, required: false, note: "let a platform no longer probed return its history; default false"}
      note: "scope visibility.read. Mentions (brand named) and citations (URL sourced) are separate metrics"
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included in every paid plan; no per-call charge"}
    test_request:
      pathParams: {projectId: "321e11dc-aaf8-498b-8c3c-a3e52c34a043"}
      queryParams: {windowDays: 30}
    docs_url: https://docs.devtune.ai/api-reference/overview

