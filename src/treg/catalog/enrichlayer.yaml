proposed_capabilities:
  linkedin.school.profile: Get a school profile.
  companies.employees.list: List employees of a company with cursor pagination.
  companies.employees.count: Get employee counts for a company.
  linkedin.profile.picture: Get a cached person profile picture.
  linkedin.company.picture: Get a cached company profile picture.
  people.profile.lookup: Resolve a person profile from name and company.
  people.role.lookup: Find a person in a role at a company.
  companies.id.resolve: Resolve a numeric company ID to its public identifier.
  companies.employees.search: Search employees of one company by job title or keyword.
  people.profile.from_phone: Find social profiles from a contact phone number.
  linkedin.job.profile: Get a job profile by URL.
  linkedin.jobs.search: Search job postings using company and role filters.
  people.email.disposable: Check whether an email domain is disposable.
  people.phone.find.personal: Find personal phone numbers for a social profile.
