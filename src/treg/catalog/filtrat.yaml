# Filtrat: email verification (with optional catch-all resolution) and email finding. Every call is
# synchronous and answers within 175 seconds; each answer reports its own charge in credits_used,
# which settles the call (repeat checks are charged too on treg's partner account). Bulk jobs,
# LinkedIn lookups, lists, monitors and AI routes are not listed (see the PR's surface map).
provider: filtrat
source:
  docs: https://filtrat.io/v1/docs
  openapi: https://filtrat.io/openapi.json
  curated: '2026-10-29'
pricing_url: https://filtrat.io/v1/credits/rate-card
limits: "Per key: 60 verifications and 20 finder searches a minute on treg's partner account (other keys: 200 a minute each), answered with 429 and Retry-After: 60 above that. Every call answers within 175 seconds."
cache: forbidden
endpoints:
  - id: filtrat.people.email.verify
    added: '2026-10-29'
    domain: contacts
    capability: people.email.verify
    platform: people
    scope: any_account
    method: POST
    path: /verify/email
    name: Verify an email address
    summary: Check whether an email address is deliverable, with the domain's mail setup and catch-all detection.
    body_allowlist: true
    platform_request:
      body.resolve_catchall: false
    input:
      bodyType: json
      body:
        email: {type: string, required: true, format: email, example: "m.buriak@relevant.software"}
        resolve_catchall: {type: boolean, required: false, enum: [false], example: false, note: "Fixed to false on this tool; filtrat.people.email.verify.resolve_catchall resolves catch-alls."}
      note: "Returns status verified, invalid, catchall, risky or unknown. Verified and invalid cost one credit; catchall, risky and unknown are free. Idempotency-Key is honoured: a retry gets the first answer and is not charged twice."
    test_request: {body: {email: "m.buriak@relevant.software"}}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: result
      settle: usage
      usage: {path: credits_used, unit: credit}
      fallback: {value: 1, note: "One credit is the most a plain verification costs."}
      source: observed
      source_url: https://filtrat.io/v1/credits/rate-card
      checked: '2026-10-29'
      confidence: verified
      note: "credits_used settles the call. A verified and an invalid address each reduced the balance by exactly one credit; catchall, risky and unknown answers report 0."
    verified: '2026-10-29'
    example_response: examples/filtrat.people.email.verify.json
    docs_url: https://filtrat.io/v1/docs

  - id: filtrat.people.email.verify.resolve_catchall
    added: '2026-10-29'
    domain: contacts
    capability: people.email.verify
    platform: people
    scope: any_account
    method: POST
    path: /verify/email
    name: Verify an email address and resolve a catch-all domain
    summary: Verify an address and, on a catch-all domain, resolve it to deliverable or bounce.
    body_allowlist: true
    platform_request:
      body.resolve_catchall: true
    input:
      bodyType: json
      body:
        email: {type: string, required: true, format: email, example: "mykhailo.buriak@reckitt.com"}
        resolve_catchall: {type: boolean, required: false, enum: [true], example: true, note: "Fixed to true on this tool."}
      note: "On a catch-all domain the address is resolved to verified or invalid (catchall_resolved: true) for five credits in all; an address on an ordinary domain costs one credit as in plain verification, and a catch-all that couldn't be resolved within the time limit stays catchall and is free. Slower than plain verification (seconds to about two minutes)."
    test_request: {body: {email: "mykhailo.buriak@reckitt.com", resolve_catchall: true}}
    cost:
      type: per_success
      value: 5
      currency: credit
      per: 1
      unit: result
      settle: usage
      usage: {path: credits_used, unit: credit}
      fallback: {value: 5, note: "Five credits is the most a verification with catch-all resolution costs."}
      source: observed
      source_url: https://filtrat.io/v1/credits/rate-card
      checked: '2026-10-29'
      confidence: verified
      note: "credits_used settles the call. A catch-all address resolved to verified reduced the balance by exactly five credits (catchall_resolved: true)."
    verified: '2026-10-29'
    example_response: examples/filtrat.people.email.verify.resolve_catchall.json
    docs_url: https://filtrat.io/v1/docs

  - id: filtrat.people.email.find
    added: '2026-10-29'
    domain: people
    capability: people.email.find
    platform: people
    scope: any_account
    method: POST
    path: /finder/search
    name: Find a work email from a name and domain
    summary: Find a person's work email from their name and company domain, verified against the mail server.
    body_allowlist: true
    platform_request:
      body.resolve_catchall: false
    input:
      bodyType: json
      body:
        first_name: {type: string, required: false, example: Michael}
        last_name: {type: string, required: false, example: Buriak}
        full_name: {type: string, required: false, note: "Instead of first_name and last_name"}
        domain: {type: string, required: true, example: tallium.com, note: "Company domain or website URL"}
        company_name: {type: string, required: false, note: "Corrects a domain that doesn't receive mail"}
        resolve_catchall: {type: boolean, required: false, enum: [false], example: false, note: "Fixed to false on this tool; on a catch-all domain the most likely address comes back with catchall_unverified: true."}
      note: "status found (20 credits) or not_found (free). A miss answers 200 with found_email null. Idempotency-Key is honoured."
    test_request: {body: {first_name: Michael, last_name: Buriak, domain: tallium.com}}
    cost:
      type: per_success
      value: 20
      currency: credit
      per: 1
      unit: result
      settle: usage
      usage: {path: credits_used, unit: credit}
      fallback: {value: 20, note: "Twenty credits is the most a find without catch-all resolution costs."}
      source: observed
      source_url: https://filtrat.io/v1/credits/rate-card
      checked: '2026-10-29'
      confidence: verified
      note: "credits_used settles the call. A found address reduced the balance by exactly twenty credits; a deliberate miss (a person who doesn't exist) answered not_found in 3.7 s and reduced it by nothing."
    verified: '2026-10-29'
    example_response: examples/filtrat.people.email.find.json
    docs_url: https://filtrat.io/v1/docs

  - id: filtrat.people.email.find.resolve_catchall
    added: '2026-10-29'
    domain: people
    capability: people.email.find
    platform: people
    scope: any_account
    method: POST
    path: /finder/search
    name: Find a work email and resolve a catch-all domain
    summary: Find a person's work email; on a catch-all domain the address is resolved to a confirmed one.
    body_allowlist: true
    platform_request:
      body.resolve_catchall: true
    input:
      bodyType: json
      body:
        first_name: {type: string, required: false, example: Mykhailo}
        last_name: {type: string, required: false, example: Buriak}
        full_name: {type: string, required: false, note: "Instead of first_name and last_name"}
        domain: {type: string, required: true, example: epam.com, note: "Company domain or website URL"}
        company_name: {type: string, required: false, note: "Corrects a domain that doesn't receive mail"}
        resolve_catchall: {type: boolean, required: false, enum: [true], example: true, note: "Fixed to true on this tool."}
      note: "status found or not_found (free). Found costs 25 credits when the address needed catch-all resolution and 20 when it didn't; credits_used says which."
    test_request: {body: {first_name: Mykhailo, last_name: Buriak, domain: epam.com, resolve_catchall: true}}
    cost:
      type: per_success
      value: 25
      currency: credit
      per: 1
      unit: result
      settle: usage
      usage: {path: credits_used, unit: credit}
      fallback: {value: 25, note: "Twenty-five credits is the most a find with catch-all resolution costs."}
      source: observed
      source_url: https://filtrat.io/v1/credits/rate-card
      checked: '2026-10-29'
      confidence: verified
      note: "credits_used settles the call. A find that needed catch-all resolution reduced the balance by 25 credits; the same person found again without needing it reduced it by 20. Misses are free."
    verified: '2026-10-29'
    example_response: examples/filtrat.people.email.find.resolve_catchall.json
    docs_url: https://filtrat.io/v1/docs
