    platform: stocks
    scope: any_account
    method: GET
    path: /financials/cash-flow-statements
    name: "US company cash-flow statements"
    summary: "Get standardized annual, quarterly or trailing cash-flow statements for a US public company"
    input: *financial_input
    test_request: {queryParams: {ticker: AAPL, period: annual, limit: 1}}
    cost: *standard_cost
    verified: '2026-09-15'
    added: '2026-09-15'
    example_response: examples/financialdatasets.financials.cash-flow-statements.json
    docs_url: https://docs.financialdatasets.ai/api/financials/cash-flow-statements

  - id: financialdatasets.financials.income-statements.segments
    domain: stocks
