provider: financialdatasets
source:
  docs: https://docs.financialdatasets.ai
  openapi: https://www.financialdatasets.ai/openapi.json
  curated: '2026-09-15'
pricing_url: https://www.financialdatasets.ai/pricing
limits: "Financial Datasets publishes Credits pricing per successful request but does not return charge or remaining-Credits headers. Coverage is US public-company data, ETF and index-fund holdings, plus central-bank interest rates; use each dataset's free discovery helper to confirm coverage."

# BYOK and treg's platform key expose the same paths. A team's own key is unmetered by treg.
# On treg's key, documented Credits rates are settled from the catalog rate card after success.
proposed_capabilities:
  stocks.financials.all: "Get standardized company financial statements"
  stocks.financials.income-statements: "Get company income statements"
  stocks.financials.balance-sheets: "Get company balance sheets"
  stocks.financials.cash-flow-statements: "Get company cash-flow statements"
  stocks.financials.segments: "Get company financial-statement segments"
  stocks.earnings.list: "List company earnings"
  stocks.filings.list: "List SEC filings"
  stocks.insider-trades.list: "List insider trades"
  stocks.institutional-holdings.list: "List institutional holdings"
  stocks.index-funds.holdings: "Get ETF and index-fund holdings and weights"
  stocks.screener.search: "Screen US public companies by financial filters"
  stocks.macro.interest-rates: "Get major central-bank interest rates"
  stocks.kpi.metrics: "Get company operating KPIs"
  stocks.kpi.guidance: "Get company KPI guidance"
  stocks.kpi.non-gaap: "Get company non-GAAP metrics"
  stocks.ipos.list: "List IPO and registration filings"
  stocks.discovery.company-facts-tickers: "List tickers available for company facts"
  stocks.discovery.company-facts-ciks: "List CIKs available for company facts"
  stocks.discovery.prices-tickers: "List tickers available for historical prices"
  stocks.discovery.price-snapshot-tickers: "List tickers available for price snapshots"
  stocks.discovery.earnings-tickers: "List tickers available for earnings"
  stocks.discovery.filings-tickers: "List tickers available for filings"
  stocks.discovery.filings-ciks: "List CIKs available for filings"
  stocks.discovery.filings-types: "List filing types available for filings"
  stocks.discovery.financial-metrics-snapshot-tickers: "List tickers available for financial-metric snapshots"
  stocks.discovery.screener-filters: "List supported financial-screener fields and operators"
  stocks.discovery.interest-rate-banks: "List central banks available for interest rates"
  stocks.discovery.institutional-holdings-tickers: "List tickers available for institutional holdings"
  stocks.discovery.institutional-holdings-investors: "List institutional investors available for holdings"
  stocks.discovery.index-funds-tickers: "List available ETF and index-fund tickers"

endpoints:
  - id: financialdatasets.company.facts
    domain: stocks
    capability: stocks.company.profile
    platform: stocks
    scope: any_account
    method: GET
    path: /company/facts
    name: "US company facts by ticker or CIK"
    summary: "Get identity, exchange, sector, industry, status and SEC metadata for a US public company"
    input:
      queryParams:
        ticker: {type: string, required: false, note: "US stock ticker; supply ticker or cik. If availability is uncertain, call financialdatasets.company.facts.tickers first", example: AAPL}
        cik: {type: string, required: false, note: "SEC Central Index Key; supply ticker or cik. If availability is uncertain, call financialdatasets.company.facts.ciks first"}
      note: "Supply exactly one of ticker or cik. Use the matching company-facts utility when coverage is uncertain."
    test_request: {queryParams: {ticker: AAPL}}
    cost: {type: per_success, value: 0.02, currency: USD, per: 1, unit: call, source: observed, source_url: "https://www.financialdatasets.ai/pricing", checked: '2026-09-15', confidence: verified, note: "Observed in the provider transaction ledger: the authenticated batch reconciled to $0.02 for each standard request"}
    verified: '2026-09-15'
    added: '2026-09-15'
    example_response: examples/financialdatasets.company.facts.json
    docs_url: https://docs.financialdatasets.ai/api/company/facts/ticker

  - id: financialdatasets.financials
    domain: stocks
    capability: stocks.financials.all
    platform: stocks
    scope: any_account
    method: GET
    path: /financials
    name: "US company financial statements"
    summary: "Get standardized income statements, balance sheets and cash-flow statements for a US public company"
    input: &financial_input
      queryParams:
        ticker: {type: string, required: false, note: "US stock ticker; supply ticker or cik", example: AAPL}
        cik: {type: string, required: false, note: "SEC Central Index Key; supply ticker or cik"}
        period: {type: string, required: true, note: "annual | quarterly | ttm", example: annual}
        limit: {type: integer, required: false, min: 1}
        report_period: {type: string, required: false, note: "exact report date, YYYY-MM-DD"}
        report_period_gte: {type: string, required: false, note: "report date on or after YYYY-MM-DD"}
        report_period_lte: {type: string, required: false, note: "report date on or before YYYY-MM-DD"}
        report_period_gt: {type: string, required: false, note: "report date after YYYY-MM-DD"}
        report_period_lt: {type: string, required: false, note: "report date before YYYY-MM-DD"}
        filing_date: {type: string, required: false, note: "exact filing date, YYYY-MM-DD"}
        filing_date_gte: {type: string, required: false, note: "filing date on or after YYYY-MM-DD"}
        filing_date_lte: {type: string, required: false, note: "filing date on or before YYYY-MM-DD"}
        filing_date_gt: {type: string, required: false, note: "filing date after YYYY-MM-DD"}
        filing_date_lt: {type: string, required: false, note: "filing date before YYYY-MM-DD"}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_page_url; when supplied, omit the original filters because the cursor preserves them"}
      note: "Supply ticker or cik unless continuing with cursor."
    test_request: {queryParams: {ticker: AAPL, period: annual, limit: 1}}
    cost: &standard_cost {type: per_success, value: 0.02, currency: USD, per: 1, unit: call, source: observed, source_url: "https://www.financialdatasets.ai/pricing", checked: '2026-09-15', confidence: verified, note: "Observed in the provider transaction ledger: the authenticated batch reconciled to $0.02 for each standard request"}
    verified: '2026-09-15'
    added: '2026-09-15'
    example_response: examples/financialdatasets.financials.json
    docs_url: https://docs.financialdatasets.ai/api/financials/all-financial-statements

  - id: financialdatasets.financials.income-statements
    domain: stocks
    capability: stocks.financials.income-statements
    platform: stocks
    scope: any_account
    method: GET
    path: /financials/income-statements
    name: "US company income statements"
    summary: "Get standardized annual, quarterly or trailing income statements for a US public company"
    input: *financial_input
    test_request: {queryParams: {ticker: AAPL, period: annual, limit: 1}}
    cost: *standard_cost
    verified: '2026-09-15'
    added: '2026-09-15'
    example_response: examples/financialdatasets.financials.income-statements.json
    docs_url: https://docs.financialdatasets.ai/api/financials/income-statements

