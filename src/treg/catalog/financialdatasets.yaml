        cursor: {type: string, required: false, note: "opaque cursor from the response next_page_url; when supplied, omit the original filters because the cursor preserves them"}
    test_request: {queryParams: {ticker: AAPL, period: annual, limit: 1}}
    cost: *standard_cost
    verified: '2026-09-15'
    added: '2026-09-15'
    example_response: examples/financialdatasets.financials.income-statements.segments.json
    docs_url: https://docs.financialdatasets.ai/api/financials/income-statement-segments

