    method: GET
    path: /filings
    name: "US public-company SEC filings"
    summary: "List SEC filing metadata for a US public company by ticker or CIK"
    input:
      queryParams:
        ticker: {type: string, required: false, note: "US stock ticker; supply ticker or cik. If availability is uncertain, call financialdatasets.filings.tickers first", example: AAPL}
        cik: {type: string, required: false, note: "SEC Central Index Key; supply ticker or cik. If availability is uncertain, call financialdatasets.filings.ciks first"}
        filing_type: {type: "array[string]", required: false, note: "repeatable filing type. Call financialdatasets.filings.types to list supported values"}
        limit: {type: integer, required: false, min: 1, note: "default 10"}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_page_url; when supplied, omit the original filters because the cursor preserves them"}
    test_request: {queryParams: {ticker: AAPL, filing_type: [10-K], limit: 1}}
