        end_date: {type: string, required: true, note: "YYYY-MM-DD", example: '2026-09-14'}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_page_url; when supplied, omit the original filters because the cursor preserves them"}
    test_request: {queryParams: {ticker: AAPL, interval: day, start_date: '2026-09-01', end_date: '2026-09-14'}}
    cost: *standard_cost
    verified: '2026-09-15'
    added: '2026-09-15'
    example_response: examples/financialdatasets.prices.json
    docs_url: https://docs.financialdatasets.ai/api/prices/historical

