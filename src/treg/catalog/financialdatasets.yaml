    input:
      queryParams:
        ticker: {type: string, required: true, note: "US stock ticker. If availability is uncertain, call financialdatasets.earnings.tickers first", example: AAPL}
        limit: {type: integer, required: false, min: 1, max: 40, note: "default 1"}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_page_url; when supplied, omit the original filters because the cursor preserves them"}
    test_request: {queryParams: {ticker: AAPL, limit: 1}}
    cost: *standard_cost
