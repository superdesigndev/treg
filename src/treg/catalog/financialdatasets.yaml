  - id: financialdatasets.index-funds
    domain: stocks
    capability: stocks.index-funds.holdings
    platform: stocks
    scope: any_account
    method: GET
    path: /index-funds
    name: "ETF and index-fund holdings"
    summary: "Get an ETF or index fund's holdings and weights, or find funds that hold a US security"
    input:
      queryParams:
        ticker: {type: string, required: false, note: "ETF or index-fund ticker; supply exactly one of ticker or holding. If availability is uncertain, call financialdatasets.index-funds.tickers first", example: SPY}
        holding: {type: string, required: false, note: "US security ticker; supply exactly one of ticker or holding to find funds whose latest filing holds the security"}
        as_of: {type: string, required: false, note: "YYYY-MM-DD; valid only with ticker; returns the fund composition in effect on or before this date"}
        asset_class: {type: string, required: false, note: "equity | bond; valid only with ticker; omit for all holdings"}
        limit: {type: integer, required: false, min: 1, note: "total rows across all pages; default 50; each response page contains up to 10 rows"}
        offset: {type: integer, required: false, min: 0, note: "rows to skip; default 0"}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_page_url; when supplied, omit the original filters because the cursor preserves them"}
      note: "Supply exactly one of ticker or holding unless continuing with cursor. The response shape depends on the query: ticker returns fund and holdings; holding returns security and funds."
    test_request: {queryParams: {ticker: SPY, limit: 1}}
    cost: *standard_cost
    verified: '2026-09-15'
    added: '2026-09-15'
    example_response: examples/financialdatasets.index-funds.json
    docs_url: https://docs.financialdatasets.ai/api/index-funds/ticker

