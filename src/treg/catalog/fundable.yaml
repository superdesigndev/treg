  - id: fundable.people.search
    capability: people.search
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /people
    name: Search people
    summary: Search founders, employees, angel investors and lead investors by role, company or investment activity.
    input:
      bodyType: json
      body:
        type: object
        properties:
          person_type: {type: string, required: false, default: any, enum: [company, investor, any]}
          identifiers: {type: object, required: false, note: "ids, linkedin_urls, crunchbase_urls and twitter_urls batch lookup"}
          person: {type: object, required: false, note: "roles, contact_types, job_titles, education_schools and linkedin_companies filters"}
          company: {type: object, required: false, note: "employer, location, industry, headcount, funding and latest-deal filters"}
          investor: {type: object, required: false, note: "investor firm identity, location and deal filters"}
          page: {type: integer, required: false, default: 0, min: 0}
          page_size: {type: integer, required: false, default: 10, min: 1, max: 500}
          sort_by: {type: string, required: false, default: most_recent_deal_date, note: "Documented people sort options"}
      note: person_type accepts company, investor or any; the default any combines both populations.
    test_request:
      body: {identifiers: {linkedin_urls: [https://www.linkedin.com/in/eladgil/]}, page: 0, page_size: 1}
    reserve: {rows: {param: body.page_size, default: {value: 10, source: docs}, max: 500}}
    price: {value: '0.06', currency: USD, per: 1, unit: result}
    settle: {reported: {path: response.meta.credits_used, unit: usd, scale: 0.06}}
