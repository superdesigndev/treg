    domain: contacts
    scope: any_account
    method: GET
    path: /person/search
    name: Resolve a person
    summary: Search people by name, UUID, LinkedIn, Crunchbase or Twitter identifier.
    input:
      queryParams:
        name: {type: string, required: false, example: Elad Gil}
        id: {type: string, required: false, note: "Person UUID"}
        linkedin: {type: string, required: false, example: https://www.linkedin.com/in/eladgil/}
        crunchbase: {type: string, required: false, example: https://crunchbase.com/person/elad-gil}
        twitter: {type: string, required: false, example: https://x.com/eladgil}
        person_type: {type: string, required: false, enum: [investor, company]}
      note: Provide exactly one identifier or name; person_type optionally limits the result pool.
