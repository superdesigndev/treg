  - id: generect.people.enrich
    added: '2026-10-28'
    capability: people.enrich
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/enrich/database/lead/
    body_allowlist: true
    name: "Enrich a person (database)"
    summary: "Retrieve a full lead profile from cached data by Generect ID, LinkedIn URL, or email (reverse lookup)."
    input: &lead_lookup
      bodyType: json
      body:
        linkedin_url: {type: string, required: false, note: "linkedin.com/in/{slug}, /in/{id} or a Sales Navigator lead URL", example: "https://www.linkedin.com/in/andrewkolp"}
        email: {type: string, required: false, note: "a work email, for a reverse lookup"}
        id: {type: string, required: false, note: "a Generect lead id from a search"}
        get_full_experience: {type: boolean, required: false, default: true, note: "false returns current positions only; free either way"}
        inexact_company: {type: boolean, required: false, note: "fall back to a fuzzy company match; free"}
      note: "exactly one of linkedin_url, email or id; anything else is a 400"
    test_request: {body: {linkedin_url: "https://www.linkedin.com/in/andrewkolp"}}
    cost: &cached_hit
      type: per_success
      value: 0.02
      currency: USD
      per: 1
      unit: record
      reported_charge: {path: meta.amount_charged, unit: usd}
      source: docs
      source_url: https://docs.generect.com/billing/pricing
      checked: '2026-10-28'
      confidence: documented
      note: "$0.02 per profile returned; a profile that does not exist is a free 400 (see miss). Observed 2026-10-28: hit charged 0.02 (0.8 s), miss $0 (7.0 s)."
    miss:
      status: 400
      when: "detail == 'Person does not exist'"
      means: "no such person: a normal outcome (and free), not an API failure (400 with detail \"Person does not exist\"; other 400 bodies, e.g. \"Bad url\" or a field map, are real request errors)"
    docs_url: https://docs.generect.com/api-reference/endpoint/enrich/enrich-database-lead

