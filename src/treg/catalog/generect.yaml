provider: generect
source:
  docs: https://docs.generect.com/api-reference/introduction
  openapi: https://docs.generect.com/api-reference/openapi.yaml
  curated: 2026-10-28
# Prepaid USD balance. Every billable result deducts its listed price, and every JSON response reports
# the exact charge in meta.amount_charged (USD), which the cost blocks below settle against. Not-found
# results are never billed: enrich answers 400 "Person/Company does not exist" at $0, email and phone
# find answer 200 with a null value at $0. Database counts and thin search rows ("detail": "thin",
# 2,000 rows per account per UTC day) are free. Real-time count routes are NOT free ($0.04 a call) and
# are left out of this file. Optional enrich sections (posts, comments, reactions, people_also_viewed,
# people_also_follow) and include_full_profile on real-time search add a charge per section and are
# not declared, so a row's price stays the one listed.
# Probe: GET /api/v1/accounts/me/ is free; a bad or missing token answers 401
# {"status": "error", "status_code": 401, "detail": "Authentication credentials were not provided."}.
# Prices are the published standard (Tier 0) API rates, which every API account pays until its lifetime
# spend reaches $20,000; each one was observed charged by meta.amount_charged and the balance delta on
# 2026-10-28.
limits: "Parallel requests per token and source IP: lead search 50, company search 20, lead enrich 500, company enrich 50; email find, email validation and phone find are uncapped. Excess answers 429 without Retry-After. Recommended timeouts: search 300 s, lead enrich 100 s, company enrich 60 s. HTTP 402 \"Insufficient funds in the account.\" when the prepaid balance is empty."
pricing_url: https://docs.generect.com/billing/pricing
endpoints:
  - id: generect.account.me
    added: '2026-10-28'
    kind: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /api/v1/accounts/me/
    name: "Get your account and balance"
    summary: "Retrieve the current account profile, credit balance, monthly usage, and whether Preview is currently free for you."
    input:
      note: "no parameters; the token rides in the Authorization header as `Token <token>`"
    test_request: {queryParams: {}}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "free; data.credits.wallet_usd is the prepaid balance in USD. A bad or missing token gets HTTP 401."}
    docs_url: https://docs.generect.com/api-reference/endpoint/accounts/get-account-me

  - id: generect.people.search.count
    added: '2026-10-28'
    capability: people.search.count
    platform: people
    domain: search
    scope: any_account
    method: POST
    path: /api/v1/search/database/leads/count/
    body_allowlist: true
    name: "Count people before you search"
    summary: "Count matching cached leads before running a database lead search."
    input:
      bodyType: json
      body:
        <<: &lead_filters_body
          job_titles: {type: "array[string]", required: false, note: "a lead matches any one title; more titles widen the search", example: ["CEO"]}
          seniorities: {type: "array[string]", required: false, note: "seniority at the current employer, e.g. c_suite, vp, director, manager, senior, entry, owner, partner, training, unpaid. Matched exactly: an unknown value returns 0 rows, not a 400", example: ["c_suite"]}
          locations: {type: "array[string]", required: false, note: "where the lead lives: city, region or country names; an unknown value is a 400", example: ["United States"]}
          exclude_locations: {type: "array[string]", required: false}
          company_locations: {type: "array[string]", required: false, note: "the employer's HQ location"}
          exclude_company_locations: {type: "array[string]", required: false}
          company_industries: {type: "array[string]", required: false, note: "LinkedIn industry names, e.g. Software Development. Matched exactly: an unknown value returns 0 rows, not a 400", example: ["Software Development"]}
          exclude_company_industries: {type: "array[string]", required: false}
          company_headcounts: {type: "array[string]", required: false, note: "one of 1-10, 11-50, 51-200, 201-500, 501-1000, 1001-5000, 5001-10000, 10001+", example: ["11-50"]}
          exclude_company_headcounts: {type: "array[string]", required: false}
          company_types: {type: "array[string]", required: false, note: "Public Company, Privately Held, Non Profit, Government Agency, Educational, Self Employed, Partnership, Self Owned"}
          company_name: {type: string, required: false, note: "one employer by name; mutually exclusive with company_link and company_id"}
          company_link: {type: string, required: false, note: "one employer by LinkedIn company URL", example: "https://www.linkedin.com/company/generect/"}
          company_id: {type: integer, required: false, note: "one employer by LinkedIn numeric company id"}
          exclude_names: {type: "array[string]", required: false, note: "skip leads by full name"}
          exclude_ids: {type: "array[string]", required: false, note: "skip leads by id"}
          filter_empty_vars: {type: "array[string]", required: false, note: "skip leads missing any of job_started_on, profile_photo, started_at_position, company_website"}
          strict: {type: "array[string]", required: false, note: "fields to match strictly, e.g. company_locations"}
          skip_truncated_names: {type: boolean, required: false, note: "drop leads whose first or last name is one character"}
        gender: {type: "array[string]", required: false, note: "male, female or unknown; inferred from the name, known for about a third of leads"}
    test_request: {body: {job_titles: ["CEO"], company_link: "https://www.linkedin.com/company/generect/"}}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "free: a cached count, meta.amount_charged 0"}
    docs_url: https://docs.generect.com/api-reference/endpoint/search/count-database-leads

  - id: generect.people.search
    added: '2026-10-28'
    capability: people.search
    platform: people
    domain: search
    scope: any_account
    method: POST
    path: /api/v1/search/database/leads/
    body_allowlist: true
    name: "Search people (database)"
    summary: "Search cached lead data with fast database filters."
    input:
      bodyType: json
      body:
        <<: *lead_filters_body
        gender: {type: "array[string]", required: false, note: "male, female or unknown; inferred from the name, known for about a third of leads"}
        detail: {type: string, required: false, default: full, note: "full (billed per row) or thin: id, name, title, seniority, location and employer at $0, up to 2,000 rows per account per UTC day; a spent quota is a 429 with Retry-After, never billed", example: full}
        limit_by: {type: integer, required: false, min: 1, max: 2400, note: "rows to return and the price dial: each full row is billed", example: 1}
        offset_by: {type: integer, required: false, min: 0, max: 2399, note: "rows to skip, for pagination"}
    test_request: {body: {job_titles: ["CEO"], company_link: "https://www.linkedin.com/company/generect/", limit_by: 1}}
    cost: &cached_row
      type: per_result
      value: 0.02
      currency: USD
      per: 1
      unit: row
      reported_charge: {path: meta.amount_charged, unit: usd}
      source: docs
      source_url: https://docs.generect.com/billing/pricing
      checked: '2026-10-28'
      confidence: documented
      note: "$0.02 per full row returned; zero rows cost $0. \"detail\": \"thin\" rows are $0 within the daily quota (meta.free_tier reports it). The exact charge is meta.amount_charged. Observed 2026-10-28: 1 full row charged 0.02, 1 thin row 0, 0 rows 0."
    docs_url: https://docs.generect.com/api-reference/endpoint/search/database-leads

