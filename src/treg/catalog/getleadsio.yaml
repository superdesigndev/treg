# GetLeads.io's fair-use and contacts-health routes are internal: connection verification and
# capacity collection use them, but neither is a catalog data tool. CSV upload, asynchronous
# export, and profile-monitoring state are excluded because they are file, job, or account-owned
# surfaces. BYOK always wins and is never metered by treg.
provider: getleadsio
source:
  docs: https://www.getleads.io/docs/
  openapi: null
  curated: '2026-09-16'
limits: '100 requests per minute by default across all endpoints. Catalog enrichment calls accept exactly one item. Search and company-contact lookups can return up to 5,000 records per request.'
pricing_url: https://www.getleads.io/pricing/
proposed_capabilities:
  people.organization_contacts: Find contacts at an organization by domain or role
  companies.acquisitions.feed: Browse recent company acquisition announcements
endpoints:
  - id: getleadsio.people.enrich.from_email
    capability: people.enrich
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/enrich/from-email
    strict_body: true
    name: Enrich one person from a work email
    summary: Enrich one person from a known work email address.
    input:
      body:
        items:
          type: 'array[object]'
          required: true
          min: 1
          max: 1
          example: [{email: nobody-treg-20260916@example.invalid}]
          note: Each item needs an email string.
      note: Exactly one item is accepted. One credit is charged when that result has success=true.
    test_request:
      body: {items: [{email: nobody-treg-20260916@example.invalid}]}
    cost: &one_credit_success
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: item
      source: observed
      source_url: https://www.getleads.io/docs/#json-batch--post-apiv1enrichfrom-email
      checked: '2026-09-16'
      confidence: verified
      note: One credit for each result whose success field is true. Live balance moved by one for one such result. A reserved .invalid email also returned success=true and was billed; treat that as an upstream data-quality observation, not a validity guarantee.
    docs_url: https://www.getleads.io/docs/#json-batch--post-apiv1enrichfrom-email
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.enrich.from_email.json

  - id: getleadsio.people.enrich.from_linkedin
    capability: people.enrich
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/enrich/from-linkedin
    strict_body: true
    name: Enrich one person from a LinkedIn URL
    summary: Enrich one person from a public LinkedIn profile URL.
    input:
      body:
        items:
          type: 'array[object]'
          required: true
          min: 1
          max: 1
          example: [{linkedin_url: https://www.linkedin.com/in/example}]
          note: Each item needs linkedin_url.
        limit_per_item: {type: integer, required: false, default: 1, min: 1, max: 10}
      note: Exactly one item is accepted. One credit is charged when that result has success=true.
    test_request:
      body: {items: [{linkedin_url: https://www.linkedin.com/in/treg-nonexistent-20260916}], limit_per_item: 1}
    cost:
      <<: *one_credit_success
      source_url: https://www.getleads.io/docs/#json-batch--post-apiv1enrichfrom-linkedin
    docs_url: https://www.getleads.io/docs/#json-batch--post-apiv1enrichfrom-linkedin
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.enrich.from_linkedin.json

  - id: getleadsio.people.enrich.from_person
    capability: people.enrich
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/enrich/from-person
    strict_body: true
    name: Enrich one person from name and company
    summary: Enrich one person from a name plus a company name or email domain.
    input:
      body:
        items:
          type: 'array[object]'
          required: true
          min: 1
          max: 1
          example: [{first_name: Jane, last_name: Doe, email_domain: example.com}]
          note: Each item needs first_name and last_name plus company_name or email_domain.
      note: Exactly one item is accepted. One credit is charged when that result has success=true.
    test_request:
      body: {items: [{first_name: Treg, last_name: Nonexistent, email_domain: treg-nonexistent-20260916.invalid}]}
    cost:
      <<: *one_credit_success
      source_url: https://www.getleads.io/docs/#json-batch--post-apiv1enrichfrom-person
    docs_url: https://www.getleads.io/docs/#json-batch--post-apiv1enrichfrom-person
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.enrich.from_person.json

  - id: getleadsio.people.phone.lookup
    capability: people.phone.find
    platform: people
    domain: contacts
    scope: any_account
    method: GET
    path: /api/v1/contacts/lookup/phone
    strict_query: true
    name: Look up one contact by phone
    summary: Find one contact record from a phone number.
    input:
      queryParams:
        phone: {type: string, required: true, example: '+1 202-555-0100'}
      note: The upstream also accepts cellphone as an alias. This tool uses phone so the request has one clear shape.
    test_request:
      queryParams: {phone: '+1 202-555-0100'}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://www.getleads.io/docs/#get-apiv1contactslookupphone
      checked: '2026-09-16'
      confidence: verified
      note: One credit when success is true; a live synthetic-number miss returned success=false and used zero credits. Platform access is a $0 limited treg trial, not the vendor's database-credit price.
    docs_url: https://www.getleads.io/docs/#get-apiv1contactslookupphone
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.phone.lookup.json
  - id: getleadsio.people.colleagues
    capability: people.organization_contacts
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/contacts/lookup/colleagues
    name: List colleagues at an organization
    summary: Find verified-email contacts by domain or LinkedIn organization URL.
    input:
      body:
        email_domain: {type: string, required: false, example: stripe.com}
        linkedin_company_url: {type: string, required: false, example: https://www.linkedin.com/company/stripe/}
        job_titles: {type: 'array[string]', required: false, example: [Engineer]}
        limit_per_item: {type: integer, required: false, default: 100, min: 1, max: 5000}
        offset: {type: integer, required: false, default: 0, min: 0}
      note: Provide email_domain or linkedin_company_url, not both. Continue with next_offset while has_more is true. One credit per returned record.
    test_request:
      body: {email_domain: treg-nonexistent-20260916.invalid, limit_per_item: 1, offset: 0}
    cost: &one_credit_record
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://www.getleads.io/docs/#post-apiv1contactslookupcolleagues
      checked: '2026-09-16'
      confidence: verified
      note: One credit per returned record. A live zero-row miss reported query_credits_used=0 and did not move the balance.
    docs_url: https://www.getleads.io/docs/#post-apiv1contactslookupcolleagues
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.colleagues.json

  - id: getleadsio.people.decision_makers
    capability: people.organization_contacts
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/contacts/lookup/decision-makers
    name: List decision makers at an organization
    summary: Find directors, VPs, executives, and heads at one organization.
    input:
      body:
        domain: {type: string, required: false, example: stripe.com}
        company_name: {type: string, required: false, example: Stripe}
        linkedin_company_url: {type: string, required: false, example: https://www.linkedin.com/company/stripe/}
        limit: {type: integer, required: false, default: 5000, min: 1, max: 5000}
        offset: {type: integer, required: false, default: 0, min: 0}
      note: Provide exactly one company identifier. Continue with next_offset while has_more is true. Results have VALID email status. One credit per returned record.
    test_request:
      body: {domain: treg-nonexistent-20260916.invalid, limit: 1, offset: 0}
    cost:
      <<: *one_credit_record
      source_url: https://www.getleads.io/docs/#post-apiv1contactslookupdecision-makers
    docs_url: https://www.getleads.io/docs/#post-apiv1contactslookupdecision-makers
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.decision_makers.json

  - id: getleadsio.people.search
    capability: people.search
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/contacts/search
    name: Search the contact database
    summary: Search business contacts with person, role, company, location, email, hiring, and funding filters.
    input:
      body:
        filters:
          type: object
          required: true
          example: {domains: [stripe.com], email_status: [VALID]}
          note: Supports role, company, industry, technology, geography, identity, email-quality, hiring, funding, revenue, headcount, traffic, ad-spend, and exclusion filters documented by GetLeads.io.
        limit: {type: integer, required: false, default: 1000, min: 1, max: 5000}
        offset: {type: integer, required: false, default: 0, min: 0}
        max_per_company: {type: integer, required: false, min: 1, max: 50}
        columns: {type: 'array[string]', required: false}
        where_sql: {type: string, required: false, max: 4000, note: Advanced predicate over the provider's internal columns. Use dedicated filters when possible.}
      note: Paginate with next_offset while has_more is true. Offset walks are reliable only below 50,000 matches. Run getleadsio.people.search.count first. One credit per returned record.
    test_request:
      body: {filters: {domains: [treg-nonexistent-20260916.invalid], email_status: [VALID]}, limit: 1, offset: 0}
    cost:
      <<: *one_credit_record
      source_url: https://www.getleads.io/docs/#post-apiv1contactssearch
      note: One credit per returned record. Live one-row pages each reported and consumed one credit; a zero-row page reported and consumed zero.
    docs_url: https://www.getleads.io/docs/#post-apiv1contactssearch
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.search.json

  - id: getleadsio.people.search.count
    capability: people.search.count
    platform: people
    domain: contacts
    scope: any_account
    method: POST
    path: /api/v1/contacts/search/count
    name: Count matching contacts for free
    summary: Count all contacts matching a search filter without returning or charging for records.
    input:
      body:
        filters: {type: object, required: true, example: {countries: [Ireland], seniority: [C-Team]}}
        where_sql: {type: string, required: false, max: 4000}
      note: At least one filter or where_sql is required. The count is exact and has no result cap.
    test_request:
      body: {filters: {domains: [stripe.com], email_status: [VALID]}}
    cost: &free_cost
      type: free
      value: 0
      currency: USD
      per: 1
      unit: call
      note: Live request reported credits_used=0 and did not reduce plan credits.
    docs_url: https://www.getleads.io/docs/#post-apiv1contactssearchcount
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.search.count.json

  - id: getleadsio.people.search.filters
    capability: people.search.filters
    platform: people
    domain: contacts
    kind: utility
    scope: any_account
    method: GET
    path: /api/v1/contacts/filter-values
    strict_query: true
    name: List accepted contact-filter values
    summary: List the canonical values for one enumerated contact-search filter.
    input:
      queryParams:
        field:
          type: string
          required: true
          enum: [seniority, job_functions, company_size, revenue, regions, continents, countries, headquarters_countries, office_countries, job_location_country, industries, personas, entity_types, email_status]
          example: email_status
      note: Free-text filters have no value list and return 400; use this tool only for an enumerated field.
    test_request:
      queryParams: {field: email_status}
    cost: *free_cost
    docs_url: https://www.getleads.io/docs/#get-apiv1contactsfilter-values
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.people.search.filters.json

  - id: getleadsio.companies.funding.feed
    capability: companies.funding.feed
    platform: companies
    domain: companies
    scope: any_account
    method: GET
    path: /api/v1/funding/signals
    name: Browse recent funding announcements
    summary: List structured company funding facts from recent US and European news feeds.
    input:
      queryParams:
        limit: {type: integer, required: false, default: 50, min: 1, max: 200, example: 1}
        since: {type: string, required: false, note: YYYY-MM-DD}
        min_confidence: {type: number, required: false, default: 0.5, min: 0, max: 1, example: 0.5}
        region: {type: string, required: false, enum: [US, EU, GLOBAL]}
      note: Each request fetches feeds live and can take 15-45 seconds. One credit per returned record.
    test_request:
      queryParams: {limit: 1, min_confidence: 0.5}
    cost:
      <<: *one_credit_record
      source_url: https://www.getleads.io/docs/#get-apiv1fundingsignals
      note: One credit per returned record; a live limit=1 request returned one record and reported queryCreditsUsed=1.
    docs_url: https://www.getleads.io/docs/#get-apiv1fundingsignals
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.companies.funding.feed.json

  - id: getleadsio.companies.acquisitions.feed
    capability: companies.acquisitions.feed
    platform: companies
    domain: companies
    scope: any_account
    method: GET
    path: /api/v1/acquisitions/signals
    name: Browse recent acquisition announcements
    summary: List structured merger and acquisition facts from recent news feeds.
    input:
      queryParams:
        limit: {type: integer, required: false, default: 50, min: 1, max: 200, example: 1}
        since: {type: string, required: false, note: YYYY-MM-DD}
        min_confidence: {type: number, required: false, default: 0.5, min: 0, max: 1, example: 0.5}
        acquirer: {type: string, required: false}
        target: {type: string, required: false}
        has_amount: {type: boolean, required: false}
        min_amount: {type: number, required: false, min: 0}
      note: Each request fetches feeds live. One credit per returned record.
    test_request:
      queryParams: {limit: 1, min_confidence: 0.5}
    cost:
      <<: *one_credit_record
      source_url: https://www.getleads.io/docs/#get-apiv1acquisitionssignals
      note: One credit per returned record; a live zero-record response reported queryCreditsUsed=0.
    docs_url: https://www.getleads.io/docs/#get-apiv1acquisitionssignals
    verified: '2026-09-16'
    added: '2026-09-16'
    example_response: examples/getleadsio.companies.acquisitions.feed.json
