  - id: google-ai.voice-gen.gemini-3-8-flash-tts
    capability: voice-gen.gemini-3-8-flash-tts.generate
    platform: voice-gen
    domain: models
    scope: any_account
    method: POST
    path: /models/{model}:generateContent
    name: "Google: Gemini 3.8 Flash TTS"
    summary: "Speak a text in one of 30 prebuilt voices, or a two-speaker dialogue, with Gemini 3.8 Flash TTS on Google's own API; the audio returns inline as base64 WAV (24 kHz mono)."
    spooled_response: true
    input:
      pathParams:
        model: {type: string, required: true, enum: [gemini-3.8-flash-tts], example: gemini-3.8-flash-tts}
      body:
        contents:
          type: array
          required: true
          example: [{parts: [{text: "Say cheerfully: Welcome to treg."}]}]
          note: "One user turn: {parts: [{text: script}]}. Style is steered in the text itself (\"Say cheerfully: ...\"). For two speakers, give each line its own part with its speaker: [{text: \"Did it finish?\", speechMetadata: {speaker: Joe}}, {text: \"Yes.\", speechMetadata: {speaker: Jane}}], and name both in multiSpeakerVoiceConfig; a single \"Joe: ... Jane: ...\" text answers 400."
        generationConfig:
          type: object
          required: true
          properties:
            responseModalities: {type: array, required: true, example: [AUDIO], note: "Must be [AUDIO]."}
            speechConfig:
              type: object
              required: true
              note: "Either {voiceConfig: {prebuiltVoiceConfig: {voiceName}}} for one voice, or {multiSpeakerVoiceConfig: {speakerVoiceConfigs: [{speaker, voiceConfig: {prebuiltVoiceConfig: {voiceName}}}]}} for exactly two named speakers. Voices: Zephyr, Puck, Charon, Kore, Fenrir, Leda, Orus, Aoede, Callirrhoe, Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome, Algenib, Rasalgethi, Laomedeia, Achernar, Alnilam, Schedar, Gacrux, Pulcherrima, Achird, Zubenelgenubi, Vindemiatrix, Sadachbia, Sadaltager, Sulafat."
              example: {voiceConfig: {prebuiltVoiceConfig: {voiceName: Kore}}}
      bodyType: json
    test_request:
      pathParams: {model: gemini-3.8-flash-tts}
      body: {contents: [{parts: [{text: "Say cheerfully: Welcome to treg, the tool catalog for your agents."}]}], generationConfig: {responseModalities: [AUDIO], speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName: Kore}}}}}
    cost:
      type: per_success
      value: 0.05
      per: 1
      unit: call
      fallback: {value: 0.05, note: "About 5,500 audio tokens (3.7 minutes); the reported token meters settle, and a long script may settle above it."}
      currency: USD
      settle: usage
      usage:
        unit: usd
        terms:
          - {path: usageMetadata.promptTokenCount, rate: 0.0000005}
          - {path: usageMetadata.candidatesTokenCount, rate: 0.000009}
          - {path: usageMetadata.thoughtsTokenCount, rate: 0.000009}
      source: docs
      source_url: https://ai.google.dev/gemini-api/docs/pricing
      checked: 2026-09-30
      confidence: documented
      note: "Token-metered at Google's paid-tier rates (through 2026-12-31): input $0.50/M, audio output $9/M, about 25 audio tokens a second ($0.00225 per 10 s). Live 2026-09-30 a 7.1 s line read 22 prompt and 228 audio tokens ($0.002063). A five-minute WAV is about 19 MB of base64 and is spooled."
    verified: 2026-09-30
    added: '2026-09-29'
    example_response: examples/google-ai.voice-gen.gemini-3-8-flash-tts.json
    docs_url: https://ai.google.dev/gemini-api/docs/speech-generation

