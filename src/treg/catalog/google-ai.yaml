  - id: google-ai.music-gen.lyria-3-5
    capability: music-gen.lyria-3-5.generate
    platform: music-gen
    domain: models
    scope: any_account
    method: POST
    path: /models/{model}:generateContent
    name: "Google: Lyria 3.5"
    summary: "Compose a full song (about three minutes) from a text prompt with Lyria 3.5 on Google's own API; the MP3 returns inline as base64 with its lyrics or section markers."
    spooled_response: true
    # A generation Google refuses answers 200 without STOP; only a finished song is billed.
    expect: {json_path: candidates.0.finishReason, equals: STOP}
    input:
      pathParams:
        model: {type: string, required: true, enum: [lyria-3.5], example: lyria-3.5}
      body:
        contents:
          type: array
          required: true
          example: [{parts: [{text: "An upbeat lo-fi hip hop instrumental with warm piano chords."}]}]
          note: "One user turn: {parts: [{text: prompt}]}. Describe genre, mood, instruments and tempo; ask for an instrumental or supply lyrics in the prompt. The answer carries an MP3 part (inlineData, audio/mpeg) and a text part with the lyrics or section markers."
      bodyType: json
    test_request:
      pathParams: {model: lyria-3.5}
      body: {contents: [{parts: [{text: "An upbeat lo-fi hip hop instrumental with warm piano chords and soft vinyl crackle."}]}]}
    cost:
      type: per_success
      value: 0.08
      per: 1
      unit: call
      currency: USD
      source: docs
      source_url: https://ai.google.dev/gemini-api/docs/pricing
      checked: 2026-09-30
      confidence: documented
      note: "$0.08 per song, flat. usageMetadata reports tokens but no audio meter and is not the bill. Live 2026-09-30 a prompt returned a 179 s, 192 kbps MP3 (4.3 MB, 5.7 MB as base64) in 36 s; longer songs approach the 8 MiB buffer, so the answer is spooled. Only a STOP answer is billed."
    verified: 2026-09-30
    added: '2026-09-29'
    example_response: examples/google-ai.music-gen.lyria-3-5.json
    docs_url: https://ai.google.dev/gemini-api/docs/music-generation

