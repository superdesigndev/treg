  cost: *id001
  docs_url: https://developers.google.com/tag-platform/tag-manager/api/reference/rest/v2
  input:
    pathParams:
      accountsId:
        type: string
        required: true
        note: Atomic accountsId path segment from Google's expanded resource name; do not pass a slash-delimited parent/path value
      containersId:
        type: string
        required: true
        note: Atomic containersId path segment from Google's expanded resource name; do not pass a slash-delimited parent/path value
    queryParams:
      allowUserPermissionFeatureUpdate:
        type: boolean
        required: false
        note: Must be set to true to allow features.user_permissions to change from false to true. If this operation causes an update but this bit is false, the operation will fail.
      copySettings:
        type: boolean
        required: false
        note: Whether or not to copy tag settings from this tag to the new tag.
      copyTermsOfService:
        type: boolean
        required: false
        note: Must be set to true to accept all terms of service agreements copied from the current tag to the newly created tag. If this bit is false, the operation will fail.
      copyUsers:
        type: boolean
        required: false
        note: Whether or not to copy users from this tag to the new tag.
      tagId:
        type: string
        required: false
        note: Tag ID to be removed from the current Container.
      tagName:
        type: string
        required: false
        note: The name for the newly created tag.
