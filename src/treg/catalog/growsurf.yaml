- id: growsurf.referral.program.analytics
  capability: referral.program.analytics
  platform: referral
  scope: own_account
  method: GET
  path: /campaign/{id}/analytics
  name: Get program analytics
  summary: Retrieve campaign analytics
  input:
    pathParams:
      id:
        type: string
        required: true
        note: GrowSurf program ID.
    queryParams:
      days:
        type: integer
        required: false
        note: Last number of days to retrieve analytics for. Defaults to 365. Maximum 1825.
      startDate:
        type: integer
        required: false
        note: Start date of the analytics timeframe as a Unix timestamp in milliseconds. Required if `days`
          is not set.
      endDate:
        type: integer
        required: false
        note: End date of the analytics timeframe as a Unix timestamp in milliseconds. Required if `days`
          is not set.
      interval:
        type: string
        required: false
        note: 'When set to `day`, `week`, or `month`, the response also includes a `series` array with
          per-period totals and uses the same bucket size for `engagement.series`. Defaults to `total`
          (no legacy series); `engagement.series` uses daily buckets when `interval` is `total` or omitted.
          Allowed values: day, week, month, total.'
      include:
        type: string
        required: false
        note: 'Comma-separated list of optional data to include: `previousPeriod` adds totals for the
          equal-length window immediately before the requested one; `statusCounts` adds reward (and, for
          affiliate programs, affiliate/commission/payout) status breakdowns; `rates` adds derived referral
          rates; `email` adds `sent`, `delivered`, `opened`, `clicked`, `bounced`, `spamComplaints`, and
          per-email-type metrics; `engagement` adds unique participant engagement, action totals, comparisons,
          and platform/source/channel breakdowns. When `email` and an interval are both requested, each
          `series` item also contains counts for emails sent during that period. Combine `email` with
          `previousPeriod` to include the same email metrics in both windows.'
        example: previousPeriod,statusCounts,rates,email,engagement
      timezone:
        type: string
        required: false
        note: IANA timezone used for engagement interval boundaries and distinct-day calculations. Used
          only when `include` contains `engagement`.
        example: America/Los_Angeles
      platform:
        type: string
        required: false
        note: 'Limits engagement events to one client platform. Used only when `include` contains `engagement`.
          Allowed values: ALL, WEB, IOS, ANDROID.'
    note: 'Required API-key scope: analytics:read. Use a dedicated test program for verification.'
  cost:
    type: free
    value: 0
    currency: USD
    source: docs
    source_url: https://growsurf.com/pricing/referral-programs/
    checked: '2026-10-03'
    confidence: documented
    note: API access is included in the connected team’s plan; no separate per-request price is published.
      No per-call charge field, credit balance or rate-card endpoint is exposed, so a per-call price is
      not independently metered. Plan, participant usage and rate limits still apply.
    unit: call
  docs_url: https://docs.growsurf.com/developer-tools/rest-api/api-reference
  test_request:
    pathParams:
      id: s4hnhx
    queryParams:
      days: 1
