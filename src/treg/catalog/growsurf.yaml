- id: growsurf.referral.participant.analytics
  capability: referral.participant.analytics
  platform: referral
  scope: own_account
  method: GET
  path: /campaign/{id}/participant/{participantIdOrEmail}/analytics
  name: Get participant analytics
  summary: Retrieve participant analytics
  input:
    pathParams:
      id:
        type: string
        required: true
        note: GrowSurf program ID.
      participantIdOrEmail:
        type: string
        required: true
        note: GrowSurf participant ID or URL-encoded participant email address.
    queryParams:
      include:
        type: string
        required: false
        note: Comma-separated optional data. `series` returns this participant's own activity per period;
          `email` returns `sent`, `delivered`, `opened`, `clicked`, `bounced`, `spamComplaints`, and per-email-type
          metrics attributed to the participant for the requested analytics window (including invitations
          they sent). Request both in either order to add email counts to every series item for emails
          sent during that period. `activation` returns covered enrollment, cohort-anchor, and first-milestone
          values. Request `activation,series` to add `portalViews` and `shareActions`; those values are
          `null` outside known coverage. Only documented tokens are accepted; an unknown token returns
          `400`.
        example: email,series
      days:
        type: integer
        required: false
        note: Last number of days for optional `series` and `email` analytics. Defaults to 365. Maximum
          1825. Does not filter the top-level all-time totals.
      startDate:
        type: integer
        required: false
        note: Start of a custom `series` and `email` analytics window as a Unix timestamp in milliseconds.
          Set it together with `endDate`. Does not filter the top-level all-time totals.
      endDate:
        type: integer
        required: false
        note: End of a custom `series` and `email` analytics window as a Unix timestamp in milliseconds.
          Set it together with `startDate`. Does not filter the top-level all-time totals.
      interval:
        type: string
        required: false
        note: 'Bucket size for the `series` (only used when `include` contains `series`). Defaults to
          `day`. Allowed values: day, week, month.'
    note: 'Required API-key scope: analytics:read. Use a dedicated test program for verification.'
  cost:
    type: free
    value: 0
    currency: USD
    source: docs
    source_url: https://growsurf.com/pricing/referral-programs/
    checked: '2026-10-03'
    confidence: documented
    note: API access is included in the connected team’s plan; no separate per-request price is published.
      No per-call charge field, credit balance or rate-card endpoint is exposed, so a per-call price is
      not independently metered. Plan, participant usage and rate limits still apply.
    unit: call
  docs_url: https://docs.growsurf.com/developer-tools/rest-api/api-reference
  test_request:
    pathParams:
      id: s4hnhx
      participantIdOrEmail: k06ewb
    queryParams:
      days: 1
