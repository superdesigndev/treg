      cohortInterval:
        type: string
        required: false
        note: 'Bucket size for the `cohorts` array. Allowed values: day, week, month.'
      observationWindowDays:
        type: integer
        required: false
        note: 'Days after each participant''s eligibility date in which stages can count. Allowed values:
          7, 30.'
      timezone:
        type: string
        required: false
