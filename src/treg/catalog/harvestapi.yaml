# API-key-only read surface. Account probe is internal; no interactions or custom sessions.
# 23 upstream endpoints; profile has three enforced variants. Examples contain synthetic identities.
provider: harvestapi
source:
  docs: https://docs.harvestapi.io
  openapi: https://docs.harvestapi.io/linkedin-api-reference/openapi.json
  curated: '2026-09-10'
limits: 'Starter: 5 concurrent requests, queue of 10 per Harvest account; no RPM cap. Excess queue requests fail.
  BYOK uses the customer’s account allowance.'
pricing_url: https://harvestapi.io/
proposed_capabilities:
  linkedin.search.companies: Search LinkedIn companies
  linkedin.search.services: Search LinkedIn service providers
  linkedin.search.groups: Search LinkedIn groups
  linkedin.group.detail: Get a LinkedIn group
  linkedin.search.locations: Find LinkedIn location IDs
  linkedin.comment.replies: Get replies to a LinkedIn comment
  linkedin.comment.reactions: Get reactions to a LinkedIn comment
endpoints:
- id: harvestapi.linkedin.user.profile
  capability: linkedin.user.profile
  platform: linkedin
  scope: any_account
  domain: contacts
  method: GET
  path: /linkedin/profile
  name: Get a full LinkedIn profile
  summary: Get a full LinkedIn profile with detailed experience, education and skills.
  input:
    queryParams:
      url:
        type: string
        required: false
        note: URL of the LinkedIn profile (optional)
      publicIdentifier:
        type: string
        required: false
        note: Public identifier of the LinkedIn profile (optional)
        example: williamhgates
      profileId:
        type: string
        required: false
        note: ID of the LinkedIn profile (optional)
    note: 'Supply at least one profile identifier: url, publicIdentifier or profileId. Do not add main or findEmail. Use only the declared query parameters, once each, without a request body. Results are provider-native:
      inspect element/elements and body status/error; HTTP 200 alone does not prove a hit. Empty results can still
      be charged. Basic, full and email are separate tools. Do not combine main and findEmail. Email availability
      and quality are provider-reported; no email is guaranteed.'
  strict_query: true
  test_request:
    queryParams:
      publicIdentifier: williamhgates
  cost:
    type: per_call
    value: 0.0064
    currency: USD
    per: 1
    unit: call
    source: observed
    source_url: https://docs.harvestapi.io
    checked: '2026-09-10'
    confidence: verified
    note: Observed on treg’s prepaid Harvest account. Final platform cost follows the response cost, including billed
      misses and explicit zero. BYOK never charges the treg balance.
    reported_charge:
      path: cost
      unit: usd
  docs_url: https://docs.harvestapi.io/linkedin-api-reference/openapi.json
  verified: '2026-09-10'
  example_response: examples/harvestapi.linkedin.user.profile.json
