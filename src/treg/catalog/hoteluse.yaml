          children_ages.'
        example:
          date_intent: tonight
          rooms:
          - adults: 2
            children_ages: []
          currency: USD
          market:
            residency_country: US
      rate_filters:
        type: object
        required: false
        properties:
          refundable_only: {type: boolean, required: false, note: Require known refundable terms.}
          breakfast_included: {type: boolean, required: false}
          stay_total_min: {type: number, required: false, min: 0, max: 100000000, note: 'Minimum full-stay total for
              all requested rooms, including mandatory taxes and fees.'}
          stay_total_max: {type: number, required: false, min: 0, max: 100000000, note: 'Maximum full-stay total for
              all requested rooms, including mandatory taxes and fees.'}
        note: Filters apply to provider offers before minimum prices are selected; budgets are full-stay amounts in context.currency.
        example:
          refundable_only: true
      providers:
        type: array
        required: false
        minItems: 1
        note: 'Provider IDs: expedia, booking, agoda, brek, trip, vio. Check /v1/capabilities for enabled providers.'
        example:
        - expedia
      page_size:
