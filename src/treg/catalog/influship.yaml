  platform: youtube
  scope: any_account
  method: GET
  path: /v1/raw/youtube/search
  name: Search YouTube
  summary: Search YouTube videos and channels.
  input:
    queryParams:
      q:
        type: string
        required: true
        example: fitness workout
        note: Search query; minLength=1; maxLength=500
      limit:
        type: integer
        required: false
        default: 20
        example: 20
        min: 1
        max: 50
        note: Maximum number of results to return
      country_code:
        type: string
        required: false
        default: US
        example: US
        note: Country code for localized results (ISO 3166-1 alpha-2); minLength=2; maxLength=2
      language_code:
        type: string
        required: false
        default: en
        example: en
        note: Language code for results; minLength=2; maxLength=5
      upload_date:
        type: string
        required: false
        default: any
        example: this_week
        enum:
        - any
        - last_hour
        - today
        - this_week
        - this_month
        - this_year
        note: Only return results uploaded within the selected window
      sort_by:
        type: string
        required: false
        default: relevance
        example: popular
        enum:
        - relevance
        - popular
        note: Order results by relevance or view popularity
      content_type:
        type: string
        required: false
        default: all
        example: videos
        enum:
        - all
        - videos
        note: Return all result types or only videos
      duration:
        type: string
        required: false
        default: any
        example: long
        enum:
        - any
        - short
        - medium
        - long
        note: Filter videos by YouTube duration band
      cursor:
        type: string
