- id: influship.searchcreators
  capability: creators.search
  platform: creators
  scope: any_account
  method: POST
  path: /v1/search
  name: AI-Powered Creator Search
  summary: Find Instagram creators from a natural-language brief. Each result includes ranking, reasons, and available
    evidence.
  input:
    body:
      query:
        type: string
        required: true
        example: fitness influencers with 100k+ followers who post workout videos
        note: Natural language search query; minLength=1; maxLength=500
      platforms:
        type: array[string]
        required: false
        example:
        - instagram
        note: 'Filter results to specific platforms; JSON schema: {"description":"Filter results to specific platforms","example":["instagram"],"type":"array","items":{"$ref":"#/components/schemas/Platform"}}'
      filters:
        type: object
        required: false
        note: 'Additional filters; JSON schema: {"type":"object","properties":{"followers":{"description":"Filter
          by follower count","$ref":"#/components/schemas/FollowersFilter"},"engagement_rate":{"description":"Filter
          by engagement rate","$ref":"#/components/schemas/EngagementRateFilter"},"verified":{"description":"Filter
          by verified status","example":true,"type":"boolean"}},"description":"Additional filters"}'
      limit:
        type: integer
        required: false
        default: 25
        example: 5
        min: 1
        max: 100
        note: Maximum results to return. Start with 5 for a small trial; default is 25.
      creator_kinds:
        type: array[string]
        required: false
        example:
        - INFLUENCER
        minItems: 1
        note: 'Restrict results to specific creator kinds (e.g. INFLUENCER vs THEME_PAGE). Omit for no filter.;
          JSON schema: {"description":"Restrict results to specific creator kinds (e.g. INFLUENCER vs THEME_PAGE).
          Omit for no filter.","example":["INFLUENCER"],"minItems":1,"type":"array","items":{"type":"string","enum":["INFLUENCER","THEME_PAGE"]}}'
  test_request:
    body:
      query: space science and astronomy educators
      limit: 1
      platforms:
      - instagram
  cost:
    type: per_result
    value: 2
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://docs.influship.com/concepts/pricing
    checked: '2026-10-09'
    confidence: documented
    reported_charge:
      header: X-Credits-Charged
      unit: credit
    note: API-key pricing; 1 credit = $0.01. Calculated credit meter checked 2026-10-09 using a billing-exempt verification
      account; no paid acquisition receipt. Independent maintainer verification is pending. HTTP 4xx/5xx responses
      are free. A successful empty search still costs 25 credits; reserve 25 + 2 × requested limit, settle exact
      header. Saved pagination is free.
    request_count:
      location: body
      field: limit
      mode: value
      default: 25
      maximum: 100
    base_value: 25
  added: '2026-10-09'
  docs_url: https://docs.influship.com/api-reference
