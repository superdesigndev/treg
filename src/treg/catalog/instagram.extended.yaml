# instagram — EXTENDED tier: the provider's full endpoint surface, machine-generated by
# scripts/catalog_ingest.py. Reviewed request, authorization, capability and verification fields
# are carried across re-ingests by id via carry_verification. Routes curated in core
# instagram.yaml are excluded here.
#
# META PUBLISHES NO SPEC. There is no OpenAPI document, no discovery document and no
# machine-readable index for the Graph API — the only source is the HTML reference, one page
# per node type. Hand-transcribing hundreds of routes out of HTML is how typos ship, so this
# file is deliberately SHORT: 22 entries, each an edge of a node type this provider's scopes
# can actually reach, read off the official reference page linked in every docs_url. Accuracy
# over volume — assume the Graph surface is much larger than what is listed here.
#
# Paths are relative to the method profile's base URL, which ends in /v25.0. Direct-supported
# rows use graph.instagram.com. Page-only rows use graph.facebook.com.
#
# Direct grants request instagram_business_* scopes. The optional Page grant keeps the existing
# instagram_* and pages_* scopes.
# 2 entries need a scope beyond that and carry `scope_gap:`. Meta gates most of those behind
# App Review with a screencast per permission, so a scope gap here is a product decision, not
# a config change.
#
# Graph ids are opaque and account-specific ({page_id}, {ad_account_id} — the latter includes
# its `act_` prefix), so nothing here carries a test_request; `treg connections resources`
# supplies the id for the connected account.

provider: instagram
source:
  method: hand-curated from the official Graph API HTML reference (Meta publishes no machine-readable spec)
  ingested: '2026-08-31'
  spec_urls:
  - https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference
  - https://developers.facebook.com/docs/graph-api/reference
