- id: justblogged.blog.posts.list
  added: '2026-10-31'
  capability: blog.posts.list
  platform: blog
  scope: own_account
  method: GET
  path: /blogs/{blogId}/posts
  name: List your blog posts
  summary: List posts
  input:
    pathParams:
      blogId:
        type: string
        required: true
        note: Blog ID
        example: 7RkrCq_ZWQHbzlkE00ZCg
    queryParams:
      page:
        type: integer
        required: false
        default: 1
        min: 1
        example: 1
      limit:
        type: integer
        required: false
        default: 30
        min: 1
        max: 100
        example: 1
      status:
        type: string
        required: false
        enum:
        - draft
        - published
        - scheduled
        - all
      collectionId:
        type: string
        required: false
      tagId:
        type: string
        required: false
      userId:
        type: string
        required: false
        note: Filter by author
      orderBy:
        type: string
        required: false
        enum:
        - createdAt
        - updatedAt
        - title
        - publishedAt
        default: createdAt
      order:
        type: string
        required: false
        enum:
        - asc
        - desc
        default: desc
    note: Use a blog ID returned by GET /blogs; content IDs come from the corresponding list route.
  test_request:
    pathParams:
      blogId: 7RkrCq_ZWQHbzlkE00ZCg
    queryParams:
      page: 1
      limit: 1
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://justblogged.com/pricing
    checked: '2026-10-31'
    confidence: documented
    note: REST API access is included on Free; no per-call billing.
  docs_url: https://justblogged.com/developers/api
- id: justblogged.blog.post.create
  added: '2026-10-31'
  capability: blog.post.create
  platform: blog
  scope: own_account
  kind: action
  method: POST
  path: /blogs/{blogId}/posts
  name: Create a blog post
  summary: Create post
  input:
    pathParams:
      blogId:
        type: string
        required: true
        note: Blog ID
        example: 7RkrCq_ZWQHbzlkE00ZCg
    bodyType: json
    body:
      title:
        type: string
        required: true
        minLength: 1
        maxLength: 200
        example: treg catalog post creation check
      slug:
        type: string
        required: false
        maxLength: 100
        note: Auto-generated from title if not provided
        example: treg-catalog-post-check
      content:
        type: string
        required: true
        minLength: 1
        maxLength: 1000000
        example: <p>Unpublished API verification fixture.</p>
      status:
        type: string
        required: false
        enum:
        - draft
        - published
        default: draft
        example: draft
      collection_id:
        type: string
        required: false
        minLength: 1
        note: Optional collection ID. When omitted, the blog's empty-slug default Posts collection is used.
          If that default does not exist, collection_id is required.
        example: 4RzZLQPvo23SH_hT2j39_
      author_id:
        type: string
        required: false
        minLength: 1
        note: Optional author user ID. Assigning another blog member requires owner or admin access.
      image:
        type: string
        required: false
        maxLength: 500
      published_at:
        type: string
        required: false
        note: Auto-set to now if status is published and not provided
      tags:
        type: array
        required: false
        default: []
        maxItems: 10
      metadata:
        type: object
        required: false
        note: Custom metadata (max 20 fields, description max 200 chars)
    note: Test request creates an unpublished draft on the dedicated verification blog. Delete that draft before
      replaying the unchanged request. Use your own IDs for another account.
  test_request:
    pathParams:
      blogId: 7RkrCq_ZWQHbzlkE00ZCg
    body:
      title: treg catalog post creation check
      slug: treg-catalog-post-check
      content: <p>Unpublished API verification fixture.</p>
      status: draft
      collection_id: 4RzZLQPvo23SH_hT2j39_
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://justblogged.com/pricing
    checked: '2026-10-31'
    confidence: documented
    note: REST API access is included on Free; no per-call billing.
  docs_url: https://justblogged.com/developers/api
