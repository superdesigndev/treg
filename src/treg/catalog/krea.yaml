provider: krea
source:
  docs: https://www.krea.ai/docs/developers/introduction
  openapi: https://api.krea.ai/openapi.json
  curated: 2026-09-15
pricing_url: https://www.krea.ai/features/api
limits: "Generation is asynchronous: every POST /generate/* answers at once with a job_id; poll GET /jobs/{id} every 5 seconds (images finish in seconds, videos in 1-5 minutes). Concurrency and backlog scale with the workspace plan tier; jobs above the concurrency limit queue in a backlog instead of being refused. Only completed jobs bill. Failed and cancelled jobs are free. When the prepaid API balance is empty new requests answer HTTP 402. Every per-request price sits in the OpenAPI document under x-krea-pricing (the machine-readable rate card). Image inputs accept a public URL, a base64 data URI, or a Krea asset URL."
proposed_capabilities:
  # Per-model join keys, following the model-wall convention in minimax.yaml: one row per model,
  # merging with other routes to the same model when those are curated.
  image-gen.krea-2-turbo.generate: "Generate a Krea 2 Turbo image from a text prompt"
  image-gen.krea-2-large.generate: "Generate a Krea 2 Large image from a text prompt"
  image-gen.flux-dev.from_text: "Generate a FLUX.1 [dev] image from a text prompt"
  image-gen.flux-kontext-dev.edit: "Edit an image with a prompt using FLUX.1 Kontext [dev]"
  video-gen.h3-max-turbo.generate: "Generate a MiniMax H3 Max Turbo video from a text prompt, optionally from a start image"
  # Shared per-model keys already proposed by other provider files (reapi, piapi, openrouter,
  # replicate, minimax); re-declared here so the join resolves until they land in capabilities.yaml.
  image-gen.gemini-3-pro-image.generate: "Gemini 3 Pro Image"
  video-gen.seedance-2-5.generate: "Seedance 2.5"
  video-gen.veo-3-1-fast.generate: "Generate a Veo 3.1 Fast video from text, optionally from a starting image"
  video-gen.wan-3-0.from_text: "Generate a Wan 3.0 video from a text prompt"
  video-gen.hailuo.from_text: "Generate a Hailuo video from a text prompt"
async:
  id_from: job_id
  poll:
    endpoint: krea.jobs.get
    param: {in: pathParams, name: id}
  status:
    path: status
    success: [completed]
    failure: [failed, cancelled]
  result:
    path: result.urls
  interval: 5
endpoints:
  - id: krea.jobs.get
    kind: utility
    capability: video-gen.task.status
    platform: video-gen
    scope: any_account
    method: GET
    path: /jobs/{id}
    name: "Check a Krea job"
    summary: "Read a generation job's status (backlogged, queued, scheduled, processing, sampling, intermediate-complete, completed, failed, cancelled), its output URLs on success, and its error on failure."
    resource_ownership:
      requires: {kind: "poll:krea.jobs.get", param: id}
    async: false
    input:
      pathParams:
        id: {type: string, required: true, example: "1296e8a1-2502-4b66-8a2e-542bde1d0891"}
    test_request: {pathParams: {id: "1296e8a1-2502-4b66-8a2e-542bde1d0891"}}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "Job status reads are free."}
    docs_url: https://www.krea.ai/docs/api-reference/general/get-a-job-by-id

  - id: krea.image-gen.krea-2-turbo
    capability: image-gen.krea-2-turbo.generate
    platform: image-gen
    domain: models
    scope: any_account
    method: POST
    path: /generate/image/krea/krea-2/medium-turbo
    name: "Krea: Krea 2 Turbo"
    summary: "Fastest medium quality Krea 2 model. Best for low-cost iteration on expressive illustrations and style-driven concepts."
    input:
      body:
        prompt: {type: string, required: true, example: "A paper boat drifts across a quiet pond at sunrise, risograph poster."}
        aspect_ratio: {type: string, required: true, enum: ["1:1", "4:3", "3:2", "16:9", "2.35:1", "4:5", "2:3", "9:16"], example: "1:1"}
        resolution: {type: string, required: true, enum: ["1K"], example: "1K"}
        creativity: {type: string, required: false, default: low, enum: [raw, low, medium, high], example: low, note: "Prompt expansion mode. raw disables it."}
        seed: {type: number, required: false, example: 42}
        intensity: {type: integer, required: false, default: 0, min: -100, max: 100, note: "Krea 2 style slider; 0 is neutral."}
        complexity: {type: integer, required: false, default: 0, min: -100, max: 100, note: "Krea 2 composition-density slider; 0 is neutral."}
        movement: {type: integer, required: false, default: 0, min: -100, max: 100, note: "Krea 2 motion slider; 0 is neutral."}
      bodyType: json
    test_request:
      body: {prompt: "A paper boat drifts across a quiet pond at sunrise, risograph poster.", aspect_ratio: "1:1", resolution: "1K", creativity: low}
    cost:
      type: per_success
      value: 0.015
      currency: USD
      source: rate_card_api
      source_url: https://api.krea.ai/openapi.json
      checked: 2026-09-15
      confidence: documented
      note: "Text-to-image tier. The rate card bills $0.0175 with image style references and $0.02 with a moodboard; those inputs are not exposed on this row, so every call settles at the text-to-image price."
    docs_url: https://www.krea.ai/docs/api-reference/krea/krea-2-turbo

