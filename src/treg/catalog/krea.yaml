    summary: "Krea's flagship foundation image model. Best for expressive photorealism with full control over style and composition."
    input:
      body:
        prompt: {type: string, required: true, example: "Portrait of a lighthouse keeper at dusk, 35mm film photograph."}
        aspect_ratio: {type: string, required: true, enum: ["1:1", "4:3", "3:2", "16:9", "2.35:1", "4:5", "2:3", "9:16"], example: "3:2"}
        resolution: {type: string, required: true, enum: ["1K"], example: "1K"}
        creativity: {type: string, required: false, default: low, enum: [raw, low, medium, high], example: low, note: "Prompt expansion mode. raw disables it."}
        seed: {type: number, required: false, example: 42}
        intensity: {type: integer, required: false, default: 0, min: -100, max: 100, note: "Krea 2 style slider; 0 is neutral."}
        complexity: {type: integer, required: false, default: 0, min: -100, max: 100, note: "Krea 2 composition-density slider; 0 is neutral."}
        movement: {type: integer, required: false, default: 0, min: -100, max: 100, note: "Krea 2 motion slider; 0 is neutral."}
      bodyType: json
    test_request:
      body: {prompt: "Portrait of a lighthouse keeper at dusk, 35mm film photograph.", aspect_ratio: "1:1", resolution: "1K", creativity: low}
    cost:
      type: per_success
      value: 0.06
      currency: USD
      source: rate_card_api
      source_url: https://api.krea.ai/openapi.json
      checked: 2026-09-15
      confidence: documented
      note: "Text-to-image tier. The rate card bills $0.065 with image style references and $0.07 with a moodboard; those inputs are not exposed on this row, so every call settles at the text-to-image price."
    docs_url: https://www.krea.ai/docs/api-reference/krea/krea-2-large

  - id: krea.image-gen.flux-1-dev
    capability: image-gen.flux-dev.from_text
    platform: image-gen
    domain: models
    scope: any_account
    method: POST
    path: /generate/image/bfl/flux-1-dev
    name: "Black Forest Labs: FLUX.1 [dev]"
    summary: "Fast, cheap text-to-image. The cheapest image route on Krea."
    input:
      body:
        prompt: {type: string, required: true, example: "A small red kite above a calm beach.", note: "Up to 1,800 characters."}
        width: {type: number, required: false, default: 1024, min: 512, max: 2368, example: 1024}
        height: {type: number, required: false, default: 1024, min: 512, max: 2368, example: 1024}
        steps: {type: integer, required: false, default: 25, min: 1, max: 100, example: 25}
        guidance_scale: {type: number, required: false, default: 3, min: 0, max: 24, example: 3}
        seed: {type: number, required: false, example: 42}
      bodyType: json
    test_request:
      body: {prompt: "A small red kite above a calm beach.", width: 1024, height: 1024, steps: 25}
    cost:
      type: per_success
      value: 0.007
      currency: USD
      source: rate_card_api
      source_url: https://api.krea.ai/openapi.json
      checked: 2026-09-15
      confidence: documented
      note: "The rate card lists a flat $0.007 per completed request. OBSERVED 2026-09-15: the meter billed $0.003169 for the default 1024x1024, 25-step request (4.225 s of GPU time), below the card. This route meters GPU time on the account we tested; $0.007 is the card price and the safe reserve, and the observed charge is the floor for the default request. Image-to-image (image_url) and LoRA styles are not exposed on this row."
    docs_url: https://www.krea.ai/docs/api-reference/image/flux

  - id: krea.image-gen.flux-kontext-dev
    capability: image-gen.flux-kontext-dev.edit
    platform: image-gen
    domain: models
    scope: any_account
    method: POST
    path: /generate/image/bfl/flux-1-kontext-dev
    name: "Black Forest Labs: FLUX.1 Kontext [dev] (image editing)"
    summary: "Edit an existing image with a natural-language instruction while keeping the rest of the frame."
    input:
      body:
        prompt: {type: string, required: true, example: "Make it a snowy winter scene."}
        image_url: {type: string, required: true, example: "https://gen.krea.ai/images/0424f602-2999-4d0c-a46e-39cbf0ef384b.png", note: "The image to edit: a public URL, a base64 data URI, or a Krea asset URL."}
