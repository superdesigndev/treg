        guidance_scale: {type: number, required: false, default: 3, min: 0, max: 24, example: 3}
        strength: {type: number, required: false, default: 1, min: 0, max: 1, example: 1, note: "Denoising strength. 0 keeps the input image, 1 fully replaces it."}
        seed: {type: number, required: false, example: 42}
      bodyType: json
    test_request:
      body: {prompt: "Make it a snowy winter scene.", image_url: "https://gen.krea.ai/images/0424f602-2999-4d0c-a46e-39cbf0ef384b.png", width: 1024, height: 1024}
