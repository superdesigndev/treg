        - {when: {body.resolution: 1080p}, value: 0.4299, times: body.duration}
      fallback: {value: 12.897, note: "A 30-second 1080p clip is the most expensive combination on this row."}
      currency: USD
      settle: table
      source: rate_card_api
      source_url: https://api.krea.ai/openapi.json
