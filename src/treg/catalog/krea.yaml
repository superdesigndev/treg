      note: "Per-second rates without a video reference ($0.1078/s at 480p, $0.2427/s at 720p, $0.4299/s at 1080p). The rate card bills a lower per-second rate when reference_videos are passed ($0.0645, $0.1452, $0.2572); that input is not exposed on this row."
    docs_url: https://www.krea.ai/docs/api-reference/video/seedance-25*

