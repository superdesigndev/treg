    input:
      body:
        prompt: {type: string, required: true, example: "A clean editorial illustration of a paper airplane.", note: "At least 3 characters."}
        aspect_ratio: {type: string, required: false, enum: ["21:9", "1:1", "4:3", "3:2", "2:3", "5:4", "4:5", "3:4", "16:9", "9:16"], example: "1:1"}
        resolution: {type: string, required: false, default: 1K, enum: [1K, 2K, 4K], example: 1K, note: "4K doubles the price."}
        image_urls: {type: array, required: false, note: "Reference or source images to edit: public URLs, base64 data URIs, or Krea asset URLs. Up to 14. They do not change the price."}
      bodyType: json
    test_request:
      body: {prompt: "A clean editorial illustration of a paper airplane.", aspect_ratio: "1:1", resolution: 1K}
    cost:
      type: per_success
      table:
        - {when: {body.resolution: 1K}, value: 0.15}
        - {when: {body.resolution: 2K}, value: 0.15}
        - {when: {body.resolution: 4K}, value: 0.30}
      fallback: {value: 0.30, note: "4K is the highest listed resolution."}
      currency: USD
      settle: table
      source: rate_card_api
      source_url: https://api.krea.ai/openapi.json
      checked: 2026-09-15
      confidence: documented
    docs_url: https://www.krea.ai/docs/api-reference/image/nano-banana-pro

