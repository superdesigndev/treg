# LimaData Basic v2. Batch submission and result operations are omitted from the catalog.
# Shared platform access is limited to synchronous operations whose full cost the generic money
# model can bound before the call. BYOK always wins and is never metered by treg.
provider: limadata
source:
  docs: https://api.limadata.com/docs/basic_v2
  openapi: https://api.limadata.com/openapi/basic-v2.json
  curated: '2026-09-17'
pricing_url: https://limadata.com/
limits: 'The default account limit is 1 request/second. The docs explicitly exempt several lookup, enrichment, research and search operations but publish no higher numeric ceiling.'
proposed_capabilities:
  people.database.autocomplete: List accepted values for a LimaData database filter
  people.employees.search: Search employees at named companies
  people.audience.resolve: Resolve a person to advertising audience identifiers
  people.audience.email_hash: Resolve a person to hashed email identifiers
  linkedin.company.from_domain: Find a company's LinkedIn page from its domain
  people.identity.from_email: Resolve an email address to social profiles
  web.research: Search and synthesize web research for a question
endpoints:
  - id: limadata.people.enrich
    capability: people.enrich
    platform: people
    scope: any_account
    domain: contacts
    method: POST
    path: /api/v1/enrich/person
    name: Enrich a person
    summary: Enrich a professional profile from an email, LinkedIn URL, or name and company.
    input:
      bodyType: json
      body:
        email: {type: string, required: false, example: person@example.com}
        linkedin_url: {type: string, required: false, example: 'https://www.linkedin.com/in/example'}
        name: {type: string, required: false, example: Example Person}
        company_name: {type: string, required: false, example: Example Inc}
        company_domain: {type: string, required: false, example: example.com}
        include_work_email: {type: boolean, required: false, default: false}
        include_phone: {type: boolean, required: false, default: false}
      note: Provide an email, a LinkedIn URL, or a name plus company. Optional email and phone fields add credits only when found.
    test_request: {body: {linkedin_url: 'https://www.linkedin.com/in/example'}}
    cost:
      type: per_success
      value: 15
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://api.limadata.com/docs/basic_v2
      checked: '2026-09-17'
      confidence: verified
      note: BYOK only. Base lookup costs 1 credit for LinkedIn/work email, 2 for name plus company, or 5 for personal email; work email adds 1 and phone adds 10 when found. Fifteen is the documented maximum.
    platform_blocked: Variable input and optional-result charges cannot be settled safely from the generic response contract; connect your own LimaData key.
    docs_url: https://api.limadata.com/docs/basic_v2
    verified: '2026-09-17'
    added: '2026-09-17'
    example_response: examples/limadata.people.enrich.json

  - id: limadata.companies.enrich
    capability: companies.enrich
    platform: companies
    scope: any_account
    domain: companies
    method: POST
    path: /api/v1/enrich/company
    name: Enrich a company
    summary: Enrich a company from its domain or LinkedIn URL.
    input:
      bodyType: json
      body:
        domain: {type: string, required: false, example: example.com}
        linkedin_url: {type: string, required: false, example: 'https://www.linkedin.com/company/example'}
      note: Provide at least one identifier.
    test_request: {body: {domain: example.com}}
    cost: &one_credit_success
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://api.limadata.com/docs/basic_v2
      checked: '2026-09-17'
      confidence: verified
      note: One credit on a successful response; HTTP errors are not charged.
    docs_url: https://api.limadata.com/docs/basic_v2
    verified: '2026-09-17'
    added: '2026-09-17'
    example_response: examples/limadata.companies.enrich.json

  - id: limadata.database.autocomplete
    capability: people.database.autocomplete
    platform: people
    scope: any_account
    domain: contacts
    kind: utility
    method: POST
    path: /api/v1/database/autocomplete
    name: List database filter values
    summary: List accepted enum values for a LimaData database filter.
    input:
      bodyType: json
      body:
        filter_type: {type: string, required: true, example: revenue_range}
        query: {type: string, required: false, example: '1'}
    test_request: {body: {filter_type: revenue_range, query: '1'}}
    cost:
      <<: *one_credit_success
      source: observed
      note: The docs omit a price. A successful live request consumed one credit.
    docs_url: https://api.limadata.com/docs/basic_v2
    verified: '2026-09-17'
    added: '2026-09-17'
    example_response: examples/limadata.database.autocomplete.json

  - id: limadata.companies.count
    capability: companies.search.count
    platform: companies
    scope: any_account
    domain: companies
    method: POST
    path: /api/v1/database/count_companies
    name: Count companies
    summary: Count companies that match a prompt, structured filters, or a filter expression.
    input: &count_input
      bodyType: json
      body:
        ai_prompt: {type: string, required: false, example: Software companies in Canada}
        filter_expression: {type: string, required: false, example: headquarters_country_name=Canada}
        filters: {type: array, required: false, items: {type: object}}
    test_request: {body: {filter_expression: company_name=treg-nonexistent-company}}
    cost: &tenth_credit_success
      type: per_success
      value: 0.1
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://api.limadata.com/docs/basic_v2
      checked: '2026-09-17'
      confidence: verified
      note: 0.1 credit for a successful request; HTTP errors are not charged.
    docs_url: https://api.limadata.com/docs/basic_v2
    verified: '2026-09-17'
    added: '2026-09-17'
    example_response: examples/limadata.companies.count.json

