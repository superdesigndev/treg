    platform: companies
    scope: any_account
    domain: companies
    method: POST
    path: /api/v1/database/search_companies
    name: Search companies
    summary: Search the company database with a prompt, structured filters, or a filter expression.
    input: &search_input
      bodyType: json
      body:
        ai_prompt: {type: string, required: false, example: Software companies in Canada}
        filter_expression: {type: string, required: false, example: headquarters_country_name=Canada}
        filters: {type: array, required: false, items: {type: object}}
        limit: {type: integer, required: false, min: 1, max: 10000, default: 10}
        offset: {type: integer, required: false, min: 0, max: 10000, default: 0}
    test_request: {body: {filter_expression: company_name=treg-nonexistent-company, limit: 1}}
    cost: &database_search_cost
      type: per_result
      value: 0.1
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://api.limadata.com/docs/basic_v2
      checked: '2026-09-17'
      confidence: verified
      note: 0.1 credit per returned record, billed in whole-credit blocks of ten, with a one-credit minimum per request.
    platform_blocked: Variable result charges and the minimum whole-credit rule cannot be settled safely from the generic response contract; connect your own LimaData key.
    docs_url: https://api.limadata.com/docs/basic_v2
    verified: '2026-09-17'
    added: '2026-09-17'
    example_response: examples/limadata.companies.search.json

