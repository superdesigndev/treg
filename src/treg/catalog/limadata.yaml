    cost: *tenth_credit_success
    platform_blocked: LimaData's shared account does not have People Database API access; connect your own LimaData key on a plan that includes People Database access.
    docs_url: https://api.limadata.com/docs/basic_v2
    verified: '2026-09-17'
    added: '2026-09-17'
    example_response: examples/limadata.people.count.json

  - id: limadata.companies.search
