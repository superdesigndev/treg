- id: litescrape.x.duckduckgo-maps
  tier: extended
  platform: duckduckgo
  method: GET
  path: /api/duckduckgo/maps
  name: DuckDuckGo Maps search
  summary: Search DuckDuckGo's local application inside a geographic viewport.
  input:
    queryParams:
      q:
        type: string
        required: true
        note: query, 1-500 characters
        example: coffee
      bbox:
        type: string
        required: false
        note: top,left,bottom,right rectangle; conflicts with lat/lon
      lat:
        type: number
        required: false
        note: latitude; requires lon
        example: 30.2672
      lon:
        type: number
        required: false
        note: longitude; requires lat
        example: -97.7431
      strict_bbox:
        type: boolean
        required: false
        note: exclude results outside the viewport; default true
    note: Supply either bbox or lat/lon. Results arrive in local_results.
