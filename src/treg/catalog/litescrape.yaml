- id: litescrape.google.serp.maps
  capability: google.serp.maps
  platform: google
  domain: search
  scope: any_account
  method: GET
  path: /api/google/maps
  name: Search Google Maps
  summary: Search Google Maps with q and type=search to get up to 20 places in local_results, or look up one exact
    place by place_id, data_cid or data to get place_results
  input:
    queryParams:
      q:
        type: string
        required: false
        example: coffee shops in Austin, TX
        note: Search query, such as coffee shops in Austin, TX. Required when type=search. A search needs one of
          q, place_id, data_cid or data.
      type:
        type: string
        required: false
        enum:
        - search
        - place
        example: search
        note: search returns a list of places in local_results; place returns one exact place in place_results.
          Required when searching by q or by filter data, and type=place is required with an exact-place data sequence.
          Can be omitted with place_id or data_cid.
      place_id:
        type: string
        required: false
        example: ChIJT2h1HKZZwokR0kgzEtsa03k
        note: Google Place ID for an exact-place lookup. Mutually exclusive with data_cid and an exact-place data
          sequence.
      data_cid:
        type: string
        required: false
        note: Decimal Google CID for an exact-place lookup. Mutually exclusive with place_id and an exact-place
          data sequence.
      data:
        type: string
        required: false
        note: Google Maps protobuf sequence copied from a Maps URL, beginning with ! and at most 8,192 characters.
          A sequence that identifies one place requires type=place and is mutually exclusive with place_id and data_cid.
      ll:
        type: string
        required: false
        example: '@30.2672,-97.7431,14z'
        note: Map viewport as @latitude,longitude,zoomz or @latitude,longitude,radiusm, for example @30.2672,-97.7431,14z.
          Already includes its scale, so do not add z or m. Mutually exclusive with location and lat/lon.
      location:
        type: string
        required: false
        example: Austin, Texas, United States
        note: Human-readable location to center the map on, such as Austin, Texas. Requires z or m. Mutually exclusive
          with ll and lat/lon.
      lat:
        type: number
        required: false
        min: -90
        max: 90
        note: Latitude of the map center. Supply with lon and either z or m. Mutually exclusive with ll and location.
      lon:
        type: number
        required: false
        min: -180
        max: 180
        note: Longitude of the map center. Supply with lat and either z or m. Mutually exclusive with ll and location.
      z:
        type: number
        required: false
        min: 3
        max: 30
        note: Zoom level from 3 through 30. Use with location or lat/lon. Mutually exclusive with m.
      m:
        type: number
        required: false
        min: 1
        max: 15028132
        note: Map radius in meters, from 1 through 15,028,132. Use with location or lat/lon. Mutually exclusive
          with z.
      nearby:
        type: boolean
        required: false
        default: false
        note: Set to true to remove near me wording from the query so the supplied viewport is used. Requires ll,
          location or lat/lon.
      hl:
        type: string
        required: false
        default: en
        example: en
        note: Language code such as en, en-GB, or de.
      gl:
        type: string
        required: false
        minLength: 2
        maxLength: 2
        default: us
        example: us
        note: Two-letter country code used to localize results. Defaults to us.
      google_domain:
        type: string
        required: false
        default: google.com
        example: google.com
        note: Google domain used for the request.
      start:
        type: integer
        required: false
        min: 0
        default: 0
        note: 'Result offset in steps of 20: 0, 20, 40 and so on. Prefer following pagination.next from the previous
          response.'
      min_price:
        type: integer
        required: false
        min: 0
        note: Minimum Google price level, a non-negative integer. Must not exceed max_price.
      max_price:
        type: integer
        required: false
        min: 0
        note: Maximum Google price level, a non-negative integer. Must be at least min_price.
      min_rating:
        type: number
        required: false
        note: Minimum star rating. Google treats it as a relevance preference, so lower-rated or unrated places
          may still appear.
      open_state:
        type: string
        required: false
        enum:
        - now
        - 24h
        note: now returns places open now; 24h returns places open 24 hours. Cannot be combined with open_on_day
          or open_at_hour.
      open_on_day:
        type: string
        required: false
        enum:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
        note: Return places open on this weekday, optionally at open_at_hour. Cannot be combined with open_state.
      open_at_hour:
        type: integer
        required: false
        min: 0
        max: 23
        note: Hour from 0 through 23 at which the place must be open. Requires open_on_day. Cannot be combined with
          open_state.
      timeout:
        type: number
        required: false
        max: 90.0
        note: Optional budget for the entire request in seconds, measured from gateway receipt until the response
          is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90.
          On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a
          request ID. Omit to retain the standard server deadline.
