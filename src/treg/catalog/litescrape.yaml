provider: litescrape
source:
  docs: https://litescrape.com/docs
  openapi: https://api.litescrape.com/api/openapi.json
  curated: '2026-09-03'
limits: "No public numeric request-per-second limit is published. Rate-limit responses use HTTP 429 and the standard retryable error envelope."
pricing_url: https://litescrape.com/#pricing

# Litescrape charges a flat $0.15 per 1,000 successful scraper calls. Every endpoint below costs
# $0.00015; invalid, unsupported, scraper, upstream and internal failures are refunded. The
# authenticated GET /api/keys/status route is both the balance meter (`remaining_calls`) and the
# machine-readable rate card (`cents_per_1000_calls`).
# Vendor self-verification on 2026-09-03 called all 22 selected core + extended routes with real
# public targets: every successful response moved `remaining_calls` by exactly one; transient
# `503 proxy_capacity_unavailable` attempts moved it by zero. Independent treg verification is
# still required, so endpoint-level `verified:` stamps and response examples are intentionally absent.
# Vendor PR policy: these rows deliberately carry no `verified:` stamp and no captured examples.
# The PR ledger records the vendor's self-verification; treg maintainers add those artifacts after
# independent live verification.

proposed_capabilities:
  google.maps.posts: "List updates and events published by a Google Maps place"
  google.maps.popular_times: "Get current and usual foot-traffic levels for a Google Maps place"
  google.maps.photo_meta: "Get contributor, place and capture metadata for a Google Maps photo"
  google.business.reviews: "List public Google reviews for a place"
  google.contributor.reviews: "List the public review history for a Google Maps contributor"
  google.shopping.search: "Search Google's Shopping product grid"
  google.serp.ai_overview: "Get the AI Overview module for a Google query"
  google.shopping.product: "Get offers, specifications and reviews for a Google Shopping product"

endpoints:
  - id: litescrape.google.serp.organic
    domain: search
    capability: google.serp.organic
    platform: google
    scope: any_account
    method: GET
    path: /api/google/search
    name: "Google organic search"
    summary: "Search Google and return structured organic results plus source-selected SERP modules."
    input:
      queryParams:
        q: {type: string, required: false, note: "query text, 1-2,048 characters; one of q, ludocid or kgmid is required", example: "Litescrape API"}
        ludocid: {type: string, required: false, note: "decimal Google entity ID; conflicts with q and kgmid"}
        kgmid: {type: string, required: false, note: "Google Knowledge Graph ID; conflicts with q and ludocid"}
        location: {type: string, required: false, note: "named origin; conflicts with uule and lat/lon"}
        uule: {type: string, required: false, note: "pre-encoded Google location; conflicts with other geography modes"}
        lat: {type: number, required: false, note: "latitude; requires lon"}
        lon: {type: number, required: false, note: "longitude; requires lat"}
        radius: {type: number, required: false, note: "metres around location or coordinates"}
        google_domain: {type: string, required: false, note: "validated Google domain; default google.com"}
        gl: {type: string, required: false, note: "two-letter country code", example: "us"}
        hl: {type: string, required: false, note: "language code", example: "en"}
        cr: {type: string, required: false, note: "country restriction such as countryUS"}
        lr: {type: string, required: false, note: "language restriction such as lang_en"}
        tbs: {type: string, required: false, note: "native Google search-filter string"}
        safe: {type: string, required: false, note: "active or off"}
        tbm: {type: string, required: false, note: "lcl, vid, nws, shop or pts; images are unsupported"}
        start: {type: integer, required: false, note: "non-negative result offset", example: 0}
        num: {type: integer, required: false, note: "best-effort first-page row hint, 1-100", example: 10}
        device: {type: string, required: false, note: "desktop, tablet or mobile", example: "desktop"}
      note: "Always returns search_metadata and search_parameters. Optional groups include organic_results, ads, knowledge_graph, answer_box, related questions/searches, local modules, stories, media and pagination when Google supplies them."
    test_request:
      queryParams: {q: "Litescrape API", hl: "en", gl: "us", device: "desktop", num: 10}
    cost:
      type: per_success
      value: 0.15
      currency: USD
      per: 1000
      unit: call
      source: observed
      source_url: https://api.litescrape.com/api/keys/status
      checked: '2026-09-03'
      confidence: verified
      note: "One successful response consumes one call at the published 15 cents per 1,000 calls; failed responses are refunded."
    docs_url: https://litescrape.com/docs#google-search-api

  - id: litescrape.google.serp.maps
    domain: search
    capability: google.serp.maps
    platform: google
    scope: any_account
    method: GET
    path: /api/google/maps
    name: "Google Maps search or place details"
    summary: "Search Google Maps by query and viewport or resolve an exact place identifier."
    input:
      queryParams:
        q: {type: string, required: false, note: "required for type=search", example: "coffee shops in Austin, TX"}
        type: {type: string, required: false, note: "search or place; inferred as place when an exact-place identifier is supplied", example: "search"}
        ll: {type: string, required: false, note: "viewport as @lat,lon,14z or @lat,lon,5000m", example: "@30.2672,-97.7431,14z"}
        location: {type: string, required: false, note: "named origin; conflicts with ll and lat/lon; requires z or m"}
        lat: {type: string, required: false, note: "latitude; requires lon and z or m"}
        lon: {type: string, required: false, note: "longitude; requires lat and z or m"}
        z: {type: string, required: false, note: "zoom from 3 through 30"}
        m: {type: string, required: false, note: "radius from 1 through 15,028,132 metres"}
        nearby: {type: boolean, required: false, note: "requires a viewport or location"}
        place_id: {type: string, required: false, note: "mutually exclusive exact-place identifier"}
        data_cid: {type: string, required: false, note: "decimal Google CID for an exact place"}
        data: {type: string, required: false, note: "opaque Google Maps data token for an exact place"}
        start: {type: integer, required: false, note: "non-negative Maps offset", example: 0}
        hl: {type: string, required: false, example: "en"}
        gl: {type: string, required: false, example: "us"}
        google_domain: {type: string, required: false, note: "validated Google domain"}
      note: "Search responses expose local_results and pagination; exact-place responses expose place_results with source-supplied hours, reviews, photos, services and related-place modules."
    test_request:
      queryParams: {q: "coffee shops in Austin, TX", type: "search", ll: "@30.2672,-97.7431,14z", hl: "en", gl: "us"}
    cost:
      type: per_success
      value: 0.15
      currency: USD
      per: 1000
      unit: call
      source: observed
      source_url: https://api.litescrape.com/api/keys/status
      checked: '2026-09-03'
      confidence: verified
      note: "One successful response consumes one call at the published 15 cents per 1,000 calls; failed responses are refunded."
    docs_url: https://litescrape.com/docs#google-maps-api

