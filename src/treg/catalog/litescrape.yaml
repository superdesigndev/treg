- id: litescrape.google.serp.ai_mode
  capability: google.serp.ai_mode
  platform: google
  domain: search
  scope: any_account
  method: GET
  path: /api/google/ai-mode
  name: Get Google AI Mode answer
  summary: Returns the answer Google AI Mode generates for a question, as ordered text blocks, with the sources
    it cited
  input:
    queryParams:
      q:
        type: string
        required: true
        maxLength: 2048
        example: what is the best espresso machine for a small kitchen
        note: Question to ask, up to 2,048 characters. Required on every turn, including follow-ups.
      continuable:
        type: boolean
        required: false
        default: false
        note: Return a subsequent_request_token so this answer can be followed up, when Google offers a continuation.
      subsequent_request_token:
        type: string
        required: false
        maxLength: 128
        note: Token from a previous continuable response. Send it with a new q to continue that conversation; reuse
          the same gl, hl and location. Expires after 30 minutes. Cannot be combined with image_url.
      image_url:
        type: string
        required: false
        maxLength: 2048
        note: Public http or https URL of an image to include in the question, up to 2,048 characters. The image
          may be at most 20 MB. Cannot be combined with subsequent_request_token.
      location:
        type: string
        required: false
        maxLength: 63
        example: Austin, Texas
        note: Human-readable search location, such as Austin, Texas. At most 63 UTF-8 bytes. Mutually exclusive
          with uule.
      uule:
        type: string
        required: false
        maxLength: 2048
        note: Pre-encoded Google location token. Mutually exclusive with location.
      google_domain:
        type: string
        required: false
        default: google.com
        example: google.com
        note: Google domain used for the request.
      gl:
        type: string
        required: false
        minLength: 2
        maxLength: 2
        example: us
        note: Two-letter country code used to localize results.
      hl:
        type: string
        required: false
        default: en
        example: en
        note: Language code such as en, en-GB, or de.
      device:
        type: string
        required: false
        default: desktop
        enum:
        - desktop
        - tablet
        - mobile
        note: Google device layout. Each device is served Google's real layout for it.
      timeout:
        type: number
        required: false
        max: 90.0
        note: Optional budget for the entire request in seconds, measured from gateway receipt until the response
          is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90.
          On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a
          request ID. Omit to retain the standard server deadline.
  test_request:
    queryParams:
      q: what is photosynthesis
      hl: en
      gl: us
  cost:
    type: per_success
    value: 0.00015
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://litescrape.com/pricing
    checked: '2026-09-29'
    confidence: verified
    note: One successful API response consumes one prepaid call; failures are free.
  docs_url: https://litescrape.com/docs/reference
  strict_query: true
  verified: '2026-09-29'
  added: '2026-09-29'
  example_response: examples/litescrape.google.serp.ai_mode.json
