        note: Set 1 to disable Google spelling auto-correction, or 0 to allow it.
      device:
        type: string
        required: false
        default: desktop
        enum:
        - desktop
        - tablet
        - mobile
        example: desktop
        note: 'Google returns its real layout for the selected device: desktop, tablet, or mobile.'
      timeout:
        type: number
        required: false
        max: 90.0
        note: Optional budget for the entire request in seconds, measured from gateway receipt until the response
