- id: litescrape.web.fetch
  capability: web.extract
  platform: web
  domain: extract
  scope: any_account
  method: GET
  path: /api/web/fetch
  name: Fetch rendered web content
  summary: Fetch a public HTTP(S) page and return LLM-ready content
  input:
    queryParams:
      assert_status_code:
        type: integer
        required: false
        min: 100
        max: 599
        example: 200
        note: Expected origin HTTP status, 100-599. A different status is rejected; otherwise a rendered error page
          is a successful capture.
      base:
        type: string
        required: false
        enum:
        - initial
        - final
        note: Resolve relative links against the requested URL (initial, default) or the final URL after redirects
          (final).
      detach_invisibles:
        type: boolean
        required: false
        note: Drop display:none elements from the page.
      engine:
        type: string
        required: false
        enum:
        - auto
        - browser
        - curl
        note: auto (default; lightweight HTTP first, a browser when needed), browser, or curl (no JavaScript).
      keep_img_data_url:
        type: boolean
        required: false
        note: 'Keep inline data: images in Markdown.'
      locale:
        type: string
        required: false
        minLength: 2
        maxLength: 64
        example: en-US
        note: Browser locale as a language tag, 2-64 characters. Defaults to the browser's own.
      markdown_chunking:
        type: string
        required: false
        enum:
        - 'true'
        - h1
        - h2
        - h3
        - h4
        - h5
        - structured
        - s1
        - s2
        - s3
        - s4
        - s5
        note: 'true, h1-h5, structured or s1-s5: split the Markdown and return chunks.'
      max_tokens:
        type: integer
        required: false
        min: 500
        max: 10000000
        note: Integer 500-10,000,000. Trim content to this many tokens.
      no_gfm:
        type: string
        required: false
        note: 'true, false or table: disable GitHub-flavored Markdown, or only its tables.'
      page_timeout:
        type: integer
        required: false
        min: 1
        max: 180
        example: 30
        note: Seconds from 1 through 180 for page loading and browser operations. Cannot extend the total request
          budget set by timeout.
      preset:
        type: string
        required: false
        enum:
        - reader
        - index
        - research
        - agent
        - spider
        note: Option preset. Fills only the options the request leaves unset.
      referer:
        type: string
        required: false
        minLength: 1
        maxLength: 8192
        example: https://example.com
        note: HTTP(S) URL sent as the Referer.
      remove_overlay:
        type: boolean
        required: false
        note: Remove modal and cookie-banner overlays from the page.
      remove_selector:
        type: string
        required: false
        minLength: 1
        maxLength: 2048
        example: nav, footer
        note: CSS selector removed before extraction, 1-2,048 characters; POST also accepts a list of 1-16 selectors.
      respond_timing:
        type: string
        required: false
        enum:
        - html
        - visible-content
        - mutation-idle
        - resource-idle
        - media-idle
        - network-idle
        example: network-idle
        note: Page readiness condition to reach before responding.
      respond_with:
        type: string
        required: false
        minLength: 3
        maxLength: 64
        example: markdown
        note: 'Output format: content (default; main content as Markdown, or the whole page when extraction keeps
          too little), markdown (whole page as Markdown), html, text, frontmatter (content plus front matter), or
          a ''+'' combination such as markdown+frontmatter. For screenshots use /api/web/screenshot.'
      retain_images:
        type: string
        required: false
        enum:
        - none
        - all
        - alt
        example: alt
        note: 'Images to keep: all (default), alt (alt text only) or none.'
      retain_links:
        type: string
        required: false
        enum:
        - none
        - all
        - text
        - gpt-oss
        note: 'Links to keep: all (default), text (link text only), none, or gpt-oss (citation format with a links
          summary).'
      retain_media:
        type: string
        required: false
        enum:
        - none
        - text
        - link
        - image
        - html
        note: 'How video, audio and embedded video appear: none, text, link (default), image or html.'
      robots_txt:
        type: string
        required: false
        minLength: 1
        maxLength: 256
        example: MyBot
