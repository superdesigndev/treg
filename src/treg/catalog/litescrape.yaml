provider: litescrape
source:
  docs: https://litescrape.com/docs/reference
  openapi: https://api.litescrape.com/api/openapi.json
  curated: '2026-09-29'
pricing_url: https://litescrape.com/pricing
limits: The key status API reports a configured concurrency limit (25 on the tested key). No hourly, daily, monthly
  or per-second cap is published. Failed calls are unbilled.
proposed_capabilities:
  google.serp.ads: Find sponsored ads on a Google results page
  google.shopping.product: Get merchant offers and details for a Google Shopping product
  google.maps.contributor_reviews: List the reviews written by a Google Maps contributor
  google.maps.popular_times: Check how busy a Google Maps place is now
  google.maps.posts: Read public posts from a Google Maps business
  google.maps.photo_metadata: Get place and contributor details for a Google Maps photo
  bing.maps.search: Search Bing Maps businesses or resolve one listing
  duckduckgo.maps.search: Search DuckDuckGo Maps places in a viewport
  apple-maps.places: Get public Apple Maps place details by MUID
  apple-maps.reviews: Read Apple Maps place ratings and reviews
  tripadvisor.place.detail: Get one Tripadvisor place's details
  google-play.search.games: Search or browse Google Play games
  google-play.search.books: Search or browse Google Play books
  google-play.search.movies: Search or browse Google Play movies
  google-play.product: Get details of a Google Play product
  google-play.reviews: List reviews for a Google Play product
  app-store.product: Get details of an App Store product
  app-store.reviews: List reviews for an App Store product
  web.extract.advanced: Fetch rendered web content with browser controls
  web.screenshot.advanced: Capture a web screenshot with browser controls
  web.screenshot.download: Download a screenshot captured under the connected key
endpoints:
- id: litescrape.google.serp.news
  capability: google.serp.news
  platform: google
  domain: search
  scope: any_account
  method: GET
  path: /api/google/search
  name: Search Google News
  summary: Search Google News articles using Litescrape's news vertical.
  input:
    queryParams:
      q: {type: string, required: true, maxLength: 2048}
      tbm: {type: string, required: true, enum: [nws]}
      num: {type: integer, required: false, min: 1, max: 10}
      hl: {type: string, required: false}
  test_request: {queryParams: {q: "AI policy", tbm: nws, num: 10, hl: en}}
  cost: {type: per_success, value: 0.00015, currency: USD, per: 1, unit: call,
         source: docs, source_url: "https://litescrape.com/pricing", checked: '2026-10-05',
         confidence: verified, note: "The news vertical uses the same Google Search request and per-success price."}
  docs_url: https://litescrape.com/docs/google-search
  strict_query: true
  verified: '2026-10-05'
  added: '2026-10-05'
  example_response: examples/litescrape.google.serp.news.json
- id: litescrape.google.serp.organic
  capability: google.serp.organic
  platform: google
  domain: search
  scope: any_account
  method: GET
  path: /api/google/search
  name: Search Google
  summary: 'Returns a Google results page as JSON: organic results plus every other result group Google served,
    such as ads, AI Overview, knowledge graph, and local results'
  input:
    queryParams:
      fast_mode:
        type: boolean
        required: false
        default: false
        note: Set true to return only organic_results, search_metadata, and search_parameters, skipping AI Overview
          and all other result groups. Only lowercase true or false are accepted.
      q:
        type: string
        required: false
        maxLength: 2048
        example: coffee shops in Austin
        note: Search query, up to 2,048 characters. Required unless ludocid or kgmid is supplied.
      ludocid:
        type: string
        required: false
        maxLength: 128
        example: '1234567890123456789'
        note: Decimal Google CID for a local entity search. Can replace q.
      kgmid:
        type: string
        required: false
        maxLength: 512
        example: /m/0k8z
        note: Google Knowledge Graph machine ID, such as /m/0k8z. Can replace q.
      location:
        type: string
        required: false
        maxLength: 512
        example: Austin, Texas, United States
        note: Human-readable search location, up to 512 characters. Use only one of location, uule, or lat and lon.
      uule:
        type: string
        required: false
        maxLength: 2048
        note: Pre-encoded Google location token, up to 2,048 characters. Use only one of location, uule, or lat
          and lon.
      lat:
        type: number
        required: false
        min: -90
        max: 90
        example: 30.2672
        note: Latitude between -90 and 90. Supply with lon; conflicts with location and uule.
      lon:
        type: number
        required: false
        min: -180
        max: 180
        example: -97.7431
        note: Longitude between -180 and 180. Supply with lat; conflicts with location and uule.
      radius:
        type: number
        required: false
        min: 1
        max: 1000
        note: Search radius in meters around location or lat and lon, which it requires. 1 to 199 on desktop, 1
          to 1,000 on tablet or mobile.
      lsig:
        type: string
        required: false
        maxLength: 4096
        note: Opaque Google local or Knowledge Graph signature, up to 4,096 characters.
      si:
        type: string
        required: false
        maxLength: 4096
        note: Opaque cached Google search context, up to 4,096 characters.
      ibp:
        type: string
        required: false
        maxLength: 4096
        note: Google layout or expansion control, up to 4,096 characters.
      uds:
        type: string
        required: false
        maxLength: 4096
        note: Opaque Google filter token, up to 4,096 characters.
      color_scheme:
        type: string
        required: false
        enum:
        - light
        - dark
        note: Google's light or dark result presentation.
      google_domain:
        type: string
        required: false
        default: google.com
        example: google.com
        note: A Google domain from Google's supported list, such as google.com or google.co.uk.
      gl:
        type: string
        required: false
        example: us
        note: Lowercase two-letter country code used to localize results.
      hl:
        type: string
        required: false
        default: en
        example: en
        note: Google interface and result language, such as en, en-US, or de. Defaults to en.
      cr:
        type: string
        required: false
        example: countryUS
        note: 'Country restriction: one or more countryXX values joined with |, such as countryUS.'
      lr:
        type: string
        required: false
        example: lang_en
        note: 'Language restriction: one or more lang_xx values joined with |, such as lang_en.'
      device:
        type: string
        required: false
        default: desktop
        enum:
        - desktop
        - tablet
        - mobile
        example: desktop
        note: 'Google returns its real layout for the selected device: desktop, tablet, or mobile.'
      tbs:
        type: string
        required: false
        maxLength: 4096
        note: Google search-filter string, such as qdr:w, up to 4,096 characters.
      safe:
        type: string
        required: false
        enum:
        - active
        - 'off'
        note: 'Google adult-content filtering: active or off.'
      nfpr:
        type: string
        required: false
        enum:
        - '0'
        - '1'
        note: Set 1 to disable Google spelling auto-correction, or 0 to allow it.
      filter:
        type: string
        required: false
        enum:
        - '0'
        - '1'
        note: 'Google similar-results filtering: 0 or 1.'
      pws:
        type: string
        required: false
        enum:
        - '0'
        - '1'
        note: 'Google personalization flag: 0 or 1. 0 asks for non-personalized results.'
      peek_pws:
        type: string
        required: false
        enum:
        - '0'
        - '1'
        note: 'Google personalization companion flag: 0 or 1, forwarded to Google unchanged.'
      tbm:
        type: string
        required: false
        enum:
        - lcl
        - vid
        - nws
        - shop
        - pts
        note: 'Google vertical: lcl, vid, nws, shop, or pts. Google Images (isch) is rejected with 400 unsupported_search_vertical.'
      start:
        type: integer
        required: false
        min: 0
        default: 0
        example: 10
        note: Result offset for pagination. Defaults to 0.
      num:
        type: integer
        required: false
        min: 1
        max: 10
        note: 'Requested result count, 1 to 10. A best-effort hint: Google may return fewer rows, and results are
          never padded.'
      as_dt:
        type: string
        required: false
        enum:
        - i
        - e
        note: Include (i) or exclude (e) the as_sitesearch host. Requires as_sitesearch.
      as_epq:
        type: string
        required: false
        maxLength: 2048
        note: Exact phrase the results must contain, up to 2,048 characters.
      as_eq:
        type: string
        required: false
        maxLength: 2048
        note: Words the results must not contain, up to 2,048 characters.
      as_lq:
        type: string
        required: false
        maxLength: 4096
        note: Return pages that link to this complete HTTP(S) URL.
      as_nlo:
        type: integer
        required: false
        min: 0
        note: Lower bound of a number range. Supply with as_nhi.
      as_nhi:
        type: integer
        required: false
        min: 0
        note: Upper bound of a number range. Supply with as_nlo.
      as_oq:
        type: string
        required: false
        maxLength: 2048
        note: Additional terms of which any may match, up to 2,048 characters.
      as_q:
        type: string
        required: false
        maxLength: 2048
        note: Additional terms that must all match, up to 2,048 characters.
      as_qdr:
        type: string
        required: false
        example: m3
        note: 'Date range: d, w, m, or y with an optional positive count, such as m3 for the past three months.'
      as_rq:
        type: string
        required: false
        maxLength: 4096
        note: Return pages related to this complete HTTP(S) URL.
      as_sitesearch:
        type: string
        required: false
        maxLength: 253
        example: example.com
        note: Hostname to include or exclude, such as example.com. A hostname, not a URL.
      oq:
        type: string
        required: false
        maxLength: 2048
        note: Original query text from a Google URL, up to 2,048 characters; forwarded unchanged.
      gs_lp:
        type: string
        required: false
        maxLength: 4096
        note: Opaque Google autocomplete-session value from a Google URL, up to 4,096 characters; forwarded unchanged.
      sclient:
        type: string
        required: false
        maxLength: 64
        note: 'Google client label such as gws-wiz-serp: up to 64 letters, digits, dots, underscores, or hyphens.'
      timeout:
        type: number
        required: false
        max: 90.0
        note: Optional budget for the entire request in seconds, measured from gateway receipt until the response
          is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90.
          On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a
          request ID. Omit to retain the standard server deadline.
  test_request:
    queryParams:
      q: OpenAI API documentation
  cost:
    type: per_success
    value: 0.00015
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://litescrape.com/pricing
    checked: '2026-09-29'
    confidence: verified
    note: One successful API response consumes one prepaid call; failures are free.
  docs_url: https://litescrape.com/docs/reference
  strict_query: true
  verified: '2026-09-29'
  added: '2026-09-29'
  example_response: examples/litescrape.google.serp.organic.json
