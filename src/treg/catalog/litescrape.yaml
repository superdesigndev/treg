- id: litescrape.web.screenshot.post
  capability: web.screenshot.advanced
  platform: web
  domain: extract
  scope: any_account
  method: POST
  path: /api/web/screenshot
  name: "Screenshot with browser options"
  platform_blocked: The image download needs the same key and treg cannot assign the returned URL to one organization on a shared account. Connect your own Litescrape key.
  summary: Capture a public HTTP(S) page as a PNG
  input:
    queryParams:
      timeout:
        type: number
        required: false
        max: 90.0
        note: Optional budget for the entire request in seconds, measured from gateway receipt until the response
          is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90.
          On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a
          request ID. Omit to retain the standard server deadline.
    bodyType: json
    body:
      url:
        type: string
        required: true
        minLength: 1
        maxLength: 8192
        example: https://example.com
        note: Public HTTP(S) URL to capture, 1-8,192 characters. Include http:// or https://; bare domains are rejected.
          The host must be public, on port 80 or 443, without embedded credentials.
      remove_overlay:
        type: boolean
        required: false
        note: Remove modal and cookie-banner overlays from the page.
      detach_invisibles:
        type: boolean
        required: false
        note: Drop display:none elements from the page.
      wait_for_selector:
        type: string
        required: false
        example: main
        note: CSS selector to wait for after navigation, 1-2,048 characters. POST also accepts a list of 1-16 selectors.
      set_cookies:
        type: list
        required: false
        note: POST only. 1-100 cookies in Set-Cookie syntax (name=value; Path=/; Domain=...), one line each, up
          to 4,096 characters.
      user_agent:
        type: string
        required: false
        minLength: 1
        maxLength: 1024
        note: User-Agent for the page request, 1-1,024 characters without control characters. Defaults to the browser's
          own.
      inject_page_script:
        type: list
        required: false
        note: POST only. 1-8 scripts (source, or a URL to a script), up to 8,192 characters each, run in the main
          frame.
      inject_frame_script:
        type: list
        required: false
        note: POST only. 1-8 scripts (source, or a URL to a script), up to 8,192 characters each, run in every frame.
      page_timeout:
        type: integer
        required: false
        min: 1
        max: 180
        example: 30
        note: Seconds from 1 through 180 for page loading and browser operations. Cannot extend the total request
          budget set by timeout.
      locale:
        type: string
        required: false
        minLength: 2
        maxLength: 64
        example: en-US
        note: Browser locale as a language tag, 2-64 characters. Defaults to the browser's own.
      referer:
        type: string
        required: false
        minLength: 1
        maxLength: 8192
        example: https://example.com
        note: HTTP(S) URL sent as the Referer.
      assert_status_code:
        type: integer
        required: false
        min: 100
        max: 599
        example: 200
        note: Expected origin HTTP status, 100-599. A different status is rejected; otherwise a rendered error page
          is a successful capture.
      viewport:
        type: dict
        required: false
        note: 'POST only. Browser viewport; width and height are required. Default: 1280 x 1280.'
      robots_txt:
        type: string
        required: false
        minLength: 1
        maxLength: 256
        example: MyBot
        note: User agent, 1-256 characters, to check against the site's robots.txt; disallowed URLs are rejected.
      respond_timing:
        type: string
        required: false
        enum:
        - html
        - visible-content
        - mutation-idle
        - resource-idle
        - media-idle
        - network-idle
        example: network-idle
        note: Page readiness condition to reach before responding.
      full_page:
        type: boolean
        required: false
        default: false
        example: true
        note: Capture the full page when true. The default, false, captures the viewport.
    note: The returned screenshot_url needs the same bearer key for PNG download. That download is free and the
      URL expires after seven days.
  test_request:
    queryParams:
      timeout: 60
    body:
      url: https://example.com
      full_page: true
      viewport:
        width: 1280
        height: 800
  cost:
    type: per_success
    value: 0.00015
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://litescrape.com/pricing
    checked: '2026-09-29'
    confidence: verified
    note: One successful API response consumes one prepaid call; failures are free.
  docs_url: https://litescrape.com/docs/reference
  body_allowlist: true
  verified: '2026-09-29'
  added: '2026-09-29'
  example_response: examples/litescrape.web.screenshot.post.json
