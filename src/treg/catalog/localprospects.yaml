      note: "status is ready | running | paused | needs_attention | completed | stopped, with pause_reason, completed/failed location counts, lead_count, credits_used, child search job_ids and recent activity. CHAINED ID: the test_request campaign_id is a real completed campaign (coffee shop, Fredericksburg TX, 2026-11-02) on the treg reviewer account, so it replays with that key"
    test_request:
      pathParams: {campaign_id: "db6cbe66-4d11-47d9-b372-cfab1fc86644"}
    cost: {type: free, value: 0, currency: USD, unit: call, source: observed, source_url: 'https://localprospects.ai/docs#campaigns', checked: '2026-11-02', confidence: verified, note: "OBSERVED free 2026-11-02 (balance 1300 -> 1281 across the whole run reconciles to the three paid calls alone, 2 + 16 + 1). free"}
    docs_url: https://localprospects.ai/docs#campaigns

  - id: localprospects.google.serp.maps.campaign.leads
    added: '2026-11-02'
    capability: google.serp.maps.campaign.leads
    platform: google
    scope: any_account
    method: GET
    path: /api/v1/campaigns/{campaign_id}/leads
    name: "List a Google Maps lead campaign's enriched businesses"
    summary: "Paginated, cross-search deduplicated campaign leads"
    resource_ownership:
      requires: {kind: campaign, param: campaign_id}
    input:
      pathParams:
        campaign_id: {type: string, required: true, note: "campaign.id from localprospects.google.serp.maps.campaign.create", example: "5b0c8f7e-2d1a-4c3b-9e8f-1a2b3c4d5e6f"}
