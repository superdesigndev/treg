    test_request:
      pathParams: {campaign_id: "db6cbe66-4d11-47d9-b372-cfab1fc86644"}
      queryParams: {page: 1, page_size: 5}
    cost: {type: free, value: 0, currency: USD, unit: call, source: observed, source_url: 'https://localprospects.ai/docs#campaigns', checked: '2026-11-02', confidence: verified, note: "OBSERVED free 2026-11-02 (balance 1300 -> 1281 across the whole run reconciles to the three paid calls alone, 2 + 16 + 1). free: leads were paid for as the campaign found them"}
    docs_url: https://localprospects.ai/docs#campaigns
