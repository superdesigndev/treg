provider: lusha
source:
  method: official docs (client-rendered reference; read via markdown-rendered doc pages and search,
    since the interactive OpenAPI viewer does not serve a fetchable spec document)
  ingested: 2026-07-28
  spec_urls:
    - https://docs.lusha.com/apis/openapi.md
    - https://docs.lusha.com/tutorials/v3-migration-guide
    - https://docs.lusha.com/apis/openapi/lookalikes.md
    - https://docs.lusha.com/apis/openapi/signals.md
    - https://docs.lusha.com/apis/openapi/webhooks.md
    - https://docs.lusha.com/apis/openapi/decision-makers.md
    - https://docs.lusha.com/apis/openapi/buying-group.md
    - https://docs.lusha.com/_bundle/apis/@v3/openapi.yaml
    - https://docs.lusha.com/apis/openapi/website-visits.md
    - https://docs.lusha.com/apis/openapi/account-usage-api/get-account-usage
# Everything below is V3 (V2 sunsets 2026-11-18, see lusha.yaml's header note). These are the
# routes the V3 surface exposes BEYOND the six curated in lusha.yaml (search-and-enrich x2,
# prospecting search x2, contacts/enrich, account/usage) — filter/type discovery, lookalikes,
# signals, buying-group (the retired decision-makers route is kept as a tombstone), website-visits
# and the webhook-subscription family. Auth is the same `api_key` header, no scheme prefix. No calls
# were made while writing this file.
endpoints:
  - id: lusha.x.contacts-prospecting-filters
    kind: utility
    tier: extended
    platform: people
    method: GET
    path: /v3/contacts/prospecting/filters/{filterType}
    cost: {type: free, value: 0, currency: USD, unit: call, source: observed, source_url: 'https://api.lusha.com/v3/account/usage', checked: '2026-08-07', note: 'measured on our own account — called it twice and credits.used did not move (24 -> 24); only the request rate-limit counter advanced. Filter enumeration is metadata, not data'}
    name: "List contact filter values"
    summary: "Enumerate the accepted values for one contact-prospecting filter type (job titles, seniority, departments, locations, etc.)"
    input:
      pathParams:
        filterType: {type: string, required: true, note: "which filter's accepted values to list. CORRECTED at verify time from the real OpenAPI bundle (https://docs.lusha.com/_bundle/apis/@v3/openapi.yaml, unreachable from the client-rendered reference pages): the enum is departments | seniority | existingDataPoints | countries | locations (locations additionally requires a `query` param)", example: "departments"}
      note: "companion to POST /v3/contacts/prospecting — call this first to know what to pass into filters.contacts.include/exclude"
    test_request:
      pathParams: {filterType: "departments"}
    verified: 2026-07-28
    example_response: examples/lusha.x.contacts-prospecting-filters.json
    docs_url: https://docs.lusha.com/apis/openapi/prospecting-search-and-enrich

