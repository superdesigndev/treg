provider: lusha
source:
  method: official docs (client-rendered reference; read via markdown-rendered doc pages and search,
    since the interactive OpenAPI viewer does not serve a fetchable spec document)
  ingested: 2026-07-28
  spec_urls:
    - https://docs.lusha.com/apis/openapi.md
    - https://docs.lusha.com/tutorials/v3-migration-guide
    - https://docs.lusha.com/apis/openapi/lookalikes.md
    - https://docs.lusha.com/apis/openapi/signals.md
    - https://docs.lusha.com/apis/openapi/webhooks.md
    - https://docs.lusha.com/apis/openapi/decision-makers.md
    - https://docs.lusha.com/apis/openapi/buying-group.md
    - https://docs.lusha.com/_bundle/apis/@v3/openapi.yaml
    - https://docs.lusha.com/apis/openapi/website-visits.md
    - https://docs.lusha.com/apis/openapi/account-usage-api/get-account-usage
# Everything below is V3 (V2 sunsets 2026-11-18, see lusha.yaml's header note). These are the
# routes the V3 surface exposes BEYOND the six curated in lusha.yaml (search-and-enrich x2,
# prospecting search x2, contacts/enrich, account/usage) — filter/type discovery, lookalikes,
# signals, buying-group (the retired decision-makers route is kept as a tombstone), website-visits
# and the webhook-subscription family. Auth is the same `api_key` header, no scheme prefix. No calls
# were made while writing this file.
# Hand-maintained: no ingester reads Lusha's client-rendered reference, so this file is never
# regenerated and edits here (tombstones included) survive.
endpoints:
  - id: lusha.x.contacts-prospecting-filters
    kind: utility
    platform: people
    method: GET
    path: /v3/contacts/prospecting/filters/{filterType}
    price: {value: '0', currency: USD, unit: call, note: "free: it uses no credits"}
    settle: null
    name: "List contact filter values"
    summary: "List the accepted values for one contact-search filter: departments, seniority, data points, countries or locations"
    input:
      pathParams:
        filterType: {type: string, required: true, note: "departments | seniority | existingDataPoints | countries | locations; locations also needs a `query` parameter", example: "departments"}
      note: "companion to POST /v3/contacts/prospecting — call this first to know what to pass into filters.contacts.include/exclude"
    test_request:
      pathParams: {filterType: "departments"}
    verified: 2026-07-28
    added: '2026-07-28'
    example_response: examples/lusha.x.contacts-prospecting-filters.json
    docs_url: https://docs.lusha.com/apis/openapi/prospecting-search-and-enrich

  - id: lusha.x.companies-prospecting-filters
    kind: utility
    platform: companies
    method: GET
    path: /v3/companies/prospecting/filters/{filterType}
    price: {value: '0', currency: USD, unit: call, note: "free: it uses no credits"}
    settle: null
    name: "List company filter values"
    summary: "List the accepted values for one company-search filter: names, sizes, revenues, locations, SIC, NAICS, industries, intent topics or technologies"
    input:
      pathParams:
        filterType: {type: string, required: true, note: "names | sizes | revenues | locations | sics | naics | industriesLabels | intentTopics | technologies; names, technologies and locations also need a `query` parameter", example: "sizes"}
      note: "companion to POST /v3/companies/prospecting"
    test_request:
      pathParams: {filterType: "sizes"}
    verified: 2026-07-28
    added: '2026-07-28'
    example_response: examples/lusha.x.companies-prospecting-filters.json
    docs_url: https://docs.lusha.com/apis/openapi/company-filters

  - id: lusha.x.companies-enrich-by-id
    added: '2026-07-28'
    domain: companies
    platform: companies
    method: POST
    path: /v3/companies/enrich
    name: "Enrich companies by Lusha id (up to 100)"
    summary: "Enrich up to 100 companies by Lusha id into full records: industry, headcount, revenue, funding, tech"
    input:
      bodyType: json
      body:
        ids: {type: array, items: {type: string}, required: true, note: "1-100 company ids from lusha.companies.search", example: ["16303253"]}
        reveal: {type: array, items: {type: string, enum: [employeesByDepartment, employeesByLocation, employeesBySeniority, competitors, estimatedAnnualItSpend, monthlyWebsiteTraffic, openJobsTotal, openJobsByDepartment, openJobsByLocation, openJobsBySeniority, directParent, ultimateParent]}, required: false, note: "premium fields to add; each costs 1 credit per company returned"}
        tableId: {type: string, required: false, note: "persist results into a Lusha Table"}
      note: "use lusha.companies.enrich when you have a domain or name instead of an id"
    test_request:
      body: {ids: ["v1.3J1rAxaCJItvAYiCFRJaszj9lstdGJw"]}
    price: {value: '1', currency: credit, unit: result, note: "1 credit per company returned, plus 1 per premium `reveal` field per company"}
    provenance: {source: observed, source_url: 'https://www.lusha.com/pricing/', checked: '2026-11-11', confidence: verified}
    reserve: {entities: {from: body.ids.*, max: 100}}
    verified: 2026-11-11
    example_response: examples/lusha.x.companies-enrich-by-id.json
    docs_url: https://docs.lusha.com/apis/openapi/company-search-and-enrich

  - id: lusha.x.contacts-lookalike
    domain: contacts
    platform: people
    method: POST
    path: /v3/contacts/lookalike
    name: "Find lookalike contacts from 5-100 seed contacts"
    summary: "Find contacts with roles, seniority and companies like 5-100 seed contacts"
    input:
      bodyType: json
      body:
        seeds: {type: object, required: true, note: "one object {linkedinUrls, contacts, emails, ids}, not an array; the items in all its lists must total 5-100", example: {ids: ["4389064654", "4389064624"]}}
        exclude: {type: object, required: false, note: "same ContactIdentifiersBatch shape as seeds"}
        dedupeSessionId: {type: string, required: false, note: "omit on the first call; send the returned id again to get more results (kept 30 days)"}
        limit: {type: integer, required: false, note: "1-100, default 25"}
        tableId: {type: string, required: false, note: "persist results into a Lusha Table"}
      note: "returns previews; pass the returned ids to lusha.people.contacts.enrich for emails and phones"
    test_request:
