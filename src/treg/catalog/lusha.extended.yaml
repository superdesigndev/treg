  - id: lusha.x.contacts-signals
    added: '2026-07-28'
    domain: contacts
    platform: people
    method: POST
    path: /v3/contacts/signals
    name: "Job-change and promotion signals for contact ids"
    summary: "Retrieve signal events for a list of contacts — job changes and promotions"
    platform_blocked: Lusha bills each matched signal, and one call can match hundreds per company, more than a hold can cover. Connect your own Lusha key.
    input:
      bodyType: json
      body:
        ids: {type: array, items: {type: string}, required: true, note: "up to 100 Lusha contact ids (the field is `ids`; Lusha refuses `contactIds`)", example: ["12345"]}
        signalTypes: {type: array, items: {type: string}, required: false, note: "promotion | companyChange | allSignals"}
        startDate: {type: string, required: false, note: "ISO date; only signals on/after this date"}
        tableId: {type: string, required: false, note: "persist results into a Lusha Table's Signals column"}
      note: "standalone alternative to the signals filter on the search/prospecting endpoints"
    price: {value: '1', currency: credit, unit: result, note: "1 credit per matched signal; set signalTypes and startDate to keep the bill small"}
    provenance: {source: rate_card_api, source_url: 'https://www.lusha.com/pricing/', checked: '2026-11-12', confidence: verified}
    reserve: {entities: {from: body.ids.*, max: 100}}
    untestable: "requires ids minted by a prior search on this account; no public/stable id is documented to probe with"
    docs_url: https://docs.lusha.com/apis/openapi/signals
    capability: people.signals

