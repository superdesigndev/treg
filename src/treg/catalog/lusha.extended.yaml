  - id: lusha.x.webhook-subscriptions-create
    kind: account
    tier: extended
    platform: account
    method: POST
    path: /api/subscriptions
    name: "Create webhook subscriptions"
    summary: "Create one or more webhook subscriptions (bulk, up to 25 per request) that deliver signal events to your endpoint"
    input:
      bodyType: json
      body:
        defaults: {type: object, required: false, note: "shared entityType/signalTypes/url applied to every subscription entry that omits its own", example: {entityType: "company", signalTypes: ["headcountIncrease1m"], url: "https://example.com/webhooks/lusha"}}
        subscriptions: {type: "array[object]", required: true, note: "up to 25 per request; each needs entityId (a real contact or company id owned by this account) plus name; entityType/signalTypes/url come from `defaults` unless overridden per entry", example: [{entityId: "16303253", name: "My Test Webhook"}]}
      note: "deliveries are signed with HMAC-SHA256 (X-Lusha-Signature, X-Lusha-Timestamp) and must be acknowledged within 10s with a 2xx + {received, timestamp, webhookId} body. NOT free-standing — each subscription is bound to one entityId, so it needs a real contact/company id on hand (e.g. from lusha.companies.search)"
    test_request:
      body: {defaults: {entityType: "company", signalTypes: ["headcountIncrease1m"], url: "https://example.com/webhooks/lusha-catalog-test"}, subscriptions: [{entityId: "v1.A1gXjPYd63SSPjSvxO4uwqXqE5ilJV9S", name: "catalog-verify-test"}]}
    cost: {type: free, value: 0, currency: USD, unit: call, note: webhook management is not metered against the data-credit balance}
    verified: 2026-07-28
    example_response: examples/lusha.x.webhook-subscriptions-create.json
    docs_url: https://docs.lusha.com/apis/openapi/webhooks

  - id: lusha.x.webhook-subscription-get
    kind: account
    tier: extended
