  - id: lusha.x.decision-makers
    status: retired
    status_note: "Lusha removed POST /v3/contacts/decision-makers on 2026-08-12 (API changelog 2.9.0) in favour of POST /v3/contacts/buying-group, the only operation that accepts contactsLimit and personas. A legacy handler still answers companies-only bodies on the old path, but it rejects contactsLimit and personas with 400 'property … should not exist', so the per-company spend cap documented here never applied: every call ran uncapped at Lusha's 60-contacts-per-company default, 1 credit per contact. Retired 2026-09-09."
    superseded_by: lusha.x.buying-group
    domain: contacts
    platform: people
    method: POST
    path: /v3/contacts/decision-makers
    name: "Buying-committee contacts (retired path)"
    summary: "RETIRED - the same operation now lives at lusha.x.buying-group. Resolve a company to a Lusha company id, rank the most relevant decision makers with the buying-committee-ranker model, and return them grouped per company (1 credit per contact returned)"
    input:
      bodyType: json
      body:
        companies: {type: array, items: {type: object}, required: true, note: "up to 25 entries; each needs exactly one of domain or id (a vN.… Lusha company id). Optional clientReferenceId is echoed back per company. `domain` goes inside each entry: a top-level domain, company_domain, website or company_name is rejected with 'property … should not exist'", example: [{"domain": "lusha.com"}]}
      note: "this path rejects contactsLimit and personas with 400 'property <name> should not exist'; use lusha.x.buying-group"
    test_request:
      body: {companies: [{domain: "lusha.com"}]}
    price: {value: '1', currency: credit, unit: result, note: "1 credit per contact returned"}
    provenance: {source: observed, source_url: 'https://docs.lusha.com/_bundle/apis/@v3/openapi.yaml', checked: '2026-09-03', confidence: verified}
    reserve: {entities: {from: body.companies.*, max: 100}}
    verified: 2026-09-02
    added: '2026-07-28'
    example_response: examples/lusha.x.decision-makers.json
    docs_url: https://docs.lusha.com/apis/openapi/decision-makers
    capability: people.decision_makers

  - id: lusha.x.buying-group
    added: '2026-09-19'
    domain: contacts
    platform: people
    method: POST
    path: /v3/contacts/buying-group
    name: "Find the buying-committee contacts at a company"
    summary: "Find the buying committee at up to 25 companies: decision makers, champions and end users, ranked, as contact previews grouped per company"
    input:
      bodyType: json
      body:
        companies: {type: array, items: {type: object}, required: true, note: "1-25 entries (V3BuyingGroupCompanyItem); each needs exactly one of `domain` (resolved server-side) or `id` (Lusha company id, vN.… form, e.g. from lusha.companies.search). Optional `clientReferenceId` is echoed back on the matching result. `domain` goes inside each entry: a top-level domain, company_domain, website or company_name is rejected with 'property … should not exist'", example: [{"domain": "lusha.com"}]}
        personas: {type: array, items: {type: string, enum: [decision_maker, potential_champion, end_user]}, required: false, note: "filter to buying-committee roles: decision_maker (budget or sign-off authority) | potential_champion (an internal advocate) | end_user (a day-to-day user); omit for all three", example: ["decision_maker"]}
        contactsLimit: {type: integer, required: false, note: "the spend cap: most contacts returned per company, 1 or more, default 60. Each contact costs 1 credit, so the bill is at most companies × contactsLimit credits. Always set it", example: 5}
        pagination: {type: object, required: false, note: "optional {page, size}; page >= 0 (default 0), size 10-100 (default 100). Pages across the ranked contacts; contactsLimit still bounds what one company can return", example: {"page": 0, "size": 100}}
      note: "returns previews (name, title, company, location, social links, `has`/`canReveal` data-point flags, persona `roles`, relevance `score` 0-1) grouped per company under `results[].contacts`; pass the contact ids to lusha.people.contacts.enrich for emails and phones"
    test_request:
      body: {companies: [{domain: "lusha.com"}], contactsLimit: 1}
    price: {value: '1', currency: credit, unit: result, note: "1 credit per contact returned"}
    provenance: {source: observed, source_url: 'https://docs.lusha.com/_bundle/apis/@v3/openapi.yaml', checked: '2026-11-11', confidence: verified}
    reserve: {rows: {param: body.contactsLimit, default: {value: 60, source: docs}, max: 100}}
    skipped: "no example_response is shipped: every answer names real people. lusha.x.companies-enrich-by-id is verified on the same billing field"
    docs_url: https://docs.lusha.com/apis/openapi/buying-group
    capability: people.decision_makers

  - id: lusha.x.companies-website-visits
    added: '2026-07-28'
    domain: other
    platform: companies
    method: POST
    path: /v3/companies/website-visits
    price: null
    name: "Rank companies by website-visit signals"
    summary: "Returns companies ranked by website-visit signals for your tracked domains, combining firmographics with visit metrics (score, sessions, unique visitors, avg session length)"
    input:
      bodyType: json
      body:
        domains: {type: array, items: {type: string}, required: true, note: "must already be configured for visitor tracking in the Lusha dashboard — an untracked domain 400s"}
        dateRange: {type: object, required: false, note: "start/end dates; span limited to <= 3 months"}
        limit: {type: integer, required: false, note: "1-150", example: 1}
