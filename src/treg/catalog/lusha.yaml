provider: lusha
source:
  docs: https://docs.lusha.com/tutorials/v3-migration-guide
  openapi: null # Lusha renders an OpenAPI-style reference client-side; no fetchable spec document
  curated: 2026-07-28
# VERIFIED — all six endpoints have been called live with a real credential and every one passed:
# people.search, people.contacts.enrich and companies.search on 2026-07-28 (their captured examples
# and the two path/field corrections below are that run's output), account.usage, companies.enrich
# and people.enrich re-called 2026-07-31. Paths and prices were originally transcribed from Lusha's
# official API documentation 2026-07-28; what stands now is what the API answered.
#
# EVERY RESPONSE CARRIES ITS OWN BILL. A `billing: {creditsCharged, resultsReturned}` block comes
# back on every v3 call, so no price in this file is a guess any more — the counts below are what
# Lusha reported charging, and they did not always match the docs (see people.search) or the rate
# card (see companies.enrich). The test account is the FREE plan: 50 credits a month, 28 remaining
# on 2026-07-31, which is why verification was rationed to the cheapest useful call per endpoint.
#
# THIS IS THE V3 API, AND V2 IS ON A CLOCK. Most Lusha material still circulating on the web shows
# the older flat routes (GET /v2/person, GET /v2/company, POST /prospecting/contact/search). Those
# still answer, but Lusha began sending V2 sunset headers on 2026-05-18 and V2 SHUTS OFF ON
# 2026-11-18 — roughly four months after this file was curated. Cataloguing V2 would ship a
# provider that breaks itself before year end, so every path below is V3. Lusha's migration guide
# maps the old routes onto these, and several GETs became POSTs in the move. The registry's probe
# (/v3/account/usage) is already on V3.
#
# Auth quirk carried over from the registry: the key rides in a header literally named `api_key`,
# with no scheme prefix — not Authorization, not Bearer.
#
# THE COST MODEL, which is the point of the two-step shape — and where the docs are WRONG twice.
# The documented story is that SEARCH is free and only ENRICH is charged: prospecting returns
# non-PII previews plus record ids for nothing, and you spend credits when you pass those ids to an
# enrich endpoint, billed PER REVEALED DATAPOINT (an email and a phone on the same contact are two
# charges). The `reveal` array is the real price dial — ask for emails only when you only need
# emails. What the live `billing` blocks show instead:
#   * PROSPECTING IS NOT FREE. Both prospecting routes charge 1 credit per up to 25 results
#     (pricing.contactSearch / companySearch), despite their own docs pages calling the step free.
#   * SEARCH-AND-ENRICH IS NOT PRICED LIKE THE ENRICH STEP. companies/search-and-enrich charged 2
#     credits for one company — a search charge plus a reveal charge — while the rate card lists
#     revealCompany at 1. Prospecting once and then enriching by id is the cheaper path when you
#     will reuse the ids.
# Credits are sold per plan (API access is generally Pro/Scale and up) and Lusha publishes no
# numeric V3 credit costs in its docs. It offers something better: the FREE GET /v3/account/usage
# returns a `pricing` object with the per-action credit costs for the calling plan — a live rate
# card no other provider in this catalog exposes. Read it first, but treat it as a FLOOR: it prices
# single actions, and a composite route can spend two of them (above).
#
# Request-body shapes below come from the migration guide and endpoint summaries; Lusha's reference
# pages render client-side and could not be read in full at curation time, so field lists are the
# documented essentials rather than an exhaustive schema. Treat `note` as the contract.

pricing_url: https://www.lusha.com/pricing/  # A no-match is free; a search that returns rows is not.
# Every priced answer reports its own bill in `billing.creditsCharged` (0 on a no-match), so that
# figure is the bill, uncapped; a 2xx without a readable one settles at the hold.
defaults:
  settle: {reported: {path: response.billing.creditsCharged, unit: credit, missing: 0}}
  error: {when: {any: [{path: response.error, op: present}, {path: response.errors, op: present}]}}
  bill: {miss: charged, error: charged}
endpoints:
  - id: lusha.people.enrich
    domain: contacts
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /v3/contacts/search-and-enrich
    name: "Find a person's work email and phone by LinkedIn or name"
    summary: "Enrich a person — work email, direct dial and mobile — from email, LinkedIn or name"
    input:
      bodyType: json
      body:
        contacts: {type: array, items: {type: object}, required: true, note: "the people to look up, each identified by email, linkedinUrl, or firstName + lastName + companyName|companyDomain", example: [{"firstName": "Jane", "lastName": "Doe", "companyDomain": "lusha.com"}]}
        reveal: {type: array, items: {type: string, enum: [emails, phones]}, required: false, note: "emails, phones or both; each revealed datapoint is billed, so ask only for what you need", example: ["emails"]}
      note: "Lusha's strength is direct-dial and mobile numbers; ask for phones only when you need them, because a phone costs five times an email"
    test_request:
      body: {contacts: [{firstName: "Jane", lastName: "Doe", companyDomain: "lusha.com"}], reveal: ["emails"]}
    price: {value: '2', currency: credit, unit: result, note: "a matched contact costs 1 credit plus 1 per email and 5 per phone revealed, so an email costs 2 and a phone 6. A contact Lusha cannot match costs 0. A contact this account revealed recently costs 1 less."}
    provenance: {source: rate_card_api, source_url: 'https://www.lusha.com/pricing/', checked: '2026-11-12', confidence: verified}
    reserve: {plugin: lusha.contact_enrich_units, max: '700'}
    miss: {when: {path: response.results.0.error, op: present}}
    verified: 2026-08-13
    added: '2026-07-28'
    example_response: examples/lusha.people.enrich.json
    docs_url: https://docs.lusha.com/apis/openapi/enrichment

  - id: lusha.people.phone.find
    domain: contacts
    capability: people.phone.find
    platform: people
    scope: any_account
    method: POST
    path: /v3/contacts/search-and-enrich
    name: "Find a person's phone by LinkedIn URL, email or name"
    summary: "Reveal a person's direct dial or mobile from a LinkedIn URL, email, or name and company domain"
    input:
      bodyType: json
      body:
        contacts: {type: array, items: {type: object}, required: true, note: "the person to look up, by linkedinUrl, email, or firstName + lastName + companyDomain", example: [{"linkedinUrl": "https://www.linkedin.com/in/example"}]}
        reveal: {type: array, items: {type: string, enum: [emails, phones]}, required: true, note: "always [\"phones\"] on this route", example: ["phones"]}
      note: "three outcomes: not found gives `results[0].error.code` NOT_FOUND; found with no number gives a profile with no `phones` key and a top-level `status: partial`; found with a number gives `phones: [{number, type, doNotCall, countryIso2}]`. Honour `doNotCall`. On treg's key the numbers come from Lusha's own data only, because no third-party waterfall is connected"
    test_request:
      body: {contacts: [{firstName: "Jane", lastName: "Doe", companyDomain: "lusha.com"}], reveal: ["phones"]}
    price: {value: '6', currency: credit, unit: result, note: "a found number costs 6 credits, a found contact with no number 1, and a contact Lusha cannot match 0"}
    provenance: {source: rate_card_api, source_url: 'https://www.lusha.com/pricing/', checked: '2026-11-12', confidence: verified}
    reserve: {entities: {from: body.contacts.*, max: 100}}
    miss:
      when: {path: response.results.0.phones.0.number, op: absent}
      means: "Lusha has no number for this person; do not retry the same identifier"
    verified: 2026-09-04
    added: '2026-09-04'
    example_response: examples/lusha.people.phone.find.json
    docs_url: https://docs.lusha.com/apis/openapi/enrichment

  - id: lusha.people.search
    domain: contacts
    capability: people.search
    platform: people
    scope: any_account
    method: POST
    path: /v3/contacts/prospecting
    name: "Search people by title, company or intent"
    summary: "Search Lusha's contacts by title, seniority, company, location or intent, with contact ids and previews"
    input:
      bodyType: json
      body:
        pagination: {type: object, required: true, note: "{page: <0-based>, size: 10-100}; rows are billed in blocks of 25, so a size of 25 costs the same as 10", properties: {page: {type: integer, min: 0}, size: {type: integer, min: 10, max: 100}}, example: {"page": 0, "size": 10}}
        filters: {type: object, required: true, note: "nested contact and company filters: job titles, seniority, departments, locations, company size, revenue, industry, technologies, intent topics and signals. GET /v3/contacts/prospecting/filters/{filterType} enumerates the accepted values for each filter. A `signals` filter is billed per matched signal, so treg's key refuses it; use your own Lusha key for it", properties: {contacts: {type: object, properties: {include: {type: object, properties: {signals: {type: object}}}, exclude: {type: object, properties: {signals: {type: object}}}}}}, example: {"contacts": {"include": {"jobTitles": ["Head of Marketing"]}}}}
      note: "returns a requestId, contact ids and previews with no email or phone; pass the ids you want to lusha.people.contacts.enrich to reveal them"
    test_request:
      body: {pagination: {page: 0, size: 10}, filters: {contacts: {include: {jobTitles: ["Head of Marketing"]}}}}
    price: {value: '1', currency: credit, per: 25, round: up, unit: result, note: "1 credit per started block of 25 rows returned; Lusha's docs call this step free, but it is billed. An empty answer costs 0"}
    provenance: {source: rate_card_api, source_url: 'https://www.lusha.com/pricing/', checked: '2026-11-12', confidence: verified}
    reserve: {rows: {param: body.pagination.size, default: {value: 25, source: docs}, max: 100}}
    platform_request: {body.filters.contacts.include.signals: null, body.filters.contacts.exclude.signals: null}
    miss: {when: {path: response.results, op: empty}}
    verified: 2026-07-28
    added: '2026-07-28'
    example_response: examples/lusha.people.search.json
    docs_url: https://docs.lusha.com/apis/openapi/prospecting-search-and-enrich

  - id: lusha.people.contacts.enrich
    domain: contacts
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /v3/contacts/enrich
    name: "Reveal emails and phone numbers for found contact ids"
    summary: "Reveal emails and phone numbers for contacts you already found in a prospecting search"
    input:
      bodyType: json
      body:
        ids: {type: array, items: {type: string}, required: true, note: "1-100 contact ids from lusha.people.search; each revealed datapoint is billed, so send only the ids you want", example: ["4389064654"]}
        reveal: {type: array, items: {type: string, enum: [emails, phones]}, required: false, note: "emails, phones or both", example: ["emails"]}
        waterfallEnabled: {type: boolean, required: false, note: "false keeps the call to Lusha's own data; it matters only on your own Lusha key with Data Waterfall on"}
        tableId: {type: string, required: false, note: "persist the results into a Lusha Table"}
    test_request:
      body: {ids: ["v1.-R1YwK7SIvBv1FVAOW1zmel9bZ4XD9mxNQ"], reveal: ["emails"]}
    price: {value: '1', currency: credit, unit: result, note: "1 credit per email and 5 per phone revealed, across the batch, so phones for 100 ids cost 500 credits"}
    provenance: {source: rate_card_api, source_url: 'https://www.lusha.com/pricing/', checked: '2026-11-12', confidence: verified}
    reserve: {plugin: lusha.contact_reveal_credits, max: '600'}
    verified: 2026-07-28
    added: '2026-07-28'
    example_response: examples/lusha.people.contacts.enrich.json
    docs_url: https://docs.lusha.com/apis/openapi/enrichment

  - id: lusha.companies.enrich
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /v3/companies/search-and-enrich
    name: "Enrich a company by domain or name — headcount, funding"
    summary: "Enrich a company from domain or name — industry, headcount, revenue, funding, tech"
    input:
      bodyType: json
      body:
        companies: {type: array, items: {type: object}, required: true, note: "the companies to look up, each identified by domain (preferred), name, or Lusha company id", example: [{"domain": "lusha.com"}]}
        reveal: {type: array, items: {type: string, enum: [employeesByDepartment, employeesByLocation, employeesBySeniority, competitors, estimatedAnnualItSpend, monthlyWebsiteTraffic, openJobsTotal, openJobsByDepartment, openJobsByLocation, openJobsBySeniority, directParent, ultimateParent]}, required: false, note: "premium fields to add; each costs 1 credit per company returned"}
      note: "pass a domain rather than a name when you have one: a name alone is ambiguous"
    test_request:
      body: {companies: [{domain: "lusha.com"}]}
    price: {value: '2', currency: credit, unit: result, note: "one company costs 2 credits: 1 per company returned plus 1 per started block of 25 companies, and 1 more per premium `reveal` field per company. A company Lusha cannot match costs 0. With ids from lusha.companies.search, lusha.x.companies-enrich-by-id skips the block charge"}
    provenance: {source: observed, source_url: 'https://www.lusha.com/pricing/', checked: '2026-11-12', confidence: verified}
    reserve: {plugin: lusha.company_enrich_units, max: '1304'}
    miss: {when: {path: response.results.0.name, op: absent}}
    verified: 2026-07-31
    added: '2026-07-28'
    example_response: examples/lusha.companies.enrich.json
    docs_url: https://docs.lusha.com/apis/openapi/company-search-and-enrich

  - id: lusha.companies.search
    domain: companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: POST
    path: /v3/companies/prospecting
    name: "Search companies by industry or tech"
    summary: "Search Lusha's companies by industry, headcount, revenue or tech, with company ids and previews"
    input:
      bodyType: json
      body:
        pagination: {type: object, required: true, note: "{page: <0-based>, size: 10-100}; rows are billed in blocks of 25, so a size of 25 costs the same as 10", properties: {page: {type: integer, min: 0}, size: {type: integer, min: 10, max: 100}}, example: {"page": 0, "size": 10}}
        filters: {type: object, required: true, note: "filters.companies.include takes domains, names, ids, sizes, revenues, mainIndustriesIds, technologies, locations, sicCodes, naicsCodes and signals; lusha.x.companies-prospecting-filters lists the accepted values. A `signals` filter is billed per matched signal, so treg's key refuses it; use your own Lusha key for it", properties: {companies: {type: object, properties: {include: {type: object, properties: {signals: {type: object}}}, exclude: {type: object, properties: {signals: {type: object}}}}}}, example: {"companies": {"include": {"domains": ["lusha.com"]}}}}
      note: "returns company ids and previews; pass the ids you want to lusha.x.companies-enrich-by-id for full records"
    test_request:
      body: {pagination: {page: 0, size: 10}, filters: {companies: {include: {domains: ["lusha.com"]}}}}
    price: {value: '1', currency: credit, per: 25, round: up, unit: result, note: "1 credit per started block of 25 rows returned; Lusha's docs call this step free, but it is billed. An empty answer costs 0"}
    provenance: {source: observed, checked: '2026-11-12', confidence: verified}
    reserve: {rows: {param: body.pagination.size, default: {value: 25, source: docs}, max: 100}}
    platform_request: {body.filters.companies.include.signals: null, body.filters.companies.exclude.signals: null}
    miss: {when: {path: response.results, op: empty}}
    verified: 2026-07-28
    added: '2026-07-28'
    example_response: examples/lusha.companies.search.json
    docs_url: https://docs.lusha.com/apis/openapi/prospecting-search-and-enrich/searchprospectingcompanies

  - id: lusha.account.usage
    kind: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /v3/account/usage
    name: "Check account credit balance and usage"
    summary: "See the Lusha plan's credit balance, usage so far and reset date (free)"
    input:
      note: "no parameters. Returns credits {total, used, remaining}, rateLimits, the plan and a `pricing` object with this plan's credit cost per action; call it before you budget a batch. Lusha limits this route to five a minute"
    test_request: {queryParams: {}}
    price: {value: '0', currency: USD, unit: call, note: "free: it uses no credits"}
    settle: null
    verified: 2026-07-31
    added: '2026-07-28'
    example_response: examples/lusha.account.usage.json
    docs_url: https://docs.lusha.com/apis/openapi/account-usage-api/get-account-usage
