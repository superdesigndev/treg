# MailVeri single-email verification and balance check. Bulk file endpoints (/v1/verify-mails/,
# /v1/get-status/, /v1/download-result/, /v1/delete-list/) require multipart file upload and
# account-owned list lifecycle management and are intentionally excluded from the catalog.
provider: mailveri
source:
  docs: https://mailveri.com/docs/api
  openapi: null
  curated: '2026-11-12'
pricing_url: https://mailveri.com/pricing
limits: "Single verification allows 10 requests/second and at most 5 concurrent checks per account (HTTP 429 above either limit); GET /v1/get-balance/ is unthrottled."
defaults:
  expect: {path: response.error, op: equals, value: 0}
  provenance: {source: docs, source_url: 'https://mailveri.com/pricing', checked: '2026-11-12', confidence: documented}
endpoints:
  - id: mailveri.people.email.verify
    added: '2026-11-12'
    verified: '2026-11-12'
    cache:
      ignore_paths: ["balance", "credits_used", "daily_limit", "daily_remaining", "message"]
    domain: contacts
    capability: people.email.verify
    platform: people
    scope: any_account
    method: POST
    path: /v1/verify-mail/
    name: Verify email — catch-all, disposable and quality score
    summary: Check whether an email address is deliverable, with catch-all, disposable, role-account and forwarding detection
    body_allowlist: true
    input:
      bodyType: json
      body:
        email: {type: string, required: true, note: "the email address to verify", example: "founder@acme-saas.io"}
      note: "Returns status (VALID, INVALID, CATCH_ALL, DISPOSABLE, FULL_INBOX, ROLE_ACCOUNT or UNKNOWN), quality_score (0-100), is_forwarding and credits_used."
    test_request:
      body: {email: "founder@acme-saas.io"}
    price:
      value: '1'
      currency: credit
      per: 1
      unit: result
      note: "One credit per conclusive verdict (VALID, INVALID, CATCH_ALL, DISPOSABLE, FULL_INBOX, ROLE_ACCOUNT). UNKNOWN results and errors report credits_used: 0 and deduct no credit."
    settle:
      reported: {path: response.credits_used, unit: credit}
    miss:
      when: {path: response.status, op: equals, value: UNKNOWN}
    example_response: examples/mailveri.people.email.verify.json
    docs_url: https://mailveri.com/docs/api

  - id: mailveri.account.usage
    added: '2026-11-12'
    verified: '2026-11-12'
    kind: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /v1/get-balance/
    name: Check credit balance
    summary: Check remaining non-expiring verification credits and daily quota usage
    input:
      note: "No parameters; the API key rides in Authorization: Bearer."
    test_request: {queryParams: {}}
    price:
      value: '0'
      currency: USD
      unit: call
      note: "Free balance check; also serves as the connection health probe."
    example_response: examples/mailveri.account.usage.json
    docs_url: https://mailveri.com/docs/api
