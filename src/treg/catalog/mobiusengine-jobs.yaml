provider: mobiusengine-jobs
source:
  docs: https://jobs.mobiusengine.ai/docs?utm_source=treg&utm_medium=listing
  openapi: https://jobs-api.arihaan.ai/v1/openapi.json
  curated: 2026-10-27
# Prepaid pay-per-job balance, billed by what comes back: a job without its description, a job with a 300 character
# description preview (separate routes, so each endpoint has one price), a count. The full description text is not
# listed here: it is not sold on pay per job. Every response carries X-Cost-USD and X-Balance-USD; the public rate card is
# GET /v1/rates. Company lookups, counts grouped by company and description searches answer 403 on these keys.
# Probe: GET /v1/balance is free; a bad or missing key answers 401.
limits: "100 jobs per call; 30 requests at once; a search stops at 20 s; HTTP 402 when the prepaid balance is empty"
pricing_url: https://jobs.mobiusengine.ai/?utm_source=treg&utm_medium=pricing#pricing
endpoints:
  - id: mobiusengine-jobs.jobs.search
    verified: '2026-10-27'
    added: '2026-10-28'
    example_response: examples/mobiusengine-jobs.jobs.search.json
    domain: jobs
    capability: companies.jobs.search
    platform: companies
    scope: any_account
    method: GET
    path: /v1/jobs
    name: "Search job postings (listing fields)"
    summary: "Search open job postings taken from employers' own career pages. Filter by title, company, country, remote, salary, job system (Workday, Greenhouse, Lever, Ashby, SmartRecruiters, Oracle Cloud, SAP SuccessFactors, iCIMS, Workable, BambooHR, Paycom, ADP, UKG, Taleo and more) or posted date, newest first. Each job has its title, company, locations, dates, seniority, pay when published, skills and apply link, without the description text."
    input:
      queryParams:
        title: {type: "array[string]", required: false, note: "job title keywords (repeat the parameter); up to 10, a job matches if its title has any as consecutive words", example: "data engineer"}
        company: {type: "array[string]", required: false, note: "company name or board key contains any of these (repeat the parameter)", example: "stripe"}
        countries: {type: "array[string]", required: false, note: "ISO-2 codes (repeat the parameter)", example: "US"}
        locations: {type: "array[string]", required: false, note: "a place; every comma part must match", example: "Austin, Texas"}
        sources: {type: "array[string]", required: false, note: "the job system the posting came from: workday, greenhouse, lever, ashby, smartrecruiters, oraclecloud, successfactors, icims, workable, bamboohr, teamtailor, paylocity, adp, paycom, ukg, jazzhr, dayforce, recruitee, breezy, personio, jobvite, pinpoint, rippling, applicantpro, peopleadmin, isolvedhire, usajobs, gem, governmentjobs, schooljobs, taleo, manatal, jsonld_sitemap", example: "greenhouse"}
        work_mode: {type: "array[string]", required: false, note: "On-site, Hybrid, Remote OK or Remote Solely", example: "Remote Solely"}
        posted_within_days: {type: integer, required: false, note: "1 to 365", example: 7}
        has_salary: {type: boolean, required: false, note: "only jobs with published pay"}
        limit: {type: integer, required: false, default: 20, min: 1, max: 100, note: "jobs per page and the price dial: every job returned is charged", example: 1}
        cursor: {type: string, required: false, note: "next_cursor from the previous page; null means the last page. Stable at any depth."}
    test_request: {queryParams: {title: "software engineer", countries: "US", limit: 1}}
    cost:
      type: per_result
      value: 0.016
      currency: USD
      per: 1000
      unit: record
      source: rate_card_api
      source_url: https://jobs-api.arihaan.ai/v1/rates
      checked: '2026-10-27'
      confidence: documented
      note: "$0.000016 per job returned, no description. An empty page, a 4xx and the free routes cost nothing. The charge is in the X-Cost-USD response header."
    docs_url: https://jobs.mobiusengine.ai/docs?utm_source=treg&utm_medium=listing

