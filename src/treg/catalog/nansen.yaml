provider: nansen
source:
  docs: https://docs.nansen.ai
  openapi: https://api.nansen.ai/openapi.json
  curated: '2026-11-03'
pricing_url: https://docs.nansen.ai/getting-started/credits
limits: 'Free: 15 requests/second and 300/minute. Pro: 75 requests/second and 1,500/minute.
  Account-specific limits may apply.'
proposed_capabilities:
  crypto.token.holders: Find token holders with balances and supply shares
  crypto.token.indicators: Quantitative risk and reward indicators for a token
  crypto.tokens.screen: Screen tokens using market and on-chain filters
  crypto.token.flows: Token flow summaries grouped by wallet cohort
  crypto.token.buyers_sellers: Find wallets that bought or sold a token
  crypto.smart_money.holdings: Aggregated token holdings of Smart Money wallets
  crypto.wallet.balances: Current token balances and USD values for a blockchain wallet
  crypto.wallet.counterparties: Find wallets and entities transacting with a wallet
  crypto.wallet.related: Find related wallets and on-chain address relationships
  crypto.wallet.pnl: Summarize realized wallet trading profit and loss
endpoints:
- id: nansen.search.general
  capability: crypto.search
  platform: crypto
  scope: any_account
  method: POST
  path: /api/v1/search/general
  name: Search tokens and entities
  summary: Search across all categories
  input:
    bodyType: json
    body:
      search_query:
        type: string
        required: true
        note: Search query - token name, symbol, contract address, or entity name.
        example: AAVE
      result_type:
        type: string
        required: false
        note: Type filter - 'token' for tokens only, 'entity' for entities only, 'any'
          for both.
        enum:
        - token
        - entity
        - any
        default: any
        example: token
      chain:
        type: string
        required: false
        note: Optional chain filter to narrow down token results (e.g., 'ethereum',
          'solana', 'base').
        example: ethereum
      limit:
        type: integer
        required: false
        note: 'Maximum number of results to return (default: 25, max: 50).'
        min: 1.0
        max: 50.0
        default: 25
        example: 1
    note: Corresponds to connector tool general_search. Token/entity discovery mode;
      address labels and domain resolution are separate API operations.
  test_request:
    body:
      search_query: AAVE
      result_type: token
      chain: ethereum
      limit: 1
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: observed
    source_url: https://docs.nansen.ai/getting-started/credits
    checked: '2026-11-03'
    confidence: verified
    note: 'Token/entity discovery mode; address labels and domain resolution are separate
      API operations. '
  added: '2026-11-03'
  docs_url: https://docs.nansen.ai/api/search
- id: nansen.tgm.token-information
  capability: crypto.coin.profile
