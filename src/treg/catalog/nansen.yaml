      chain:
        type: string
        required: true
        note: Blockchain chain
        enum: &id002
        - arbitrum
        - arc
        - avalanche
        - base
        - bnb
        - ethereum
        - hyperevm
        - hyperliquid
        - injective
        - iotaevm
        - linea
        - mantle
        - mantra
        - monad
        - near
        - optimism
        - plasma
        - polygon
        - robinhood
        - sei
        - solana
        - sonic
        - starknet
        - sui
        - ton
        - tron
        example: ethereum
      token_address:
        type: string
        required: true
        note: Token address
        example: '0x7fc66500c84a76ad7e9c93437bfc5ac33e2ddae9'
      timeframe:
        type: string
        required: true
        note: Timeframe for the token information query
        enum: &id004
        - 5m
        - 1h
        - 6h
        - 12h
        - 1d
        - 7d
        example: 1d
