  capability: crypto.smart_money.netflows
  platform: crypto
  scope: any_account
  method: POST
  path: /api/v1/smart-money/netflow
  name: Smart Money token netflows
  summary: Get Smart Money Netflow Data
  input:
    bodyType: json
    body:
      chains:
        type: array
        required: true
        note: Chains to include in the analysis (only smart money supported chains).
          Use 'all' to include all available chains.
        example: &id004
        - ethereum
      filters:
        type: object
        required: false
        note: Additional filters to apply. Only filters for columns that are being
          selected will be applied.
        example:
          exclude_smart_money_labels:
          - 30D Smart Trader
          include_native_tokens: false
          include_smart_money_labels:
          - Smart Trader
          include_stablecoins: false
      pagination:
        type: object
        required: false
        note: Pagination parameters
        example: *id002
      order_by:
        type: array
        required: false
        note: 'Custom sort order to override the endpoint''s default ordering.


          Examples:

          - [{"field": "market_cap_usd", "direction": "DESC"}] - Sort by market cap
          descending

          - [{"field": "net_flow_24h_usd", "direction": "ASC"}] - Sort by 24h flow
          ascending

          - [{"field": "market_cap_usd", "direction": "DESC"}, {"field": "net_flow_24h_usd",
          "direction": "ASC"}] - Sort by market cap descending, then 24h flow ascending'
        example:
        - direction: DESC
          field: net_flow_24h_usd
  test_request:
    body:
      chains: *id004
      pagination: *id002
  cost:
    type: per_success
    value: 5
    currency: credit
    unit: call
    source: docs
    source_url: https://docs.nansen.ai/getting-started/credits
    checked: '2026-11-03'
    confidence: documented
    note: Published standard tariff. Self-test account reported zero cost and usage
      for all calls; standard-account billing remains unobserved. Errors are not charged.
  added: '2026-11-03'
  docs_url: https://docs.nansen.ai/api/smart-money/netflows
