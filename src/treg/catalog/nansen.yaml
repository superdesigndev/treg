    note: Spot/on-chain mode; Hyperliquid perp statistics are outside this route.
      Published standard tariff. Self-test account reported zero cost and usage for
      all calls; standard-account billing remains unobserved. Errors are not charged.
  added: '2026-11-03'
  docs_url: https://docs.nansen.ai/api/token-god-mode/token-information
- id: nansen.tgm.holders
  capability: crypto.token.holders
  platform: crypto
  scope: any_account
  method: POST
  path: /api/v1/tgm/holders
  name: Find top token holders
  summary: Get "Token God Mode" (TGM) holders data
  input:
    bodyType: json
    body:
      chain:
        type: string
        required: true
        note: Blockchain chain
        enum:
        - arbitrum
        - arc
        - avalanche
        - base
        - bitcoin
        - bnb
        - ethereum
        - hyperevm
        - injective
        - iotaevm
        - linea
        - mantle
        - mantra
        - monad
        - near
        - optimism
        - plasma
        - polygon
        - robinhood
        - sei
        - solana
        - sonic
        - starknet
        - sui
        - ton
        - tron
        example: ethereum
      token_address:
        type: string
        required: true
        note: Token address
        example: '0x7fc66500c84a76ad7e9c93437bfc5ac33e2ddae9'
      aggregate_by_entity:
        type: boolean
        required: false
        note: Whether to return entity data
        default: false
      label_type:
        type: string
        required: false
        note: 'Which holders to return: ''all_holders'', ''smart_money'', ''whale'',
          ''public_figure'' or ''exchange''. The matching labels are applied automatically,
          so no labels filter is needed. To keep only specific labels, use filters.include_smart_money_labels;
          to drop specific labels, use filters.exclude_smart_money_labels.'
        enum:
        - whale
        - public_figure
        - smart_money
        - all_holders
        - exchange
        default: all_holders
      pagination:
        type: object
        required: false
        note: Pagination parameters
        example: &id001
          page: 1
          per_page: 1
      filters:
        type: object
        required: false
        note: Additional filters to apply to the query.
      premium_labels:
        type: boolean
        required: false
        note: Controls label tier in the response. When null/omitted or false (the
          default), returns free-tier labels at the standard credit cost for this
          endpoint. When true, returns premium labels (Smart Money, Fund, and other
          advanced labels), is billed at 150 credits per call, and requires a paid
          plan.
        example: false
      order_by:
        type: array
        required: false
        note: 'Custom sort order to override the endpoint''s default ordering.


          Examples:

          - [{"field": "value_usd", "direction": "DESC"}] - Sort by value USD descending

          - [{"field": "token_amount", "direction": "ASC"}] - Sort by token amount
          ascending

          - [{"field": "ownership_percentage", "direction": "DESC"}] - Sort by ownership
          percentage descending'
    note: Corresponds to connector tool token_current_top_holders. Spot holders, cheapest
      standard-label tier. premium_labels=true costs 150 credits and requires a paid
      plan; connector on-chain calls use that premium tier. Hyperliquid positions
      are a separate operation.
  test_request:
    body:
      chain: ethereum
      token_address: '0x7fc66500c84a76ad7e9c93437bfc5ac33e2ddae9'
      pagination: *id001
      premium_labels: false
  cost:
    type: per_success
    value: 5
    currency: credit
    unit: call
    source: docs
    source_url: https://docs.nansen.ai/getting-started/credits
    checked: '2026-11-03'
    confidence: documented
    note: Spot holders, cheapest standard-label tier. premium_labels=true costs 150
      credits and requires a paid plan; connector on-chain calls use that premium
      tier. Hyperliquid positions are a separate operation. Standard-account paid
      pricing remains unobserved.
  added: '2026-11-03'
  docs_url: https://docs.nansen.ai/api/token-god-mode/holders
