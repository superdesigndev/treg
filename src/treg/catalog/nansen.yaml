- id: nansen.token-screener
  capability: crypto.tokens.screen
  platform: crypto
  scope: any_account
  method: POST
  path: /api/v1/token-screener
  name: Discover tokens with screening filters
  summary: Retrieve token screener data
  input:
    bodyType: json
    body:
      chains:
        type: array
        required: true
        note: List of blockchain chains to filter by
        minItems: 1
        maxItems: 5
        example: &id003
        - ethereum
      timeframe:
        type: string
        required: false
        note: '**Required** (unless using deprecated ''date'' parameter).


          Time window for token screening data.


          Available timeframes and their data characteristics:

          - 5m: Last 5 minutes (minute-level granularity, 2-hour retention)

          - 10m: Last 10 minutes (minute-level granularity, 2-hour retention)

          - 1h: Last 1 hour (minute-level granularity, 2-hour retention)

          - 6h: Last 6 hours (hourly granularity, 2-day retention)

          - 24h: Last 24 hours (hourly granularity, 2-day retention)

          - 7d: Last 7 days (daily granularity, 2-month retention)

          - 30d: Last 30 days (daily granularity, 2-month retention)


          Cannot be used together with ''date''.'
        enum:
        - 5m
        - 10m
        - 1h
        - 6h
        - 24h
        - 7d
        - 30d
        example: 24h
      pagination:
        type: object
        required: false
        note: Pagination parameters
        example: *id001
      filters:
        type: object
        required: false
        note: Additional filters to apply
      order_by:
        type: array
        required: false
        note: 'Custom sort order to override the endpoint''s default ordering.


          Examples:

          - [{"field": "buy_volume", "direction": "DESC"}] - Sort by buy volume descending

          - [{"field": "price_change", "direction": "DESC"}] - Sort by price change
          descending'
    note: Corresponds to connector tool token_discovery_screener. Spot token screener;
      Hyperliquid perps use the separate perp-screener route.
  test_request:
    body:
      chains: *id003
      timeframe: 24h
      pagination: *id001
  cost:
    type: per_success
    value: 1
    currency: credit
    unit: call
    source: docs
    source_url: https://docs.nansen.ai/getting-started/credits
    checked: '2026-11-03'
    confidence: documented
    note: Spot token screener; Hyperliquid perps use the separate perp-screener route.
      Standard-account paid pricing remains unobserved.
  added: '2026-11-03'
  docs_url: https://docs.nansen.ai/api/token-god-mode/token-screener
