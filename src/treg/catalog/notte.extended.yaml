    bodyType: json
    body:
      default_runtime:
        type: string
        required: false
        enum:
        - standard
        - extended
      name:
        type: string
        required: false
      description:
        type: string
        required: false
      domain:
        type: string
        required: false
      instructions:
        type: string
        required: false
      self_healing:
        type: boolean
        required: false
      shared:
        type: boolean
        required: false
        note: Enable or disable public code sharing and forking for this function. Source code, including embedded credentials, becomes public. Runs, results and stored runtime secrets remain private. This does not enable public execution. Omit or send null to leave sharing unchanged.
      deletion_protected:
        type: boolean
        required: false
        note: Turn deletion protection on or off. While it is on, the function cannot be deleted. Any workspace member's key can turn it on; turning it off takes the key of a workspace admin or owner. Omit or send null to leave it unchanged.
      response_format:
        type: object
        required: false
        note: JSON Schema of run()'s return value, computed by the caller from its pydantic model
