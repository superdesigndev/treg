# notte - EXTENDED tier: the provider's full endpoint surface, machine-generated by
# scripts/catalog_ingest.py. Do not hand-edit; re-run the script instead. Entries start with
# no capability, no verification and no example response - verification stamps and reviewed
# `capability` mappings (with their platform correction) are added later and carried across
# re-ingests by id via carry_verification. Routes curated in core notte.yaml are excluded here.
#
# Source: Notte's own OpenAPI document (api.notte.cc/openapi.json). Every path is relative to
# OAuthProvider.base_url. NOTTE_ROUTES in scripts/catalog_ingest.py is the list of routes kept.
#
# OWN-KEY ONLY: every route acts on the caller's own Notte account (its sessions, profiles,
# personas, vaults, functions and monitors), and Notte bills by use with no fixed per-call
# price, so the price default in notte.yaml names a credit rate that fx.yaml leaves null.

provider: notte
source:
  method: official openapi
  ingested: '2026-11-17'
  spec_urls:
  - https://api.notte.cc/openapi.json
endpoints:
