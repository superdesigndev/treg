  name: 'Instagram: Get a profile'
  summary: Get a profile
  input:
    pathParams:
      identifier:
        type: string
        required: true
        note: Public resource reference. Profile paths accept a username with an @ prefix, such as @openai,
          or the stable platform ID. Post paths accept the platform post ID or shortcode.
        example: '@instagram'
    queryParams:
      freshness:
        type: string
        required: false
        default: 24h
        note: 'Maximum accepted data age. The default is 24h. Allowed values: live | 24h | 7d | 30d. A
          30-day cache hit is free; a miss fetches live and can cost $0.003.'
        example: 30d
    note: Use a Live key for public data; Test keys return synthetic data.
