- id: openhandle.instagram.user.profile
  platform: instagram
  scope: any_account
  kind: data
  method: GET
  path: /v1/instagram/profiles/{identifier}
  summary: Get a profile
  input:
    pathParams:
      identifier:
        type: string
        required: true
        minLength: 1
        example: '@northstar_forge_test'
        note: Public resource reference. Profile paths accept a username with an @ prefix, such as @openai,
          or the stable platform ID. Post paths accept the platform post ID or shortcode.
    queryParams:
      freshness:
        type: string
        required: false
        enum:
        - live
        - 24h
        - 7d
        - 30d
        default: 24h
        example: 24h
        note: Maximum accepted data age. The default is 24h.
    note: OpenAPI examples can refer to synthetic Test fixtures. Use real public identifiers with a Live
      key. freshness=30d makes cache hits free; cache misses still fetch and bill Live data.
  cost:
    type: per_call
    value: 0.0025
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://openhandle.dev/pricing.md
    checked: '2026-09-21'
    confidence: documented
    note: 'Published prepaid entry rate per answered request: $0.0025 for the first 100,000 requests per
      month, then $0.002. Cache hits cost less: 24h $0.0005, 7d $0.0001, 30d free; cache misses fetch
      and bill Live data. Confirmed not-found and private profiles are billed; invalid input, provider
      failures and rate limits are not. Live data verified 2026-09-21 with freshness=live. Response headers
      reported Openhandle-Cost: 0.000, Openhandle-List-Price: 0.0025 and Openhandle-Billing-Disposition:
      allowance. Paid charge unobserved; price remains documented.'
  docs_url: https://openhandle.dev/docs/api-reference
  test_request:
    pathParams:
      identifier: '@instagram'
    queryParams:
      freshness: live
  capability: instagram.user.profile
  name: 'Instagram: Get a profile'
  example_response: examples/openhandle.instagram.user.profile.json
  verified: '2026-09-21'
