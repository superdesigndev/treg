provider: orbit
source:
  docs: https://docs.orbitsearch.com/
  openapi: https://docs.orbitsearch.com/openapi.json
  curated: '2026-09-04'
limits: Scoped API key and token-bucket limits apply. Honor Retry-After on 429; see
  https://docs.orbitsearch.com/concepts/rate-limits.
pricing_url: https://docs.orbitsearch.com/concepts/search
proposed_capabilities:
  people.search.status: Get search status
  people.enrich.batch: Batch enrich profiles
  people.profile.read: Read an enriched profile
  people.enrich.status: Get enrichment status
  people.watchers.create: Create a watcher
  people.watchers.list: List watchers
  people.watchers.get: Get a watcher
  people.watchers.update: Update a watcher
  people.watchers.delete: Delete a watcher
  people.watchers.runs: List watcher runs
  people.webhooks.create: Create a webhook endpoint
  people.webhooks.list: List webhook endpoints
  people.webhooks.delete: Delete a webhook endpoint
  people.webhooks.test: Send a test delivery
endpoints:
- id: orbit.people.search
  capability: people.search
  platform: people
  domain: search
  scope: any_account
  kind: data
  method: POST
  path: /v3/search
  name: Start a people search
  summary: Start a people search
  input:
    bodyType: json
    body:
      request_id:
        type: string
        minLength: 1
        required: false
        note: Your idempotency key. Reuse it only when retrying the same logical request.
      query:
        type: string
        minLength: 1
        required: false
        note: A plain-English description of the people you want. When intent is also
          present, Orbit derives a base intent from this query before applying the
          caller-provided structured fields.
      intent:
        type: object
        minProperties: 1
        additionalProperties: false
        properties:
          names:
            type: array
            items:
              type: string
              minLength: 1
          experiences:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                titleAnyOf:
                  type: array
                  items:
                    type: string
                organization:
                  type: string
                year:
                  type: integer
                startYear:
                  type: integer
                startYearLte:
                  type: integer
                endYear:
                  type: integer
                temporalScope:
                  type: string
                  enum:
                  - current
                  - historical
                  - both
          semanticClauses:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                text:
                  type: string
                  minLength: 1
                anyOf:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
              anyOf:
              - required:
                - text
              - required:
                - anyOf
          schools:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                school:
                  type: string
                schoolAnyOf:
                  type: array
                  items:
                    type: string
                graduationYear:
                  type: integer
                startYear:
                  type: integer
                endYear:
                  type: integer
                temporalScope:
                  type: string
                  enum:
                  - current
                  - historical
                  - both
                relation:
                  type: string
          geo:
            oneOf:
            - type: object
              additionalProperties: false
              properties:
                place:
                  type: string
                isHistorical:
                  type: boolean
                distance:
                  type: string
            - type: 'null'
          demographics:
            oneOf:
            - type: object
              additionalProperties: false
              properties:
                ageRange:
                  type: object
                  additionalProperties: false
                  required:
                  - min
                  - max
                  properties:
                    min:
                      type: integer
                    max:
                      type: integer
                birthYearRange:
                  type: object
                  additionalProperties: false
                  required:
                  - min
                  - max
                  properties:
                    min:
                      type: integer
                    max:
                      type: integer
                gender:
                  type: string
            - type: 'null'
          personalization:
            oneOf:
            - type: object
              additionalProperties: false
              properties:
                network:
                  type: object
                  additionalProperties: false
                  required:
                  - scope
                  properties:
                    scope:
                      type: string
                      enum:
                      - first_degree
                nearMe:
                  type: object
                  additionalProperties: false
                  required:
                  - distance
                  properties:
                    distance:
                      type: string
            - type: 'null'
        required: false
        note: Advanced structured criteria. Do not include a `version` field.
      signals:
        type: object
        minProperties: 1
        additionalProperties: false
        properties:
          address:
            type: string
            minLength: 1
          email:
            type: string
            format: email
          phone:
            type: string
            minLength: 1
          linkedin_url:
            type: string
            format: uri
          urls:
            type: array
            items:
              type: string
              format: uri
          usernames:
            type: array
            items:
              type: string
              minLength: 1
        required: false
        note: Known identity signals. Send only the signals you have.
      candidate_discovery:
        type: boolean
        default: false
        required: false
        note: Continue beyond known matches to find additional people. Address, email,
          and phone signals can each resolve to multiple associated people.
      candidate_discovery_limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
        required: false
        note: Maximum number of Candidate Discovery results. Valid only with candidate_discovery
          set to true. A lower value reduces downstream profile-generation fanout,
          although source discovery and clustering can still dominate initial discovery
          time.
        min: 1
        max: 50
      profile_depth:
        type: string
        enum:
        - partial
        - full
        default: partial
        required: false
        note: The minimum profile depth required for each ready result.
      include_profile:
        type: boolean
        default: true
        required: false
        note: Embed profile objects in results. This changes the response shape, not
          the enrichment work.
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        required: false
        note: The maximum number of matches returned from the existing Orbit index.
          Candidate Discovery results append outside this limit, and profile upgrades
          update selected results in place.
        min: 1
        max: 100
    note: 'Find people, optionally discover additional candidates, and build every
      selected result to the requested profile depth. Requires the `search:read` scope.
      Requests that include profiles also require `profile:read`. Idempotency-Key:
      A client-generated key for a safe retry. If the body omits `request_id`, Orbit
      can use this value as the request ID. Provide `query`, `intent`, at least one
      identity signal, or a supported combination. When query and intent are both
      present, Orbit derives a base intent from query and overlays the caller-provided
      intent. Arrays, scalar values, and null replace derived values; nested objects
      merge field by field. Reuse request_id for safe POST retries. Poll orbit.people.search.status
      with the returned search_id while status is running. completed_with_errors is
      terminal partial success: retain ready results and inspect failures. Do not
      repeat POST to poll. Native treg --await is not configured.'
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: Current Orbit v3 Search and Enrich documentation states no credit consumption;
      checked 2026-09-04. Rate limits and API-key authorization still apply.
  docs_url: https://docs.orbitsearch.com/
  untestable: 'No unattended replay: requires customer-owned resource IDs or can expose
    personal/account data or change scheduled work. Request schema comes from the
    public OpenAPI; not claimed live-verified.'
- id: orbit.people.search.status
  capability: people.search.status
  platform: people
  domain: search
  scope: own_account
  kind: utility
  method: GET
  path: /v3/search/{search_id}
  name: Get search status
  summary: Get search status
  input:
    pathParams:
      search_id:
        type: string
        minLength: 1
        required: true
    note: 'Return the latest search snapshot. Poll while the status is `running`.
      Requires the `search:read` scope. Searches that include profiles also require
      `profile:read`. Reuse request_id for safe POST retries. Poll orbit.people.search.status
      with the returned search_id while status is running. completed_with_errors is
      terminal partial success: retain ready results and inspect failures. Do not
      repeat POST to poll. Native treg --await is not configured.'
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: Current Orbit v3 Search and Enrich documentation states no credit consumption;
      checked 2026-09-04. Rate limits and API-key authorization still apply.
  docs_url: https://docs.orbitsearch.com/
  untestable: 'No unattended replay: requires customer-owned resource IDs or can expose
    personal/account data or change scheduled work. Request schema comes from the
    public OpenAPI; not claimed live-verified.'
- id: orbit.people.enrich.batch
  capability: people.enrich.batch
  platform: people
  domain: enrich
  scope: any_account
  kind: action
  method: POST
  path: /v3/enrich
  name: Batch enrich profiles
  summary: Batch enrich profiles
  input:
    bodyType: json
    body:
      request_id:
        type: string
        minLength: 1
        required: false
        note: The parent idempotency key for the batch.
      profile_ids:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
        required: true
        note: Provide between 1 and 20 Orbit profile IDs or slugs. Duplicate entries
          within this list are normalized before work starts.
      operation:
        type: string
        enum:
        - partial
        - full
        - regenerate
        required: true
        note: Use `partial` for a useful profile, `full` for the deepest available
          profile, or `regenerate` to rebuild a fresh full profile.
      include_profile:
        type: boolean
        default: true
        required: false
        note: Embed available profiles in child results.
    note: 'Apply one enrichment operation to between 1 and 20 known Orbit profile
      IDs. Requires the `search:read` scope. Requests that include profiles also require
      `profile:read`. Idempotency-Key: A client-generated key for a safe retry. If
      the body omits `request_id`, Orbit can use this value as the request ID. Read
      uses GET and starts no work. POST can build or regenerate a profile. Poll orbit.people.enrich.status
      with request_id until completed or failed. Batch accepts 1–20 IDs; poll each
      returned child links.status separately. Do not restart POST to poll. Native
      treg --await is not configured.'
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: Current Orbit v3 Search and Enrich documentation states no credit consumption;
      checked 2026-09-04. Rate limits and API-key authorization still apply.
  docs_url: https://docs.orbitsearch.com/
  untestable: 'No unattended replay: requires customer-owned resource IDs or can expose
    personal/account data or change scheduled work. Request schema comes from the
    public OpenAPI; not claimed live-verified.'
