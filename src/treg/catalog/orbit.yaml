      include_profile:
        type: boolean
        default: true
        required: false
        note: Embed the profile when it is available.
    note: 'Read, upgrade, or regenerate one known Orbit profile. Requires the `search:read`
      scope. Requests that include the profile also require `profile:read`. Idempotency-Key:
      A client-generated key for a safe retry. If the body omits `request_id`, Orbit
      can use this value as the request ID. Read uses GET and starts no work. POST
      can build or regenerate a profile. Poll orbit.people.enrich.status with request_id
      until completed or failed. Batch accepts 1–20 IDs; poll each returned child
