- id: orbit.people.webhooks.test
  capability: people.webhooks.test
  platform: people
  domain: webhooks
  scope: own_account
  kind: action
  method: POST
  path: /v3/webhooks/{webhook_id}/test
  name: Send a test delivery
  summary: Send a test delivery
  input:
    pathParams:
      webhook_id:
        type: string
        format: uuid
        required: true
    bodyType: json
    body:
      event_type:
        type: string
        enum:
        - profile.updated
        - company.thesis.changed
        - company.alert
        - portfolio.changed
        required: false
    note: >-
      Delivers one signed test event to the endpoint so you can verify your handler without waiting for
      a real event. The body is your most recent event of this type when you have one and the documented
      example payload otherwise; either way the envelope carries `"test": true` and an `evt_test_` event
      ID. Test deliveries are never retried and are not recorded in your delivery history. Requires the
      `webhooks:write` scope and is rate limited more tightly than other routes. Optional. Defaults to
      the first event type the endpoint subscribes to; must be one of its subscribed types.
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: Test deliveries are free.
  docs_url: https://docs.orbitsearch.com/api/webhooks/test
  untestable: >-
    needs a webhook_id owned by the calling account and a reachable HTTPS receiver; the route is rate
    limited more tightly than the rest of the API.
