- id: orbit.people.watchers.update
  capability: people.watchers.update
  platform: people
  domain: watchers
  scope: own_account
  kind: action
  method: PATCH
  path: /v3/watchers/{watcher_id}
  name: Update a watcher
  summary: Update a watcher
  input:
    pathParams:
      watcher_id:
        type: string
        format: uuid
        required: true
    bodyType: json
    body:
      enabled:
        type: boolean
        required: false
        note: '`false` pauses the watcher; `true` resumes it and schedules the next
          run.'
      interval_seconds:
        type: integer
        minimum: 3600
        maximum: 2592000
        required: false
        min: 3600
        max: 2592000
      phases:
        type:
        - array
        - 'null'
        items:
          type: string
          enum:
          - existing_sources
          - existing_socials
          - new_sources
          description: '`existing_sources` watches sources already on the profile
            for updates; `existing_socials` watches the person''s social activity;
            `new_sources` looks for new sources about the person.'
        required: false
        note: Send `null` to run all three phases.
    note: Pause, resume, retime or rescope a watcher. Send the fields you want to
      change. Requires the `watchers:write` scope. Send the fields you want to change.
