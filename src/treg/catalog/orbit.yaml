- id: orbit.people.watchers.create
  capability: people.watchers.create
  platform: people
  domain: watchers
  scope: own_account
  kind: action
  method: POST
  path: /v3/watchers
  name: Create a watcher
  summary: Create a watcher
  input:
    bodyType: json
    body:
      orbit_id:
        type: string
        format: uuid
        required: true
        note: The profile to watch — the `id` returned by search and profile reads.
      interval_seconds:
        type: integer
        minimum: 3600
        maximum: 2592000
        required: true
        note: How often to refresh, from `3600` (hourly) to `2592000` (every 30 days).
        min: 3600
        max: 2592000
      phases:
        type:
        - array
        - 'null'
        items:
          type: string
          enum:
          - existing_sources
          - existing_socials
          - new_sources
          description: '`existing_sources` watches sources already on the profile
            for updates; `existing_socials` watches the person''s social activity;
            `new_sources` looks for new sources about the person.'
        required: false
        note: Restrict runs to these phases. Omit or send `null` to run all three.
    note: Start watching a profile. Orbit checks it on the schedule you choose and
      adds what it finds to the profile. Each profile has one watcher per organization;
      creating a watcher for a profile you already watch updates that watcher and
      turns it back on. Requires the `watchers:write` scope.
  cost:
    type: per_call
    value: null
    currency: USD
    unit: call
    source: docs
    source_url: https://docs.orbitsearch.com/
    checked: '2026-09-04'
    confidence: unknown
    note: No per-operation public price was established for watcher or webhook operations.
      BYOK only; do not treat unknown pricing as free or enable platform-key billing.
  docs_url: https://docs.orbitsearch.com/
  untestable: 'No unattended replay: requires customer-owned resource IDs or can expose
    personal/account data or change scheduled work. Request schema comes from the
    public OpenAPI; not claimed live-verified.'
