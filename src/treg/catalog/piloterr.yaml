- id: piloterr.google.serp.organic
  capability: google.serp.organic
  platform: google
  domain: search
  scope: any_account
  method: GET
  path: /v2/google/search
  name: Search Google
  summary: Search Google and return organic results, knowledge graph and related searches as JSON.
  input:
    queryParams:
      query:
        type: string
        required: true
        example: best electric cars
        note: The search query to execute on Google. Supports all standard Google search operators.
      tbs:
        type: string
        required: false
        note: Advanced time-range and filter string for Google Search. Used to restrict results by recency.
      location:
        type: string
        required: false
        note: City or region from which the search should originate. Simulates a real user's search from the specified location.
      uule:
        type: string
        required: false
        note: Google-encoded location string for precise geographic targeting.
      google_domain:
        type: string
        required: false
        default: google.com
      gl:
        type: string
        required: false
        default: us
        example: us
      hl:
        type: string
        required: false
        default: en
        example: en
      cr:
        type: string
        required: false
      lr:
        type: string
        required: false
      page:
        type: number
        required: false
        default: 1
        note: Page number of search results to retrieve.
      num:
        type: number
        required: false
        default: 10
        example: 10
      safe:
        type: string
        required: false
  test_request:
    queryParams:
      query: best electric cars
      gl: us
      hl: en
      num: 10
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  added: '2026-11-09'
  docs_url: https://www.piloterr.com/library
- id: piloterr.amazon.search.products
  capability: amazon.search.products
  platform: amazon
  domain: ecommerce
