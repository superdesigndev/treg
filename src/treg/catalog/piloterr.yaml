- id: piloterr.ebay.search.products
  capability: ebay.search.products
  platform: ebay
  domain: ecommerce
  scope: any_account
  method: GET
  path: /v2/ebay/search
  name: Search eBay listings
  summary: Search eBay listings by keyword and return price, seller and pagination.
  input:
    queryParams:
      query:
        type: string
        required: true
        example: laptop
        note: Keyword on www.ebay.com, or a search URL on a supported eBay site.
      page:
        type: number
        required: false
        note: Page number, sent as _pgn. Default 1 for a keyword. On a URL, the page already in the URL is kept when this
          is empty. Below 1 returns 400.
      return_page_source:
        type: boolean
        required: false
        note: When true, return raw HTML.
