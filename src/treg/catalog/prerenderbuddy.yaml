- id: prerenderbuddy.answer.status
  capability: web.answer.status
  platform: web
  domain: answer
  scope: any_account
  kind: utility
  method: GET
  path: /marketplace/jobs/{id}
  name: Read a queued answer and its charge
  summary: Read progress or the completed answer for a job created by this API key.
  resource_ownership:
    requires:
      kind: poll:prerenderbuddy.answer.status
      param: id
  input:
    pathParams:
      id:
        type: string
        required: true
        format: uuid
        note: Use the jobId returned by a standalone answer submission using the same key.
    note: Use pollAfterSeconds. Content is retained seven days; later reads return 410 without charging again.
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
