- id: prerenderbuddy.chatgpt.answer
  capability: ai-search.chatgpt.answer
  platform: ai-search
  domain: chatgpt
  scope: any_account
  method: POST
  path: /marketplace/answers/chatgpt
  body_allowlist: true
  name: Get a ChatGPT answer with brand evidence
  summary: Queue one realtime ChatGPT API answer with returned sources, citations and optional brand/competitor
    evidence.
  input:
    headers:
      Idempotency-Key:
        type: string
        required: false
        note: "1\u2013256 printable characters. Reuse for retries of the same request; changed parameters return\
          \ 409."
    bodyType: json
    body:
      prompt:
        type: string
        required: true
        minLength: 5
        maxLength: 1000
        example: What does Prerender Buddy do? Answer briefly with sources.
      brand:
        type: object
        required: false
        note: "Object with required name (1\u2013100 characters), optional aliases (at most 5 strings, 1\u2013\
          100 characters each), and optional domain (hostname only, at most 253 characters). Evidence is inspected\
          \ after collection; subjects are not appended to the prompt."
        example: &id001
          name: Prerender Buddy
          domain: prerenderbuddy.com
      competitors:
        type: array[object]
        required: false
        maxItems: 10
        note: At most 10 subject objects with the same name/aliases/domain structure as brand.
    note: Only the submitted question is sent for collection. No location, model or output-size override. Review
      supporting spans for recommendation heuristics; opaque citation URLs can leave websiteCited unknown.
  cost:
    type: per_success
    value: 0.025
    currency: USD
    unit: call
    source: rate_card_api
    source_url: https://api.prerenderbuddy.com/v1/developer/marketplace/rate-card
    checked: '2026-10-02'
    confidence: documented
    reported_charge:
      path: billing.chargedUsd
      unit: usd
    note: Fixed price reserved at submission and charged once for a completed, non-empty answer. Failures release
      credit. Mentions/citations and free polls add no fee.
  async:
    id_from: jobId
    poll:
      endpoint: prerenderbuddy.answer.status
      param:
        in: pathParams
        name: id
    status:
      path: status
      progress:
      - queued
      - running
      - submitted
      success:
      - completed
      failure:
      - failed
    result:
      path: result
    interval: 5
  docs_url: https://api.prerenderbuddy.com/v1/developer/marketplace/docs
  test_request:
    body:
      prompt: What does Prerender Buddy do? Answer briefly with sources.
      brand: &id002
        name: Prerender Buddy
        domain: prerenderbuddy.com
