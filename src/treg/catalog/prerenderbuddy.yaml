provider: prerenderbuddy
source:
  docs: https://api.prerenderbuddy.com/v1/developer/marketplace/docs
  openapi: https://api.prerenderbuddy.com/v1/developer/marketplace/openapi.json
  curated: '2026-10-02'
pricing_url: https://api.prerenderbuddy.com/v1/developer/marketplace/rate-card
limits: 'Standalone answers require the marketplace scope and prepaid API credit, not a PB subscription. Shared-key
  calls inspect only the submitted prompt and subjects. Private saved workspace evidence is BYOK only, with
  Developer API entitlement and matching read scopes. Standalone limits: 1,000 prompt characters, 10 new requests/minute
  and 3 pending/account; answers expire after 23 hours and result content after 7 days. Mentions and citations
  are included; failed or missing answers and status polls have no charge. Claude uses native batch processing
  and can take hours. Other platforms use queued realtime processing. These are provider API samples, not consumer-app
  scrapes or a historical mentions index. The initial pilot has bounded provider capacity; exhausted capacity
  returns 503 without a charge.'
proposed_capabilities:
  web.sites.list: List websites registered in your connected workspace
  web.site.overview: Read saved website setup, monitoring and visibility context
  web.monitoring.evidence: Read saved website health checks, incidents and discovery-file findings
  web.crawlers.activity: Read recorded crawler visits grouped by platform and page
  web.improvements.recommendations: Read website improvements grounded in recorded evidence
  web.content.status: Read article-draft and publication-calendar metadata for a website
  web.content.ideas: List tracked questions with recorded evidence suitable for article proposals
endpoints:
- id: prerenderbuddy.sites
  capability: web.sites.list
  platform: web
  domain: account
  scope: own_account
  kind: account
  method: GET
  path: /sites
  name: List workspace websites
  summary: List registered sites available to the API key workspace.
  input:
    note: Requires the sites API key scope. Missing recorded evidence is not proof of a negative outcome.
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://prerenderbuddy.com/developer-api
    checked: '2026-10-02'
    confidence: documented
    note: Included reads for an entitled connected workspace; a subscription is required. No fresh render or
      article-draft allowance is consumed. BYOK only; no shared-platform workspace data.
  docs_url: https://prerenderbuddy.com/developer-api
  test_request:
    queryParams: {}
