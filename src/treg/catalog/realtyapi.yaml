provider: realtyapi
source:
  docs: https://www.realtyapi.io/docs
  # Each portal publishes its own spec at https://<portal>.realtyapi.io/openapi.json (no key
  # needed). Paths and parameters here are taken from those specs.
  openapi: https://zillow.realtyapi.io/openapi.json
  curated: '2026-11-17'
pricing_url: https://www.realtyapi.io/pricing
limits: "No per-key rate limit is published; concurrent requests are unlimited on every plan."

# The ten most-used portals over the last 30 days with their most-used routes (search and details
# for each, plus Zillow agents, charts and market data); Skip Trace is excluded. One key works on
# every portal host; the Zillow host is the base_url and the other hosts are catalog targets.
proposed_capabilities:
  # Also proposed by crawl4ai.yaml with this exact wording: two providers now share it.
  zillow.property.detail: One Zillow home
  zillow.property.lookup: "Look up a Zillow home by street address"
  zillow.search.listings: "Search Zillow homes for sale, for rent or sold in an area"
  zillow.agent.search: "Find real estate agents on Zillow by area or name"
  realtor.property.detail: "Get one Realtor.com home by property id"
  realtor.property.lookup: "Look up a Realtor.com home by street address"
  realtor.search.mls: "Find a Realtor.com listing by its MLS number"
  realtor.search.listings: "Search Realtor.com homes for sale, for rent or sold in an area"
  redfin.property.lookup: "Look up a Redfin home by street address"
  streeteasy.rental.detail: "Get one New York City rental from StreetEasy"
  airbnb.search.homes: "Search Airbnb stays in a destination"
  rightmove.property.detail: "Get one Rightmove property listing"
  # Also proposed by crawl4ai.yaml with this exact wording.
  airbnb.listing.detail: One Airbnb listing
  zillow.search.radius: "Search Zillow homes within a radius of a map point"
  zillow.location.suggest: "Suggest Zillow addresses, places and ZIP codes for typed text"
  zillow.agent.detail: "Get a Zillow agent's profile, sales and reviews"
  zillow.agent.sales: "List the homes a Zillow agent has sold"
  zillow.property.charts: "Chart a Zillow home's value, rent, price or tax history"
  zillow.property.history: "Get a Zillow home's price history"
  zillow.property.photos: "List a Zillow home's photos"
  zillow.property.walkscore: "Get a Zillow home's Walk, Transit and Bike Scores"
  zillow.market.trends: "Get Zillow housing market stats for an area"
  zillow.property.comparables: "List comparable homes for a Zillow home"
  realtor.location.suggest: "Suggest Realtor.com places and addresses for typed text"
  realtor.search.radius: "Search Realtor.com homes within a radius of a map point"
  realtor.agent.detail: "Get a Realtor.com agent's profile and listings"
  realtor.agent.search: "Find real estate agents on Realtor.com by area or name"
  redfin.property.detail: "Get one Redfin home by property id"
  redfin.search.listings: "Search Redfin homes for sale, for rent or sold in an area"
  redfin.search.radius: "Search Redfin homes around a map point"
  redfin.market.trends: "Get Redfin housing market trends for an area"
  streeteasy.search.rentals: "Search New York City rentals on StreetEasy"
  streeteasy.search.sales: "Search New York City homes for sale on StreetEasy"
  streeteasy.sale.detail: "Get one New York City sale listing from StreetEasy"
  airbnb.listing.availability: "Check an Airbnb listing's availability calendar"
  rightmove.search.listings: "Search Rightmove homes for sale or to rent in a UK area"
  rightmove.search.postcode: "Search Rightmove homes around a UK postcode"
  rightmove.sold.prices: "Get sold house prices for a UK area from Rightmove"
  homes-com.property.lookup: "Look up a Homes.com home by street address"
  homes-com.search.listings: "Search Homes.com homes for sale, for rent or sold in an area"
  homes-com.agent.detail: "Get a Homes.com agent's profile"
  apartments-com.property.detail: "Get one Apartments.com rental property"
  apartments-com.search.listings: "Search Apartments.com rentals in an area"
  realestate-au.search.listings: "Search realestate.com.au homes in an Australian suburb or area"
  realestate-au.search.postcode: "Search realestate.com.au homes by Australian postcode"
  realestate-au.property.detail: "Get one realestate.com.au listing"
  bayut.location.suggest: "Suggest Bayut locations for typed text"
  bayut.search.listings: "Search Bayut properties for sale or rent in a UAE location"
  bayut.property.detail: "Get one Bayut property listing"

# Every request that passes the key check costs one credit, an empty result included, so misses
# and errors in a 2xx answer are charged.
defaults:
  price: {value: '1', currency: credit, per: 1, unit: call}
  bill: {miss: charged, error: charged}
  provenance: {source: docs, source_url: 'https://www.realtyapi.io/pricing', checked: '2026-11-17', confidence: documented}

endpoints:
  # --- Zillow -------------------------------------------------------------------------------------
  - id: realtyapi.zillow.property.detail
    added: '2026-11-17'
    capability: zillow.property.detail
    platform: zillow
    scope: any_account
    method: GET
    path: /pro/byzpid
    name: "Zillow home by zpid"
    summary: "Get one Zillow home by zpid: status, price, Zestimate, rent estimate, beds, baths, living area, price and tax history, schools and photos."
    input:
      queryParams:
        zpid: {type: string, required: true, note: "the number before _zpid in a Zillow home URL", example: "44471319"}
    test_request:
      queryParams: {zpid: "44471319"}
    miss: {when: {path: response.propertyDetails.zpid, op: absent}}
    docs_url: https://www.realtyapi.io/docs/zillow/by-zpid

  - id: realtyapi.zillow.property.lookup
    added: '2026-11-17'
    capability: zillow.property.lookup
    platform: zillow
    scope: any_account
    method: GET
    path: /pro/byaddress
    name: "Zillow home by street address"
    summary: "Find a Zillow home from its street address and return its full details: zpid, status, price, Zestimate, facts, price history and photos."
    input:
      queryParams:
        propertyaddress: {type: string, required: true, note: "street, city, state and ZIP", example: "1875 AVONDALE Circle, Jacksonville, FL 32205"}
    test_request:
      queryParams: {propertyaddress: "1875 AVONDALE Circle, Jacksonville, FL 32205"}
    miss: {when: {path: response.propertyDetails.zpid, op: absent}}
    docs_url: https://www.realtyapi.io/docs/zillow/by-property-address

  - id: realtyapi.zillow.search.listings
    added: '2026-11-17'
    capability: zillow.search.listings
    platform: zillow
    scope: any_account
    method: GET
    path: /search/byaddress
    name: "Search Zillow listings in an area"
    summary: "Search Zillow homes for sale, for rent or sold in a city, ZIP, neighborhood or address, with Zillow's price, bed, bath, home type and days-listed filters."
    input:
      queryParams:
        location: {type: string, required: true, note: "address, neighborhood, city or ZIP; up to 5 separated by semicolons", example: "Montauk, NY"}
        listingStatus: {type: string, required: true, enum: [For_Sale, For_Rent, Sold], example: For_Sale}
        page: {type: integer, required: false, default: 1, min: 1, max: 5, note: "up to 200 results a page and 1,000 a search; split a bigger area to collect more"}
        sortOrder: {type: string, required: false, enum: [Homes_for_you, Rental_Priority_Score, Price_High_to_Low, Price_Low_to_High, Newest, Bedrooms]}
        listPriceRange: {type: string, required: false, note: "min:5000, max:500000, or either bound alone", example: "min:300000, max:900000"}
        bed_min: {type: string, required: false, enum: [No_Min, Studio, '1', '2', '3', '4']}
        bed_max: {type: string, required: false, enum: [No_Max, Studio, '1', '2', '3', '4']}
        bathrooms: {type: string, required: false, enum: [Any, OnePlus, OneHalfPlus, TwoPlus, ThreePlus, FourPlus]}
        homeType: {type: string, required: false, note: "comma-separated; empty means every type", example: "Houses, Townhomes"}
        daysOnZillow: {type: string, required: false, enum: [Any, 1_day, 7_days, 14_days, 30_days, 90_days], note: "For_Sale and For_Rent only"}
        soldInLast: {type: string, required: false, enum: [Any, 1_day, 7_days, 14_days, 30_days, 90_days], note: "Sold only"}
        keywords: {type: string, required: false, note: "free text such as an MLS number, pool or fireplace"}
    test_request:
      queryParams: {location: "Montauk, NY", listingStatus: For_Sale}
    miss: {when: {any: [{path: response.searchResults, op: absent}, {path: response.searchResults, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/searchbyaddress

  - id: realtyapi.zillow.agent.search
    added: '2026-11-17'
    capability: zillow.agent.search
    platform: zillow
    scope: any_account
    method: GET
    path: /agent/search
    name: "Find Zillow agents"
    summary: "Find real estate agents on Zillow by city or ZIP, optionally by name, with ratings, price range, recent sales counts and profile links."
    input:
      queryParams:
        location: {type: string, required: false, note: "city, neighborhood or ZIP", example: "10001"}
        agentName: {type: string, required: false, example: "Alex"}
        page: {type: integer, required: false, default: 1, min: 1}
        isTopAgent: {type: boolean, required: false}
        specialties: {type: string, required: false, note: "comma-separated, no spaces, such as first-time-home-buyers,luxury-homes"}
        languages: {type: string, required: false, note: "comma-separated, no spaces, such as spanish,french"}
    test_request:
      queryParams: {location: "10001"}
    miss: {when: {any: [{path: response.agents, op: absent}, {path: response.agents, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/agentsearch

  - id: realtyapi.zillow.search.radius
    added: '2026-11-17'
    capability: zillow.search.radius
    platform: zillow
    scope: any_account
    method: GET
    path: /search/bycoordinates
    name: "Search Zillow listings around a point"
    summary: "Search Zillow homes for sale, for rent or sold within a radius of a latitude and longitude, with Zillow's price, bed, bath and home type filters."
    input:
      queryParams:
        latitude: {type: "string", required: true, example: "40.599283"}
        longitude: {type: "string", required: true, example: "-74.129194"}
        radius: {type: "string", required: true, note: "circle radius around the point", example: "0.5"}
        listingStatus: {type: "string", required: true, enum: ["For_Sale", "For_Rent", "Sold"], example: "For_Sale"}
        page: {type: "integer", required: false, min: 1, max: 5, example: 1}
        sortOrder: {type: "string", required: false, enum: ["Homes_for_you", "Rental_Priority_Score", "Price_High_to_Low", "Price_Low_to_High", "Newest", "Bedrooms", "Bathrooms", "Square_Feet", "Lot_Size", "Year_Built"]}
        listPriceRange: {type: "string", required: false, note: "min:5000, max:500000, or either bound alone"}
        bed_min: {type: "string", required: false, enum: ["No_Min", "Studio", "1", "2", "3", "4", "5"]}
        bed_max: {type: "string", required: false, enum: ["No_Max", "Studio", "1", "2", "3", "4", "5"]}
        homeType: {type: "string", required: false, note: "comma-separated; empty means every type"}
    test_request:
      queryParams: {latitude: "40.599283", longitude: "-74.129194", radius: "0.5", listingStatus: "For_Sale"}
    miss: {when: {any: [{path: response.searchResults, op: absent}, {path: response.searchResults, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/searchbycoordinates

  - id: realtyapi.zillow.location.suggest
    added: '2026-11-17'
    capability: zillow.location.suggest
    platform: zillow
    scope: any_account
    method: GET
    path: /autocomplete
    name: "Zillow address and place suggestions"
    summary: "Suggest Zillow addresses, cities, neighborhoods and ZIP codes for typed text, with each address's zpid and coordinates."
    input:
      queryParams:
        query: {type: "string", required: true, note: "partial address, city, neighborhood or ZIP", example: "649 Keller St, Bay St Louis, MS 39520"}
    test_request:
      queryParams: {query: "649 Keller St, Bay St Louis, MS 39520"}
    miss: {when: {any: [{path: response.results, op: absent}, {path: response.results, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/autocomplete

  - id: realtyapi.zillow.agent.detail
    added: '2026-11-17'
    capability: zillow.agent.detail
    platform: zillow
    scope: any_account
    method: GET
    path: /agent/details
    name: "Zillow agent profile"
    summary: "Get a Zillow agent's profile: contact details, ratings and reviews, licenses, sales stats, past sales, service areas and active listings."
    input:
      queryParams:
        username: {type: "string", required: false, note: "the last part of the agent's Zillow profile URL; send username or agent_link", example: "Alex-Antigua"}
        agent_link: {type: "string", required: false, note: "the agent's full Zillow profile URL"}
    test_request:
      queryParams: {username: "Alex-Antigua"}
    miss: {when: {any: [{path: response.agent_details, op: absent}, {path: response.agent_details, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/agentdetails

  - id: realtyapi.zillow.agent.sales
    added: '2026-11-17'
    capability: zillow.agent.sales
    platform: zillow
    scope: any_account
    method: GET
    path: /agent/sold_properties
    name: "Homes a Zillow agent sold"
    summary: "List the homes a Zillow agent sold, with sale date, price, side represented, address and zpid."
    input:
      queryParams:
        encodedZuid: {type: "string", required: true, note: "the agent's encodedZuid from a Zillow agent search result", example: "X1-ZU10bs62tnoyy2x_5dugv"}
        page: {type: "integer", required: false, min: 1}
    test_request:
      queryParams: {encodedZuid: "X1-ZU10bs62tnoyy2x_5dugv"}
    miss: {when: {any: [{path: response.pastSales, op: absent}, {path: response.pastSales, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/agentsoldproperties

  - id: realtyapi.zillow.property.charts
    added: '2026-11-17'
    capability: zillow.property.charts
    platform: zillow
    scope: any_account
    method: GET
    path: /graph_charts
    name: "Zillow home value and tax charts"
    summary: "Get chart data for one Zillow home over time: Zestimate, rent Zestimate, list price, Zestimate change, tax assessment or tax paid."
    input:
      queryParams:
        which: {type: "string", required: true, enum: ["zestimate_history", "rent_zestimate_history", "listing_price", "zestimate_percent_change", "tax_assessment", "tax_paid"], example: "zestimate_history"}
        recent_first: {type: "boolean", required: true, example: true}
        byzpid: {type: "string", required: false, note: "send one of byzpid, byaddress or byurl", example: "30907787"}
        byaddress: {type: "string", required: false}
        byurl: {type: "string", required: false}
    test_request:
      queryParams: {which: "zestimate_history", recent_first: true, byzpid: "30907787"}
    miss: {when: {any: [{path: response.DataPoints.homeValueChartData, op: absent}, {path: response.DataPoints.homeValueChartData, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/tax-paid-history

  - id: realtyapi.zillow.property.history
    added: '2026-11-17'
    capability: zillow.property.history
    platform: zillow
    scope: any_account
    method: GET
    path: /pricehistory
    name: "Zillow home price history"
    summary: "Get a Zillow home's price history: listings, price changes, sales and rentals with dates, prices and price per square foot."
    input:
      queryParams:
        byzpid: {type: "string", required: false, note: "send one of byzpid, byaddress or byurl", example: "44466838"}
        byaddress: {type: "string", required: false}
        byurl: {type: "string", required: false}
    test_request:
      queryParams: {byzpid: "44466838"}
    miss: {when: {any: [{path: response.priceHistory, op: absent}, {path: response.priceHistory, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/pricehistory

  - id: realtyapi.zillow.property.photos
    added: '2026-11-17'
    capability: zillow.property.photos
    platform: zillow
    scope: any_account
    method: GET
    path: /propimages
    name: "Zillow home photos"
    summary: "List a Zillow home's full-resolution photos, plus its street-view image when Zillow has one."
    input:
      queryParams:
        byzpid: {type: "string", required: false, note: "send one of byzpid, byaddress or byurl", example: "44472566"}
        byaddress: {type: "string", required: false}
        byurl: {type: "string", required: false}
    test_request:
      queryParams: {byzpid: "44472566"}
    miss: {when: {any: [{path: response.originalPhotos, op: absent}, {path: response.originalPhotos, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/propertyimages

  - id: realtyapi.zillow.property.walkscore
    added: '2026-11-17'
    capability: zillow.property.walkscore
    platform: zillow
    scope: any_account
    method: GET
    path: /walk_transit_bike
    name: "Zillow home Walk Score"
    summary: "Get the Walk Score, Transit Score and Bike Score of a Zillow home."
    input:
      queryParams:
        byzpid: {type: "string", required: false, note: "send one of byzpid, byaddress or byurl", example: "44466838"}
        byaddress: {type: "string", required: false}
        byurl: {type: "string", required: false}
    test_request:
      queryParams: {byzpid: "44466838"}
    miss: {when: {any: [{path: response.walk_transit_bike, op: absent}, {path: response.walk_transit_bike, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/walktransitbike

  - id: realtyapi.zillow.market.trends
    added: '2026-11-17'
    capability: zillow.market.trends
    platform: zillow
    scope: any_account
    method: GET
    path: /housing_market
    name: "Zillow housing market stats"
    summary: "Get Zillow housing market stats for a city, ZIP or neighborhood: typical home value, inventory, new listings, median list and sale prices, sale-to-list ratio and days to pending."
    input:
      queryParams:
        search_query: {type: "string", required: true, note: "city, ZIP or neighborhood", example: "Austin, TX"}
        home_type: {type: "string", required: false, enum: ["All_Homes", "Single_Family", "Condo"]}
        exclude_rentalMarketTrends: {type: "boolean", required: false}
        exclude_neighborhoods_zhvi: {type: "boolean", required: false}
    test_request:
      queryParams: {search_query: "Austin, TX"}
    miss: {when: {any: [{path: response.market_overview, op: absent}, {path: response.market_overview, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/housingmarket-zhvi

  - id: realtyapi.zillow.property.comparables
    added: '2026-11-17'
    capability: zillow.property.comparables
    platform: zillow
    scope: any_account
    method: GET
    path: /comparable_homes
    name: "Comparable homes on Zillow"
    summary: "List comparable homes for one Zillow home, with each comp's price, facts and zpid."
    input:
      queryParams:
        byzpid: {type: "string", required: false, note: "send one of byzpid, byaddress or byurl", example: "44471319"}
        byaddress: {type: "string", required: false}
        byurl: {type: "string", required: false}
    test_request:
      queryParams: {byzpid: "44471319"}
    miss: {when: {any: [{path: response.comparable_homes, op: absent}, {path: response.comparable_homes, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/zillow/comparablehomes

  # --- Realtor.com --------------------------------------------------------------------------------
  - id: realtyapi.realtor.property.detail
    added: '2026-11-17'
    capability: realtor.property.detail
    platform: realtor
    scope: any_account
    method: GET
    host: realtor.realtyapi.io
    path: /details/byid
    name: "Realtor.com home by property id"
    summary: "Get one Realtor.com home by property id: status, price, facts, MLS details, agent and office, tax and price history, schools and photos."
    input:
      queryParams:
        property_id: {type: string, required: true, note: "digits only; every Realtor.com search result carries it", example: "8955838462"}
        listing_id: {type: string, required: false, note: "picks one listing when the property has several"}
    test_request:
      queryParams: {property_id: "8955838462"}
    miss: {when: {path: response.detail.property_id, op: absent}}
    docs_url: https://www.realtyapi.io/docs/realtor/detailsbyid

  - id: realtyapi.realtor.property.lookup
    added: '2026-11-17'
    capability: realtor.property.lookup
    platform: realtor
    scope: any_account
    method: GET
    host: realtor.realtyapi.io
    path: /details/byaddress
    name: "Realtor.com home by street address"
    summary: "Find a Realtor.com home from its street address and return its full details: property id, status, price, facts, MLS details and photos."
    input:
      queryParams:
        address: {type: string, required: true, note: "street, city, state and ZIP; encode # as %23", example: "9504 Quail Village Ln, Austin, TX 78758"}
    test_request:
      queryParams: {address: "9504 Quail Village Ln, Austin, TX 78758"}
    miss: {when: {path: response.detail.property_id, op: absent}}
    docs_url: https://www.realtyapi.io/docs/realtor/detailsbyaddress

  - id: realtyapi.realtor.search.mls
    added: '2026-11-17'
    capability: realtor.search.mls
    platform: realtor
    scope: any_account
    method: GET
    host: realtor.realtyapi.io
    path: /search/bymls
    name: "Realtor.com listing by MLS number"
    summary: "Find Realtor.com listings by MLS number, active or sold, each with its property id, MLS board and listing card."
    input:
      queryParams:
        mlsId: {type: string, required: true, note: "the MLS number as printed on the listing; letters allowed", example: "9647628"}
        mlsBoard: {type: string, required: false, note: "Realtor.com board code such as AUTX, to match one MLS only"}
        location: {type: string, required: false, note: "city, ZIP or state to narrow the match", example: "Austin, TX"}
        searchType: {type: string, required: false, default: "For_Sale,Sold", note: "comma-separated For_Sale, For_Rent, Sold"}
        page: {type: integer, required: false, default: 1, min: 1}
        resultCount: {type: integer, required: false, default: 50, min: 1, max: 200}
    test_request:
      queryParams: {mlsId: "9647628"}
    miss: {when: {any: [{path: response.searchResults, op: absent}, {path: response.searchResults, op: empty}]}}
    docs_url: https://www.realtyapi.io/docs/realtor/searchbymls

  - id: realtyapi.realtor.search.listings
    added: '2026-11-17'
    capability: realtor.search.listings
    platform: realtor
    scope: any_account
    method: GET
    host: realtor.realtyapi.io
    path: /search/bylocation
    name: "Search Realtor.com listings in an area"
    summary: "Search Realtor.com homes for sale, for rent or sold in a city, ZIP, neighborhood, county or state, with price, bed, bath, type and status filters."
    input:
      queryParams:
        location: {type: string, required: true, note: "city, ZIP, neighborhood, county or state", example: "Austin, TX"}
        searchType: {type: string, required: false, default: For_Sale, note: "comma-separated For_Sale, For_Rent, Sold"}
        page: {type: integer, required: false, default: 1, min: 1, note: "keep paging while nextPage is true"}
        resultCount: {type: integer, required: false, default: 50, min: 1, max: 200}
        sortOrder: {type: string, required: false, enum: [Recommended, Newest, Oldest, Price_High_to_Low, Price_Low_to_High, Square_Feet]}
        propertyType: {type: string, required: false, note: "comma-separated House, Condo, Townhome, Multi_Family, Mobile, Farm, Land, Co-op"}
        priceRange: {type: string, required: false, note: "min:500000,max:1500000, or either bound alone"}
        bedsRange: {type: string, required: false, note: "min:3,max:5, or either bound alone"}
