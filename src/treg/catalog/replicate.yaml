        - {when: {body.input.quality: high}, value: 0.128, times: body.input.number_of_images}
        - {when: {body.input.quality: xhigh}, value: 0.25, times: body.input.number_of_images}
        - {when: {body.input.quality: max}, value: 0.50, times: body.input.number_of_images}
      fallback: {value: 2.001, note: "Four max-quality images at the documented rate ($2.00), rounded up to clear float comparison."}
      currency: USD
      settle: table
      source: docs
      source_url: https://replicate.com/openai/gpt-image-2.5-flare
      checked: 2026-09-14
      confidence: documented
      note: "Replicate's model page prices per output image by quality tier; times number_of_images."
    verified: 2026-09-14
    added: '2026-09-14'
    example_response: examples/replicate.image-gen.gpt-image-2-5-flare.json
    docs_url: https://replicate.com/openai/gpt-image-2.5-flare/api

