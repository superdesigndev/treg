provider: reversecontact
source:
  docs: https://docs.reversecontact.com
  openapi: https://api.reversecontact.com/openapi.json   # OpenAPI 3.1, public, no auth
  curated: '2026-10-09'
limits: "Per-workspace requests per minute set by the plan, read live from GET /v2/usage (quotas.workspace.minuteRateLimit); optional per-key minute and daily caps. Over a limit: HTTP 429 RATE_LIMIT_EXCEEDED or DAILY_LIMIT_EXCEEDED. GET /v2/usage, GET /v2/webhooks/{webhookId} and the two available-fields routes are not counted."
pricing_url: https://www.reversecontact.com/pricing

# CURATED BY THE VENDOR and self-verified live on 2026-10-09 with a pay-as-you-go workspace key
# (ledger in the PR). No `verified:` stamp and no example response: those are the maintainers' to add.
#
# BILLING. One credit pool. The public pricing page lists the per-endpoint credit price, and every
# response reports what the call charged in `quotas.creditsConsumed` (async jobs: the reservation on
# the acknowledgement, the net figure in the poll body's `data.creditsConsumed`). On 2026-10-09 the
# fourteen credits spent across the paid test calls matched the workspace balance delta exactly
# (701,565 -> 701,551).
#   enrich (email, name or domain) 2 · fetch cached 1 · fetch live 2 · people search 1 per profile
#   lookalike 1 per profile · company search 1 per page (up to 100 companies) · work email 3
#   direct phone 20 · count, check, available-fields, usage and polling 0
# A miss is free: enrich and fetch answer HTTP 404 at 0 credits, and the email and phone finders
# refund their reservation when nothing is found. Every 4xx/5xx other than 404 is free as well.
#
# FREE PRE-FLIGHT ROUTES. /v2/search/people/count sizes a search, the available-fields routes list
# every filter and its accepted values, and the /check routes say whether a profile is on file and
# how fresh it is. An agent can shape a whole query for nothing and pay only for rows.
#
# ASYNC. Live fetch and the contact finders answer at once with {status: created, webhookId,
# pollUrl}; GET /v2/webhooks/{webhookId} is the free poll (results kept 72 hours). Webhook delivery
# (`webhookUrl`) is optional and not modelled: the poll is the honest interface for a proxy.
#
# NOT MODELLED (deliberate, see the surface map in the PR):
#   - POST /v2/fetch/companies/live: same job as the cached company fetch, re-sourced in real time.
#     Company pages change slowly; one live row (people) shows the async shape.
#   - POST /v2/search/people/prompt: plain-language prompt turned into people-search filters by an
#     LLM (1 credit per request + 1 per profile). Agents compose the filters themselves through the
#     search row and its free filter list.
#   - /v2/lists/* (11 routes): saved-list workspace CRUD and bulk enrich, bound to the dashboard.
#   - POST /v2/search/persons (legacy, retired 2026-10-13) and /v2/resolve/* (retired, HTTP 410).

proposed_capabilities:
  people.profile.check: "Check a person's profile is on file and how fresh it is, before paying to fetch it"
  companies.profile.check: "Check a company's profile is on file and how fresh it is, before paying to fetch it"
  companies.search.filters: "List the accepted values for a company-search filter"
  account.jobs.get: "Get one background job's details"

endpoints:

  # ---------------------------------------------------------------------------------------------
  # People
  # ---------------------------------------------------------------------------------------------
  - id: reversecontact.people.enrich
    added: '2026-10-09'
    capability: people.enrich
    platform: people
    scope: any_account
    miss:
      status: 404
      means: "`Could not resolve the provided identifiers to a profile`: nobody matches, an expected outcome. Free (quotas.creditsConsumed 0); observed 2026-10-09, 555 ms"
    method: POST
    path: /v2/enrich/persons
    name: "Enrich a person from email or name + company domain"
    summary: "Enrich person"
    input:
      body:
        email: {type: string, required: false, note: "work or personal email", example: "jane.doe@acme.com"}
        firstName: {type: string, required: false, example: "Satya"}
        lastName: {type: string, required: false, example: "Nadella"}
        companyDomain: {type: string, required: false, note: "current employer's domain, sharpens a name match", example: "microsoft.com"}
        companyName: {type: string, required: false, note: "current employer's name, when the domain is unknown", example: "Microsoft"}
      note: "at least one field. An email alone works (reverse lookup); a name works best with companyDomain. Returns the full profile in data.person (experience, education, skills, location, current company) plus data.alternativePersons when the match is ambiguous."
    test_request:
      body: {firstName: "Satya", lastName: "Nadella", companyDomain: "microsoft.com"}
    cost:
      type: per_success
      value: 2
      currency: credit
      per: 1
      unit: record
      reported_charge: {path: quotas.creditsConsumed, unit: credit}
      source: observed
      source_url: https://www.reversecontact.com/pricing
      checked: '2026-10-09'
      confidence: verified
      note: "2 credits per profile found, observed 2026-10-09 (quotas.creditsConsumed 2). A 404 miss costs 0."
    docs_url: https://docs.reversecontact.com/endpoints/enrich-person

  - id: reversecontact.linkedin.profile.from_email
    added: '2026-10-09'
    capability: linkedin.profile.from_email
    platform: linkedin
    scope: any_account
    miss:
      status: 404
      means: "`Could not resolve the provided identifiers to a profile`: no profile behind this email, an expected outcome. Free (quotas.creditsConsumed 0); observed 2026-10-09, 4.1 s (an email-only miss searches longer than a name miss)"
    method: POST
    path: /v2/enrich/persons
    name: "LinkedIn profile from a work or personal email"
    summary: "Enrich person"
    input:
      body:
        email: {type: string, required: true, note: "work or personal email", example: "jane.doe@acme.com"}
      note: "the reverse email lookup the product is named after: same route as reversecontact.people.enrich, called with the email only. The answer carries the LinkedIn URL (data.person.linkedinUrl) and the full profile."
    test_request:
      body: {email: "nobody.treg.probe@example.com"}
    cost:
      type: per_success
      value: 2
      currency: credit
      per: 1
      unit: record
      reported_charge: {path: quotas.creditsConsumed, unit: credit}
      source: observed
      source_url: https://www.reversecontact.com/pricing
      checked: '2026-10-09'
      confidence: verified
      note: "DELIBERATE MISS test_request (an example.com address, 404 at 0 credits) so no real person's email sits in this public file. The hit price, 2 credits, was observed on the same route 2026-10-09 (reversecontact.people.enrich)."
    docs_url: https://docs.reversecontact.com/endpoints/enrich-person

  - id: reversecontact.people.enrich.linkedin
    added: '2026-10-09'
    capability: people.enrich
    platform: people
    scope: any_account
    miss:
      status: 404
      means: "`Person not found in database`: the profile is not on file, an expected outcome. Free (quotas.creditsConsumed 0); observed 2026-10-09, 161 ms. Try reversecontact.people.enrich.live"
    method: POST
    path: /v2/fetch/persons
    name: "Person profile by LinkedIn URL: experience, education"
    summary: "Person profile"
    input:
      body:
        url: {type: string, required: false, note: "LinkedIn profile URL (linkedin.com/in/… or /sales/lead/…)", example: "https://www.linkedin.com/in/williamhgates"}
        id: {type: string, required: false, note: "Reverse Contact person id from an earlier answer", example: "prs_01jbd5vewyenebxgaz869ffe5t"}
      note: "exactly one of url | id. Reads the cached profile: experience, education, skills, languages, certifications, location, followers."
    test_request:
      body: {url: "https://www.linkedin.com/in/williamhgates"}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: record
      reported_charge: {path: quotas.creditsConsumed, unit: credit}
      source: observed
      source_url: https://www.reversecontact.com/pricing
      checked: '2026-10-09'
      confidence: verified
      note: "1 credit per profile returned, observed 2026-10-09. A 404 miss costs 0."
    docs_url: https://docs.reversecontact.com/endpoints/fetch-profile

  - id: reversecontact.people.enrich.live
    added: '2026-10-09'
    capability: people.enrich
    platform: people
    scope: any_account
    resource_ownership:
      produces: [{kind: job, path: data.webhookId}]
    async:
      id_from: data.webhookId
      poll:
        endpoint: reversecontact.account.jobs.get
        param: {in: pathParams, name: webhookId}
      status:
        path: data.status
        progress: [created, in_progress]
        success: [succeeded]
        failure: []
        billed_failure: [errored]
      result: {path: data.result}
      interval: 5
    method: POST
    path: /v2/fetch/persons/live
    name: "Live person profile by LinkedIn URL, re-sourced now"
    summary: "Person profile live"
    input:
      body:
        url: {type: string, required: false, note: "LinkedIn profile URL", example: "https://www.linkedin.com/in/williamhgates"}
        id: {type: string, required: false, note: "Reverse Contact person id", example: "prs_01jbd5vewyenebxgaz869ffe5t"}
      note: "exactly one of url | id. Re-sources the profile in real time; use it when the cached fetch misses or a /check shows a stale lastUpdate. Answers {status: created, webhookId, pollUrl}; the profile arrives in the poll body's data.result."
    test_request:
      body: {url: "https://www.linkedin.com/in/williamhgates"}
    cost:
      type: per_call
      value: 2
      currency: credit
      per: 1
      unit: record
      settle: usage
      usage: {path: data.creditsConsumed, unit: credit}
      fallback: {value: 2, note: "the acknowledgement reserves 2 credits"}
      source: observed
      source_url: https://www.reversecontact.com/pricing
      checked: '2026-10-09'
      confidence: verified
      note: "2 credits, reserved on the acknowledgement and settled from the terminal poll body's data.creditsConsumed (observed 2 on a succeeded job, 2026-10-09). An errored job whose profile does not exist stays billed; invalid input and upstream fetch errors are refunded to 0, hence billed_failure + usage settlement."
    docs_url: https://docs.reversecontact.com/endpoints/fetch-profile-live

