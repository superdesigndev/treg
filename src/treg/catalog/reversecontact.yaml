      body: {currentCompanyName: "Stripe", currentSeniority: ["VP"], perPage: 1}
    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      reported_charge: {path: quotas.creditsConsumed, unit: credit}
      source: observed
      source_url: https://www.reversecontact.com/pricing
      checked: '2026-10-09'
      confidence: verified
      note: "1 credit per profile delivered, observed 2026-10-09 (perPage 1, 1 credit). An empty page costs 0; quotas.creditsConsumed carries the exact count."
    docs_url: https://docs.reversecontact.com/endpoints/search-people

