        currentCompanyName: {type: string, required: false, note: "string or array", example: "Stripe"}
        currentCompanyIndustry: {type: string, required: false, note: "string or array, closed list"}
        location: {type: object, required: false, note: "{countryCode, country, state, city}, each a string or array", example: {countryCode: "FR"}}
        cursor: {type: string, required: false, note: "metadata.nextCursor of the previous page"}
