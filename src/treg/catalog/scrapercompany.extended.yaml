  docs_url: https://scrapercompany.com/docs/reference/booking-hotels
  price: {value: '4', currency: credit, per: 1, unit: call, note: "4 credits per started 25 properties returned."}
  miss: {when: {path: response.properties, op: empty}}
  input:
    bodyType: json
    body:
      query: {type: string, required: false, note: "Destination as a guest would type it: a city, region, district, landmark or airport.", example: "Lisbon"}
      check_in: {type: string, required: true, note: "First night of the stay, `YYYY-MM-DD`.", example: "2026-12-10"}
      nights: {type: integer, required: false, note: "Length of stay.", example: 1}
      currency: {type: string, required: false, note: "ISO 4217 code for the returned prices.", example: "EUR"}
      limit: {type: integer, required: false, note: "Properties to return, in Booking's order.", example: 5}
      dest_id: {type: integer, required: false, note: "Booking's destination id from `POST /v1/ota/booking/destinations` (negative for most cities, e.g. Lisbon is `-2167973`).", example: -2167973}
      dest_type: {type: string, required: false, note: "The `dest_type` that came with `dest_id`.", example: "city"}
      url: {type: string, required: false, note: "A `booking.com/searchresults.html` link.", example: "https://www.booking.com/searchresults.html?ss=Lisbon&checkin=2026-12-08&checkout=2026-12-10&group_adults=2"}
      check_out: {type: string, required: false, note: "Departure date.", example: "2027-03-29"}
  test_request:
    body: {"query": "Lisbon", "check_in": "2026-12-10", "nights": 1, "currency": "EUR", "limit": 5}
