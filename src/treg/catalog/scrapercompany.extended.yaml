# scrapercompany - EXTENDED tier: every other documented ScraperCompany operation that passed a
# live test_request and has a healthy 7-day production success rate, generated from
# https://scrapercompany.com/openapi.json (param names, types and example values) and filtered by
# hand. Routes curated in core scrapercompany.yaml are excluded here; the full-surface map in the PR
# lists every operation left out and why. Prices are the spec's `x-credits` per successful call;
# the core file's `defaults:` (provenance) apply to these rows. No verified: stamps or examples.

provider: scrapercompany
source:
  method: openapi
  ingested: '2026-11-09'
  spec_urls:
  - https://scrapercompany.com/openapi.json

proposed_capabilities:
  agoda.hotel.find: "Find a hotel's Agoda id by name and city"
  booking.search.hotels: "Search a destination's Booking.com hotels with prices for a stay"
  trivago.hotel.offers: "List Trivago partners' deals for one hotel and stay"
  tripadvisor.hotel.offers: "List the booking-site prices Tripadvisor shows for one hotel and stay"
  hostelworld.property.rooms: "List a hostel's beds and rooms with rates for a stay"
  rakuten-travel.hotel.rooms: "List a Rakuten Travel hotel's rooms and plans for a stay"
  google-flights.calendar: "Get the cheapest fare for each date around a travel date"
  google.serp.autocomplete: "Get Google query autocomplete suggestions"
  target.search.products: "Search Target products priced at a store"
  zalando.search.products: "Search Zalando products by keyword"
  idealo.search.products: "Search Idealo products with their lowest offer price"
  tcgplayer.search.products: "Search TCGplayer products with market prices"
  shopify.store.products: "Products of a Shopify store"
  seatgeek.search.events: "Search events with live ticket price stats"
  sec-edgar.company.filings: "Get a company's SEC profile and recent filings"
  businesses-for-sale.listings: "List online businesses for sale with asking price and financials"
  weather.forecast.daily: "Daily weather forecast for a place"

endpoints:
- id: scrapercompany.x.google-search
  added: '2026-11-09'
  platform: google
  method: POST
  path: /v1/google/search
  name: "Google web search results"
  summary: "Returns one page of Google organic results for a query with People Also Ask questions, the AI Overview text when shown and related searches."
  docs_url: https://scrapercompany.com/docs/reference/google-search
  price: {value: '4', currency: credit, per: 1, unit: call}
  miss: {when: {path: response.organic_results, op: empty}}
  input:
    bodyType: json
    body:
      gl: {type: string, required: false, note: "Country market (Google `gl`).", example: "us"}
      hl: {type: string, required: false, note: "Interface language (Google `hl`).", example: "en"}
      q: {type: string, required: true, note: "Search query.", example: "Hilton Chicago"}
      location: {type: string, required: false, note: "City-level geo-targeting: a Google canonical place name such as `Austin,Texas,United States` (The standard SERP API `location`).", example: "Austin,Texas,United States"}
      uule: {type: string, required: false, note: "Raw Google `uule` passthrough (`w+...` canonical-name or `a+...` coordinate form), for callers that already encode their own.", example: "w+CAIQICIaQXVzdGluLFRleGFzLFVuaXRlZCBTdGF0ZXM="}
      page: {type: integer, required: false, note: "Result page (10 results per page).", example: 1}
      num: {type: integer, required: false, note: "Results per page.", example: 10}
  test_request:
    body: {"q": "Hilton Chicago", "gl": "us", "hl": "en"}
  skipped: "treg verification pending: vendor self-verified this test_request live (see the PR description); no verified stamp or example claimed"
