    queryParams:
      q:
        type: string
        required: true
        note: Image search query (max 500 characters).
        example: cats
      page:
        type: integer
        required: false
        note: Page number (1-10), about 60 images per page.
      size:
        type: string
        required: false
        note: small, medium, large or wallpaper.
        enum:
        - small
        - medium
        - large
        - wallpaper
        example: large
      color:
        type: string
        required: false
        note: color, bw, red, orange, yellow, green, teal, blue, purple, pink, brown, black, gray or white.
        enum:
        - color
        - bw
        - red
        - orange
        - yellow
        - green
        - teal
        - blue
        - purple
        - pink
        - brown
        - black
        - gray
        - white
      type:
        type: string
        required: false
        note: photo, clipart, linedrawing, gif or transparent.
        enum:
        - photo
        - clipart
        - linedrawing
        - gif
        - transparent
      layout:
        type: string
        required: false
        note: square, wide or tall.
        enum:
        - square
        - wide
        - tall
      age:
        type: string
        required: false
        note: 'Image age: day, week, month or year.'
        enum:
        - day
        - week
        - month
        - year
      format:
        type: string
        required: false
        note: 'People in the image: face, portrait or no_people.'
        enum:
        - face
        - portrait
        - no_people
      license:
        type: string
        required: false
        note: 'Usage rights: creative_commons, public_domain, share, share_commercial, modify or modify_commercial.'
        enum:
        - creative_commons
        - public_domain
        - share
        - share_commercial
        - modify
        - modify_commercial
- id: scrappa.x.yahoo-search
  added: '2026-11-18'
  platform: yahoo
  method: GET
  path: /yahoo/search
  summary: Retrieve Yahoo web search results for a query.
  name: Search Yahoo web results
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      p:
        type: string
        required: true
        note: The search query (e.g., "climate change")
        example: climate change
      b:
        type: integer
        required: false
        note: 1-based result offset, step 7. Omit or pass 1 for the first page; pass 8 for page 2, 15 for page 3.
      pz:
        type: integer
        required: false
        note: Results per page are fixed upstream.
        enum:
        - 7
      vm:
        type: string
        required: false
        note: 'Safe search: r = strict, i = moderate, p = off'
        enum:
        - r
        - i
        - p
      vc:
        type: string
        required: false
        note: Country/region (2-letter cc, e.g. "us")
      vl:
        type: string
        required: false
        note: Language (e.g., "en-US")
      fr2:
        type: string
        required: false
        note: Tracking surface id (e.g., "piv-web")
