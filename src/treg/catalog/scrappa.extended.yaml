        - news
        - youtube
        - shopping
- id: scrappa.x.google-trends-trending-now
  added: '2026-11-18'
  platform: google
  method: GET
  path: /google-trends/trending-now
  summary: Retrieve the Trending Now searches for a country or sub-region ("Trending searches" on trends.google.com).
  name: Get Trending Now
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      geo:
        type: string
        required: true
        note: 'Country or sub-region code (e.g., "US", "US-NY", "DE"). Required: Trending Now has no Worldwide option.'
        example: US
      hl:
        type: string
        required: false
        note: 2-letter language code for results (e.g., en, de, fr)
        example: en
      hours:
        type: integer
        required: false
        note: 'Trending window in hours: 4, 24, 48 or 168 (7 days)'
        enum:
        - 4
        - 24
        - 48
        - 168
        example: 24
      num_news:
        type: integer
        required: false
        note: Embedded news articles per trend (0 to 5). Google Trends currently embeds no news, so news_articles stays empty. A value above 0 adds a notice field when no trend has a news_id.
        example: 0
      only_active:
        type: boolean
        required: false
        note: Keep only trends that are still active
      sort:
        type: string
        required: false
        note: 'Result ordering: relevance (upstream order), title, search_volume or recency'
        enum:
        - relevance
        - title
        - search_volume
        - recency
      category_id:
        type: integer
        required: false
        note: Keep only trends whose categories contain this category id (e.g., 17 for Sports)
