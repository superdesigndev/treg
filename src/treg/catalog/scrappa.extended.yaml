        type: integer
        required: false
        note: Number of infants in seat (0-9)
      infants_on_lap:
        type: integer
        required: false
        note: Number of infants on lap (0-9)
      cabin_class:
        type: string
        required: false
        note: 'Cabin class: economy, premium_economy, business, or first'
        enum:
        - economy
        - premium_economy
        - business
        - first
      exclude_basic:
        type: boolean
        required: false
        note: 'Exclude basic economy fares when searching in economy class (default: false)'
      max_stops:
        type: string
        required: false
        note: 'Maximum stops: any, nonstop, one_or_fewer, two_or_fewer'
        enum:
        - any
        - nonstop
        - one_or_fewer
