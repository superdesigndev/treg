- id: scrappa.x.linkedin-jobs-search
  added: '2026-11-18'
  platform: linkedin
  method: GET
  path: /linkedin/jobs/search
  summary: Search LinkedIn job listing pages via Google Search with an automatic LinkedIn jobs site filter.
  name: LinkedIn Jobs Search
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      query:
        type: string
        required: true
        note: Required
        example: software engineer berlin
      num:
        type: integer
        required: false
        note: Results per page (1-20, default 10).
      start:
        type: integer
        required: false
        note: Starting index for pagination (0-100). Google serves at most about 100 results per query, so a larger start returns 422 at once and is never billed. Mutually exclusive with page.
      page:
        type: integer
        required: false
        note: 'Page number for pagination (1-10). Google serves at most about 100 results per query, so the offset (page - 1) × num must be 100 or less: with num=20 use page 1-6. A deeper page returns 422 at once and is never billed. Mutually exclusive wi'
      hl:
        type: string
        required: false
        note: Language
      lr:
        type: string
        required: false
        note: 'Restrict results to a language (format: lang_xx).'
      gl:
        type: string
        required: false
        note: Geolocation
      cr:
        type: string
        required: false
        note: 'Restrict results to a country (format: countryXX).'
      safe:
        type: string
        required: false
        note: Safety
        enum:
        - active
        - 'off'
      dateRestrict:
        type: string
        required: false
        note: Date filtering
      sort:
        type: string
        required: false
        note: Sort by date (date, date:r, date:d).
        enum:
        - date
        - date:r
        - date:d
      filter:
        type: integer
        required: false
        note: 'Duplicate-content filter: 1 to omit near-duplicate results (default), 0 to keep them.'
        enum:
        - 0
        - 1
      rights:
        type: string
        required: false
        note: Usage rights filter (cc_publicdomain, cc_attribute, cc_sharealike, cc_noncommercial, cc_nonderived).
        enum:
        - cc_publicdomain
        - cc_attribute
        - cc_sharealike
        - cc_noncommercial
        - cc_nonderived
