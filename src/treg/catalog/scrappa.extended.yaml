# scrappa - EXTENDED tier: the provider's full endpoint surface, machine-generated by
# scripts/catalog_ingest.py. Do not hand-edit; re-run the script instead. Entries start with
# no capability, no verification and no example response - verification stamps and reviewed
# `capability` mappings (with their platform correction) are added later and carried across
# re-ingests by id via carry_verification. Routes curated in core scrappa.yaml are excluded here.
#
# Scrappa publishes one OpenAPI document; every operation carries x-credits {min, max, rule}.
# The price is the operation's maximum credits; a call settles on the X-Credits-Charged header
# (the core file's defaults), so a range such as 1 to 50 pages bills only what was fetched.
# `platform` is the shared-taxonomy platform the data is about; Google surfaces fold into `google`.
# Left out: 2 own-account route(s) (account, auth, zapier), 10 POST route(s) that need a request body, and 3239 route(s) in 618 source(s) with no platform in capabilities.yaml.
# No row carries a test_request: bulk verification is catalog_verify_extended.py's job.

