- id: scrappa.x.google-trends-interest-by-region
  added: '2026-11-18'
  platform: google
  method: GET
  path: /google-trends/interest-by-region
  summary: 'Retrieve interest by region for a keyword: the relative search interest per region on a 0-100 scale, like the Google Trends "Interest by region" map.'
  name: Get Interest by Region
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      q:
        type: string
        required: true
        note: The search keyword to analyze (e.g., "coffee"). To compare keywords, pass up to 5 terms separated by commas (e.g., "coffee,tea"). Each term can be up to 100 characters.
        example: coffee
      geo:
        type: string
        required: false
        note: Geographic location code (e.g., "US", "DE", "GB"). Leave empty for the worldwide list (250 countries).
        example: US
      region:
        type: string
        required: false
        note: REGION (default) returns sub-national regions for the geo (e.g., 51 states for US). COUNTRY returns the worldwide country list and requires an empty geo.
        enum:
        - REGION
        - COUNTRY
      date:
        type: string
        required: false
        note: 'Time period: a relative token (today 12-m, today 3-m, today 1-m, now 1-d, now 7-d, now 4-h) or an absolute range (YYYY-MM-DD YYYY-MM-DD).'
        example: today 12-m
      cat:
        type: integer
        required: false
        note: Google Trends category id (0 for all categories)
      gprop:
        type: string
        required: false
        note: 'Search property: images, news, youtube or froogle (empty for web search)'
        enum:
        - ''
        - images
        - news
        - youtube
        - froogle
      tz:
        type: integer
        required: false
        note: Timezone offset in minutes
      hl:
        type: string
        required: false
        note: Language code for results (e.g., en, en-US, de-DE)
- id: scrappa.x.google-trends-related
  added: '2026-11-18'
  platform: google
