- id: scrappa.x.airbnb-listing
  added: '2026-11-18'
  platform: airbnb
  method: GET
  path: /airbnb/listing
  summary: 'Retrieve a public Airbnb listing by its numeric id: title, name, property type, room type, guest capacity, overview, rating, review count, category ratings, Superhost and Guest favorite flags (the host name and id are never returned), approximate location with coordinates, amenities, images with cap'
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      listing_id:
        type: string
        required: true
        note: 'Numeric Airbnb listing id from the room URL. Example: 18648717.'
        example: '18648717'
      checkin:
        type: string
        required: false
        note: Check-in date, YYYY-MM-DD. Send together with checkout.
        example: '2026-11-10'
      checkout:
        type: string
        required: false
        note: Check-out date, YYYY-MM-DD, after check-in.
        example: '2026-11-14'
      adults:
        type: integer
        required: false
        note: Number of adults, 1 to 16. Defaults to 1.
        example: 2
- id: scrappa.x.airbnb-reviews
  added: '2026-11-18'
  platform: airbnb
  method: GET
  path: /airbnb/reviews
  summary: 'Retrieve the public guest reviews of an Airbnb listing, newest first: for each review the id, rating, plain-text comment, language, publish date (ISO 8601, UTC), the reviewer first name only, the stay highlight and the host response.'
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      listing_id:
        type: string
        required: true
        note: 'Numeric Airbnb listing id from the room URL. Example: 18648717.'
        example: '18648717'
      limit:
        type: integer
        required: false
        note: Reviews per page, 1 to 50. Defaults to 10.
        example: 10
      offset:
        type: integer
        required: false
        note: Number of reviews to skip. Use next_offset from the previous response. Defaults to 0.
