        required: false
        note: Centre longitude of the search area.
        example: -122.3321
      radius_mi:
        type: number
        required: false
        note: Search radius around the centre point, up to 100 miles. Required with a latitude and longitude centre point unless a complete bounding box is given instead.
        example: 5
      north_latitude:
        type: number
        required: false
        note: Northern bound of an explicit bounding box.
      south_latitude:
        type: number
        required: false
        note: Southern bound of an explicit bounding box.
      east_longitude:
        type: number
        required: false
        note: Eastern bound of an explicit bounding box.
      west_longitude:
        type: number
        required: false
        note: Western bound of an explicit bounding box.
      region_ids:
        type: array
        required: false
        items:
          type: integer
        note: Region ids from the autocomplete endpoint, up to 20.
      region_id_type:
        type: integer
        required: false
        note: 'How the region ids are interpreted: 0 state, 1 county, 2 city, 3 ZIP code, 5 neighborhood. The autocomplete endpoint returns the matching value as region_id_type.'
      polygon:
        type: string
        required: false
        note: 'Custom search boundary as lat,lon|lat,lon|:lat,lon|lat,lon: points separated by |, polygons separated by |:.'
      listing_category:
        type: string
        required: false
        note: category1 for sale (default), category2 for rent, or all.
        enum:
        - all
        - category1
        - category2
        example: category1
      sort_order:
        type: string
        required: false
        note: One of relevance, price, beds, baths, yearBuilt, daysOn, featured, livingArea, lotArea, nearby, recentlyChanged, rentalDays, rentalPriorityScore.
        enum:
        - baths
        - yearBuilt
        - price
        - relevance
        - beds
        - daysOn
        - featured
        - livingArea
        - lotArea
        - nearby
        - recentlyChanged
        - rentalDays
        - rentalPriorityScore
      sort_ascending:
        type: boolean
        required: false
        note: Sort lowest first instead of highest first.
      min_price:
        type: integer
        required: false
        note: Lowest list price to include.
      max_price:
        type: integer
        required: false
        note: Highest list price to include.
      min_beds:
        type: integer
        required: false
        note: Fewest bedrooms to include.
      max_beds:
        type: integer
        required: false
        note: Most bedrooms to include.
      min_baths:
        type: integer
        required: false
        note: Fewest bathrooms to include.
      max_baths:
        type: integer
        required: false
        note: Most bathrooms to include.
      living_area_min:
        type: integer
        required: false
        note: Smallest living area in square feet.
      lot_size_min:
        type: integer
        required: false
        note: Smallest lot size in square feet.
      year_built_min:
        type: integer
        required: false
        note: Earliest construction year.
      home_statuses:
        type: array
        required: false
        items:
          type: string
          enum:
          - newConstruction
          - forRent
          - auction
          - foreclosed
          - fsbo
          - recentlySold
          - foreclosure
          - comingSoon
          - preforeclosure
          - fsba
        note: 'Statuses from one listing type only: for-sale statuses (fsba, fsbo, newConstruction, comingSoon, auction, foreclosure, foreclosed, preforeclosure), forRent, or recentlySold. Defaults to every for-sale status, or forRent when listing_categor'
      keywords:
        type: string
        required: false
        note: Free-text filter applied to listings.
      zoom_level:
        type: integer
        required: false
        note: Map zoom level, 6 to 25.
      include_off_market:
        type: boolean
        required: false
        note: Supplement the results with off-market listings. The totals reported then cover a larger population.
      allow_empty:
        type: boolean
        required: false
        note: Return an empty result set for an area with no matches instead of raising.
      page:
        type: integer
        required: false
        note: Page number, 1-based.
      page_size:
        type: integer
        required: false
        note: Rows per page. page * page_size must not exceed 1000.
        example: 20
