        note: Exclude these authors. V2 only, plural key. Accepted and forwarded; upstream effect unverified.
      excludeHashtags:
        type: array
        required: false
        items:
          type: string
        note: Exclude these hashtags. V2 only, plural key. Accepted and forwarded; upstream effect unverified.
      excludeMentions:
        type: array
        required: false
        items:
          type: string
        note: Exclude these mentions. V2 only, plural key. Accepted and forwarded; upstream effect unverified.
      excludeDomains:
        type: array
        required: false
        items:
          type: string
        note: Exclude posts linking these domains. V2 only. Accepted and forwarded; upstream effect unverified.
      excludeUrls:
        type: array
        required: false
        items:
          type: string
        note: Exclude posts linking these URLs. V2 only. Accepted and forwarded; upstream effect unverified.
      excludeLanguages:
        type: array
        required: false
        items:
          type: string
        note: Exclude these language codes. V2 only. Accepted and forwarded; upstream effect unverified.
      excludeEmbeddedAtUris:
        type: array
        required: false
        items:
          type: string
        note: Exclude posts embedding these records. V2 only. Accepted and forwarded; upstream effect unverified.
