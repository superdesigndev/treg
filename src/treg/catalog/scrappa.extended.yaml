- id: scrappa.x.search-advanced
  added: '2026-11-18'
  platform: google
  method: GET
  path: /search-advanced
  summary: The ranked response keeps existing result collections and adds a canonical DOM-ordered reference list for paid cards, local modules, and organic cards.
  name: Search Google Advanced
  price:
    value: '3'
    currency: credit
    per: 1
    unit: call
    note: 1 credit per successful request. proxy_country adds up to 1 extra credit(s). fetch_ai_overview=1 adds 1 when the AI Overview page is fetched. Failed requests are free.
  input:
    queryParams:
      query:
        type: string
        required: true
        note: Required
        example: best restaurants in Berlin
      location:
        type: string
        required: false
        note: Geographic location for the search (e.g. "Berlin, Germany"). Cannot be combined with uule.
      uule:
        type: string
        required: false
        note: Encoded location (deprecated; supported)
      google_domain:
        type: string
        required: false
        note: Google domain (e.g., google.de)
      gl:
        type: string
        required: false
        note: 'Country code (e.g., us, de, fr; default: us, or none with proxy_country)'
        example: de
      cr:
        type: string
        required: false
        note: Restrict results to countries (e.g., countryUS|countryDE)
      hl:
        type: string
        required: false
        note: Interface language code (2 letters, e.g. en, de). Defaults to en.
        example: en
      lr:
        type: string
        required: false
        note: Restrict results to language (e.g., lang_en)
      ludocid:
        type: string
        required: false
        note: Google local business identifier used to target a specific listing.
      lsig:
        type: string
        required: false
        note: Google local listing signature, used with ludocid to target one listing.
      kgmid:
        type: string
        required: false
        note: Google Knowledge Graph machine ID of the entity to target (e.g. /m/0dr90d).
      si:
        type: string
        required: false
        note: Opaque Google search context token, passed through unchanged.
      ibp:
        type: string
        required: false
        note: Opaque Google interface parameter, passed through unchanged.
      uds:
        type: string
        required: false
        note: Opaque Google filter token from a previous result page, passed through unchanged.
      oq:
        type: string
        required: false
        note: Original Google query value, passed through and encoded once in the upstream URL.
      sclient:
        type: string
        required: false
        note: Google search client identifier, passed through and encoded once in the upstream URL.
      gs_lp:
        type: string
        required: false
        note: Opaque Google SERP context value, passed through and encoded once in the upstream URL.
      tbs:
        type: string
        required: false
        note: Advanced Google filter string (e.g. qdr:d to restrict to the past day).
      as_qdr:
        type: string
        required: false
        note: Simple time range filter (e.g., d, w, m, y)
      safe:
        type: string
        required: false
        note: Safe search mode (active, off)
        enum:
        - active
        - 'off'
      nfpr:
        type: integer
        required: false
        note: 'Exclude auto-corrected results (default: 1). Set 0 to allow auto-correction; results for a different query are rejected.'
        enum:
        - 0
        - 1
      filter:
        type: integer
        required: false
        note: Enable/disable similar/omitted filters (0 or 1)
        enum:
        - 0
        - 1
      tbm:
        type: string
        required: false
        note: 'Search vertical: isch (images), vid (videos), nws (news), lcl (local), shop (shopping) or pts (patents). Omit for web results.'
        enum:
        - isch
        - vid
        - nws
        - lcl
        - shop
        - pts
      udm:
        type: integer
        required: false
        note: 'Set 14 to request Google''s Web tab: plain web results only, without AI overview, related questions, related searches, ads and other modules. Recommended when you only need the organic results (rank tracking, link lists, research): Web tab p'
        enum:
        - 14
      start:
        type: integer
        required: false
        note: Result offset for pagination (0-indexed)
      include_thumbnails:
        type: string
        required: false
        note: 'Set 1 to add images that Google only ships inline as a base64 data: URI in thumbnail_base64 (about 2-6 KB each): news card images (tbm=nws) and organic result images without an image URL. Off by default.'
        enum:
        - '0'
        - '1'
        - 'true'
        - 'false'
      page:
        type: integer
        required: false
        note: '0-based page number (0-100): 0 is the first page and 1 is the second. Prefer start for new integrations.'
      amount:
        type: integer
        required: false
        note: Results per page (1-10, may return fewer)
      device:
        type: string
        required: false
        note: 'Device used to fetch results: desktop (default), tablet, or mobile.'
        enum:
        - desktop
        - tablet
        - mobile
        example: mobile
      proxy_country:
        type: string
        required: false
        note: 'Run the search from an exit IP in this country. Only pl (Poland) is supported; any other value returns 422. The search uses Polish IPs only and never falls back to another country: when no Polish route is available the request fails with 50'
        enum:
        - pl
      fetch_ai_overview:
        type: string
        required: false
        note: Set 1 to fetch an AI Overview that Google loads after the page. For many queries the page holds only a loading placeholder, so ai_overview is null. With this parameter the endpoint then sends one extra Google request and fills ai_overview f
        enum:
        - '0'
        - '1'
        - 'true'
        - 'false'
