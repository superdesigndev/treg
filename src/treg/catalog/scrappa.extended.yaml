- id: scrappa.x.google-scholar
  added: '2026-11-18'
  platform: google
  method: GET
  path: /google/scholar
  summary: Search scholarly publications or follow a cited-by/version relationship.
  name: Search Google Scholar
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      q:
        type: string
        required: false
        note: One of q, cites or cluster is required. Scholar search query. Optional when cites or cluster is supplied.
        example: machine learning
      hl:
        type: string
        required: false
        note: Two-letter interface language, optionally with a region. Defaults to en.
        example: en
      start:
        type: integer
        required: false
        note: Zero-based result offset from 0 to 990. Defaults to 0.
      num:
        type: integer
        required: false
        note: Results per request from 1 to 20. Defaults to 10.
        example: 10
      as_ylo:
        type: integer
        required: false
        note: Earliest publication year to include.
        example: 2020
      as_yhi:
        type: integer
        required: false
        note: Latest publication year to include.
      scisbd:
        type: integer
        required: false
        note: 0 for relevance, 1 for recent abstracts, or 2 for all recent additions.
        enum:
        - 0
        - 1
        - 2
      cites:
        type: string
        required: false
        note: One of q, cites or cluster is required. Numeric publication ID for a cited-by search. May be combined with q.
      cluster:
        type: string
        required: false
        note: One of q, cites or cluster is required. Numeric publication ID for an all-versions search. Must be used alone.
  note: 'Send one of: q + cites + cluster.'
