- id: scrappa.x.kick-v1-livestreams
  added: '2026-11-18'
  platform: kick
  method: GET
  path: /kick/v1/livestreams
  summary: Retrieve the platform-wide live feed with viewer counts, thumbnails, categories, tags, and channel details.
  name: Retrieve the platform-wide featured live feed
  price:
    value: '1'
    currency: credit
    per: 1
    unit: call
  input:
    queryParams:
      feed:
        type: string
        required: false
        note: cursor for the paginated feed, featured for the no-cursor rail. Defaults to cursor. The featured rail applies only language; the cursor-only parameters below are rejected on it.
        enum:
        - cursor
        - featured
        example: cursor
      sort:
        type: string
        required: false
        note: featured or featured_home. Defaults to featured. Cursor feed only; rejected with feed=featured.
        enum:
        - featured
        - featured_home
        example: featured
      limit:
        type: integer
        required: false
        note: Streams per page, up to 100. Defaults to 24. Cursor feed only; rejected with feed=featured.
        example: 24
      language:
        type: string
        required: false
        note: Filter by language code from the languages endpoint. The only filter the feed=featured rail applies, and the only parameter it accepts — it is required there, because Kick rejects a rail request without it. Optional on the cursor feed.
      category_id:
        type: integer
        required: false
        note: Filter by subcategory id, not the top-level category id. Cursor feed only; rejected with feed=featured.
      after:
        type: string
        required: false
        note: Opaque cursor for the next page. Cursor feed only; rejected with feed=featured.
      before:
        type: string
        required: false
        note: Opaque cursor for the previous page. Cursor feed only; rejected with feed=featured.
