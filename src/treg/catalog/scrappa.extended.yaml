      author:
        type: string
        required: false
        note: Restrict to one author. V1 only, singular key.
      lang:
        type: string
        required: false
        note: Restrict to this language code. V1 only.
      domain:
        type: string
        required: false
      url:
        type: string
        required: false
      since:
        type: string
        required: false
        note: Only posts after this timestamp. Both generations.
      until:
        type: string
        required: false
        note: Only posts before this timestamp. Both generations.
      authors:
        type: array
        required: false
        items:
          type: string
        note: Restrict to these authors. V2 only, plural key.
      hashtags:
        type: array
        required: false
        items:
          type: string
        note: Restrict to these hashtags. V2 only, plural key.
      domains:
        type: array
        required: false
        items:
          type: string
        note: Restrict to posts linking these domains. V2 only.
      urls:
        type: array
        required: false
        items:
          type: string
      languages:
        type: array
        required: false
        items:
          type: string
      embeddedAtUris:
        type: array
        required: false
        items:
          type: string
      tag:
        type: array
        required: false
        items:
          type: string
        note: 'Restrict to these hashtags. V1 only. This is the one plural filter on V1: repeat the key or pass a comma-separated list, and multiple tags are AND-matched.'
      excludeAuthors:
        type: array
        required: false
        items:
