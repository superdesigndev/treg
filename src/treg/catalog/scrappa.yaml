    example_response: examples/scrappa.google.flights.search.json
    capability: google.flights.search
    platform: google
    scope: any_account
    method: GET
    path: /flights/one-way
    name: "Google Flights one-way search"
    summary: "One-way Google Flights offers between two airports on a date: price, airline, stops, duration, emissions and legs"
    note: "Answers in 8 to 55 seconds, and HTTP 503 when Google Flights is unavailable (billed nothing). Use a future departure_date."
    input:
      queryParams:
        origin: {type: string, required: true, note: "origin airport IATA code", example: "BER"}
        destination: {type: string, required: true, note: "destination airport IATA code", example: "LHR"}
        departure_date: {type: string, required: true, note: "YYYY-MM-DD, today or later", example: "2027-03-16"}
        adults: {type: integer, required: false, note: "1 to 9, default 1"}
        cabin_class: {type: string, required: false, enum: [economy, premium_economy, business, first], note: "cabin"}
        max_stops: {type: string, required: false, enum: [any, nonstop, one_or_fewer, two_or_fewer], note: "stop limit", example: "nonstop"}
        currency: {type: string, required: false, note: "3-letter currency code"}
