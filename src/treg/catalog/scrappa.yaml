    added: '2026-11-18'
    verified: '2026-11-18'
    example_response: examples/scrappa.google.serp.maps.json
    capability: google.serp.maps
    platform: google
    scope: any_account
    method: GET
    path: /maps/simple-search
    name: "Google Maps place search"
    summary: "Google Maps businesses and places for a search: name, address, rating, review count, coordinates and the business_id to fetch reviews"
    input:
      queryParams:
        query: {type: string, required: true, note: "what and where, e.g. restaurants in new york", example: "Brandenburg Gate Berlin"}
        limit: {type: integer, required: false, note: "places to return, 1 to 200", example: 1}
        page: {type: integer, required: false, note: "page, starting at 0"}
        hl: {type: string, required: false, note: "language code"}
        gl: {type: string, required: false, note: "country code"}
        google_domain: {type: string, required: false, note: "Google domain such as google.de"}
    test_request:
      queryParams: {query: "Brandenburg Gate Berlin", limit: 1}
    price: {value: '1', currency: credit, per: 1, unit: call, note: "An empty result still charges 1 credit"}
    provenance: {source: observed, source_url: 'https://scrappa.co/api/docs/openapi.json', checked: '2026-11-18', confidence: verified}
    miss: {when: {path: response.items, op: empty}}
    docs_url: https://scrappa.co/docs/google-maps-api/simple_search

  - id: scrappa.google.maps.reviews
    added: '2026-11-18'
    verified: '2026-11-18'
    example_response: examples/scrappa.google.maps.reviews.json
    capability: google.maps.reviews
    platform: google
    scope: any_account
    method: GET
    path: /maps/reviews
    name: "Google Maps reviews of a place"
    summary: "Reviews of a Google Maps business: rating, text, date and owner reply, with a token for the next page"
    input:
      queryParams:
        business_id: {type: string, required: true, note: "google_id (0x…:0x…) or place_id; scrappa.google.serp.maps returns it as business_id", example: "0x47a851c655f20989:0x26bbfb4e84674c63"}
        limit: {type: integer, required: false, note: "reviews per page", example: 1}
        sort: {type: integer, required: false, enum: [1, 2, 3, 4], note: "1 most relevant, 2 newest, 3 highest rating, 4 lowest rating"}
        search: {type: string, required: false, note: "keep reviews that mention this word"}
        page: {type: string, required: false, note: "continuation token from the nextPage field of a previous answer"}
        hl: {type: string, required: false, note: "language code"}
        gl: {type: string, required: false, note: "country code"}
    test_request:
      queryParams: {business_id: "0x47a851c655f20989:0x26bbfb4e84674c63", limit: 1}
    price: {value: '1', currency: credit, per: 1, unit: page, note: "1 credit per page of reviews fetched"}
    provenance: {source: observed, source_url: 'https://scrappa.co/api/docs/openapi.json', checked: '2026-11-18', confidence: verified}
    miss: {when: {path: response.items, op: empty}}
    docs_url: https://scrappa.co/docs/google-maps-api/google_reviews

