provider: scrappa
source:
  docs: https://scrappa.co/docs
  openapi: https://scrappa.co/api/docs/openapi.json
  curated: '2026-11-18'
# Scrappa publishes its rate card in the OpenAPI spec: every operation carries `x-credits: {min, max,
# rule}`, and most routes are 1 credit. The meter is the `X-Credits-Charged` response header: the exact
# credits billed for that request, 0 for a free or failed one. Every row settles on it, so a call
# that Scrappa serves free (an empty Google Jobs page, a repeated search served from its one-hour
# cache) is not billed on treg's key either. The free check `GET /account/usage` is the registry's
# probe: a bad key answers 401, a request with no key header at all answers 402 (an x402 pay-per-call
# challenge), so the two are not the same failure.
# Live observations (2026-11-18, one request per row; the ledger is in the pull request): an empty
# Google Maps or Google News page still charges 1 credit, an empty Google Jobs page charges 0, and a
# 404 (no Trustpilot profile, no LinkedIn company, no YouTube transcript) charges 0. Google Search
# `proxy_country` adds up to 1 credit and is left out of the row's inputs. Google Flights answers 503
# after about a minute when its upstream is down, and bills nothing.
limits: Scrappa publishes no request-rate limit. A key without credits gets HTTP 402.
pricing_url: https://scrappa.co/pricing

proposed_capabilities:
  google.serp.images: "Get Google Images results for a keyword"
  google.serp.autocomplete: "Get Google query autocomplete suggestions"
  google.flights.search: "Search Google Flights offers between two airports"
  google.hotels.search: "Search Google Hotels properties and nightly rates for a place and dates"
  google.jobs.search: "Search Google Jobs listings by keyword"

defaults:
  provenance: {source: rate_card_api, source_url: 'https://scrappa.co/api/docs/openapi.json', checked: '2026-11-18', confidence: documented}
  docs_url: https://scrappa.co/docs
  bill: {miss: free, error: free}
  settle: {reported: {header: x-credits-charged, unit: credit}}

endpoints:
