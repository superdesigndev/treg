  - id: scrappa.google.serp.organic
    added: '2026-11-18'
    verified: '2026-11-18'
    example_response: examples/scrappa.google.serp.organic.json
    capability: google.serp.organic
    platform: google
    scope: any_account
    method: GET
    path: /search
    name: "Google Search results"
    summary: "Google results page as JSON: organic results, related searches, knowledge graph, local results and ads"
    input:
      queryParams:
        query: {type: string, required: true, note: "search words", example: "coffee berlin"}
        location: {type: string, required: false, note: "place name such as Berlin, Germany; cannot be combined with uule", example: "Berlin, Germany"}
        gl: {type: string, required: false, note: "2-letter country code", example: "de"}
        hl: {type: string, required: false, note: "2-letter interface language", example: "en"}
        google_domain: {type: string, required: false, note: "Google domain such as google.de", example: "google.de"}
        page: {type: integer, required: false, note: "result page, starting at 1"}
    test_request:
      queryParams: {query: "coffee berlin"}
    price: {value: '1', currency: credit, per: 1, unit: call, note: "A search repeated within one hour is served from cache and charges 0 credits"}
    provenance: {source: observed, source_url: 'https://scrappa.co/api/docs/openapi.json', checked: '2026-11-18', confidence: verified}
    miss: {when: {path: response.organic_results, op: empty}}
    docs_url: https://scrappa.co/docs/google-search-api/search

