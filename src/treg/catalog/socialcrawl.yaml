- id: socialcrawl.instagram.user.profile
  capability: instagram.user.profile
  platform: instagram
  scope: any_account
  method: GET
  path: /instagram/profile
  name: Get Instagram user profile
  summary: Returns public profile information for an Instagram user including the exact integer follower
    count, following count, bio, profile picture URL, and verification status. `author.posts_count` is
    the account's lifetime post count, for accounts of any size, in the same call and for the same 1 credit.
    In the rare case that count cannot be read in time the leaf is null rather than a wrong number, and
    a repeat call normally fills it. Age-restricted (18+) profiles are supported. When the account publishes
    a contact address in its bio, it is returned as `author.ext.public_email`; otherwise that leaf is
    null. Instagram's in-app tap-to-email button is not readable from any public surface, so the bio is
    the only source for it.
  strict_query: true
  input:
    queryParams:
      handle:
        type: string
        required: true
        note: Instagram username without the @ symbol
        example: instagram
      trim:
        type: boolean
        required: false
        note: Set to true to get a trimmed response
    note: This curated tool accepts only the declared query parameters; optional paid enrichment and multi-page
      modes are excluded. A connected user can use the raw API for the full surface.
  test_request:
    queryParams:
      handle: instagram
  expect:
    json_path: success
    equals: true
  cost:
    type: per_success
    value: 1
    currency: credit
    source: observed
    source_url: https://www.socialcrawl.dev/openapi.json
    checked: '2026-10-01'
    confidence: verified
    note: Net credits are returned in credits_used. Cache hits cost zero; failed and empty results are
      refunded. Shared-key activation needs an agreed USD credit rate and reported_charge wiring.
  docs_url: https://www.socialcrawl.dev/docs/api-reference
- id: socialcrawl.instagram.search.users
  capability: instagram.search.users
  platform: instagram
  scope: any_account
  method: GET
  path: /instagram/search/profiles
  name: Search Instagram profiles by keyword
  summary: 'Searches Google for public Instagram results matching a keyword or phrase, then returns matching
    public profiles mapped to the unified Author schema: `username`, `display_name`, `bio`, `verified`,
    `followers`, `following`, `posts_count`, `avatar_url`, and the profile `url`. Best-effort against
    Google''s index, not a native Instagram profile search. The plain call has no account country: Instagram
    does not put that on a search stub. Send `include=about` to join each row to the About-this-account
    panel for `author.ext.country`, the join month, and the public email and phone the account publishes,
    2 extra credits a row filled, default the top 8 (17 credits held), `limit=12` for the page. A row
    the panel could not fill is refunded. This is not a country filter: a query that surfaces no Korean
    accounts still returns no Korean accounts after the join. For place-tagged posts, use /v1/instagram/search/location
    then /v1/instagram/location/posts.'
  strict_query: true
  input:
    queryParams:
      query:
        type: string
        required: true
        note: Bio or caption keyword/phrase to search for.
        example: NASA
      cursor:
        type: string
        required: false
        note: The cursor returned by the previous response. In this version it is the next Google results
          page number.
      limit:
        type: integer
        required: false
        note: Cap the rows served, and with `include=about` the credits held. 1 to 12. Default 8 when
          the token is present so the hold is 17, not 25.
        example: 1
        min: 1
        max: 12
    note: This curated tool accepts only the declared query parameters; optional paid enrichment and multi-page
      modes are excluded. A connected user can use the raw API for the full surface.
  test_request:
    queryParams:
      query: NASA
      limit: 1
  expect:
    json_path: success
    equals: true
  cost:
    type: per_success
    value: 1
    currency: credit
    source: observed
    source_url: https://www.socialcrawl.dev/openapi.json
    checked: '2026-10-01'
    confidence: verified
    note: Net credits are returned in credits_used. Cache hits cost zero; failed and empty results are
      refunded. Shared-key activation needs an agreed USD credit rate and reported_charge wiring.
  docs_url: https://www.socialcrawl.dev/docs/api-reference
- id: socialcrawl.tiktok.user.profile
  capability: tiktok.user.profile
  platform: tiktok
  scope: any_account
  method: GET
  path: /tiktok/profile
  name: Get TikTok user profile
  summary: 'Returns public profile information for a TikTok user: follower count, following count, total
    likes, bio, avatar URL, verification status, and the ISO 3166-1 alpha-2 region of the account at `author.location`
    (the same leaf `/v1/tiktok/profile/region` returns, included here so you do not need a second call).
    `author.followers` is the unrounded integer when the source exposes it. When only the public rounded
    figure is available, the same integer field is returned and `author.ext.followers_approximate` is
    true. Pass either `handle` or `user_id`. Profiles behind TikTok''s ''audience controls'' (a login/age
    wall in the browser) now return their profile record normally; their posts are readable through `/v1/tiktok/profile/videos`
    with the same handle. A profile with no publicly readable record still returns `404 RESOURCE_NOT_FOUND`
    with `error.details.reason` set to `account_private`. A handle the platform reports as unused returns
    the same status with `reason` set to `account_gone`; because TikTok numeric ids are permanent, re-running
    the lookup with `user_id` tells a renamed account from a removed one. `author.location` can be absent
    when the region source is unavailable; the rest of the profile is still returned.'
  strict_query: true
  input:
    queryParams:
      handle:
        type: string
        required: true
        note: 'TikTok username without the @ symbol. (one of: handle, user_id; at least one required)'
        example: nasa
    note: This curated tool accepts only the declared query parameters; optional paid enrichment and multi-page
      modes are excluded. A connected user can use the raw API for the full surface.
  test_request:
    queryParams:
      handle: nasa
  expect:
    json_path: success
    equals: true
  cost:
    type: per_success
    value: 1
    currency: credit
    source: observed
    source_url: https://www.socialcrawl.dev/openapi.json
    checked: '2026-10-01'
    confidence: verified
    note: Net credits are returned in credits_used. Cache hits cost zero; failed and empty results are
      refunded. Shared-key activation needs an agreed USD credit rate and reported_charge wiring.
  docs_url: https://www.socialcrawl.dev/docs/api-reference
