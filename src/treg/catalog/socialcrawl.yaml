  path: /tiktok/post
  name: Get TikTok post details
  summary: 'Returns detailed information about a specific TikTok video including view count, like count,
    comment count, share count, caption, music info, author details, and video metadata. When the creator
    added on-screen text with TikTok''s built-in text tool, the overlay text is returned in `data.post.ext.on_screen_texts`
