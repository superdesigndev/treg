        note: Full URL of the TikTok video
        example: https://www.tiktok.com/@nasa/video/7665075736742530317
      region:
        type: string
        required: false
        note: Two-letter country code for the proxy region (US, GB, FR, PH). The primary source does not
          take a region, so it is honoured only when a fallback source serves the request; a region-locked
