- id: sumble.signals.search
  platform: companies
  scope: own_account
  method: POST
  path: /signals
  name: Search signals
  summary: Search signals
  input:
    bodyType: json
    body:
      filter:
        properties:
          organization_ids:
            anyOf:
            - items:
                type: integer
                exclusiveMinimum: 0.0
              type: array
            - type: 'null'
            description: Organization IDs to filter signals by.
            examples:
            - - 171
          person_ids:
            anyOf:
            - items:
                type: integer
                exclusiveMinimum: 0.0
              type: array
            - type: 'null'
            description: Sumble person IDs to filter signals by.
            examples:
            - - 12729201
          signal_ids:
            anyOf:
            - items:
                type: integer
                exclusiveMinimum: 0.0
              type: array
            - type: 'null'
            description: Signal IDs to filter signals by.
            examples:
            - - 123
          technology_slugs:
            anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
            description: Canonical technology slugs to filter signals by, such as `kubernetes` or `salesforce`.
            examples:
            - - zoominfo
          job_functions:
            anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
            description: Job function names to filter signals by, such as `Engineering` or `Sales`.
            examples:
            - - Account Executive
          priorities:
            anyOf:
            - items:
                type: string
                enum:
                - high
                - medium
                - low
              type: array
            - type: 'null'
            description: Priorities to filter signals by. Matches the `priority` field returned on each signal.
            examples:
            - - high
          account_list_ids:
            anyOf:
            - items:
                type: integer
                exclusiveMinimum: 0.0
              type: array
            - type: 'null'
            description: Account list IDs to filter signals to accounts in those lists.
            examples:
            - - 4
          signal_config_ids:
            anyOf:
            - items:
                type: integer
                exclusiveMinimum: 0.0
              type: array
            - type: 'null'
            description: Signal config IDs to filter signals by. Matches the `signal_config_id` returned on each
              signal.
            examples:
            - - 512
        additionalProperties: false
        type: object
        description: Filter criteria for signals search.
        required: false
      limit:
        type: integer
        maximum: 100.0
        minimum: 1.0
        description: Maximum number of signals to return.
        default: 100
        required: false
      offset:
        type: integer
        maximum: 10000.0
        minimum: 0.0
        description: Number of signals to skip.
        default: 0
        required: false
    note: 1 credit per list, organization, person or signal returned, according to this operation. BYOK only; no
      live workspace mutation or support message was performed.
  docs_url: https://docs.sumble.com/api/api
