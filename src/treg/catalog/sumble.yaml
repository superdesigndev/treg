provider: sumble
source:
  docs: https://docs.sumble.com/api/api
  openapi: https://api.sumble.com/openapi.json?version=v9
  curated: '2026-09-09'
limits: 10 requests/second aggregated per user; HTTP 429 when exceeded.
pricing_url: https://sumble.com/pricing
proposed_capabilities:
  companies.tech_stack: Get a company’s confirmed-used technology stack
  companies.teams.search: Find and enrich teams within organizations
  companies.intelligence_brief: Retrieve an account intelligence brief
endpoints:
- id: sumble.organizations
  platform: companies
  scope: any_account
  method: POST
  path: /organizations
  name: Unified organizations endpoint
  summary: Unified organizations endpoint
  input:
    bodyType: json
    body:
      organizations:
        anyOf:
        - items:
            properties:
              name:
                anyOf:
                - type: string
                - type: 'null'
                description: Organization name
              url:
                anyOf:
                - type: string
                - type: 'null'
                description: Organization website URL or domain
              location:
                anyOf:
                - type: string
                - type: 'null'
                description: Organization location (country name or code)
              id:
                anyOf:
                - type: integer
                - type: 'null'
                description: Organization Id on Sumble. When set, the row identifies a Sumble org directly and bypasses
                  matching; name/url/location are not required.
              slug:
                anyOf:
                - type: string
                - type: 'null'
                description: Organization slug on Sumble. When set, the row identifies a Sumble org directly and
                  bypasses matching; name/url/location are not required.
            additionalProperties: false
            type: object
          type: array
          maxItems: 1000
          minItems: 1
        - type: 'null'
        description: List of organizations to resolve and enrich. Mutually exclusive with `filter`.
        required: false
      filter:
        anyOf:
        - properties:
            query:
              type: string
          type: object
          required:
          - query
        - type: 'null'
        description: Advanced query selecting the organizations to return. Mutually exclusive with `organizations`.
        required: false
      include_closed:
        type: boolean
        description: 'Filter mode only: include organizations marked permanently closed (`status` = ''closed'')
          in the results — they are excluded by default. Request the `status` / `status_reason` attributes to identify
          which results are closed. Not valid with `organizations` (direct lookups always resolve closed organizations).'
        default: false
        required: false
      select:
        properties:
          attributes:
            items:
              type: string
              enum:
              - id
              - slug
              - name
              - url
              - employee_count
              - industry
              - jobs_count
              - teams_count
              - jobs_count_rollup
              - jobs_count_no_rollup
              - teams_count_rollup
              - teams_count_no_rollup
              - people_count_rollup
              - people_count_no_rollup
              - headquarters_country
              - sumble_score
              - sumble_url
              - parent_id
              - subsidiary_ids
              - tags
              - status
              - status_reason
              - account_status
              - funding_total_raised
              - funding_valuation
              - funding_last_round_raised
              - funding_last_round_type
              - funding_last_round_date
            type: array
            description: Baseline company attributes to include. Off by default.
            default: []
          entities:
            items:
              properties:
                type:
                  type: string
                  enum:
                  - job_function
                  - technology
                  - project
                  - advanced_query
                  - technology_category
                  description: The entity type to enrich against.
                term:
                  type: string
                  minLength: 1
                  description: 'The entity term: a technology name, job function, project, category, or advanced
                    query string.'
                metrics:
                  anyOf:
                  - items:
                      type: string
                    type: array
                  - type: string
                    const: all
                  - type: 'null'
                  description: Metric names valid for `type`, or "all". Required for every type.
                granularity:
                  anyOf:
                  - type: string
                    enum:
                    - aggregate
                    - exploded
                  - type: 'null'
                  description: '`technology_category` only (required there, disallowed elsewhere). `aggregate` rolls
                    the category up into one set of counts; `exploded` decomposes into per-component-technology
                    counts.'
                since:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: 'Scopes job_post_count, job_post_used_count, team_count, and people_count to activity
                    since this date (YYYY-MM-DD). Does not affect people_count_growth_1y. No-rollup metrics are
                    all-time only: with `since` set they are excluded from `metrics: "all"` and rejected if requested
                    explicitly.'
              additionalProperties: false
              type: object
              required:
              - type
              - term
            type: array
            description: Per-entity metric selections.
            default: []
        additionalProperties: false
        type: object
        description: Dictates exactly which columns are returned.
        required: true
      limit:
        type: integer
        maximum: 200.0
        minimum: 1.0
        description: Maximum number of results to return.
        default: 10
        required: false
      offset:
        type: integer
        maximum: 10000.0
        minimum: 0.0
        description: Number of results to skip.
        default: 0
        required: false
      order_by_column:
        anyOf:
        - type: string
          enum:
          - industry
          - employee_count
          - employee_count_int
          - first_activity_time
          - last_activity_time
          - jobs_count
          - teams_count
          - people_count
          - jobs_count_growth_6mo
          - cloud_spend_estimate_millions_usd
          - account_score
        - type: string
          enum:
          - people_concentration
          - people_count_growth_1y
        - type: string
          const: job_post_concentration
        - type: 'null'
        description: 'Column to order by (filter mode only). Parameterized sorts (this endpoint only): `people_concentration`
          and `people_count_growth_1y` sort by the named job function''s people metrics — the all-time fraction
          of the org''s tracked people in it, and its current YoY people growth % (latest month vs. one year earlier;
          orgs without growth data sort last) respectively — and require `order_by_job_function`. `job_post_concentration`
          sorts by the all-time fraction of the org''s job posts matching `order_by_advanced_query`, which it requires.
          `source_data_url` is omitted for all three, since the listing page cannot reproduce their ordering.'
        required: false
      order_by_direction:
        anyOf:
        - type: string
          enum:
          - ASC
          - DESC
        - type: 'null'
        description: Direction to order by (filter mode only).
        required: false
      order_by_job_function:
        anyOf:
        - type: string
        - type: 'null'
        description: Job function whose people metrics drive the sort. Required with (and only valid with) `order_by_column="people_concentration"`
          or `order_by_column="people_count_growth_1y"`.
        required: false
      order_by_advanced_query:
        anyOf:
        - type: string
        - type: 'null'
        description: 'Advanced query whose matching job posts form the sort numerator. Required with (and only valid
          with) `order_by_column="job_post_concentration"`. Allowed fields: technology, technology_category, job_function,
          project, job_level, country. Both the matching and total job counts are all-time.'
        required: false
      match_source:
        type: string
        enum:
        - any
        - job_post
        description: Filter mode only. Which evidence an organization may match the `filter` on. `any` (default)
          matches on either job posts or the skills its employees list on LinkedIn/Coresignal. `job_post` restricts
          matches to job-post evidence only, so an org that matches solely because an employee lists the technology
          (with no job posts mentioning it) is excluded. Applies to all job-side filters (technology, job function,
          hiring location, etc.).
        default: any
        required: false
    note: 1 base + 1 per paid attribute + 1 per requested entity metric per match. Unmatched inputs free. Explicitly
      select id/name/url; live responses do not always include them. Platform supports match mode, explicit safe
      attributes and explicit metrics on technology/job_function/project or aggregate categories; advanced queries,
      ICP/CRM fields and exploded/all metrics require BYOK.
  docs_url: https://docs.sumble.com/api/api
  capability: companies.enrich
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://docs.sumble.com/api/api
    checked: '2026-09-09'
    confidence: documented
    note: 1 base + 1 per paid attribute + 1 per requested entity metric per match. Unmatched inputs free. Explicitly
      select id/name/url; live responses do not always include them. Platform supports match mode, explicit safe
      attributes and explicit metrics on technology/job_function/project or aggregate categories; advanced queries,
      ICP/CRM fields and exploded/all metrics require BYOK.
    display: {unit: result, variable: true}
    sumble:
      mode: compose
      records: organizations
      base: 1
      attribute: 1
      metric: 1
      free_attributes:
      - id
      - name
      - slug
      - url
      - sumble_url
      - account_status
      safe_attributes:
      - id
      - slug
      - name
      - url
      - employee_count
      - industry
      - jobs_count
      - teams_count
      - jobs_count_rollup
      - jobs_count_no_rollup
      - teams_count_rollup
      - teams_count_no_rollup
      - people_count_rollup
      - people_count_no_rollup
      - headquarters_country
      - sumble_url
      - parent_id
      - subsidiary_ids
      - tags
      - status
      - status_reason
      - funding_total_raised
      - funding_valuation
      - funding_last_round_raised
      - funding_last_round_type
      - funding_last_round_date
      max_records: 1000
      default_limit: 10
      max_limit: 200
  test_request:
    body:
      organizations:
      - url: stripe.com
      select:
        attributes:
        - id
        - name
        - url
        - employee_count
        - industry
  verified: '2026-09-09'
  example_response: examples/sumble.organizations.json
