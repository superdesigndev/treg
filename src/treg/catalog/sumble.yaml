- id: sumble.teams
  platform: companies
  scope: any_account
  method: POST
  path: /teams
  name: Unified teams endpoint
  summary: Unified teams endpoint
  input:
    bodyType: json
    body:
      teams:
        anyOf:
        - items:
            type: integer
          type: array
          maxItems: 1000
          minItems: 1
        - type: 'null'
        description: List of Sumble team ids to retrieve and enrich. One result row per entry, in input order. Mutually
          exclusive with `filter`.
        required: false
      filter:
        anyOf:
        - properties:
            organization_ids:
              items:
                type: integer
              type: array
              maxItems: 1000
              minItems: 1
              description: Sumble organization ids to search within. Teams are returned for these organizations
                only — no parent/subsidiary roll-up. Unknown ids simply match no teams.
            query:
              anyOf:
              - properties:
                  query:
                    type: string
                type: object
                required:
                - query
              - type: 'null'
              description: Advanced query narrowing the teams returned (technologies, technology categories, job
                functions, hiring period).
            since:
              anyOf:
              - type: string
              - type: 'null'
              description: Only count activity (jobs_count, first/last activity) on or after this date (YYYY-MM-DD).
                Does not affect the aggregated technology / job-function / location lists, which are all-time.
          additionalProperties: false
          type: object
          required:
          - organization_ids
        - type: 'null'
        description: Query selecting the teams to return. Mutually exclusive with `teams`.
        required: false
      select:
        properties:
          attributes:
            anyOf:
            - items:
                type: string
                enum:
                - organization
                - breadcrumbs
                - jobs_count
                - technology_list
                - job_function_list
                - location_list
                - first_activity
                - last_activity
                - score
              type: array
            - type: string
              const: all
            description: Team attributes to include, or 'all' for every available attribute. Off by default. 'all'
              includes `score` only when it is available (an ICP configured for your account) — otherwise it is
              skipped, not an error. Note that 'all' grows — and its cost grows — as new attributes are added to
              the endpoint.
            default: []
          related_people:
            anyOf:
            - properties:
                attributes:
                  anyOf:
                  - items:
                      type: string
                      enum:
                      - name
                      - email
                      - phone
                      - linkedin_url
                      - job_title
                      - job_function
                      - job_level
                      - location
                      - country
                      - current_employer
                      - technologies
                      - person_score
                      - confidence
                    type: array
                  - type: string
                    const: all
                  description: Person-level attributes to include for each related person, or 'all' for every attribute
                    available here. Contact attributes (email, phone) and `person_score` are not available here;
                    `confidence` (the person-team match score breakdown) is only available here.
                  default: []
                max_per_team:
                  type: integer
                  maximum: 100.0
                  minimum: 1.0
                  description: Maximum related people returned per team.
                  default: 10
              additionalProperties: false
              type: object
            - type: 'null'
            description: Also return the people associated with each team, with a person-team match score. Available
              in both modes. Each related person returned costs 1 credit.
          job_posts:
            anyOf:
            - properties:
                components:
                  anyOf:
                  - items:
                      type: string
                      enum:
                      - job_details
                      - technologies
                      - job_functions
                      - job_level
                    type: array
                  - type: string
                    const: all
                  description: 'Job components to return per posting, or ''all'' for every available component.
                    Mirrors the unified jobs endpoint: `job_details` (title, location, posted date), `technologies`,
                    `job_functions`, `job_level`. Never includes the full description (fetch that from the jobs
                    endpoint with the returned job ids).'
                  default: []
                max_per_team:
                  type: integer
                  maximum: 100.0
                  minimum: 1.0
                  description: Maximum job postings returned per team.
                  default: 10
                since:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Only return job postings pulled on or after this date (YYYY-MM-DD).
              additionalProperties: false
              type: object
            - type: 'null'
            description: Also return the job postings mentioning each team, with composable job components. Each
              job posting returned costs 1 credit.
        additionalProperties: false
        type: object
        description: Dictates exactly which attributes are returned.
        required: true
      limit:
        type: integer
        maximum: 200.0
        minimum: 1.0
        description: Maximum number of teams to return (filter mode only; ignored when `teams` is provided).
        default: 10
        required: false
      offset:
        type: integer
        maximum: 10000.0
        minimum: 0.0
