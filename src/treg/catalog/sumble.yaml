- id: sumble.people
  platform: people
  scope: any_account
  method: POST
  path: /people
  name: Unified people endpoint
  summary: Unified people endpoint
  input:
    bodyType: json
    body:
      people:
        anyOf:
        - items:
            properties:
              person_id:
                anyOf:
                - type: integer
                  minimum: 1.0
                - type: 'null'
                description: Person id on Sumble. When set, it identifies the person directly and `linkedin_url`/`email`
                  are ignored.
              linkedin_url:
                anyOf:
                - type: string
                - type: 'null'
                description: LinkedIn profile URL of the person, e.g. 'https://www.linkedin.com/in/<slug>'. Entries
                  whose URL is not a profile URL come back unmatched. Takes precedence over `email`.
              email:
                anyOf:
                - type: string
                - type: 'null'
                description: Work email of the person, resolved via reverse enrichment. Costs 20 extra credits when
                  it resolves to a returned person; emails that don't resolve come back unmatched, free. Only used
                  when neither `person_id` nor `linkedin_url` is provided.
              name:
                anyOf:
                - type: string
                - type: 'null'
                description: Full name of the person, used only to disambiguate the reverse-enrichment lookup when
                  resolving by `email`. Not an identifier on its own — an entry with just a name is rejected — and
                  ignored for `person_id`/`linkedin_url` entries. Supplying it materially improves resolution for
                  addresses whose local part isn't a parseable name (e.g. `firstname@company.com`), and lets the
                  matcher recognise people whose email is at a former employer.
            additionalProperties: false
            type: object
          type: array
          maxItems: 1000
          minItems: 1
        - type: 'null'
        description: List of people to resolve and enrich. One result row per entry, in input order. Mutually exclusive
          with `filter`.
        required: false
      filter:
        anyOf:
        - properties:
            organization_ids:
              anyOf:
              - items:
                  type: integer
                type: array
                maxItems: 1000
                minItems: 1
              - type: 'null'
              description: 'Sumble organization ids to search within. People queries are organization-scoped: provide
                this and/or `organization_list_id`.'
            organization_list_id:
              anyOf:
              - type: integer
                minimum: 1.0
              - type: 'null'
              description: Id of one of your saved organization lists (see /organization-lists) whose organizations
                to search within. Combined with `organization_ids` when both are provided.
            query:
              anyOf:
              - properties:
                  query:
                    type: string
                type: object
                required:
                - query
              - type: 'null'
              description: Advanced query narrowing the people returned (job functions, technologies, job levels,
                locations, ...).
          additionalProperties: false
          type: object
        - type: 'null'
        description: Query selecting the people to return. Mutually exclusive with `people`.
        required: false
      select:
        properties:
          attributes:
            anyOf:
            - items:
                type: string
                enum:
                - name
                - email
                - phone
                - linkedin_url
                - job_title
                - job_function
                - job_level
                - location
                - country
                - current_employer
                - technologies
                - person_score
                - confidence
              type: array
            - type: string
              const: all
            description: Person-level attributes to include, or 'all' for every attribute-priced attribute. Off
              by default. 'all' excludes contact attributes (email, phone), which must be requested explicitly,
              and includes `person_score` only when it is available (filter mode with exactly one organization in
              scope and an ICP configured for your account) — otherwise it is skipped, not an error. When `person_score`
              is included and no `order_by_column` is set, results are ordered by it. Note that 'all' grows — and
              its cost grows — as new attributes are added to the endpoint.
            default: []
          related_people:
            anyOf:
            - properties:
                direction:
                  items:
                    type: string
                    enum:
                    - managers
                    - direct_reports
                  type: array
                  minItems: 1
                  description: Which hierarchy direction(s) to return.
                attributes:
                  anyOf:
                  - items:
                      type: string
                      enum:
                      - name
                      - email
                      - phone
                      - linkedin_url
                      - job_title
                      - job_function
                      - job_level
                      - location
                      - country
                      - current_employer
                      - technologies
                      - person_score
                      - confidence
                    type: array
                  - type: string
                    const: all
                  description: Person-level attributes to include for each related person, or 'all' for every attribute
                    available here. Contact attributes (email, phone) and `person_score` are not available here;
                    `confidence` (the inferred relationship's score breakdown) is only available here.
                  default: []
              additionalProperties: false
              type: object
              required:
              - direction
            - type: 'null'
            description: Also return people related to each matched person, up or down the org hierarchy. Relationships
              are inferred from org structure and seniority (technology, job function, team, location and job-level
              similarity), not actual reporting lines. Only available in match mode (`people`), for at most 25 people
              per request. Each related person returned costs 1 credit.
        additionalProperties: false
        type: object
        description: Dictates exactly which attributes are returned.
        required: false
      limit:
        type: integer
        maximum: 200.0
        minimum: 1.0
        description: Maximum number of people to return (filter mode only; ignored when `people` is provided).
        default: 10
        required: false
      offset:
        type: integer
        maximum: 10000.0
        minimum: 0.0
        description: Number of results to skip (filter mode only; ignored when `people` is provided).
        default: 0
        required: false
      order_by_column:
        anyOf:
        - type: string
          enum:
          - person_score
          - start_date
          - job_level
        - type: 'null'
        description: 'Column to order by (filter mode only): `start_date` (current role start), `job_level` (seniority
          rank), or `person_score`. `person_score` sorts people by how well they match your ideal customer profile
          (ICP) and includes — and charges for — the `person_score` attribute on every row; it requires the filter
          to resolve to exactly one organization and an ICP configured for your account, and only supports descending
          order. Default: Sumble''s standard people ordering.'
        required: false
      order_by_direction:
        anyOf:
        - type: string
          enum:
          - ASC
          - DESC
        - type: 'null'
        description: Sort direction; DESC when omitted.
        required: false
      request_id:
        anyOf:
        - type: string
        - type: 'null'
        description: (v8 only) Id of a previously started async request (returned by the kickoff call). Provide
          this alone to poll for the status and result.
        required: false
    note: 'Async POST: start with people/filter; poll the SAME endpoint with request_id alone. First succeeded poll
      charges once; later polls report zero. 1 base + paid attributes (name free), related people 1 each; email
      reveal 10, phone 80, successful email resolution 20 extra. Contact reveal repeats/misses free. All/scores
      may include account ICP. treg does not meter BYOK. Platform disabled pending POST-poll ownership and durable
      charge recovery.'
  docs_url: https://docs.sumble.com/api/api
  capability: people.search
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://docs.sumble.com/api/api
    checked: '2026-09-09'
    confidence: documented
    note: 'Async POST: start with people/filter; poll the SAME endpoint with request_id alone. First succeeded poll
      charges once; later polls report zero. 1 base + paid attributes (name free), related people 1 each; email
      reveal 10, phone 80, successful email resolution 20 extra. Contact reveal repeats/misses free. All/scores
      may include account ICP. treg does not meter BYOK. Platform disabled pending POST-poll ownership and durable
      charge recovery.'
  platform_blocked: POST polling with first-success-only charge needs durable settlement/ownership support; use
    your own Sumble key.
  untestable: Requires the caller’s workspace or asynchronous result; documented schema, no public fixture. Use
    BYOK.
  cache: forbidden
- id: sumble.jobs
  platform: companies
  scope: any_account
  method: POST
  path: /jobs
  name: Unified jobs endpoint
  summary: Unified jobs endpoint
  input:
    bodyType: json
    body:
      jobs:
        anyOf:
        - items:
            properties:
              job_id:
                type: integer
                minimum: 1.0
                description: Job id on Sumble.
            additionalProperties: false
            type: object
            required:
            - job_id
          type: array
          maxItems: 1000
          minItems: 1
        - type: 'null'
        description: List of jobs to enrich by id. One result row per entry, in input order. Mutually exclusive
          with `filter`.
        required: false
      filter:
        anyOf:
        - properties:
            organization_ids:
              anyOf:
              - items:
                  type: integer
                type: array
                maxItems: 1000
                minItems: 1
              - type: 'null'
              description: Sumble organization ids to scope the search to. Unknown ids simply match no jobs.
            organization_list_id:
              anyOf:
              - type: integer
                minimum: 1.0
              - type: 'null'
              description: Id of one of your saved organization lists (see /organization-lists) whose organizations
                to search within. Combined with `organization_ids` when both are provided.
            query:
              anyOf:
              - properties:
                  query:
                    type: string
                type: object
                required:
                - query
              - type: 'null'
              description: Advanced query narrowing the jobs returned (technologies, technology categories, job
                functions, countries, hiring period, ...).
          additionalProperties: false
          type: object
        - type: 'null'
        description: Query selecting the jobs to return. Mutually exclusive with `jobs`.
        required: false
      select:
        properties:
          attributes:
            anyOf:
            - items:
                type: string
                enum:
                - title
                - description
                - location
                - posted_date
                - organization
                - technologies
                - teams
                - job_functions
                - job_levels
                - projects
              type: array
            - type: string
              const: all
            description: Job attributes to include, or 'all' for every available attribute (including the full `description`).
              Off by default. Note that 'all' grows — and its cost grows — as new attributes are added to the endpoint.
            default: []
          related_people:
            anyOf:
            - properties:
                attributes:
                  anyOf:
                  - items:
                      type: string
                      enum:
                      - name
                      - email
                      - phone
                      - linkedin_url
                      - job_title
                      - job_function
                      - job_level
                      - location
                      - country
                      - current_employer
                      - technologies
                      - person_score
                      - confidence
                    type: array
                  - type: string
                    const: all
                  description: Person-level attributes to include for each related person, or 'all' for every attribute
                    available here. Contact attributes (email, phone) and `person_score` are not available here;
                    `confidence` (the inferred relationship's score breakdown) is only available here.
                  default: []
                limit:
                  type: integer
                  maximum: 25.0
                  minimum: 1.0
                  description: Maximum related people returned per job.
                  default: 5
                job_levels:
                  items:
                    type: string
                  type: array
                  description: Only return related people whose job level is one of these (by name, e.g. 'Director',
                    'VP'); matching is OR across the list. When provided, this replaces the default seniority filter.
                    When empty (the default), only likely hiring managers are returned — people at Manager level
                    or above, and more senior than the role.
                  default: []
                job_functions:
                  items:
                    type: string
                  type: array
                  description: Only return related people whose primary job function is one of these (by name, e.g.
                    'Engineering') or a descendant of one; matching is OR across the list and all descendants. Combined
                    with `job_levels` as AND. Empty (the default) applies no job function filter.
                  default: []
                sort_order:
                  type: string
                  enum:
                  - score
                  - level
                  description: 'How related people are ranked: ''score'' (similarity score, the default; ties broken
                    by seniority) or ''level'' (seniority; ties broken by score).'
                  default: score
                sort_direction:
                  type: string
                  enum:
                  - desc
                  - asc
