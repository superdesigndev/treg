provider: theirstack
source:
  docs: https://theirstack.com/en/docs/api-reference
  openapi: https://api.theirstack.com/openapi.json # OpenAPI 3.1; every input below is generated from it, minus the fields it marks deprecated
  curated: '2026-10-01'
# Job postings and what they reveal about the company behind them. TheirStack indexes jobs from
# company career sites, ATSs and job boards, then derives each company's technographics and
# buying-intent topics from the text of those postings — so the tech stack and intent data come
# with evidence (how many jobs mention it, first and last seen) and a confidence level.
#
# Billing is per RECORD RETURNED, in API credits, never per request:
#   - job search: 1 credit per job in `data[]`
#   - company search: 3 credits per company in `data[]`
#   - technographics / buying intents: 3 credits per company looked up, whatever the number of
#     technologies or topics returned; no credits when the company is not found
#   - catalog routes (keywords, industries, locations) and the credit balance are free
# `limit` is the price dial on both searches. An empty result costs nothing.
#
# Free plan: only for teams that have never paid for credits. 200 API credits and 50 company
# (app) credits a month — two separate pools; API calls spend only the API credits. Searches are
# capped at 25 results a page and 5 pages. Any purchase moves the team to a paid plan.
#
# Auth: `Authorization: Bearer <key>`. A bad key returns 401
# {"request_id":null,"error":{"code":null,"title":"Could not validate credentials","description":null}}.
# Out of credits returns 402.
limits: "Searches and technographics share 4 requests/second per user on paid accounts (free accounts: 4/s, 10/min, 50/h, 400/day); HTTP 429 when exceeded. Paid plans serve up to 500 results a page with unlimited pages; the free plan serves 25 a page and 5 pages a search"
pricing_url: https://theirstack.com/en/pricing?currency=usd&tab=api

proposed_capabilities:
  companies.tech_stack.users: "Find companies that use a given technology"
  companies.technologies.list: "Browse the catalog of tracked technologies"
  companies.buying_intents: "Topics a company is investing in, inferred from its job postings"
  companies.locations.resolve: "Map a place name to the location ids job and company filters accept"

endpoints:
- id: theirstack.jobs.search
  domain: companies
  capability: companies.jobs.search
  platform: companies
  scope: any_account
  method: POST
  path: /v1/jobs/search
  name: Search job postings by title, tech, location or date
  summary: Search and filter job postings from company career sites and job boards.
  input:
    bodyType: json
    body: &jobs_body
      offset: {type: integer, required: false, note: 'Number of results to skip. Required for [offset-based pagination](https://theirstack.com/en/docs/api-reference/pagination).', default: 0, example: 0, min: 0.0}
      page: {type: integer, required: false, note: 'Page number. Required when using [page-based pagination](https://theirstack.com/en/docs/api-reference/pagination).', default: 0, example: 0, min: 0.0}
      limit: {type: integer, required: false, note: 'Number of results per page — THE PRICE DIAL: 1 API credit per job returned. Up to 500 a page on a paid plan; the free plan caps it at 25 a page and 5 pages a search', default: 25, example: 25, min: 1.0}
      cursor: {type: string, required: false, note: Cursor for pagination}
      job_title_or: {type: 'array[string]', required: false, note: 'Keyword-based patterns to match job titles. Case-insensitive. Returns jobs whose title contains all the words in any of the patterns, in any order. For example, `marketing vp` matches titles such as `VP of Marketing` or `Marketing VP, EMEA`. Passing `["software engineer", "data scientist"]` returns jobs matching either pattern.', example: [software engineer, data scientist]}
      job_title_not: {type: 'array[string]', required: false, note: 'Keyword-based patterns to exclude job titles. Case-insensitive. Excludes jobs whose title contains all the words in any of the patterns, in any order. For example, `marketing vp` excludes titles such as `VP of Marketing` or `Marketing VP, EMEA`.', example: [software engineer, data scientist]}
      job_title_pattern_and: {type: 'array[string]', required: false, note: Regex patterns to match job titles. Case-insensitive. Only jobs with title that match all of these patterns will be returned., example: [\bsoftware\s+engineer\b, \bdata\s+scientist\b, \bproduct\s+manager\b]}
      job_title_pattern_or: {type: 'array[string]', required: false, note: 'Regex patterns to match job titles. Case-insensitive. Jobs whose job title matches any of the patterns will be returned.', example: [\bsoftware\s+engineer\b, \bdata\s+scientist\b, \bproduct\s+manager\b]}
      job_title_pattern_not: {type: 'array[string]', required: false, note: Regex patterns to match job titles. Case-insensitive. Jobs whose job title doesn't match any of the patterns will be returned., example: [\bsoftware\s+engineer\b, \bdata\s+scientist\b, \bproduct\s+manager\b]}
      job_country_code_or: {type: 'array[string]', required: false, note: 2-letter ISO country code of the location of the job. Can pass more than 1, example: [US, GB]}
      job_country_code_not: {type: 'array[string]', required: false, note: 2-letter ISO country code of the location of the job. Can pass more than 1. Will exclude jobs from these countries, example: [US, GB]}
      posted_at_max_age_days: {type: integer, required: false, note: 'Date posted max age in days. If 0, only return jobs posted today. If 1, from today and yesterday, etc.', example: 10}
      posted_at_gte: {type: string, required: false, note: ISO 8601 date string (yyyy-mm-dd). Only jobs published in this date or after will be returned., example: '2025-05-25'}
      posted_at_lte: {type: string, required: false, note: ISO 8601 date string (yyyy-mm-dd). Only jobs published in this date or before will be returned., example: '2025-05-25'}
      discovered_at_max_age_days: {type: integer, required: false, note: 'If 0, only return jobs added to our database in the current day. If 1, from today and yesterday, etc.', example: 10}
      discovered_at_min_age_days: {type: integer, required: false, note: 'If 1, only return jobs discovered by TheirStack until yesterday. If 2, until 2 days ago, etc.', example: 10}
      discovered_at_gte: {type: string, required: false, note: Only jobs discovered by TheirStack on this date or datetime or after will be returned. In UTC timezone., example: '2025-05-25'}
      discovered_at_lte: {type: string, required: false, note: Only jobs discovered by TheirStack on this date or datetime or before will be returned. In UTC timezone., example: '2025-05-25'}
      job_description_pattern_or: {type: 'array[string]', required: false, note: 'Regex patterns to look for in job descriptions. Case-sensitive. Results will include jobs whose description matches any of these patterns. Use (?i) at the start of a pattern to make it case-insensitive. Can pass more than one.', example: ['(?i)\bdata warehouse\b', '(?i)\bELT\b', '(?i)\bETL\b']}
      job_description_pattern_not: {type: 'array[string]', required: false, note: 'Regex patterns to look for in job descriptions. Case-sensitive. Results will include jobs whose description doesn''t match any of these patterns. Use (?i) at the start of a pattern to make it case-insensitive. Can pass more than one.', example: ['(?i)\bdata warehouse\b', '(?i)\bELT\b', '(?i)\bETL\b']}
      job_description_pattern_and: {type: 'array[string]', required: false, note: 'Regex patterns that must ALL match the job description (AND logic). Use (?i) at the start of a pattern to make it case-insensitive. Results will only include jobs whose description matches every pattern in this list.', example: ['(?i)\bML.?Ops\b|\bmachine learning operations\b', '(?i)\bquery optim\w+\b|\bquery performance\b|\bslow quer\w+\b']}
      job_description_contains_or: {type: 'array[string]', required: false, note: 'Search for whole words in job descriptions using word boundaries (\b). Case-insensitive by default, except for the patterns that are uppercase - in that case we''ll respect it. Only finds complete words (e.g., searching ''quality'' won''t match ''inequality''). Results will include jobs whose description contains any of these words.', example: [python, javascript]}
      job_description_contains_not: {type: 'array[string]', required: false, note: 'Exclude jobs whose description contains any of these whole words using word boundaries (\b). Case-insensitive by default, except for the patterns that are uppercase - in that case we''ll respect it. Only finds complete words (e.g., searching ''quality'' won''t match ''inequality''). Results will exclude jobs whose description contains any of these words.', example: [python, javascript]}
      workplace_types_or: {type: 'array[string]', required: false, note: 'Filter jobs by workplace type. Returns jobs that match any of the specified workplace types. `on_site` matches jobs that are neither hybrid nor remote. If no values are provided or an empty list is sent, jobs are not filtered by workplace type.', enum: [on_site, hybrid, remote], example: [hybrid]}
      job_id_or: {type: 'array[integer]', required: false, note: Get jobs with these IDs only., example: [12423312, 2123123, 3123123]}
      job_id_not: {type: 'array[integer]', required: false, note: Exclude jobs with these IDs., example: [12423312, 2123123, 3123123]}
      job_seniority_or: {type: 'array[string]', required: false, note: Will return jobs where the seniority is any of the ones passed here, enum: [c_level, staff, senior, junior, mid_level], example: [junior, mid_level, senior]}
      min_salary_usd: {type: number, required: false, note: 'Minimum annual salary in USD. For example, 100000 means $100,000.', example: 100000}
      max_salary_usd: {type: number, required: false, note: 'Maximum annual salary in USD. For example, 150000 means $150,000.', example: 100000}
      job_technology_slug_or: {type: 'array[string]', required: false, note: 'Will return jobs where any of these technologies appear. Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`. If you pass more than one technology, we will return jobs that mention at least one of them.'}
      job_technology_slug_not: {type: 'array[string]', required: false, note: 'Will return jobs where none of these technologies appear. Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`.'}
      job_technology_slug_and: {type: 'array[string]', required: false, note: 'Will return jobs where all of these technologies appear. Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`.'}
      job_keyword_slug_or: {type: 'array[string]', required: false, note: 'Will return jobs where any of these keyword slugs appear. Case sensitive. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      job_keyword_slug_and: {type: 'array[string]', required: false, note: 'Will return jobs where all of these keyword slugs appear. Case sensitive. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      job_keyword_slug_not: {type: 'array[string]', required: false, note: 'Will return jobs where none of these keyword slugs appear. Case sensitive. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      job_location_or: {type: 'array[object]', required: false, note: 'Filter jobs by location. Returns jobs whose locations match ANY of the specified location criteria. Each location criteria is specified using a JobLocationFilter object. (You can find location IDs using the [locations catalog endpoint](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_locations_v0)) — each item is {id}', example: [{id: 5128581}, {id: 2921044}]}
      job_location_not: {type: 'array[object]', required: false, note: 'Filter jobs by location. Returns jobs whose locations DO NOT match ANY of the specified location criteria. Each location criteria is specified using a JobLocationFilter object. (You can find location IDs using the [locations catalog endpoint](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_locations_v0)) — each item is {id}', example: [{id: 5128581}, {id: 2921044}]}
      url_domain_or: {type: 'array[string]', required: false, note: 'Include jobs only if their URL domain (from `url` or `source_url`) is in the provided case-insensitive list. For example, [''greenhouse.io'', ''workable.com''] will match URLs containing ''greenhouse.io'' or ''workable.com''. Refer to our list of sources at https://theirstack.com/en/docs/data/job/sources.', example: [greenhouse.io, workable.com, join.com, lever.co]}
      url_domain_not: {type: 'array[string]', required: false, note: 'Exclude jobs if their URL domain (from `url` or `source_url`) is in the provided case-insensitive list. For example, [''greenhouse.io'', ''workable.com''] will exclude URLs containing ''greenhouse.io'' or ''workable.com''. Refer to our list of sources at https://theirstack.com/en/docs/data/job/sources.', example: [greenhouse.io, workable.com, join.com, lever.co]}
      easy_apply: {type: boolean, required: false, note: 'If True, only return jobs that can be applied directly through the job board. If False, only return jobs that require redirecting to the company''s website.', example: true}
      employment_statuses_or: {type: 'array[string]', required: false, note: 'Filter jobs by employment status. Returns jobs that match any of the specified employment types. If no values are provided or an empty list is sent, all jobs regardless of employment status will be returned.', enum: [full_time, part_time, temporary, internship, contract, freelance, co_founder, apprenticeship, seasonal, volunteer, other], example: [full_time]}
      is_closed: {type: boolean, required: false, note: 'If True, only return closed jobs (jobs where TheirStack detected the posting was closed). If False, only return open jobs. If None, return all jobs regardless of closure status.', example: true}
      closed_at_gte: {type: string, required: false, note: ISO 8601 date string (yyyy-mm-dd). Only return jobs closed on this date or after., example: '2025-05-25'}
      closed_at_lte: {type: string, required: false, note: ISO 8601 date string (yyyy-mm-dd). Only return jobs closed on this date or before., example: '2025-05-25'}
      property_exists_or: {type: 'array[string]', required: false, note: 'Return jobs that have any of these fields not null. For example, if you pass [''final_url''], it will return jobs that have a final_url set. This field also supports chaining of fields. For example, if you pass [''company_object.domain'', ''company_object.linkedin_url''], it will return jobs that have a company domain or a company linkedin_url set.', enum: [company_object.domain, company_object.linkedin_url, final_url, hiring_team, employment_statuses], example: [company_object.domain, company_object.linkedin_url, final_url]}
      property_exists_and: {type: 'array[string]', required: false, enum: [company_object.domain, company_object.linkedin_url, final_url, hiring_team, employment_statuses], example: [company_object.domain, company_object.linkedin_url, final_url]}
      company_name_or: {type: 'array[string]', required: false, note: 'Only return companies that match these names exactly, case-sensitively. This filter acts as an OR filter, so if you pass more than one company name, it will return companies that match any of the names.', example: [Google, Facebook, Apple]}
      company_name_case_insensitive_or: {type: 'array[string]', required: false, note: 'Only return companies that match these names exactly, case-insensitively.', example: [google, stripe]}
      company_id_or: {type: 'array[string]', required: false, note: 'Only return companies that match these IDs exactly. This filter acts as an OR filter, so if you pass more than one company ID, it will return companies that match any of the IDs.', example: ['1234567890', '1234567891']}
      company_id_not: {type: 'array[string]', required: false, note: 'Exclude companies that match these IDs. This filter acts as a NOT filter, so if you pass more than one company ID, it will exclude companies that match any of the IDs.', example: ['1234567890', '1234567891']}
      company_domain_or: {type: 'array[string]', required: false, note: 'Only return companies that match these domains exactly. It accepts full urls (https://www.google.com/) and emails (andrew@stripe.com). This filter acts as an OR filter, so if you pass more than one company domain, it will return companies that match any of the domains.', example: [google.com, stripe.com]}
      company_domain_not: {type: 'array[string]', required: false, note: 'Only return companies that don''t match these domains exactly. It accepts full urls (https://www.google.com/) and emails (andrew@stripe.com).', example: [google.com, stripe.com]}
      company_name_not: {type: 'array[string]', required: false, note: 'Only return companies that don''t match these names exactly, case-sensitively.', example: [Google, Facebook, Apple]}
      company_name_partial_match_or: {type: 'array[string]', required: false, note: 'Company names. Will return companies whose name contains any of the substrings passed here, case-insensitively. For example, if you pass "google", it will return "Google", "Google LLC", "Google Inc", etc.', example: [google, stripe]}
      company_name_partial_match_not: {type: 'array[string]', required: false, note: 'Company names. Will return companies whose name doesn''t contain any of the substrings passed here, case-insensitively. For example, if you pass ''google'', it will exclude ''Google'', ''Google LLC'', ''Google Inc'', etc.', example: [google, stripe]}
      company_linkedin_url_or: {type: 'array[string]', required: false, note: 'Return companies whose LinkedIn page matches any of the values passed here. Both forms of LinkedIn company URL work — the vanity slug (`https://www.linkedin.com/company/google/`) and the numeric company ID (`https://www.linkedin.com/company/1038`) — as do a bare slug (`google`) and a bare numeric ID (`1038`). A numeric value is matched against the company''s LinkedIn ID and its slug, so you do not need to know which of the two you are holding. We have a LinkedIn slug for ~26% of companies and a numeric LinkedIn ID for ~14%, so if you have the company''s domain, `company_domain_or` matches more often.', example: ['https://www.linkedin.com/company/google/']}
      company_description_pattern_or: {type: 'array[string]', required: false, note: Case-insensitive patterns to match in the company description. Will return companies that match any of the patterns.}
      company_description_pattern_not: {type: 'array[string]', required: false, note: 'Case-insensitive patterns to match in the company description. Will exclude companies that match any of the patterns.'}
      company_description_pattern_accent_insensitive: {type: boolean, required: false, note: 'Set to True to make company description searches accent insensitive. For example, "á" will match "a" as well.', default: false, example: true}
      min_revenue_usd: {type: integer, required: false, note: 'Minimum company revenue, in USD'}
      max_revenue_usd: {type: integer, required: false, note: 'Maximum company revenue, in USD'}
      min_employee_count: {type: integer, required: false, note: Minimum number of employees in a company, example: 100}
      max_employee_count: {type: integer, required: false, note: Maximum number of employees in a company, example: 100}
      min_employee_count_or_null: {type: integer, required: false, note: 'Minimum number of employees in a company. If we don''t have company size information, we will return it as well.', example: 100}
      max_employee_count_or_null: {type: integer, required: false, note: 'Maximum number of employees in a company. If we don''t have company size information, we will return it as well.', example: 100}
      min_funding_usd: {type: integer, required: false, note: 'Minimum company funding, in USD', example: 1000000000}
      max_funding_usd: {type: integer, required: false, note: 'Maximum company funding, in USD', example: 1000000000}
      funding_stage_or: {type: 'array[string]', required: false, note: 'Funding stages of companies returned. Possible values: [''angel'', ''convertible_note'', ''debt_financing'', ''equity_crowdfunding'', ''other'', ''private_equity'', ''seed'', ''series_a'', ''series_b'', ''series_c'', ''series_d'', ''series_e'', ''series_f'', ''series_g'', ''series_h'', ''venture_round_not_specified'', ''series_i'', ''series_j'', ''undisclosed'', ''series_unknown'', ''pre_seed'', ''post_ipo_secondary'', ''post_ipo_equity'', ''post_ipo_debt'', ''non_equity_assistance'', ''late_vc'', ''initial_coin_offering'', ''growth_equity_vc'', ''grant'', ''early_vc'', ''corporate_round'', ''secondary_market'', ''product_crowdfunding'']'}
      industry_id_or: {type: 'array[integer]', required: false, note: 'Industry codes. You can use any of [LinkedIn''s Industry Codes V2](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2) or [GET /v0/catalog/industries](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_industries_v0)'}
      industry_id_not: {type: 'array[integer]', required: false, note: 'Industry ids to exclude. You can use any of [LinkedIn''s Industry Codes V2](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2) or [GET /v0/catalog/industries](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_industries_v0)'}
      industry_id_not_or_null: {type: 'array[integer]', required: false, note: 'Industry ids to exclude. Companies whose industry we don''t know are returned as well. You can use any of [LinkedIn''s Industry Codes V2](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2) or [GET /v0/catalog/industries](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_industries_v0)'}
      company_tags_or: {type: 'array[string]', required: false, note: Return companies that match any of these keywords}
      company_type: {type: string, required: false, note: Filter by company type., enum: [recruiting_agency, direct_employer, all]}
      company_investors_or: {type: 'array[string]', required: false, note: Investors of the company}
      company_investors_partial_match_or: {type: 'array[string]', required: false, note: 'Investors of the company. Will return companies for which any of their investors contains any of the substrings passed here. For example, if you pass ''andree'', all funds that match it (like ''Andreessen Horowitz'', ''Andreessen Horowitz LLC'', etc).'}
      company_technology_slug_or: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned any of these technologies in their jobs (in job searches, not necessarily in the jobs returned). Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`'}
      company_technology_slug_and: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned all of these technologies in their jobs (in job searches, not necessarily in the jobs returned). Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`'}
      company_technology_slug_not: {type: 'array[string]', required: false, note: 'Return results from companies that haven''t mentioned any of these technologies in their jobs. Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`'}
      company_keyword_slug_or: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned any of these keywords in their jobs. Case sensitive. Pass slugs. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      company_keyword_slug_and: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned all of these keywords in their jobs. Case sensitive. Pass slugs. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      company_keyword_slug_not: {type: 'array[string]', required: false, note: 'Return results from companies that haven''t mentioned any of these keywords in their jobs. Case sensitive. Pass slugs. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      only_yc_companies: {type: boolean, required: false, note: Only return YC companies, default: false}
      company_location_pattern_or: {type: 'array[string]', required: false, note: 'Return companies whose city matches any of the patterns passed here. Case insensitive. For example, if you pass ''san francisco'', it will return companies whose city is ''San Francisco'', ''San Francisco Bay Area'', etc.'}
      company_country_code_or: {type: 'array[string]', required: false, note: 'Return companies whose HQ country code is any of the ones passed here, case sensitive. Pass ISO2 country codes.'}
      company_country_code_not: {type: 'array[string]', required: false, note: 'Return companies whose HQ country code is not any of the ones passed here, case sensitive. Pass ISO2 country codes.'}
      company_country_code_not_or_null: {type: 'array[string]', required: false, note: 'Return companies whose HQ country code is not any of the ones passed here, case sensitive. Companies whose country we don''t know are returned as well. Pass ISO2 country codes.'}
      company_list_id_or: {type: 'array[integer]', required: false, note: Return companies that belong to any of the company lists passed here}
      company_list_id_not: {type: 'array[integer]', required: false, note: Return companies that don't belong to any of the company lists passed here}
      company_revealed_at_gte: {type: string, required: false, note: Filter companies (or jobs by their company) by when the company was revealed in the caller's account. Returns only companies revealed at or after this ISO-8601 timestamp. Scoped to the caller's team — has no effect for companies the team has never revealed.}
      company_revealed_at_lte: {type: string, required: false, note: Filter companies (or jobs by their company) by when the company was revealed in the caller's account. Returns only companies revealed at or before this ISO-8601 timestamp. Scoped to the caller's team — has no effect for companies the team has never revealed.}
      last_funding_round_date_lte: {type: string, required: false, note: 'Only return companies whose last funding round date is before or on this date. Format: ''YYYY-MM-DD''', example: '2025-05-25'}
      last_funding_round_date_gte: {type: string, required: false, note: 'Only return companies whose last funding round date is after or on this date. Format: ''YYYY-MM-DD''', example: '2025-05-25'}
    note: 'At least one of posted_at_max_age_days, posted_at_gte, posted_at_lte, company_domain_or, company_linkedin_url_or or company_name_or is required. Every job carries title, description, URLs, location, salary, seniority, the technologies and keywords it mentions, hiring managers when known, and a nested company object with firmographics'
  test_request:
    body:
      posted_at_max_age_days: 7
      job_country_code_or:
      - US
      job_title_or:
      - data engineer
      limit: 1
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: record
    source: docs
