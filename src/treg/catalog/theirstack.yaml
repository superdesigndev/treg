        group_by: {type: string, required: false}
        endpoint: {type: string, required: false}
    test_request: {queryParams: {start_datetime: '2026-10-26T00:00:00Z', end_datetime: '2026-10-27T23:59:59Z'}}
    verified: '2026-10-27'
    added: '2026-10-27'
    example_response: examples/theirstack.account.credits_consumption.json
    cost: {type: free, value: 0, currency: USD, unit: call}
