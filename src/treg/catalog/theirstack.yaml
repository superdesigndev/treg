      keyword_parent_category_slug_or: {type: 'array[string]', required: false, note: 'Only return keywords from any of these parent categories. Case sensitive. Pass slugs. Check out all keyword categories at [GET /v1/catalog/keywords/categories](https://theirstack.com/en/docs/api-reference/catalog/list_keyword_categories_v1)'}
      max_rank: {type: integer, required: false, note: 'The rank measures how common a keyword (technology or buying intent topic) is within its category for a company. The keyword most mentioned among similar ones by a company has a rank of 1, the second 2, etc. Useful to keep only the primary technology or topic of each category.'}
      min_jobs: {type: integer, required: false, note: 'Minimum number of jobs in which each company mentions the keyword (technology or buying intent topic)'}
      max_jobs: {type: integer, required: false, note: 'Maximum number of jobs in which each company mentions the keyword (technology or buying intent topic)'}
      min_relative_occurrence: {type: number, required: false, note: 'Minimum value of relative_occurrence_within_category for each keyword (technology or buying intent topic). Higher values increase the probability that the company actually uses the technology or cares about the topic, because a higher share of the mentions within that category are of this keyword.'}
      first_date_found_gte: {type: string, required: false, note: 'Only return keywords (technologies or buying intent topics) where the first time they were found was after or on this date. Format: "YYYY-MM-DD"'}
      first_date_found_lte: {type: string, required: false, note: 'Only return keywords (technologies or buying intent topics) where the first time they were found was before or on this date. Format: "YYYY-MM-DD"'}
      last_date_found_gte: {type: string, required: false, note: 'Only return keywords (technologies or buying intent topics) where the last time they were found was after or on this date. Format: "YYYY-MM-DD"'}
      last_date_found_lte: {type: string, required: false, note: 'Only return keywords (technologies or buying intent topics) where the last time they were found was before or on this date. Format: "YYYY-MM-DD"'}
      confidence_or: {type: 'array[string]', required: false, note: 'Only return keywords (technologies or buying intent topics) detected with any of these confidence levels. Available values: "high", "medium", "low"', enum: [low, medium, high]}
    note: topics are things a company is hiring to build or adopt (e.g. SOC 2, data warehouse migration), read from the text of its postings
  test_request:
    body:
      company_domain: stripe.com
      limit: 5
  cost:
    type: per_success
    value: 3
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://theirstack.com/en/docs/api-reference/companies/buying_intents_v1
    checked: '2026-10-01'
    confidence: documented
    note: 3 API credits per company lookup however many topics return; an unknown company costs nothing
  docs_url: https://theirstack.com/en/docs/api-reference/companies/buying_intents_v1
- id: theirstack.technologies.list
  domain: companies
  capability: companies.technologies.list
  platform: companies
  scope: any_account
  method: GET
  path: /v0/catalog/keywords
  name: Search the technology and buying-intent catalog
  summary: Lists the technologies and buying-intent topics TheirStack tracks, with how many companies use each.
  input:
    queryParams:
      keyword_type: {type: string, required: false, note: Keyword type to filter by, enum: [technology, software_product, technology_concept, operational_activity, strategic_initiative, metric_or_concept, product_or_service_offered, regulation, threat_or_risk, event, commodity, industry_vertical, physical_equipment, medical_research, government_body]}
      keyword_type_not: {type: 'array[string]', required: false, note: Exclude keywords of these types, enum: [technology, software_product, technology_concept, operational_activity, strategic_initiative, metric_or_concept, product_or_service_offered, regulation, threat_or_risk, event, commodity, industry_vertical, physical_equipment, medical_research, government_body]}
      name_pattern: {type: string, required: false, note: Case-insensitive text to search for in the keyword name}
      slugs: {type: 'array[string]', required: false, note: Keyword slugs of one or many keywords}
      category_pattern: {type: string, required: false, note: 'Case-insensitive text to search for in the keyword category. For example, `data` to find ''data tools''.'}
      category_slug: {type: string, required: false, note: Keyword category slug}
      parent_category_slug: {type: string, required: false, note: Keyword parent category slug}
      parent_category_pattern: {type: string, required: false, note: Case-insensitive text to search for in the keyword parent category name}
      q: {type: string, required: false, note: 'General search query. Searches across keyword name, keyword type, category, and parent category (case-insensitive). Results where the keyword name starts with the query are ranked first.'}
      starts_with: {type: string, required: false, note: Filter keywords whose name starts with this string (e.g. 'A' for glossary). Special value '__other__' selects keywords whose name does not start with letters A-Z.}
      page: {type: integer, required: false, note: Page number., default: 0, min: 0}
      limit: {type: integer, required: false, note: Number of results per page, default: 25, min: 1}
    note: use it to turn a product name into the slug the search and technographics filters take
  test_request:
    queryParams:
      q: snowflake
      keyword_type: technology
      limit: 5
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0
    checked: '2026-10-01'
    confidence: documented
  docs_url: https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0
