    input:
      queryParams:
        country: {type: string, required: false, example: France}
        page: {type: integer, required: false, example: 0}
        limit: {type: integer, required: false, example: 1}
    test_request: {queryParams: {country: France, limit: 1}}
    verified: '2026-10-27'
    added: '2026-10-27'
    example_response: examples/theirstack.catalog.company_countries.json
    cost: {type: free, value: 0, currency: USD, unit: call}
    docs_url: https://theirstack.com/en/docs/api-reference/catalog/get_catalog_companies_per_company_country_code_v0

  - id: theirstack.account.balance
    kind: account
    domain: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /v0/billing/credit-balance
    name: Check API credit balance
    summary: Read your own API credit allocation and usage.
    input: {queryParams: {}}
    test_request: {queryParams: {}}
    verified: '2026-10-27'
    added: '2026-10-27'
    example_response: examples/theirstack.account.balance.json
    cost: {type: free, value: 0, currency: USD, unit: call}
    docs_url: https://theirstack.com/en/docs/api-reference/billing/get_billing_credit_balance_v0

  - id: theirstack.account.credits_consumption
    kind: account
    domain: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /v0/teams/credits_consumption
    name: Inspect credit consumption
    summary: Read your own API credit consumption over a time range.
    input:
      queryParams:
        start_datetime: {type: string, required: false, example: '2026-10-26T00:00:00Z'}
