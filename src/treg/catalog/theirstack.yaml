- id: theirstack.companies.search
  domain: companies
  capability: companies.search
  platform: companies
  scope: any_account
  method: POST
  path: /v1/companies/search
  name: Search companies by tech stack, hiring, size or industry
  summary: Find companies by firmographics, the technologies they use and the jobs they are hiring for.
  input:
    bodyType: json
    body: &companies_body
      expand_technology_slugs: {type: 'array[string]', required: false, note: 'Specify technology slugs to include detailed technology usage information for each company. The response will include a ''technologies_found'' field containing metrics like confidence score, ranking, and job count for each specified technology. Note: If a technology is not listed for a company, it means we haven''t detected it in that company''s jobs. This feature is useful for enriching company data with their technology stack details.'}
      order_by: {type: 'array[object]', required: false, note: 'List of column objects. You can pass several columns to order by, in order of priority. Only `field` is required, `desc` is True by default — each item is {desc, field (relevance | name | num_jobs | num_jobs_last_30_days | num_jobs_found | employee_count | alexa_ranking | founded_year | annual_revenue_usd | total_funding_usd | last_funding_round_date | confidence | jobs | first_date_found)}'}
      company_name_or: {type: 'array[string]', required: false, note: 'Only return companies that match these names exactly, case-sensitively. This filter acts as an OR filter, so if you pass more than one company name, it will return companies that match any of the names.', example: [Google, Facebook, Apple]}
      company_name_case_insensitive_or: {type: 'array[string]', required: false, note: 'Only return companies that match these names exactly, case-insensitively.', example: [google, stripe]}
      company_id_or: {type: 'array[string]', required: false, note: 'Only return companies that match these IDs exactly. This filter acts as an OR filter, so if you pass more than one company ID, it will return companies that match any of the IDs.', example: ['1234567890', '1234567891']}
      company_id_not: {type: 'array[string]', required: false, note: 'Exclude companies that match these IDs. This filter acts as a NOT filter, so if you pass more than one company ID, it will exclude companies that match any of the IDs.', example: ['1234567890', '1234567891']}
      company_domain_or: {type: 'array[string]', required: false, note: 'Only return companies that match these domains exactly. It accepts full urls (https://www.google.com/) and emails (andrew@stripe.com). This filter acts as an OR filter, so if you pass more than one company domain, it will return companies that match any of the domains.', example: [google.com, stripe.com]}
      company_domain_not: {type: 'array[string]', required: false, note: 'Only return companies that don''t match these domains exactly. It accepts full urls (https://www.google.com/) and emails (andrew@stripe.com).', example: [google.com, stripe.com]}
      company_name_not: {type: 'array[string]', required: false, note: 'Only return companies that don''t match these names exactly, case-sensitively.', example: [Google, Facebook, Apple]}
      company_name_partial_match_or: {type: 'array[string]', required: false, note: 'Company names. Will return companies whose name contains any of the substrings passed here, case-insensitively. For example, if you pass "google", it will return "Google", "Google LLC", "Google Inc", etc.', example: [google, stripe]}
      company_name_partial_match_not: {type: 'array[string]', required: false, note: 'Company names. Will return companies whose name doesn''t contain any of the substrings passed here, case-insensitively. For example, if you pass ''google'', it will exclude ''Google'', ''Google LLC'', ''Google Inc'', etc.', example: [google, stripe]}
      company_linkedin_url_or: {type: 'array[string]', required: false, note: 'Return companies whose LinkedIn page matches any of the values passed here. Both forms of LinkedIn company URL work — the vanity slug (`https://www.linkedin.com/company/google/`) and the numeric company ID (`https://www.linkedin.com/company/1038`) — as do a bare slug (`google`) and a bare numeric ID (`1038`). A numeric value is matched against the company''s LinkedIn ID and its slug, so you do not need to know which of the two you are holding. We have a LinkedIn slug for ~26% of companies and a numeric LinkedIn ID for ~14%, so if you have the company''s domain, `company_domain_or` matches more often.', example: ['https://www.linkedin.com/company/google/']}
      property_exists_or: {type: 'array[string]', required: false, note: 'Return companies that have any of these fields not null. For example, if you pass [''domain'', ''linkedin_url''], it will return companies that have a domain OR a linkedin_url set.', enum: [domain, linkedin_url], example: [domain, linkedin_url]}
      property_exists_and: {type: 'array[string]', required: false, note: 'Return companies that have all of these fields not null. For example, if you pass [''domain'', ''linkedin_url''], it will return companies that have both domain AND linkedin_url set.', enum: [domain, linkedin_url], example: [domain, linkedin_url]}
      offset: {type: integer, required: false, note: 'Number of results to skip. Required for [offset-based pagination](https://theirstack.com/en/docs/api-reference/pagination).', default: 0, example: 0, min: 0.0}
      page: {type: integer, required: false, note: 'Page number. Required when using [page-based pagination](https://theirstack.com/en/docs/api-reference/pagination).', default: 0, example: 0, min: 0.0}
      limit: {type: integer, required: false, note: 'Number of results per page — THE PRICE DIAL: 3 API credits per company returned. Up to 500 a page on a paid plan; the free plan caps it at 25 a page and 5 pages a search', default: 25, example: 25, min: 1.0}
      cursor: {type: string, required: false, note: Cursor for pagination}
      company_description_pattern_or: {type: 'array[string]', required: false, note: Case-insensitive patterns to match in the company description. Will return companies that match any of the patterns.}
      company_description_pattern_not: {type: 'array[string]', required: false, note: 'Case-insensitive patterns to match in the company description. Will exclude companies that match any of the patterns.'}
      company_description_pattern_accent_insensitive: {type: boolean, required: false, note: 'Set to True to make company description searches accent insensitive. For example, "á" will match "a" as well.', default: false, example: true}
      min_revenue_usd: {type: integer, required: false, note: 'Minimum company revenue, in USD'}
      max_revenue_usd: {type: integer, required: false, note: 'Maximum company revenue, in USD'}
      min_employee_count: {type: integer, required: false, note: Minimum number of employees in a company, example: 100}
      max_employee_count: {type: integer, required: false, note: Maximum number of employees in a company, example: 100}
      min_employee_count_or_null: {type: integer, required: false, note: 'Minimum number of employees in a company. If we don''t have company size information, we will return it as well.', example: 100}
      max_employee_count_or_null: {type: integer, required: false, note: 'Maximum number of employees in a company. If we don''t have company size information, we will return it as well.', example: 100}
      min_funding_usd: {type: integer, required: false, note: 'Minimum company funding, in USD', example: 1000000000}
      max_funding_usd: {type: integer, required: false, note: 'Maximum company funding, in USD', example: 1000000000}
      funding_stage_or: {type: 'array[string]', required: false, note: 'Funding stages of companies returned. Possible values: [''angel'', ''convertible_note'', ''debt_financing'', ''equity_crowdfunding'', ''other'', ''private_equity'', ''seed'', ''series_a'', ''series_b'', ''series_c'', ''series_d'', ''series_e'', ''series_f'', ''series_g'', ''series_h'', ''venture_round_not_specified'', ''series_i'', ''series_j'', ''undisclosed'', ''series_unknown'', ''pre_seed'', ''post_ipo_secondary'', ''post_ipo_equity'', ''post_ipo_debt'', ''non_equity_assistance'', ''late_vc'', ''initial_coin_offering'', ''growth_equity_vc'', ''grant'', ''early_vc'', ''corporate_round'', ''secondary_market'', ''product_crowdfunding'']'}
      industry_id_or: {type: 'array[integer]', required: false, note: 'Industry codes. You can use any of [LinkedIn''s Industry Codes V2](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2) or [GET /v0/catalog/industries](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_industries_v0)'}
      industry_id_not: {type: 'array[integer]', required: false, note: 'Industry ids to exclude. You can use any of [LinkedIn''s Industry Codes V2](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2) or [GET /v0/catalog/industries](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_industries_v0)'}
      industry_id_not_or_null: {type: 'array[integer]', required: false, note: 'Industry ids to exclude. Companies whose industry we don''t know are returned as well. You can use any of [LinkedIn''s Industry Codes V2](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2) or [GET /v0/catalog/industries](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_industries_v0)'}
      company_tags_or: {type: 'array[string]', required: false, note: Return companies that match any of these keywords}
      company_type: {type: string, required: false, note: Filter by company type., enum: [recruiting_agency, direct_employer, all]}
      company_investors_or: {type: 'array[string]', required: false, note: Investors of the company}
      company_investors_partial_match_or: {type: 'array[string]', required: false, note: 'Investors of the company. Will return companies for which any of their investors contains any of the substrings passed here. For example, if you pass ''andree'', all funds that match it (like ''Andreessen Horowitz'', ''Andreessen Horowitz LLC'', etc).'}
      company_technology_slug_or: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned any of these technologies in their jobs (in job searches, not necessarily in the jobs returned). Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`'}
      company_technology_slug_and: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned all of these technologies in their jobs (in job searches, not necessarily in the jobs returned). Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`'}
      company_technology_slug_not: {type: 'array[string]', required: false, note: 'Return results from companies that haven''t mentioned any of these technologies in their jobs. Case sensitive. Pass slugs. Check out all the technologies we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0) with `keyword_type=technology`'}
      company_keyword_slug_or: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned any of these keywords in their jobs. Case sensitive. Pass slugs. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      company_keyword_slug_and: {type: 'array[string]', required: false, note: 'Return results from companies that have mentioned all of these keywords in their jobs. Case sensitive. Pass slugs. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      company_keyword_slug_not: {type: 'array[string]', required: false, note: 'Return results from companies that haven''t mentioned any of these keywords in their jobs. Case sensitive. Pass slugs. Check out all the keywords we track at [GET /v0/catalog/keywords](https://theirstack.com/en/docs/api-reference/catalog/get_catalog_keywords_v0)'}
      only_yc_companies: {type: boolean, required: false, note: Only return YC companies, default: false}
      company_location_pattern_or: {type: 'array[string]', required: false, note: 'Return companies whose city matches any of the patterns passed here. Case insensitive. For example, if you pass ''san francisco'', it will return companies whose city is ''San Francisco'', ''San Francisco Bay Area'', etc.'}
      company_country_code_or: {type: 'array[string]', required: false, note: 'Return companies whose HQ country code is any of the ones passed here, case sensitive. Pass ISO2 country codes.'}
      company_country_code_not: {type: 'array[string]', required: false, note: 'Return companies whose HQ country code is not any of the ones passed here, case sensitive. Pass ISO2 country codes.'}
      company_country_code_not_or_null: {type: 'array[string]', required: false, note: 'Return companies whose HQ country code is not any of the ones passed here, case sensitive. Companies whose country we don''t know are returned as well. Pass ISO2 country codes.'}
      company_list_id_or: {type: 'array[integer]', required: false, note: Return companies that belong to any of the company lists passed here}
      company_list_id_not: {type: 'array[integer]', required: false, note: Return companies that don't belong to any of the company lists passed here}
      company_revealed_at_gte: {type: string, required: false, note: Filter companies (or jobs by their company) by when the company was revealed in the caller's account. Returns only companies revealed at or after this ISO-8601 timestamp. Scoped to the caller's team — has no effect for companies the team has never revealed.}
      company_revealed_at_lte: {type: string, required: false, note: Filter companies (or jobs by their company) by when the company was revealed in the caller's account. Returns only companies revealed at or before this ISO-8601 timestamp. Scoped to the caller's team — has no effect for companies the team has never revealed.}
      last_funding_round_date_lte: {type: string, required: false, note: 'Only return companies whose last funding round date is before or on this date. Format: ''YYYY-MM-DD''', example: '2025-05-25'}
      last_funding_round_date_gte: {type: string, required: false, note: 'Only return companies whose last funding round date is after or on this date. Format: ''YYYY-MM-DD''', example: '2025-05-25'}
      job_filters: {type: object, required: false}
      min_num_jobs_found: {type: integer, required: false, note: 'Minimum number of jobs matching `job_filters` a company must have to be returned (thresholds the `num_jobs_found` count). Requires `job_filters` with a date filter, so the count is always computed over the date-bounded set of matching jobs.', example: 10, min: 1.0}
      tech_filters: {type: object, required: false, note: 'Filter by technologies and buying intent topics detected for the company — each item is {keyword_slug_or, keyword_category_slug_or, keyword_parent_category_slug_or, technology_slug_or, technology_category_slug_or, technology_parent_category_slug_or, max_rank, min_jobs, max_jobs, min_relative_occurrence, first_date_found_gte, first_date_found_lte, last_date_found_gte, last_date_found_lte, confidence_or (low | medium | high)}'}
    note: each company carries domain, LinkedIn URL, employee count, industry, HQ location, funding, revenue estimate, job counts and its technology slugs
  test_request:
    body:
      company_technology_slug_or:
      - snowflake
      company_country_code_or:
      - DE
      limit: 1
