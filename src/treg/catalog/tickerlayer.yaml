    input:
      pathParams:
        symbol: {type: string, required: true, note: "coin ticker followed by USD", example: "BTCUSD"}
        multiplier: {type: integer, required: true, note: "bar size: 1, 5 or 15 with minute; 1 or 4 with hour; 1 with day", example: 1}
        timespan: {type: string, required: true, note: "minute, hour or day", example: day}
        from: {type: string, required: true, note: "first UTC date, YYYY-MM-DD, inclusive", example: "2026-11-20"}
        to: {type: string, required: true, note: "last UTC date, YYYY-MM-DD, inclusive", example: "2026-11-22"}
      queryParams:
        limit: {type: integer, required: false, min: 1, max: 5000, default: 500, note: "bars per page", example: 2}
        offset: {type: integer, required: false, min: 0, default: 0, note: "bars to skip, from next_offset"}
        sort: {type: string, required: false, enum: [asc, desc], default: desc}
    test_request: {pathParams: {symbol: "BTCUSD", multiplier: 1, timespan: day, from: "2026-11-20", to: "2026-11-22"}, queryParams: {limit: 2}}
    price: {value: '0.000196', currency: USD, per: 1, unit: call, note: "Flat plan: crypto Individual 49 USD a month for 250,000 REST calls. A free key covers crypto. An answer with no bars still uses a call; an error uses none."}
    miss: {when: {path: response.results, op: empty}}
    bill: {miss: charged}
    docs_url: https://tickerlayer.com/docs/products/crypto

