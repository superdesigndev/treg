  - id: tickerlayer.markets.commodities.quote
    added: '2026-11-26'
    capability: markets.commodities.quote
    platform: markets
    scope: any_account
    method: GET
    path: /commodities/quote/{symbol}
    name: "Commodity quote: gold, oil, metals and crops"
    summary: "Get the latest bid and ask for a commodity priced in US dollars: gold, silver, Brent, copper, coffee and more (XAUUSD, BRENTUSD)"
    input:
      pathParams:
        symbol: {type: string, required: true, note: "commodity code ending in USD; the list is at GET /commodities/symbols", example: "XAUUSD"}
    test_request: {pathParams: {symbol: "XAUUSD"}}
    price: {value: '0.000196', currency: USD, per: 1, unit: call, note: "Flat plan: commodities Individual 49 USD a month for 250,000 REST calls. A free key reads XAUUSD and XAGUSD only. Errors use no call."}
    miss: {status: [404], means: "The code is not in the catalog; the body is {\"statusCode\":404,\"message\":\"symbol not available\"}."}
    docs_url: https://tickerlayer.com/docs/products/commodities

  - id: tickerlayer.markets.indices.quote
    added: '2026-11-26'
    capability: markets.indices.quote
    platform: markets
    scope: any_account
    method: GET
    path: /indices/quote/{symbol}
    name: "Stock index level by region code"
    summary: "Get the latest bid and ask for a stock index by its region code (US500, US30, DE40, UK100, JP225)"
    note: "Indices use bare region codes with no country prefix: US500, not US:SPX."
    input:
      pathParams:
        symbol: {type: string, required: true, note: "region code; the list is at GET /indices/symbols", example: "US500"}
    test_request: {pathParams: {symbol: "US500"}}
    price: {value: '0.000196', currency: USD, per: 1, unit: call, note: "Flat plan: indices Individual 49 USD a month for 250,000 REST calls. Not on the free key. Errors use no call."}
    miss: {status: [404], means: "The code is not in the catalog; the body is {\"statusCode\":404,\"message\":\"symbol not available\"}."}
