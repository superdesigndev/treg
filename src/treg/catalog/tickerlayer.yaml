  - id: tickerlayer.markets.perpetuals.quote
    added: '2026-11-26'
    capability: markets.perpetuals.quote
    platform: markets
    scope: any_account
    method: GET
    path: /perpetuals/quote/{symbol}
    name: "Perpetual futures quote, 24/7"
    summary: "Get the composite bid and ask of a USDT-quoted perpetual futures contract on crypto, stocks, gold or indices (BTCUSDT, XAUUSDT, SPYUSDT), weekends included"
    note: "A code ending in USDT is a perpetual contract, not a spot pair: spot bitcoin is tickerlayer.crypto.price.current with BTCUSD."
    input:
      pathParams:
        symbol: {type: string, required: true, note: "contract code ending in USDT", example: "BTCUSDT"}
    test_request: {pathParams: {symbol: "BTCUSDT"}}
    price: {value: '0.000716', currency: USD, per: 1, unit: call, note: "Flat plan: Perpetuals Individual 179 USD a month for 250,000 REST calls. Not on the free key. Errors use no call."}
    miss: {status: [404], means: "The contract is not listed; the body is {\"message\":\"unknown symbol\",\"error\":\"Not Found\",\"statusCode\":404}."}
    docs_url: https://tickerlayer.com/docs/products/perpetuals

  - id: tickerlayer.markets.bonds.curve
    added: '2026-11-26'
    capability: markets.bonds.curve
    platform: markets
    scope: any_account
    method: GET
    path: /bond/curve/{country}
    name: "Government bond yield curve by country"
    summary: "Get a country's whole government yield curve in one call (US, DE, UK, JP, FR, IT, ES): each tenor's yield in percent with the prior day's value and the change in basis points"
    note: "One dated observation per tenor per day, not intraday prices."
    input:
      pathParams:
        country: {type: string, required: true, note: "two-letter code: US, JP, FR, IT, UK, DE or ES", example: "US"}
    test_request: {pathParams: {country: "US"}}
    price: {value: '0.000156', currency: USD, per: 1, unit: call, note: "Bonds add-on: Individual 39 USD a month for 250,000 REST calls. Not on the free key. Errors use no call."}
    docs_url: https://tickerlayer.com/docs/products/bonds
