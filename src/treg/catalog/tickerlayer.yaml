    path: /forex/quote/{symbol}
    name: "Forex quote by currency pair"
    summary: "Get the latest bid, ask and sizes for a currency pair (EURUSD, USDJPY, GBPUSD), majors, minors and emerging-market pairs, with a millisecond timestamp"
    input:
      pathParams:
        symbol: {type: string, required: true, note: "six-letter pair, no slash", example: "EURUSD"}
    test_request: {pathParams: {symbol: "EURUSD"}}
    price: {value: '0.000236', currency: USD, per: 1, unit: call, note: "Flat plan: forex Individual 59 USD a month for 250,000 REST calls. A free key covers forex with 3,000 REST calls every 30 days. Errors use no call."}
    miss: {status: [404], means: "The pair is not in the catalog; the body is {\"statusCode\":404,\"message\":\"symbol not available\"}."}
    docs_url: https://tickerlayer.com/docs/products/forex

  - id: tickerlayer.markets.forex.history
    added: '2026-11-26'
    capability: markets.forex.history
    platform: markets
    scope: any_account
    method: GET
    path: /forex/agg/{symbol}/{multiplier}/{timespan}/{from}/{to}
    name: "Forex OHLC bars by date range, daily to 1 minute"
    summary: "Get open, high, low and close bars for a currency pair between two dates: daily, hourly, 4-hour or 1, 5 and 15 minute bars"
    note: "Volume `v` is null for forex. Bars come newest first unless sort=asc; pass next_offset back as offset for the next page. Minute bars take at most 31 days per request."
    input:
      pathParams:
        symbol: {type: string, required: true, note: "six-letter pair, no slash", example: "EURUSD"}
        multiplier: {type: integer, required: true, note: "bar size: 1, 5 or 15 with minute; 1 or 4 with hour; 1 with day", example: 1}
        timespan: {type: string, required: true, note: "minute, hour or day", example: day}
        from: {type: string, required: true, note: "first UTC date, YYYY-MM-DD, inclusive", example: "2026-11-17"}
        to: {type: string, required: true, note: "last UTC date, YYYY-MM-DD, inclusive", example: "2026-11-21"}
      queryParams:
        limit: {type: integer, required: false, min: 1, max: 5000, default: 500, note: "bars per page", example: 2}
        offset: {type: integer, required: false, min: 0, default: 0, note: "bars to skip, from next_offset"}
        sort: {type: string, required: false, enum: [asc, desc], default: desc}
    test_request: {pathParams: {symbol: "EURUSD", multiplier: 1, timespan: day, from: "2026-11-17", to: "2026-11-21"}, queryParams: {limit: 2}}
    price: {value: '0.000236', currency: USD, per: 1, unit: call, note: "Flat plan: forex Individual 59 USD a month for 250,000 REST calls. A free key covers forex. An answer with no bars still uses a call; an error uses none."}
