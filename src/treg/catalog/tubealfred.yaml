    platform: youtube
    scope: any_account
    method: GET
    path: /v1/youtube/video/{video_id}/comments
    name: "YouTube comments by video id — top or newest"
    summary: "First comments page for a video."
    input:
      pathParams:
        video_id: {type: string, required: true, note: "11-character YouTube video id", example: "dQw4w9WgXcQ"}
      queryParams:
        count: {type: integer, required: false, default: 100, note: "1-100 comments; every non-empty page has a 100-comment billing minimum", example: 100}
        sort: {type: string, required: false, default: "top", note: "top | newest", example: "top"}
    test_request:
      pathParams: {video_id: "dQw4w9WgXcQ"}
      queryParams: {count: 100, sort: "top"}
    cost:
      type: per_success
      value: 20
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://tubealfred.com/pricing
      checked: '2026-09-06'
      confidence: verified
      note: "A non-empty page of 1-100 comments has a flat 20-credit minimum; empty and failed requests are free. The 100-comment live test charged 20."
    docs_url: https://tubealfred.com/docs/video

