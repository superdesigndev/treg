# Vendor-submitted listing. Every test_request was called against the production API on 2026-09-06
# and reconciled against TubeAlfred's key-specific credit meter. Endpoint verification stamps and
# example responses are intentionally left for the maintainers' independent live verification.
provider: tubealfred
source:
  docs: https://tubealfred.com/docs
  openapi: https://tubealfred.com/openapi.json
  curated: '2026-09-06'
limits: "60 requests/minute per API key or OAuth token"
pricing_url: https://tubealfred.com/pricing

proposed_capabilities:
  youtube.video.enhanced: "Get enriched video metadata including chapters, category and related videos"
  youtube.playlist.videos: "List the videos in a public playlist"
  youtube.url.resolve: "Resolve a YouTube URL to its resource type and canonical ids"

endpoints:
  - id: tubealfred.youtube.video.detail
    domain: video
    capability: youtube.video.detail
    platform: youtube
    scope: any_account
    method: GET
    path: /v1/youtube/video/{video_id}
    name: "YouTube video metadata by id — views, likes, duration"
    summary: "Title, views, likes, comments, and duration."
    input:
      pathParams:
        video_id: {type: string, required: true, note: "11-character YouTube video id", example: "dQw4w9WgXcQ"}
      queryParams:
        fields: {type: string, required: false, note: "comma-separated response fields", example: "id,title"}
    test_request:
      pathParams: {video_id: "dQw4w9WgXcQ"}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://tubealfred.com/pricing
      checked: '2026-09-06'
      confidence: verified
      note: "The live test moved TubeAlfred's credit meter by exactly 1; failed requests are free."
    docs_url: https://tubealfred.com/docs/video

