    platform: youtube
    scope: any_account
    method: GET
    path: /v1/youtube/search
    name: "Search YouTube videos by keyword and filters"
    summary: "YouTube search."
    input:
      queryParams:
        query: {type: string, required: true, note: "search query", example: "OpenAI"}
        continuation_token: {type: string, required: false, note: "token returned by a prior page"}
        channel_id: {type: string, required: false, note: "restrict results to one channel", example: "UCBR8-60-B28hp2BmDPdntcQ"}
        upload_date: {type: string, required: false, note: "all | today | week | month | year", example: "month"}
        duration: {type: string, required: false, note: "all | under_three_mins | three_to_twenty_mins | over_twenty_mins", example: "three_to_twenty_mins"}
        sort: {type: string, required: false, default: "relevance", note: "relevance | popularity", example: "relevance"}
        type: {type: string, required: false, default: "video", note: "video for this capability; the same route also accepts all | shorts | channel | playlist | movie", example: "video"}
        features: {type: string, required: false, note: "comma-separated feature filters", example: "hd,subtitles"}
        live: {type: boolean, required: false, note: "restrict results to live content", example: true}
        shorts: {type: boolean, required: false, note: "restrict results to Shorts", example: true}
    test_request:
      queryParams: {query: "OpenAI", type: "video", sort: "relevance"}
