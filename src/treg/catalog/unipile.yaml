# Unipile — one API over the messaging, email and calendar accounts a person already owns.
#
# WHAT MAKES IT DIFFERENT from the linkedin.yaml entry already in this catalog: LinkedIn's own API
# grants w_member_social, which permits exactly two things (identify the member, post to their
# feed). Unipile drives the member's own account, so the inbox, the search, the invitations and the
# engagement on a post are reachable — and the same routes serve WhatsApp, Instagram, Telegram,
# Gmail, Outlook, any IMAP mailbox and Google/Microsoft calendars.
#
# ONE ROUTE, SEVERAL PLATFORMS: `/v2/{account_id}/chats` is provider-agnostic; the connected
# account behind `account_id` decides whether it answers about LinkedIn or WhatsApp. The messaging
# routes are therefore listed twice, once per platform shelf, with the same path — that is the
# honest way to put them on both comparison shelves, not padding.
#
# LINKEDIN CLASSIC / SALES NAVIGATOR / RECRUITER are three different products on one account and
# they are kept distinct here, because an agent that confuses them sends the wrong kind of message:
# each has its own search route and its own inbox, and `/inboxes` is how you find out which ones
# this account actually has.
#
# BILLING is per connected account per month (from 49 EUR), never per call: no per-request price
# exists to publish, so every `cost` below is `free` with the subscription named in the note. That
# also means the endpoints are NOT platform-eligible — a treg-held key with no connected account
# answers nothing useful, so this listing is bring-your-own-key only.
#
# PROVENANCE: every path below is a route Unipile's own production MCP server calls today, not a
# route read off a docs page; every `docs_url` slug and every `summary` is the operation's own
# title from the published reference index.
#
# VERIFICATION: Unipile's Development applications provide Mock accounts that implement the whole
# Methods surface (chats, messages, users, relations, posts, emails, calendars). Every test_request
# below is written against a Mock account, so live verification touches no real LinkedIn or
# WhatsApp and messages no real person.
provider: unipile
source:
  docs: https://developer.unipile.com/v2.0/docs/welcome
  reference: https://developer.unipile.com/v2.0/reference/
  curated: 2026-09-25

limits: "per-provider pacing enforced upstream (LinkedIn ~100 actions/day/account, WhatsApp 20 new chats/day); no global API quota"
pricing_url: https://www.unipile.com/pricing-api/
endpoints:
  - id: unipile.account.connections.list
    kind: account
    capability: account.connections.list
    platform: account
    scope: own_account
    method: GET
    path: /v2/accounts/
    name: "Connected accounts"
    summary: "List all Accounts"
    input:
      pathParams:
        account_id: {type: string, required: true, note: "any connected account", example: "acc_01h2xcejqtf2nbrexx3vqjhp41"}
      queryParams:
        limit: {type: integer, required: false, note: "page size", example: 20}
        cursor: {type: string, required: false, note: "opaque cursor from the previous page's `cursor` field; do not build one by hand", example: "c3RhcnQ9MjA"}
      note: "no parameter required. This is also the free health probe: a key that is invalid or revoked answers 401 api/invalid_credentials."
    test_request:
      pathParams: {account_id: "{{MOCK_LINKEDIN_ACCOUNT_ID}}"}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "free; Unipile bills per connected account per month, never per call"}
    docs_url: https://developer.unipile.com/v2.0/reference/listaccounts

  - id: unipile.account.identity
    kind: account
    capability: account.identity
    platform: account
    scope: own_account
    method: GET
    path: /v2/{account_id}/users/me
    name: "Who this account is"
    summary: "Get a User Profile — `me` resolves to the owner of the connected account"
    input:
      pathParams:
        account_id: {type: string, required: true, note: "any connected account", example: "acc_01h2xcejqtf2nbrexx3vqjhp41"}
      note: "the `me` alias is how you learn which real person's LinkedIn, WhatsApp or mailbox sits behind an account_id."
    test_request:
      pathParams: {account_id: "{{MOCK_LINKEDIN_ACCOUNT_ID}}"}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included with the connected account"}
    docs_url: https://developer.unipile.com/v2.0/reference/getuserprofile

  - id: unipile.linkedin.user.profile
    capability: linkedin.user.profile
    platform: linkedin
    scope: any_account
    method: GET
    path: /v2/{account_id}/users/{user_id}
    name: "LinkedIn profile"
    summary: "Get a User Profile"
    input:
      pathParams:
        account_id: {type: string, required: true, note: "a connected LinkedIn account, from GET /v2/accounts/", example: "acc_01h2xcejqtf2nbrexx3vqjhp41"}
        user_id: {type: string, required: true, note: "provider user id or public identifier — take it from a search result or from the last path segment of a profile URL, never the whole URL", example: "williamhgates"}
      queryParams:
        with_sections: {type: string, required: false, note: "repeatable: experience, education, skills, languages…", example: "experience"}
    test_request:
      pathParams: {account_id: "{{MOCK_LINKEDIN_ACCOUNT_ID}}", user_id: "{{MOCK_USER_ID}}"}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included with the connected account"}
    docs_url: https://developer.unipile.com/v2.0/reference/getuserprofile

