  - id: unipile.calendar.event.create
    kind: action
    capability: calendar.event.create
    platform: calendar
    scope: own_account
    method: POST
    path: /v2/{account_id}/calendars/{calendar_id}/events
    name: "Create a calendar event"
    summary: "Create a calendar event"
    input:
      pathParams:
        account_id: {type: string, required: true, note: "a connected Google or Microsoft account", example: "acc_01h2xd4calz6p8n5sq9fjm1e08"}
        calendar_id: {type: string, required: true, note: "exact id from the calendar listing — a display name is not a calendar_id", example: "primary"}
      body:
        title: {type: string, required: true, example: "Quote walkthrough"}
        start: {type: string, required: true, note: "ISO 8601 with an explicit offset or Z — a naive local time is the usual way to book the wrong hour", example: "2026-09-28T14:00:00.000Z"}
        end: {type: string, required: true, example: "2026-09-28T14:30:00.000Z"}
        attendees: {type: array, required: false, example: [{identifier: "ada@example.com"}]}
    test_request:
      pathParams: {account_id: "{{MOCK_CALENDAR_ACCOUNT_ID}}", calendar_id: "{{MOCK_CALENDAR_ID}}"}
      body: {title: "treg listing verification", start: "2026-09-28T14:00:00.000Z", end: "2026-09-28T14:30:00.000Z"}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included with the connected account; a write, and it emails the attendees — a retry invites them twice"}
    docs_url: https://developer.unipile.com/v2.0/reference/createcalendarevent

