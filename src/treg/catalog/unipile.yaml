      pathParams:
        account_id: {type: string, required: true, note: "a connected Google or Microsoft account", example: "acc_01h2xd4calz6p8n5sq9fjm1e08"}
        calendar_id: {type: string, required: true, note: "exact id from the calendar listing — a display name is not a calendar_id", example: "primary"}
        event_id: {type: string, required: true, note: "from the event listing", example: "evt_01h2xdr9"}
      body:
        response: {type: string, required: true, note: "accepted, declined or tentative", example: "accepted"}
    test_request:
      pathParams: {account_id: "{{MOCK_CALENDAR_ACCOUNT_ID}}", calendar_id: "{{MOCK_CALENDAR_ID}}", event_id: "{{MOCK_EVENT_ID}}"}
      body: {response: "accepted"}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included with the connected account"}
    docs_url: https://developer.unipile.com/v2.0/reference/setcalendareventrsvp

