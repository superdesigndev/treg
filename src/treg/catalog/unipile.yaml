    platform: linkedin
    scope: any_account
    method: POST
    path: /v2/{account_id}/linkedin/search/people
    name: "LinkedIn people search (Classic)"
    summary: "Perform People Search"
    input:
      pathParams:
        account_id: {type: string, required: true, note: "a connected LinkedIn account, from GET /v2/accounts/", example: "acc_01h2xcejqtf2nbrexx3vqjhp41"}
      body:
        keywords: {type: string, required: false, example: "head of operations logistics"}
        limit: {type: integer, required: false, example: 10}
      note: "Classic search. Sales Navigator and Recruiter are separate products with their own routes, listed below; an existing search URL can be replayed with POST /v2/{account_id}/linkedin/search."
    test_request:
      pathParams: {account_id: "{{MOCK_LINKEDIN_ACCOUNT_ID}}"}
      body: {keywords: "operations", limit: 5}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "included with the connected account; counts against the account's daily action budget"}
    docs_url: https://developer.unipile.com/v2.0/reference/performclassicpeoplesearch

