provider: valyu
source:
  docs: https://docs.valyu.ai/home
  curated: '2026-09-30'
pricing_url: https://docs.valyu.ai/pricing
limits: No numeric self-serve rate limit is published. 429 responses may include Retry-After; successful live calls
  returned no rate headers. Shared-key calls are paced at a conservative policy rate of five per second.
proposed_capabilities:
  research.papers.search: Search scholarly publications and preprints
  stocks.search: Search stock-price data
  markets.forex.search: Search foreign-exchange data
  stocks.filings.search: Search SEC filings
  stocks.insiders.search: Search insider transactions
  markets.monitor.search: Search commodities and market movers
  markets.predictions.search: Search prediction-market events
  health.trials.search: Search clinical studies
  health.references.search: Search medicine labels and global health data
  economics.indicators.search: Search official economic indicators
  research.deep: Run cited asynchronous research
  research.deep.status: Check asynchronous research
  research.sources.list: Discover Valyu source IDs
endpoints:
- id: valyu.web.search
  added: '2026-09-29'
  platform: web
  domain: search
  capability: web.search
  scope: any_account
  method: POST
  path: /v1/search
  body_allowlist: true
  platform_request:
    body.search_type: web
    body.max_price: 1.5
    body.response_length: short
  name: Search the open web
  summary: Return ranked live web results.
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
        example: What is example.com?
      max_num_results:
        type: integer
        required: true
        min: 1
        max: 10
        example: 1
      search_type:
        type: string
        required: true
        enum:
        - web
      max_price:
        type: number
        required: true
        enum:
        - 1.5
      response_length:
        type: string
        required: true
        enum:
        - short
    note: The selected Valyu sources are fixed for shared-key calls; use a Valyu own tool for arbitrary source mixes.
  test_request:
    body:
      query: What is example.com?
      max_num_results: 1
      search_type: web
      max_price: 1.5
      response_length: short
  example_response: examples/valyu.web.search.json
  cost:
    type: per_call
    currency: credit
    unit: call
    table:
    - when:
        body.search_type: web
      value: 0.0015
      times: body.max_num_results
    fallback:
      value: 0.015
      note: Ten requested results at the highest source rate for this view.
    settle: usage
    usage:
      path: total_deduction_dollars
      unit: credit
    source: observed
    source_url: https://api.valyu.ai/v1/datasources
    checked: '2026-09-30'
    confidence: verified
    note: Web costs one and a half credits per 1,000 results; settle the reported deduction.
  docs_url: https://docs.valyu.ai/api-reference/endpoint/search
- id: valyu.research.papers.search
  added: '2026-09-29'
  platform: research
  domain: papers
  capability: research.papers.search
  scope: any_account
  method: POST
  path: /v1/search
  body_allowlist: true
  platform_request:
    body.search_type: proprietary
    body.max_price: 5
    body.response_length: short
  name: Search academic papers
  summary: Search arXiv, PubMed and subscribed preprint sources.
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
        example: quantum error correction research
      max_num_results:
        type: integer
        required: true
        min: 1
        max: 10
        example: 1
      search_type:
        type: string
        required: true
        enum:
        - proprietary
      max_price:
        type: number
        required: true
        enum:
        - 5
      response_length:
        type: string
        required: true
        enum:
        - short
      included_sources:
        type: array[string]
        required: true
        minItems: 1
        maxItems: 5
        enum: &id001
        - valyu/valyu-arxiv
        - valyu/valyu-pubmed
        - valyu/valyu-medrxiv
        - valyu/valyu-biorxiv
        - valyu/valyu-chemrxiv
        example: *id001
    note: The selected Valyu sources are fixed for shared-key calls; use a Valyu own tool for arbitrary source mixes.
  test_request:
    body:
      query: quantum error correction research
      max_num_results: 1
      search_type: proprietary
      max_price: 5
      response_length: short
      included_sources: *id001
  cost:
    type: per_call
    currency: credit
    unit: call
    table:
    - when:
        body.search_type: proprietary
      value: 0.005
      times: body.max_num_results
    fallback:
      value: 0.05
      note: Ten requested results at the highest source rate for this view.
    settle: usage
    usage:
      path: total_deduction_dollars
      unit: credit
    source: observed
    source_url: https://api.valyu.ai/v1/datasources
    checked: '2026-09-30'
    confidence: verified
    note: ChemRxiv is the highest-priced source in this view at five credits per 1,000 results.
  docs_url: https://docs.valyu.ai/api-reference/endpoint/search
