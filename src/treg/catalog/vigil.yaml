  - id: vigil.funds.compare-filings
    added: '2026-10-19'
    domain: stocks
    capability: stocks.funds.compare-filings
    platform: stocks
    scope: any_account
    method: GET
    path: /v1/compare-13f-filings
    name: "Compare 13F filings"
    summary: "Same-manager 13F filing comparison on two explicitly selected accessions"
    input:
      note: "Coverage: 13F report periods from 2021-03-31. An accession with a report period before 2021-03-31, or a manager whose filings all predate 2021, returns 404 period_outside_coverage (unbilled). The baseline must be an earlier report quarter of the same manager."
      queryParams:
        cik: {type: string, required: true, note: "manager SEC CIK; zero-padding accepted", example: "1067983"}
        current_accession: {type: string, required: true, note: "later filing accession number"}
        baseline_accession: {type: string, required: true, note: "earlier filing accession number"}
        status: {type: string, required: false, note: "NEW | SOLD | INCREASED | DECREASED | UNCHANGED"}
        security_type: {type: string, required: false, note: "all | shares | put | call"}
        limit: {type: integer, required: false, min: 1, max: 100, note: "default 20"}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_cursor; pass back verbatim"}
    test_request: {queryParams: {cik: "1067983", current_accession: "0001193125-26-352200", baseline_accession: "0001193125-26-226661", limit: 1}}
