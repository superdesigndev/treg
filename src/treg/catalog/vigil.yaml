  - id: vigil.funds.changes
    added: '2026-10-19'
    domain: stocks
    capability: stocks.funds.changes
    platform: stocks
    scope: any_account
    method: GET
    path: /v1/holding-changes-13f
    name: "13F holding changes"
    summary: "Quarterly holding changes against the matched immediate prior quarter filing"
    input:
      note: "Coverage: 13F report periods from 2021-03-31. An explicit period before 2021-03-31, or a manager whose filings all predate 2021, returns 404 period_outside_coverage (unbilled); the default selection skips pre-2021 filings. A 2021-03-31 filing returns baseline_available=false because its 2020-12-31 baseline is outside coverage."
      queryParams:
        cik: {type: string, required: true, note: "manager SEC CIK; zero-padding accepted", example: "1067983"}
        period: {type: string, required: false, note: "quarter-end date YYYY-MM-DD, 2021-03-31 or later; default latest eligible filing"}
        status: {type: string, required: false, note: "NEW | SOLD | INCREASED | DECREASED | UNCHANGED"}
