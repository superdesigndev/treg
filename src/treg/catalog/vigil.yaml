    scope: any_account
    method: GET
    path: /v1/holdings-13f
    name: "13F holdings"
    summary: "Reported 13F positions for one filing; options and share classes stay separate, values in whole USD"
    input:
      note: "Coverage: 13F report periods from 2021-03-31. An explicit period before 2021-03-31, or a manager whose filings all predate 2021, returns 404 period_outside_coverage (unbilled); the default selection skips pre-2021 filings."
      queryParams:
        cik: {type: string, required: true, note: "manager SEC CIK; zero-padding accepted", example: "1067983"}
        period: {type: string, required: false, note: "quarter-end date YYYY-MM-DD, 2021-03-31 or later; default latest eligible filing"}
        security_type: {type: string, required: false, note: "all | shares | put | call"}
        limit: {type: integer, required: false, min: 1, max: 100, note: "default 20"}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_cursor; pass back verbatim"}
    test_request: {queryParams: {cik: "1067983", limit: 1}}
    cost: {type: per_success, value: 0.01, currency: USD, per: 1, unit: call, source: docs, source_url: "https://renolabshq.com/vigil/api", checked: '2026-10-19', confidence: documented, note: "Every HTTP 200 bills the full rate, including zero-row 200s. Errors never bill, including 404 period_outside_coverage and 503 data_not_ready. Paid keys need expanded-terms consent."}
