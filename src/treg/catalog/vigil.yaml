    capability: stocks.funds.position-history
    platform: stocks
    scope: any_account
    method: GET
    path: /v1/fund-position-history
    name: "Fund position history"
    summary: "One manager's observed 13F rows in a ticker across eligible periods; gaps stay gaps"
    input:
      note: "Coverage: 13F report periods from 2021-03-31. History starts there; a since before 2021 is accepted but returns nothing older. A manager whose filings all predate 2021 returns 404 period_outside_coverage (unbilled)."
      queryParams:
        cik: {type: string, required: true, note: "manager SEC CIK; zero-padding accepted", example: "1067983"}
        ticker: {type: string, required: true, note: "US stock ticker", example: NVDA}
        since: {type: string, required: false, note: "report period on or after YYYY-MM-DD; rows before 2021-03-31 are never returned"}
