  - id: vigil.funds.new-positions
    added: '2026-10-19'
    domain: stocks
    capability: stocks.funds.new-positions
    platform: stocks
    scope: any_account
    method: GET
    path: /v1/new-13f-positions
    name: "New 13F positions"
    summary: "Credible new 13F positions from curated non-passive non-market-maker managers"
    input:
      note: "Coverage: only the newest 4 calendar quarter-ends that credible managers have filed for, all after the fund data's 2021-03-31 floor. An explicit period older than that window returns 404 period_outside_coverage (unbilled)."
      queryParams:
        period: {type: string, required: false, note: "quarter-end date YYYY-MM-DD within the newest 4 calendar quarter-ends; default latest credible quarter"}
        min_value_usd: {type: integer, required: false, min: 0, note: "default 100000000"}
        limit: {type: integer, required: false, min: 1, max: 100, note: "default 20"}
        cursor: {type: string, required: false, note: "opaque cursor from the response next_cursor; pass back verbatim"}
    test_request: {queryParams: {limit: 1}}
    cost: {type: per_success, value: 0.01, currency: USD, per: 1, unit: call, source: docs, source_url: "https://renolabshq.com/vigil/api", checked: '2026-10-19', confidence: documented, note: "Every HTTP 200 bills the full rate, including zero-row 200s. Errors never bill, including 404 period_outside_coverage and 503 data_not_ready. Paid keys need expanded-terms consent."}
