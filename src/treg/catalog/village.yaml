# Village.ai authenticates with the user's personal API token, sent as a Bearer header; it acts as
# that user. A failed call (any 4xx or 5xx) is never charged. The own_account rows answer from the
# caller's own network or synced contacts, so their answers stay per connection, and the network
# rows answer only once that network has synced (village.account.identity reports
# is_sync_complete). Real-time enrich fetches are debited after the response, so their charge is
# not in the response metadata.
provider: village
source:
  docs: https://docs.village.ai/api-reference/introduction
  openapi: https://api.village.ai/v2/docs/openapi.json
  curated: '2026-10-09'
limits: "100 requests per second per token (docs). A 402 insufficient_credits answer stops a call before any work is done."
pricing_url: https://docs.village.ai/api-reference/credits
proposed_capabilities:
  people.intro_paths: "Find the warm path to a person: who on your team, or which mutual connection, can introduce you, ranked by connection strength"
  companies.intro_paths: "Find the warm path into a company: the people there you can reach and who can introduce you, ranked by connection strength"
  companies.intro_paths.check: "Check whether you have a warm path into a company before paying for the full paths"
  people.connection_rank: "Sort the people you name by how strongly you are connected to them"
  companies.connection_rank: "Sort the companies you name by how strongly you are connected to people there"
endpoints:
  - id: village.people.search
    added: '2026-10-09'
    domain: contacts
    capability: people.search
    platform: people
    scope: own_account
    method: POST
    path: /v2/people/search
    body_allowlist: true
    name: Search people in plain language, network or global
    summary: Search for people using natural language queries.
    input:
      bodyType: json
      body:
        prompt: {type: string, required: false, example: "VP Engineering at Series B fintechs in NYC", note: "Natural language search query. Send it as prompt, not query. Optional when filters or list_filter is sent."}
        filters: {type: object, required: false, note: "Structured search filters. Multi-value keys accept an array of values (preferred) or a legacy comma-separated / JSON-array string. Keys include name, linkedinUrl, position, seniority, department, function, company, companyDomain, companyIndustry, companySize, country, city and yearsOfExperienceMin; the docs list them all."}
        limit: {type: integer, required: false, default: 25, min: 1, max: 100, example: 25, note: "Maximum number of results per page. The price scales with the results returned."}
        mode: {type: string, required: false, enum: [auto, lookup, simple, complex], note: "auto classifies the query into lookup, simple or complex. lookup is for direct matches, simple for firmographic queries, complex for multi-step or subjective queries."}
        scope: {type: string, required: false, enum: [network, global, specific_list], note: "Defaults: lookup=global, simple=network, complex=network. network searches your connections first, global searches everyone, specific_list needs specific_list_data."}
        cursor: {type: "string|object", required: false, note: "Pagination cursor from the previous response (encoded string or cursor object)."}
        network_filters: {type: object, required: false, note: "Network filtering options: connection_degrees, introducer_linkedin_ids, user_to_introducer_types, user_to_introducer_min_score, introducer_to_target_types, introducer_to_target_min_score, exclude_teams, exclude_community."}
        include_counts: {type: string, required: false, enum: [global, network, all], note: "Inline count scopes computed on the first page only. Ignored when cursor is sent, and adds latency."}
        specific_list_data: {type: object, required: false, note: "Required when scope is specific_list: people_linkedin_identifiers, 1 to 50,000 entries, each a bare LinkedIn identifier or {id, score}. limit is then ignored and every match comes back in one response."}
        list_filter: {type: object, required: false, example: {people_list_id: 123}, note: "Search within your saved lists: people_list_id, company_list_id, or both. A list alone is a valid search. Lists must belong to your active workspace."}
        screening_handoff: {type: boolean, required: false, example: false, note: "Complex searches keep only objective constraints in SQL and return the subjective ones as metadata.screening_criteria for a downstream screening step."}
      note: "Search 775M+ people in plain language, across your network or globally, to build lead lists, prospect lists, candidate shortlists and investor target lists. scope defaults to network for the simple and complex modes and to global for lookup, so pass scope global to search everyone. The Free plan returns at most 10 results. Complex searches usually take 20 to 60 seconds; wait rather than retry. Streaming (stream) is not accepted by this tool."
    test_request: {body: {prompt: "CEO of Microsoft", scope: global, limit: 1}}
    cost:
      type: per_result
      value: 3
      currency: credit
      per: 10
      unit: result
      source: docs
      source_url: https://docs.village.ai/api-reference/people/search-people
      checked: '2026-10-09'
      confidence: inferred
      note: "A floor: 3 credits per 10 results returned (0.3 per result, rounded up per call), and every call also pays for the AI work, metered on tokens with no cap (docs: 2 to 3 credits). Observed 2026-10-09: 10 results cost 4 credits on a first-time search (3 for results, 1 for AI) and 3 on an identical repeat; 1 result cost 2, then 1 on repeat. A search that returns no results pays for the AI work only. With scope specific_list, limit is ignored and every match is returned and charged."
    docs_url: https://docs.village.ai/api-reference/people/search-people

  - id: village.companies.search
    added: '2026-10-09'
    domain: companies
    capability: companies.search
    platform: companies
    scope: own_account
    method: POST
    path: /v2/companies/search
    body_allowlist: true
    name: Search companies in plain language, network or global
    summary: Search for companies using natural language queries.
    input:
      bodyType: json
      body:
        prompt: {type: string, required: false, example: "Find B2B SaaS companies with 50-200 employees in California", note: "Natural language search query. Send it as prompt, not query. Optional when filters or list_filter is sent."}
        filters: {type: object, required: false, note: "Structured company filters, compiled deterministically. Send filters without a prompt. Keys include name, domain, linkedinUrl, industry, companySize, companyType, country, city, fundingStage, foundedAfter, hiring and totalFundingMinUsd; the docs list them all."}
        limit: {type: integer, required: false, default: 25, min: 1, max: 100, example: 25, note: "Maximum number of results per page. The price scales with the results returned."}
        mode: {type: string, required: false, default: auto, enum: [auto, lookup, simple, complex], example: auto, note: "Search mode for prompt-only searches: auto lets the system decide, lookup is a direct match, simple is LLM-powered, complex adds thinking and high-reasoning SQL generation. Structured filters always compile deterministically."}
        scope: {type: string, required: false, enum: [network, global], note: "network searches companies connected to your network first, global searches all companies."}
        cursor: {type: "string|object", required: false, note: "Pagination cursor from the previous response (encoded string or cursor object)."}
        network_filters: {type: object, required: false, note: "Network path and relationship filters: connection_degrees, introducer_linkedin_ids, user_to_introducer_types, user_to_introducer_min_score, introducer_to_target_types, introducer_to_target_min_score, exclude_teams, exclude_community."}
        include_counts: {type: string, required: false, enum: [global, network, all], note: "Inline count scopes computed on the first page only. Ignored when cursor is sent, and adds latency."}
        list_filter: {type: object, required: false, example: {company_list_id: 123}, note: "Search within your saved lists: company_list_id, people_list_id, or both. A list alone is a valid search. Lists must belong to your active workspace."}
        screening_handoff: {type: boolean, required: false, example: false, note: "Complex searches keep only objective constraints in SQL and return the subjective ones as metadata.screening_criteria for a downstream screening step."}
      note: "Search 52M+ companies in plain language, across your network or globally, to build account and investor target lists. By default this searches only companies connected to your network; pass scope global to search everyone. Results carry relevance scores and connection strength. Complex searches usually take 20 to 60 seconds; wait rather than retry. Streaming (stream) is not accepted by this tool."
    test_request: {body: {prompt: "Stripe", scope: global, limit: 1}}
    cost:
      type: per_result
      value: 3
      currency: credit
      per: 10
      unit: result
      source: docs
      source_url: https://docs.village.ai/api-reference/companies/search-companies
      checked: '2026-10-09'
      confidence: inferred
      note: "A floor: 3 credits per 10 results returned (0.3 per result, rounded up per call), and every call also pays for the AI work, metered on tokens with no cap (docs: 2 to 3 credits). Observed 2026-10-09: 10 results cost 4 credits on a first-time search (3 for results, 1 for AI) and 3 on an identical repeat; 1 result cost 2. A search that returns no results pays for the AI work only."
    docs_url: https://docs.village.ai/api-reference/companies/search-companies

  - id: village.people.enrich
    added: '2026-10-09'
    domain: contacts
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /v2/people/enrich
    name: "Enrich a person by LinkedIn URL: title, company, location"
    summary: Get detailed profile information for a person.
    miss:
      status: 404
      means: "Village could not find this person, even with a live fetch. Nothing was charged."
    input:
      bodyType: json
      body:
        linkedin_url: {type: string, required: false, example: "https://linkedin.com/in/johndoe", note: "LinkedIn person profile URL. Send this or url."}
        url: {type: string, required: false, example: "https://linkedin.com/in/johndoe", note: "Generic URL (auto-detected). Send this or linkedin_url."}
        mode: {type: string, required: false, default: cached_first, enum: [cached_first, cached_only, realtime_only], example: cached_first, note: "cached_first returns the profile Village holds when it is recent and otherwise fetches it live. realtime_only always fetches live. cached_only never fetches and is free; village.people.enrich.stored is that tier."}
      note: "One of linkedin_url or url is required. Returns full name, job title or headline, current company, location, profile photo URL and LinkedIn URL. A profile Village does not hold is fetched live from public LinkedIn data and saved to Village."
    test_request: {body: {linkedin_url: "https://www.linkedin.com/in/satyanadella"}}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://docs.village.ai/api-reference/people/enrich-person
      checked: '2026-10-09'
      confidence: verified
      note: "Cached lookups are unlimited and free. 1 credit only for a real-time fetch that returns data; a fetch that finds nothing is free. Observed 2026-10-09: the test call was a cached lookup for 0 credits; realtime_only on the same profile moved the balance by 1 credit, debited after the response; an unknown profile answered 404 for 0."
    docs_url: https://docs.village.ai/api-reference/people/enrich-person

  - id: village.people.enrich.stored
    added: '2026-10-09'
    domain: contacts
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /v2/people/enrich
    body_allowlist: true
    name: Person profile by LinkedIn URL, free cached lookup
    summary: Get detailed profile information for a person.
    miss:
      status: 404
      means: "This person is not in the cache. Nothing was charged; village.people.enrich can fetch the profile live."
    input:
      bodyType: json
      body:
        linkedin_url: {type: string, required: false, example: "https://linkedin.com/in/johndoe", note: "LinkedIn person profile URL. Send this or url."}
        url: {type: string, required: false, example: "https://linkedin.com/in/johndoe", note: "Generic URL (auto-detected). Send this or linkedin_url."}
        mode: {type: string, required: true, enum: [cached_only], note: "Fixed to cached_only: answer from the cache only, never fetch live."}
      note: "One of linkedin_url or url is required. Returns the same profile as village.people.enrich from the cache only: cached lookups are unlimited and free. A person not in the cache answers 404."
    test_request: {body: {linkedin_url: "https://www.linkedin.com/in/satyanadella", mode: cached_only}}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: observed
      source_url: https://docs.village.ai/api-reference/people/enrich-person
      checked: '2026-10-09'
      confidence: verified
      note: "Never charged: this tier never fetches live. Observed 2026-10-09: the test call and a 404 for an unknown profile both cost 0."
    docs_url: https://docs.village.ai/api-reference/people/enrich-person

