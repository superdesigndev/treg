    note: 'Public reads are on the published "Free Check" plan (price_cents 0, billing_type free) in the machine-readable
      rate card at /agent/pricing.json. No charge header or balance exists for anonymous calls, so the meter column
      is not observable; the zero price rests on the rate card.'
  docs_url: https://xagent.id/docs/audit-methodology.md
