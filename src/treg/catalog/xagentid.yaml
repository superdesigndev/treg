provider: xagentid
source:
  docs: https://xagent.id/llms.txt
  openapi: https://xagent.id/openapi.json
  curated: '2026-11-01'
limits: 'Public reads: 60 requests/minute per IP (HTTP 429 with retry_after, no rate-limit headers).
  /api/card additionally allows 3 new-site crawls per minute per IP for hosts with no stored card snapshot;
  cached hosts are served from the snapshot. Audit-family reads (audit_report, evidence_pack, readiness_snapshot,
  citation_gap_matrix, content_optimization_plan) fetch the target site live and take about 5 s. Public reads
  need no key; a Site Agent Key (Authorization: Bearer) is only needed for owner-scoped routes, which are not catalogued.'
pricing_url: https://xagent.id/agent/pricing.json
proposed_capabilities:
  web.site.agent-card: Turn a company website into a source-backed agent card
  ai-search.readiness.evidence: Collect page-level evidence of how readable a website is to AI agents
  ai-search.readiness.snapshot: Freeze a website's AI-readiness checks into a comparable snapshot
  ai-search.citation.gaps: Find why AI answers do not cite a website
  ai-search.content.plan: Plan answer-first content rewrites so AI answers can cite a website
  web.site.agent-status: Check whether a website has a verified agent installed
  web.site.agent-install-plan: Get the step-by-step plan to install an agent on a website
  ai-search.workflow.route: Pick the next AI-visibility workflow for a website and goal
  ai-search.industries.list: List the industry taxonomy used for AI-visibility benchmarks
endpoints:
- id: xagentid.company.card
  added: '2026-11-01'
  capability: web.site.agent-card
  platform: web
  scope: any_account
  method: GET
  path: /api/card
  name: Company Agent Card from a website
  summary: Build one source-backed public company Agent Card, including a canonical legal-entity candidate
  input:
    queryParams:
      url:
        type: string
        required: true
        example: https://stripe.com
        note: Public HTTPS website (homepage). Bounded crawl of public pages only.
    note: 'Returns {ok, agent_card{name, description, url, agent_id, provider, public_card, ...}, package, company_lifecycle}.
      Hosts already in the snapshot store answer in under 1 s; a never-seen host triggers a bounded crawl
      (3 per minute per IP) and may return a progressive/pending card first. Legal-entity matches are
      candidates, not confirmations. Not an official company statement.'
  test_request:
    queryParams:
      url: https://stripe.com
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://xagent.id/agent/pricing.json
    checked: '2026-11-01'
    confidence: documented
    note: 'Public reads are on the published "Free Check" plan (price_cents 0, billing_type free) in the machine-readable
      rate card at /agent/pricing.json. No charge header or balance exists for anonymous calls, so the meter column
      is not observable; the zero price rests on the rate card.'
  docs_url: https://xagent.id/llms.txt
- id: xagentid.site.audit-report
  added: '2026-11-01'
  capability: web.page.audit
  platform: web
  scope: any_account
  method: GET
  path: /api/agent/audit_report
  name: AI-readiness audit report (SEO/AEO/GEO)
  summary: Return a customer-readable R1 audit report
  input:
    queryParams:
      url:
        type: string
        required: true
        example: https://stripe.com
        note: Public HTTPS URL to audit; fetched live.
    note: 'Returns {ok, measurement_status, report{overall_score, grade, scorecard, three_biggest_opportunities,
      three_fastest_wins, priority_action_plan, fix_guidance, measurement_plan, non_claims, content_hash}}.
      Methodology: https://xagent.id/docs/audit-methodology.md. Scores are readiness signals, not ranking or
      citation guarantees. Increments the public audit counter.'
  test_request:
    queryParams:
      url: https://stripe.com
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://xagent.id/agent/pricing.json
    checked: '2026-11-01'
