# Data the strict models or the validator's rules reject, each to be fixed in its own small PR.
rejected:
  - {at: datagma.yaml, path: proposed_capabilities, reason: an empty mapping; drop the key}
  - {at: zerobounce.yaml, path: proposed_capabilities, reason: an empty mapping; drop the key}
  - {at: findymail.search.company, path: input.body, reason: 'body.domain holds an example value where a parameter spec belongs'}
  - {at: aviato.people.email.find.personal, path: states, reason: verified and untestable at once; one state per row}
  - {at: fiber-ai.people.contacts.reveal.personal, path: states, reason: verified and untestable at once; one state per row}

# v2 rows whose reserve.rows has no param: a frozen legacy hold waiting for a person to pick it.
legacy_holds: []
